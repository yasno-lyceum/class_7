<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Театральне мистецтво · Ліцей «Ясно»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0644FF;--lb:#517BFF;--y:#FFCD01;--ink:#0B1640;--bg:#F5F6FA;--card:#fff;--mute:#5b6488;--line:#dfe4f3;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3,h4,.mont{font-family:Montserrat,Manrope,sans-serif}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:12px;text-decoration:none;color:var(--ink)}
.logo .mk{width:42px;height:42px;border-radius:12px;background:var(--blue);color:var(--y);display:grid;place-items:center;font:800 20px Montserrat}
.logo b{font:800 15px Montserrat;display:block}.logo small{color:var(--mute);font-size:12px}
.sbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.sbtns button{border:0;border-radius:10px;padding:8px 4px;background:var(--bg);font-weight:700;font-size:12.5px;color:var(--ink)}
.sbtns button:hover{background:var(--y)}
.search{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:10px;font:inherit}
.mod{margin-top:12px}
.mod h4{margin:0 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.mod h4 i{width:10px;height:10px;border-radius:50%;flex:none}
.mod a{display:block;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.mod a:hover{background:var(--bg)}.mod a.on{background:var(--blue);color:#fff}
.mod a span{color:var(--mute);font-size:12px;margin-right:4px}.mod a.on span{color:var(--y)}
.main{padding:22px 28px 60px;max-width:1150px;width:100%}
.burger{display:none}
.hero{background:var(--blue);color:#fff;border-radius:22px;padding:30px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:220px;height:220px;border-radius:50%;background:var(--y);opacity:.9}
.hero h1{margin:0 0 8px;font-size:30px;max-width:75%}.hero p{margin:0;max-width:70%;opacity:.92}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.mcard{background:#fff;border-radius:16px;padding:16px;border-top:6px solid var(--lb);cursor:pointer;box-shadow:0 2px 10px #0b164010}
.mcard:hover{transform:translateY(-2px)}
.mcard b{font-family:Montserrat;display:block;margin-bottom:4px}.mcard small{color:var(--mute)}
.lhead{margin-bottom:12px}.lhead .crumb{color:var(--mute);font-size:13px;font-weight:700}
.lhead h1{margin:4px 0 10px;font-size:26px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{border:2px solid var(--lb);background:#fff;color:var(--blue);border-radius:999px;padding:6px 14px;font-weight:700}
.modes button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0 10px;padding-bottom:4px}
.tabs button{border:0;background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--ink);box-shadow:0 1px 4px #0b164012}
.tabs button.on{background:var(--y)}
.tabs button.done{color:var(--mute)}
.mins{font-weight:800;color:var(--blue);font-size:14px;margin:10px 0 4px}
.ribbon{display:inline-block;background:var(--lb);color:#fff;font:800 20px Montserrat;padding:8px 22px;transform:skew(-10deg);border-radius:6px;margin:0 0 16px}
.ribbon span{display:inline-block;transform:skew(10deg)}
.nav2{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--blue);color:#fff}
.btn.y{background:var(--y);color:var(--ink)}.btn.g{background:#fff;color:var(--blue);border:2px solid var(--lb)}
.btn:disabled{opacity:.4}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin:12px 0;box-shadow:0 2px 10px #0b164010}
.act{background:#fff;border:2px solid var(--lb);border-radius:16px;margin:16px 0;overflow:hidden}
.act>.bar{background:var(--y);padding:8px 14px;display:flex;align-items:center;gap:6px;font:800 15px Montserrat}
.act>.bar i{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block}
.act>.bar span{margin-left:8px}
.act>.body{padding:14px 16px}
.def{background:#eaf0ff;border-left:6px solid var(--blue);border-radius:12px;padding:14px 16px;margin:12px 0;font-size:17px}
.def b,.rule b,.theory b{color:var(--blue)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:12px 0}
.rule{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.rule h4{margin:0 0 4px;font-size:15px}
.tbl{width:100%;border-collapse:collapse;margin:12px 0;background:#fff;border-radius:12px;overflow:hidden}
.tbl th{background:var(--blue);color:#fff;text-align:left;padding:8px 10px;font-size:14px}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.ex{background:#fffbea;border-left:5px solid var(--y);border-radius:10px;padding:10px 14px;margin:10px 0;font-style:italic}
.ex small{display:block;font-style:normal;color:var(--mute);margin-top:4px}
.note{background:#eef8f1;border-left:5px solid var(--ok);border-radius:10px;padding:10px 14px;margin:10px 0}
.warn{background:#fff1f1;border-left:5px solid var(--bad);border-radius:10px;padding:10px 14px;margin:10px 0}
.timeline{border-left:4px solid var(--lb);margin:12px 0 12px 8px;padding-left:16px}
.timeline div{position:relative;margin:8px 0}
.timeline div:before{content:"";position:absolute;left:-24px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--y);border:2px solid var(--blue)}
.timeline b{color:var(--blue)}
.scheme{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.scheme span{background:#eaf0ff;border:2px solid var(--lb);border-radius:12px;padding:8px 12px;font-weight:700}
.scheme em{font-style:normal;font-weight:800;color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.flip{perspective:800px;height:130px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .a,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;padding:10px;text-align:center}
.flip .a{background:var(--blue);color:#fff;font:700 16px Montserrat}
.flip .b{background:#fff;border:2px solid var(--lb);transform:rotateY(180deg);font-size:14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;color:var(--ink)}
.opt:hover{border-color:var(--lb)}
.opt.ok{background:#e8f8ee;border-color:var(--ok)}.opt.no{background:#fdecec;border-color:var(--bad)}
.q{margin:12px 0}.q>b{display:block;margin-bottom:4px}
.expl{display:none;font-size:14px;color:var(--mute);margin-top:4px}.q.ans .expl{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--lb);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--ink)}
.chip.sel{background:var(--y);border-color:var(--y)}
.chip.ok{background:#e8f8ee;border-color:var(--ok)}.chip.no{background:#fdecec;border-color:var(--bad)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bucket{border:2px dashed var(--lb);border-radius:14px;padding:10px;min-height:90px;cursor:pointer;background:#f8faff}
.bucket h5{margin:0 0 6px;font:800 14px Montserrat;color:var(--blue)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{display:block;width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px;margin:6px 0;text-align:left;color:var(--ink)}
.mi.sel{border-color:var(--y);background:#fff8d6}.mi.ok{border-color:var(--ok);background:#e8f8ee;opacity:.7}.mi.no{border-color:var(--bad);background:#fdecec}
.ord li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.ord li span{flex:1}.ord li button{border:0;background:var(--bg);border-radius:8px;width:32px;height:30px}
.ord li.ok{border-color:var(--ok);background:#e8f8ee}.ord li.no{border-color:var(--bad);background:#fdecec}
.tf{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tf p{flex:1;margin:0;min-width:200px}.tf button{border:2px solid var(--lb);background:#fff;border-radius:10px;padding:5px 10px;font-weight:700}
.tf.ok p{color:var(--ok)}.tf.no p{color:var(--bad)}.tf small{flex-basis:100%;color:var(--mute);display:none}.tf.ans small{display:block}
select.fl{font:inherit;border:2px solid var(--lb);border-radius:8px;padding:2px 4px;background:#fff;color:var(--ink)}
select.fl.ok{border-color:var(--ok);background:#e8f8ee}select.fl.no{border-color:var(--bad);background:#fdecec}
.cw{border-collapse:collapse;margin:8px auto}
.cw td{width:34px;height:34px;padding:0;position:relative}
.cw td.c{border:2px solid var(--ink);background:#fff}
.cw td.c input{width:100%;height:100%;border:0;text-align:center;font:700 17px Montserrat;text-transform:uppercase;background:transparent;color:var(--ink);padding:0}
.cw td.c sup{position:absolute;left:2px;top:0;font-size:9px;color:var(--blue);font-weight:800}
.cw td.ok{background:#e8f8ee}.cw td.no{background:#fdecec}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14.5px}
.clues ol{padding-left:0;list-style:none;margin:4px 0}.clues li b{color:var(--blue)}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mem button{height:96px;border-radius:12px;border:0;background:var(--blue);color:var(--blue);font-weight:700;font-size:13.5px;padding:6px}
.mem button.op{background:#fff;color:var(--ink);border:2px solid var(--lb)}
.mem button.dn{background:#e8f8ee;color:var(--ok);border:2px solid var(--ok)}
.mem button.dn.alt{background:#fff8d6;color:#8a6d00;border-color:var(--y)}
.weather{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.wc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;user-select:none}
.wc:hover{border-color:var(--lb)}
.wc .e{font-size:44px}.wc b{display:block;font-family:Montserrat;margin:4px 0}.wc .n{font:800 24px Montserrat;color:var(--blue)}
.cmp{margin-top:14px}.cmp .row{display:flex;align-items:center;gap:8px;margin:4px 0}
.cmp .row span{width:110px;font-size:14px}.cmp .bar2{height:14px;border-radius:7px;background:var(--lb)}.cmp .bar2.a{background:var(--y)}
.topic{background:var(--blue);color:#fff;border-radius:20px;padding:24px}
.topic h2{margin:0 0 10px;font-size:26px}.topic ul{margin:6px 0 0}
.plan{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}
.plan div{flex:1;min-width:90px;background:#ffffff22;border-radius:8px;padding:6px;font-size:12px;text-align:center}
.plan div b{display:block;color:var(--y);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.tile{border:0;border-radius:16px;background:#fff;border:2px solid var(--lb);padding:14px 8px;font-weight:800;font-family:Montserrat;color:var(--ink)}
.tile .e{font-size:30px;display:block}.tile.on{background:var(--y);border-color:var(--y)}
.gamebox{margin-top:10px}
.p15{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:480px;margin:10px auto}
.p15 button{position:relative;min-height:90px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;padding:8px;font-size:14px}
.p15 button sup{position:absolute;left:6px;top:4px;color:var(--y);font-size:12px}
.p15 button.e{background:transparent;border:2px dashed var(--line)}
.big{font:800 64px Montserrat;color:var(--blue);text-align:center}
.timer{font:800 32px Montserrat;color:var(--blue)}
.qbtn{display:inline-block;border:0;background:var(--y);color:var(--ink);border-radius:8px;padding:0 10px;font-weight:800;margin:0 2px}
.qbtn.r{background:#eaf0ff;color:var(--blue)}
.letters{display:flex;gap:6px;justify-content:center;margin:12px 0}
.letters span{width:42px;height:48px;border-radius:10px;background:#eaf0ff;display:grid;place-items:center;font:800 24px Montserrat;color:var(--blue);border:2px solid var(--lb)}
.inp{font:inherit;border:2px solid var(--lb);border-radius:10px;padding:8px 10px;width:100%;max-width:340px}
.score{position:fixed;right:16px;bottom:16px;background:#fff;border:2px solid var(--lb);border-radius:16px;padding:10px;z-index:50;box-shadow:0 6px 24px #0b164030;min-width:230px}
.score .tm{display:flex;align-items:center;gap:6px;margin:4px 0}
.score .tm input{width:90px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;font-size:13px}
.score .tm b{font:800 22px Montserrat;color:var(--blue);min-width:34px;text-align:center}
.score .tm button{border:0;background:var(--bg);border-radius:8px;width:30px;height:30px;font-weight:800}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:99}
.refl textarea,.refl input{width:100%;font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px}
.light{display:flex;gap:10px;flex-wrap:wrap}.light button{flex:1;min-width:150px;border:0;border-radius:14px;padding:14px;font-weight:800;color:#fff;font-size:16px}
.steps{display:flex;flex-direction:column-reverse;gap:6px;max-width:520px}
.steps button{border:0;border-radius:10px;padding:10px;font-weight:700;text-align:left;background:#eaf0ff;color:var(--ink)}
.steps button b{float:right;color:var(--blue)}
html.present{font-size:125%}
html.present .side,html.present .burger{display:none!important}
html.present .app{grid-template-columns:minmax(0,1fr)}
html.present .main{max-width:none}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:-320px;width:300px;z-index:60;transition:left .2s}.side.open{left:0}
.burger{display:inline-block;position:fixed;left:10px;top:10px;z-index:61;border:0;background:var(--blue);color:#fff;border-radius:10px;width:42px;height:42px;font-size:20px}
.main{padding:62px 14px 60px}.weather{grid-template-columns:repeat(3,1fr)}.hero h1,.hero p{max-width:100%}.clues,.mcols{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="burger" onclick="document.querySelector('.side').classList.toggle('open')">☰</button>
<div class="app">
<aside class="side">
 <a class="logo" href="#"><div class="mk">Я</div><div><b>Театральне мистецтво</b><small>Ліцей «Ясно»</small></div></a>
 <div class="sbtns"><button onclick="location.hash='#games'">🎲 Ігри</button><button onclick="toggleScore()">🏆 Табло</button><button onclick="present()">🖥️ Презентація</button></div>
 <input class="search" placeholder="Пошук уроку…" oninput="sideNav(this.value)">
 <nav id="nav"></nav>
</aside>
<main class="main" id="main"></main>
</div>
<div id="scoreBox"></div>
<script>
const LS={};function L(n,title,theory,acts){LS[n]={n,title,theory,acts:acts||[]}}
function ex(t,a){return `<div class="ex">${t}${a?`<small>— ${a}</small>`:''}</div>`}
const MORE={},GOALS={},SUMRULE={},LWORDS={};
const COURSE={title:'Театральне мистецтво: від античності до Кабукі',sub:'Інтерактивний курс за календарним планом: 9 модулів, 35 уроків. Кожен урок — 30 хвилин: настрій, розминка, нові знання, практика, ігри та рефлексія.'};
const MODULES=[
{n:1,title:'Сучасний театр світу',color:'#0644FF',range:[1,2]},
{n:2,title:'Античний театр',color:'#B45309',range:[3,6]},
{n:3,title:'Театр епохи Відродження',color:'#15803D',range:[7,10]},
{n:4,title:'Український вертеп',color:'#B91C1C',range:[11,15]},
{n:5,title:'Театр класицизму',color:'#7C3AED',range:[16,19]},
{n:6,title:'Театр сентименталізму',color:'#DB2777',range:[20,23]},
{n:7,title:'Театр романтизму',color:'#0E7490',range:[24,27]},
{n:8,title:'Театр і суспільство',color:'#475569',range:[28,31]},
{n:9,title:'Японський театр Кабукі',color:'#C2410C',range:[32,35]}];

/* ===== Модуль 1 ===== */
L(1,'Сучасне театральне мистецтво різних країн',
`<div class="def"><b>Театр</b> — вид мистецтва, у якому <b>актори</b> перед <b>глядачами</b> «тут і зараз» створюють художній образ. Кожна країна має свої <b>театральні традиції</b>, а сучасний театр поєднує їх із новими формами.</div>
<table class="tbl"><tr><th>Країна</th><th>Що варто знати</th></tr>
<tr><td>🇺🇦 Україна</td><td>Національний театр ім. Івана Франка (Київ), Львівський театр ім. Марії Заньковецької; новаторська спадщина Леся Курбаса і театру «Березіль» (1922); сучасні документальні вистави та фестиваль «ГогольFest».</td></tr>
<tr><td>🇵🇱 Польща</td><td>Єжи Гротовський і ідея «бідного театру»: головне — актор і глядач, без пишних декорацій.</td></tr>
<tr><td>🇫🇷 Франція</td><td>«Комеді Франсез» (заснований 1680 р.) — один із найстаріших діючих театрів; Авіньйонський фестиваль (з 1947 р.).</td></tr>
<tr><td>🇺🇸 США</td><td>Бродвей у Нью-Йорку — столиця <b>мюзиклу</b>, де поєднуються драма, спів і танець.</td></tr>
<tr><td>🇯🇵 Японія</td><td>Традиційні театри Но, Кабукі та ляльковий Бунраку живуть поруч із сучасною сценою.</td></tr>
<tr><td>🇨🇳 Китай</td><td>Пекінська опера: спів, акробатика, бойові мистецтва, яскравий символічний грим.</td></tr></table>
<div class="rules"><div class="rule"><h4>🎭 Драматичний театр</h4>Головне — слово і гра актора.</div><div class="rule"><h4>🎶 Музичний театр</h4>Опера, балет, оперета, мюзикл.</div><div class="rule"><h4>🪆 Театр ляльок</h4>Актори-ляльководи оживлюють ляльок.</div><div class="rule"><h4>🧑‍🎤 Сучасні форми</h4>Документальний, імерсивний (глядач усередині дії), вуличний театр.</div></div>

<script>

flip(a){return `<div class="grid2">${a.cards.map(c=>`<div class="flip" onclick="this.classList.toggle('f')"><div class="in"><div class="a">${c[0]}</div><div class="b">${c[1]}</div></div></div>`).join('')}</div>`},

};

/* ---------- crossword ---------- */
function buildCross(words){const W=words.map(w=>[w[0].toUpperCase().replace(/[^A-ZА-ЯІЇЄҐ]/g,''),w[1]]).filter(w=>w[0].length>1);let best=null;
 for(let t=0;t<40;t++){const ord=t==0?W.slice().sort((a,b)=>b[0].length-a[0].length):shuffle(W);const g={},pl=[];
  const get=(r,c)=>g[r+','+c];
  const can=(w,r,c,d)=>{const dr=d?1:0,dc=d?0:1;if(get(r-dr,c-dc)||get(r+dr*w.length,c+dc*w.length))return false;let cross=0;
   for(let i=0;i<w.length;i++){const rr=r+dr*i,cc=c+dc*i,x=get(rr,cc);if(x){if(x!=w[i])return false;cross++}else{if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return false}}return cross>0};
  const put=(w,r,c,d,cl)=>{for(let i=0;i<w.length;i++)g[(r+(d?i:0))+','+(c+(d?0:i))]=w[i];pl.push({w,r,c,d,cl})};
  put(ord[0][0],0,0,0,ord[0][1]);
  for(const [w,cl] of ord.slice(1)){const opts=[];for(const p of pl)for(let i=0;i<w.length;i++)for(let j=0;j<p.w.length;j++)if(w[i]==p.w[j]){const d=1-p.d;const r=p.d?p.r+j:p.r-i,c=p.d?p.c-i:p.c+j;
     const rr=d?p.r-i:p.r+j,cc=d?p.c+j:p.c-i;if(can(w,rr,cc,d))opts.push([rr,cc,d])}
   if(opts.length){const o=opts[Math.floor(Math.random()*opts.length)];put(w,o[0],o[1],o[2],cl)}}
  if(!best||pl.length>best.length)best=pl;if(pl.length==W.length)break}
 return best}
function crossHTML(words){const pl=buildCross(words);const id=nid();let r0=1e9,c0=1e9,r1=-1e9,c1=-1e9;pl.forEach(p=>{r0=Math.min(r0,p.r);c0=Math.min(c0,p.c);r1=Math.max(r1,p.r+(p.d?p.w.length-1:0));c1=Math.max(c1,p.c+(p.d?0:p.w.length-1))});
 const cells={},nums={};let k=0;pl.slice().sort((a,b)=>a.r-b.r||a.c-b.c).forEach(p=>{const key=p.r+','+p.c;if(!nums[key])nums[key]=++k;p.num=nums[key]});
 pl.forEach(p=>{for(let i=0;i<p.w.length;i++)cells[(p.r+(p.d?i:0))+','+(p.c+(p.d?0:i))]=p.w[i]});
 let h=`<div id="${id}" style="overflow:auto"><table class="cw">`;for(let r=r0;r<=r1;r++){h+='<tr>';for(let c=c0;c<=c1;c++){const L=cells[r+','+c];h+=L?`<td class="c">${nums[r+','+c]?`<sup>${nums[r+','+c]}</sup>`:''}<input maxlength="1" data-a="${L}" oninput="cwNext(this)"></td>`:'<td></td>'}h+='</tr>'}h+='</table>';
 const cl=d=>pl.filter(p=>p.d==d).sort((a,b)=>a.num-b.num).map(p=>`<li><b>${p.num}.</b> ${p.cl} <small>(${p.w.length})</small></li>`).join('');
 h+=`<div class="clues"><div><b>По горизонталі →</b><ol>${cl(0)}</ol></div><div><b>По вертикалі ↓</b><ol>${cl(1)}</ol></div></div><p><button class="btn" onclick="cwCheck('${id}')">Перевірити</button> <button class="btn g" onclick="cwShow('${id}')">Показати відповіді</button> <b class="res"></b></p></div>`;return h}
function cwNext(i){i.value=i.value.toUpperCase();const all=$$('input',i.closest('table'));const k=all.indexOf(i);if(i.value&&all[k+1])all[k+1].focus()}

function p15HTML(n){const words=strip(ruleHTML(n)).trim().split(/\s+/);const parts=[];const per=Math.ceil(words.length/8);for(let i=0;i<8;i++){const s=words.slice(Math.round(i*words.length/8),Math.round((i+1)*words.length/8)).join(' ');parts.push(s||'…')}
 let st=[0,1,2,3,4,5,6,7,8];for(let k=0;k<120;k++){const e=st.indexOf(8);const nb=[e-3,e+3,e%3?e-1:-1,e%3<2?e+1:-1].filter(x=>x>=0&&x<9);const m=nb[Math.floor(Math.random()*nb.length)];[st[e],st[m]]=[st[m],st[e]]}
 if(st.every((x,i)=>x==i)){[st[7],st[8]]=[st[8],st[7]];[st[6],st[7]]=[st[7],st[6]]}
 window.P15={st,parts,n};return `<p><small>Зберіть правило в правильному порядку: натискайте на плитку поруч із порожньою клітинкою. Номер у кутку — підказка.</small></p><div class="p15" id="p15">${p15Cells()}</div><p class="res" id="p15r"></p>`}

let BT=null;function stopBlitz(){if(BT){clearInterval(BT);BT=null}window.onQ=null}

 window.onQ=ok=>{if(ok){score++;$('#bs').textContent=score}setTimeout(()=>{if(BT)next()},500)};next();
 BT=setInterval(()=>{t--;const e=$('#bt');if(!e){stopBlitz();return}e.textContent=t;if(t<=0){stopBlitz();box.innerHTML=`<div class="card"><div class="big">${score}</div><p style="text-align:center">правильних відповідей за 60 секунд!</p></div>`}},1000)}

 const qs=shuffle(allQs(n)).slice(0,5);let st=0;const per=Math.ceil(word.length/5);
 const draw=()=>{const shown=Math.min(word.length,st*per);box.innerHTML=`<div class="card"><h3>🗝️ Квест: станція ${Math.min(st+1,5)} з 5</h3><div class="letters">${[...word].map((c,i)=>`<span>${i<shown?c:'?'}</span>`).join('')}</div>${st<5?`<div id="qq">${quizQ(qs[st].q,qs[st].o,qs[st].a,qs[st].e)}</div>`:`<p style="text-align:center">🎉 Секретне слово: <b>${word}</b> — ${clue}</p>`}</div>`};

 let h=`<div class="lhead"><div class="crumb" style="color:${m.color}">Модуль ${m.n}. ${esc(m.title)} · Урок ${n}</div><h1>${esc(L.title)}</h1><div class="modes"><button class="${MODE=='stages'?'on':''}" onclick="MODE='stages';showLesson()">Урок за етапами</button><button class="${MODE=='all'?'on':''}" onclick="MODE='all';showLesson()">Теорія + вправи</button></div></div>`;
 if(MODE=='all'){h+=`<span class="ribbon"><span>Нові знання</span></span>${theoryHTML(n)}<span class="ribbon"><span>Практика</span></span>${practiceHTML(n)}`}
 else{h+=`<div class="tabs">${STAGES.map((s,k)=>`<button class="${k==STAGE?'on':''}" onclick="STAGE=${k};showLesson()">${s[0]}</button>`).join('')}</div><div class="mins">${STAGES[STAGE][1]} хв</div><span class="ribbon"><span>${STAGES[STAGE][0]}</span></span>`;
  h+=[()=>moodHTML(n,'before'),()=>warmHTML(n),()=>topicHTML(n),()=>theoryHTML(n),()=>practiceHTML(n),()=>summaryHTML(n),()=>reflHTML(n),()=>moodHTML(n,'after')][STAGE]();
  h+=`<div class="nav2"><button class="btn g" ${STAGE==0?'disabled':''} onclick="STAGE--;showLesson()">← Назад</button><button class="btn" ${STAGE==7?'disabled':''} onclick="STAGE++;showLesson()">Далі →</button></div>`}
 h+=`<div class="nav2" style="border-top:1px solid var(--line);padding-top:14px">${i>0?`<a class="btn g" style="text-decoration:none" href="#l/${NUMS[i-1]}">← Урок ${NUMS[i-1]}</a>`:'<span></span>'}${i<NUMS.length-1?`<a class="btn y" style="text-decoration:none" href="#l/${NUMS[i+1]}">Урок ${NUMS[i+1]} →</a>`:''}</div>`;
 $('#main').innerHTML=h;sideNav($('.search').value)}

/* ---------- home & games ---------- */
function home(){stopBlitz();$('#main').innerHTML=`<div class="hero"><h1>${COURSE.title}</h1><p>${COURSE.sub}</p></div><div class="mods">${MODULES.map(m=>`<div class="mcard" style="border-color:${m.color}" onclick="location.hash='#l/${m.range[0]}'"><b>${m.n}. ${esc(m.title)}</b><small>Уроки ${m.range[0]}–${m.range[1]}</small></div>`).join('')}</div>`;sideNav($('.search').value)}
function gamesPage(){stopBlitz();$('#main').innerHTML=`<h1>🎲 Ігри курсу</h1>
 ${actBox('Бліц по всьому курсу',`<button class="btn" onclick="blitz($('#gcb'),NUMS.flatMap(allQs))">Почати бліц (60 с)</button><div id="gcb"></div>`)}
 ${actBox('Хто відповідає?',`<p>Кількість учнів у класі: <input class="inp" style="width:90px" id="who_n" type="number" value="${store.get('who',25)}"> <button class="btn y" onclick="who()">🎯 Обрати</button></p><div class="big" id="who_r">?</div>`)}
 ${actBox('Кросворди та пам’ять по модулях',`<div class="tiles">${MODULES.map(m=>`<button class="tile" style="border-color:${m.color}" onclick="modGame(this,${m.n},'cross')"><span class="e">🧩</span>${m.n}. ${esc(m.title)}</button><button class="tile" style="border-color:${m.color}" onclick="modGame(this,${m.n},'mem')"><span class="e">🃏</span>Пам’ять: ${m.n}</button>`).join('')}</div><div id="mgb"></div>`)}`;sideNav('')}
function who(){const n=+$('#who_n').value||25;store.set('who',n);let k=0;const it=setInterval(()=>{const e=$('#who_r');if(!e){clearInterval(it);return}e.textContent=1+Math.floor(Math.random()*n);if(++k>15)clearInterval(it)},70)}
function modGame(t,mn,g){$$('#main .tile').forEach(x=>x.classList.remove('on'));t.classList.add('on');const m=MODULES.find(x=>x.n==mn);const ns=NUMS.filter(n=>n>=m.range[0]&&n<=m.range[1]);
 const words=[];const seen={};ns.forEach(n=>(LWORDS[n]||[]).forEach(w=>{if(!seen[w[0]]){seen[w[0]]=1;words.push(w)}}));
 if(g=='cross')$('#mgb').innerHTML=crossHTML(shuffle(words).slice(0,10));
 else{const pairs=shuffle(words).slice(0,6).map(w=>[w[0],w[1]]);$('#mgb').innerHTML=memHTML(pairs)}}

/* ---------- scoreboard & presentation ---------- */
function toggleScore(){const b=$('#scoreBox');if(b.innerHTML){b.innerHTML='';store.set('scoreOn',0);return}store.set('scoreOn',1);drawScore()}
function drawScore(){const s=store.get('score',{k:2,t:[['Команда 1',0],['Команда 2',0],['Команда 3',0],['Команда 4',0]]});$('#scoreBox').innerHTML=`<div class="score"><div style="display:flex;justify-content:space-between;align-items:center"><b class="mont">🏆 Табло</b><span>${[2,3,4].map(k=>`<button class="btn ${s.k==k?'':'g'}" style="padding:2px 8px" onclick="scSet('k',${k})">${k}</button>`).join(' ')} <button class="btn g" style="padding:2px 8px" onclick="toggleScore()">✕</button></span></div>${s.t.slice(0,s.k).map((t,i)=>`<div class="tm"><input value="${esc(t[0])}" onchange="scName(${i},this.value)"><button onclick="scAdd(${i},-1)">−</button><b>${t[1]}</b><button onclick="scAdd(${i},1)">+</button></div>`).join('')}<button class="btn g" style="padding:2px 8px;font-size:13px" onclick="scReset()">Обнулити</button></div>`;window.SC=s}
function scSet(k,v){SC[k]=v;store.set('score',SC);drawScore()}
function scAdd(i,d){SC.t[i][1]+=d;store.set('score',SC);drawScore()}
function scName(i,v){SC.t[i][0]=v;store.set('score',SC)}
function scReset(){SC.t.forEach(t=>t[1]=0);store.set('score',SC);drawScore()}
function present(){const on=!document.documentElement.classList.contains('present');document.documentElement.classList.toggle('present',on);document.body.classList.toggle('present',on);
 if(on){try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Натисніть F11 для повного екрана'))}catch(e){toast('Натисніть F11 для повного екрана')}}else{try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;
 if(e.key=='Escape'&&document.documentElement.classList.contains('present')){document.documentElement.classList.remove('present');document.body.classList.remove('present')}
 if(curN()&&MODE=='stages'){if(e.key=='ArrowRight'&&STAGE<7){STAGE++;showLesson()}if(e.key=='ArrowLeft'&&STAGE>0){STAGE--;showLesson()}}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.documentElement.classList.remove('present');document.body.classList.remove('present')}});
function route(){const h=location.hash;$('.side').classList.remove('open');if(h=='#games')gamesPage();else if(curN()){if(window._last!=curN()){STAGE=0;window._last=curN()}showLesson();scrollTo(0,0)}else home()}
window.addEventListener('hashchange',route);route();if(store.get('scoreOn',0))drawScore();

</script>
</body>
</html>
