<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зарубіжна література · 7 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
const BOOK_NAME = "Ніколенко О. М., Мацевко-Бекерська Л. В., Рудніцька Н. П. Зарубіжна література, 7 клас (2024)";
const META = [{"section": "Вступ. Роль художнього перекладу в сучасну добу", "title": "Оригінал і переклад. Види перекладів. Видатні українські перекладачі", "codes": "", "ktp": "", "hw": "Опрацювати с. 8-15.\nСтворіть схему «Види перекладів». Прокоментуйте, наведіть приклади.", "pages": ""}, {"section": "Герої та героїні балад", "title": "Балада як жанр усної народної творчості. Характерні ознаки балади", "codes": "", "ktp": "", "hw": "Вивчити визначення балади.\nЗаписати в зошит 5 основних ознак балади.", "pages": ""}, {"section": "Герої та героїні балад", "title": "Староанглійська балада «Король Лір і його дочки». Сюжет випробування", "codes": "", "ktp": "", "hw": "Прочитати баладу «Король Лір і його дочки».", "pages": ""}, {"section": "Герої та героїні балад", "title": "Моральний урок у творі. Король Лір як вічний образ", "codes": "", "ktp": "", "hw": "Чого навчає балада?", "pages": ""}, {"section": "Герої та героїні балад", "title": "«Як Робін Гуд став розбійником» (або «Поєдинок Робіна Гуда з Ґаєм Ґісборном», за вибором учителя). Ідеї свободи й служіння народові", "codes": "", "ktp": "", "hw": "Прочитати баладу «Як Робін Гуд став розбійником».", "pages": ""}, {"section": "Герої та героїні балад", "title": "Образ народного захисника Робіна Гуда", "codes": "", "ktp": "", "hw": "Виконати тест https://www.classtime.com/code/WP5UBZ", "pages": ""}, {"section": "Герої та героїні балад", "title": "Літературна балада та її ознаки. Подібність і відмінність від народної балади", "codes": "", "ktp": "", "hw": "Зроби таблицю з відмінностями літературної балади і народної.", "pages": ""}, {"section": "Герої та героїні балад", "title": "Йоганн Крістоф Фрідріх Шиллер (1759–1805). «Рукавичка». Випробування головного героя балади", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Герої та героїні балад", "title": "Образ справжнього лицаря, оспівування мужності, відваги, людської гідності", "codes": "", "ktp": "", "hw": "Опрацювати презентацію.", "pages": ""}, {"sect {pages:"с. 8–15",
info:`<p><b>Переклад</b> — відтворення тексту (усного чи писемного) засобами іншої мови. Ґете називав переклад «одним з найважливіших засобів спілкування між людьми». Художній переклад допомагає народам обмінюватися культурними скарбами.</p>
<p><b>Специфіка художнього перекладу:</b> художній текст не лише передає інформацію, а й має естетичну функцію. Тож перекладач має зберегти зміст, форму й емоційний вплив оригіналу. Для цього треба знати не лише мову, а й історію, традиції, мислення обох народів. Художній переклад — явище одразу двох літератур.</p>
<p><b>Види перекладів:</b></p>
<ul><li><b>прямий</b> — з першоджерела; <b>непрямий</b> — через мову-посередника (Леся Українка перекладала давньоіндійську поезію з французьких і німецьких текстів);</li>
<li><b>буквальний (дослівний)</b> — зберігає чужомовні слова й конструкції;</li>
<li><b>точний</b> — відтворює зміст і форму, але відповідає нормам мови перекладу; <b>неточний</b> — має відхилення;</li>
<li><b>повний</b> і <b>неповний</b>; <b>вільний</b> — передає лише загальний зміст.</li></ul>
<p><b>Переспів</b> — уже авторський твір за мотивами іншомовного першоджерела з вираженою позицією автора.</p>
<p><b>Видатні українські перекладачі:</b> Іван Франко, Леся Українка, Микола Лукаш, Григорій Кочур, Борис Тен, Максим Рильський, Юрій Андрухович та ін.</p>`,

{pages:"с. 16–19",
info:`<p><b>Виникнення балади.</b> Давно на півдні Франції, у Провансі, виникли танцювальні пісні про кохання — <b>балади</b> (від лат. <i>ballare</i> — танцювати). Їх виконували мандрівні співці — менестрелі. Ранні балади мали усталену форму: три строфи, приспів, повтори, звертання.</p>
<p>Згодом балади втратили танцювальну основу й поширилися Європою як <b>усні розповіді про події</b>. Оповідачі додавали своє, тому балади існували в різних варіантах. Пізніше їх записали й надрукували.</p>
<p><b>Характерні ознаки народної балади:</b></p>
<ol><li>невеликий обсяг, віршована форма;</li><li>напружений, захопливий сюжет (часто з легенд);</li><li>небагато подій і персонажів;</li><li>поєднання епосу (розповідь), лірики (почуття) і драми (діалоги);</li><li>фантастика, гіперболи, постійні епітети, повтори, символи;</li><li>герої втілюють народні ідеали й моральні цінності.</li></ol>
<p>Деякі образи балад стали <b>вічними</b>: король Лір, Робін Гуд.</p>`,

{pages:"с. 20–25",
info:`<p><b>«Король Лір і його дочки»</b> — староанглійська балада в перекладі Івана Франка («повість про дитячую невдячність»).</p>
<p><b>Літературний рід:</b> ліро-епос. <b>Жанр:</b> балада. <b>Будова:</b> чотиривірші (катрени).</p>
<p><b>Тема:</b> трагічна історія короля, який через довірливість і лестощі втрачає владу, повагу й доньку, але врешті знаходить справжню любов — ціною життя.</p>
<p><b>Ідея:</b> засудження лестощів, лицемірства й невдячності; оспівування щирої, самовідданої любові, що виявляється у вчинках, а не в гучних словах.</p>
<p><b>Сюжет випробування:</b> старий король влаштовує доньки «іспит любові»: хто скаже, що любить його найбільше, отримає найбільшу частину королівства. Старші, Гонорелла й Регана, лестять, а молодша, Корделія, відповідає скромно й чесно. Лір помиляється — і за це дорого платить.</p>
<p><b>Провідний мотив:</b> невдячність дітей — найглибше горе батьків; справжня любов тиха й жертовна, а облудна — голосна й зрадлива.</p>`,
terms:[["Сюжет випробування","сюжет, у якому герой перевіряє інших або проходить перевірку сам"],["Катрен","строфа з чотирьох рядків"]],
q:[["Скільки дочок мав король Лір?",["Дві","Три","Чотири","Одну"],1],
["Як звали молодшу дочку?",["Регана","Гонорелла","Корделія","Маріан"],2],

{pages:"с. 20–28",
info:`<p><b>Моральний урок балади.</b> Помилка Ліра в тому, що він повірив гучним словам, а не вчинкам; цінував лестощі, а не щирість. Старші дочки, отримавши владу, виганяють батька, зменшують його почет, і король опиняється в злиднях, «жебрацький кий узяв у руку той, що королівськую носив корону».</p>
<p>Лише Корделія, яку він прогнав, приходить на допомогу з військом. Вона гине в битві, а Лір помирає від горя над її тілом. Покарання наздоганяє й лицемірних сестер.</p>
<p><b>Чого навчає балада:</b> цінувати щирість; судити людей за вчинками; бути вдячними батькам; не піддаватися лестощам.</p>
<p><b>Король Лір — вічний образ.</b> Вічні образи — персонажі, що виходять за межі одного твору й стають символами людських рис і ситуацій. Сюжет про Ліра ліг в основу трагедії <b>Вільяма Шекспіра «Король Лір»</b> (1606), численних вистав і фільмів. Ім'я Ліра стало символом сліпої батьківської любові й трагедії зрадженого батька.</p>`,
terms:[["Вічний образ","образ, що перейшов з одного твору в світову культуру як символ"],["Мораль","повчальний висновок із твору"]],
q:[["У чому головна помилка Ліра?",["Повірив лестощам, а не вчинкам","Був жорстоким","Був скупим","Не любив дочок"],0],
["Хто врятував Ліра в біді?",["Регана","Гонорелла","Корделія","Французький принц"],2],

["Що символізує образ Ліра?",["Сліпу батьківську любов і трагедію довірливості","Хитрість","Багатство","Перемогу"],0]]},

{pages:"", nobook:"Балади про Робіна Гуда немає в підручнику — прочитайте текст за матеріалами вчителя (у підручнику про Робіна Гуда згадано на с. 17).",
info:`<p><b>Робін Гуд</b> — легендарний народний герой Англії, «благородний розбійник» із Шервудського лісу. Балади про нього складали з XIV століття; їх відомо близько 40.</p>
<p><b>«Як Робін Гуд став розбійником»</b> (переказ). Роб із Локслі — син королівського лісничого. Вороги батька (шериф Ноттінгема, єпископ Герфордський та інші) зводять наклеп: родину виганяють із дому, батько помирає у в'язниці, мати — від горя.</p>
<p>Дорогою на змагання лучників Роб зустрічає лісників, ватажок яких посів місце його батька. Той глузує з хлопця й б'ється об заклад. Роб влучає в оленя-ватажка, але замість винагороди лісничий стріляє йому в спину. Роб у відповідь вбиває кривдника — і стає поза законом.</p>
<p>Він приєднується до вигнанців-лучників, переодягнений жебраком виграє на очах шерифа <b>золоту стрілу</b>, дарує її Маріан — і ватага обирає його ватажком. Вони присягають: забирати багатства в несправедливих, допомагати бідним і ніколи не кривдити жінок.</p>
<p><b>Ідеї:</b> свобода, справедливість, служіння народові.</p>`,
terms:[["Народний захисник","герой, що стає на бік скривджених простих людей"],["Поза законом","становище людини, позбавленої захисту закону"]],

{pages:"", nobook:"Балади про Робіна Гуда немає в підручнику — працюйте з текстом за матеріалами вчителя.",
info:`<p><b>Робін Гуд</b> — символ боротьби за справедливість. Разом із вірними друзями він переховується в Шервудському лісі й виступає проти жорстоких правителів, які пригнічують простих людей.</p>
<p><b>Риси героя:</b></p>
<ul><li><b>справедливість</b> — забирає багатства в несправедливих і допомагає тим, хто потребує;</li><li><b>сміливість і мужність</b> — не боїться небезпеки, захищає беззахисних;</li><li><b>майстерність</b> — найкращий лучник, спритний, винахідливий;</li><li><b>вірність</b> — не залишає друзів у біді, дотримується принципів;</li><li><b>доброта і щедрість</b>, уміння співчувати.</li></ul>
<p><b>Друзі Робіна:</b> Маленький Джон (велетень із жартівливим ім'ям), брат Тук, Вілл Скарлет, кохана — Маріан.</p>
<p><b>Висновок:</b> справжній герой — не просто сильна людина, а той, хто захищає слабших і бореться з несправедливістю. Тому історія Робіна Гуда популярна й сьогодні: фільми, мультфільми, книжки.</p>`,

{pages:"с. 31–36",
info:`<p><b>Фрідріх Шиллер</b> (1759–1805) — німецький поет і драматург, один із класиків світової літератури, співець свободи, честі й людської гідності. Його вірш «Ода до радості» став гімном Європейського Союзу (на музику Бетховена).</p>
<p><b>«Рукавичка»</b> (1797) — літературна балада. Сюжет Шиллер узяв із реального випадку з французької хроніки XVI ст.</p>
<p><b>Тема і головна ідея:</b> людська гідність і ціна життя. Не можна грати почуттями й життям іншої людини; справжня любов не вимагає доказів ціною смерті.</p>
<p><b>Композиція:</b> 1) опис королівських ігор і хижаків; 2) провокація Куніґунди й подвиг Делоржа; 3) кульмінаційна відповідь лицаря.</p>
<p><b>Випробування героя:</b> лицар Делорж мусить вибрати між придворними «правилами гри» і власною гідністю. Він доводить мужність, піднявши рукавичку серед звірів, а гідність — кинувши її в обличчя жорстокій красуні.</p>`,
terms:[["Конфлікт","зіткнення протилежних поглядів, інтересів, характерів"],["Кульмінація","найвища точка напруження в сюжеті"]],
q:[["Країна Шиллера:",["Англія","Німеччина","Франція","Шотландія"],1],
["Хто кинув рукавичку на арену?",["Король","Куніґунда","Делорж","Королева"],1],
["Як вчинив Делорж, піднявши рукавичку?",["Подарував Куніґунді з поклоном","Кинув їй в обличчя","Залишив собі","Віддав королю"],1],

{pages:"с. 34–36",
info:`<p><b>Делорж</b> — справжній лицар. У ньому поєднуються <b>мужність</b> (спокійно спускається до лева, тигра й леопардів) і <b>гідність</b> (не дозволяє принижувати себе й гратися своїм життям).</p>
<p><b>Куніґунда</b> — «глузлива красуня», жорстока й марнославна. Вона випробовує кохання лицаря, ризикуючи його життям лише для того, щоб похизуватися перед двором.</p>
<p><b>Кодекс справжнього лицаря:</b> хоробрість, честь, вірність слову, захист слабких, повага до себе й інших. Делорж показує: справжня честь — не в сліпому виконанні примх, а у внутрішній цілісності.</p>
<p><b>Художні засоби:</b> епітети («глузлива красуня»), метафори, контрасти (тиша звірів — рев арени; натовп — спокій Делоржа), паралелізм (повтори дій короля), кульмінаційна пряма мова — «Не треба дяки!».</p>
<p><b>Висновок:</b> Шиллер оспівує мужність, відвагу й людську гідність, а засуджує жорстокість і пиху.</p>`,
terms:[["Контраст","протиставлення образів, явищ для підсилення враження"],["Лицарський кодекс","правила честі, яких мав дотримуватися лицар"]],

{pages:"", nobook:"Балади Стівенсона немає в підручнику — прочитайте її за матеріалами вчителя (у підручнику автора згадано на с. 29).",
info:`<p><b>Роберт Льюїс Стівенсон</b> (1850–1894) — шотландський письменник, автор пригодницького роману «Острів скарбів». Із дитинства тяжко хворів, але мандрував світом; останні роки жив на острові Самоа, де місцеві жителі називали його «Туситала» — «Оповідач».</p>
<p><b>«Балада про вересовий трунок»</b> (1890) заснована на шотландській легенді про <b>піктів</b> — давній народ Шотландії, що вмів варити з вересу медовий напій.</p>
<p><b>Сюжет:</b> король шотландців знищує піктів. Залишаються лише двоє — старий батько й син. Король вимагає видати таємницю вересового трунку, погрожуючи тортурами. Батько погоджується, але з умовою: сина треба вбити, бо той, мовляв, не витримає зради. Коли юнака кидають у море, старий каже, що тепер таємницю не вирве ніхто, — і вона гине разом із ним.</p>
<p><b>Основний конфлікт:</b> батько і син — король; <b>свобода — рабство</b>. Пікти фізично переможені, але духовно непереможні.</p>`,

<p><b>Образ короля</b> — жорстокий завойовник, що прагне не лише землі, а й душі переможеного народу. Але він залишається безсилим.</p>

info:`<p><b>Адам Міцкевич</b> (1798–1855) — великий польський поет-романтик. Народився на Новогрудчині (нині Білорусь), навчався у Вільні, за участь у таємних студентських товариствах був засланий до Росії. Бував в Україні, в Одесі та Криму («Кримські сонети»). Помер у Константинополі. Автор поеми «Пан Тадеуш».</p>
<p><b>«Світязь»</b> (1821) — літературна балада зі збірки «Балади і романси». В її основі — легенда про озеро Світязь поблизу Новогрудка.</p>
<p><b>Сюжет:</b> пан наказує рибалкам закинути невід в озеро. Вони витягують не рибу, а прекрасну діву-німфу. Вона розповідає: колись тут стояло місто Світязь, яким правив князь Туган. Коли чоловіки пішли на допомогу союзникам, місто оточили вороги. Жінки, щоб не потрапити в неволю, помолилися — і місто зійшло під воду, а вони перетворилися на білі квіти. Вороги, які зривали ці квіти, гинули.</p>
<p><b>Ідеї:</b> любов до батьківщини, героїзм, гідність, свобода понад усе. <b>Символічні образи:</b> озеро (пам'ять), квіти (чистота, непокора), німфа (душа народу). <b>Фольклорні елементи:</b> легенда, фантастика, перетворення.</p>`,

info:`<p><b>Лицарство</b> — військовий стан у середньовічній Західній Європі. Лицарі мали дотримуватися <b>кодексу честі</b>: служити сюзеренові й вірі, бути хоробрими, вірними слову, захищати слабких, шанувати Прекрасну Даму.</p>
<p><b>Вальтер Скотт</b> (1771–1832) — шотландський письменник, <b>засновник історичного роману</b>. У дитинстві через хворобу довго жив на фермі діда, де слухав шотландські легенди й балади. Юрист за освітою, збирач фольклору, поет. Найвідоміші романи: «Веверлі», «Роб Рой», «Айвенго», «Квентін Дорвард».</p>
<p><b>Історичний роман</b> — роман, у якому зображено реальні історичні події й постаті, поєднані з художнім вимислом. Скотт уперше показав, як історія впливає на долі звичайних людей.</p>
<p><b>«Айвенго»</b> (1819) переносить читача в Англію кінця XII ст., коли король Річард Левове Серце перебував у полоні, а його брат принц Джон рвався до влади. У центрі — лицар Вілфред Айвенго, вірний королеві Річарду.</p>`,

{pages:"с. 43–61",
info:`<p><b>Бріан де Буагильбер</b> — лицар-тамплієр, сильний і хоробрий, але гордий, жорстокий і себелюбний. Готовий порушити закони ордену заради власних бажань. Закоханий у Ребекку, він хоче силою підкорити її. Протиставлений Айвенго: обидва найсильніші лицарі, але служать різним правителям і мають різні цінності.</p>
<p><b>Принц Джон</b> — брат Річарда, підступний, боягузливий, жадібний до влади; змовляється проти брата.</p>
<p><b>Реджинальд Фрон де Беф</b> — жорстокий барон-норман, господар замку Торкілстон, катує полонених заради грошей.</p>
<p><b>Моріс де Брасі</b> — ватажок найманців, легковажний; викрадає Ровену, щоб силою одружитися з нею.</p>
<p><b>Леді Ровена</b> — англосаксонська красуня королівського роду, горда, шляхетна, вірна коханню до Айвенго.</p>
<p><b>Ребекка</b> — дочка Ісаака; мудра, мужня, милосердна цілителька. Вона доглядає пораненого Айвенго, готова загинути, але не зрадити себе. Багато читачів вважають її найсильнішим образом роману.</p>`,

info:`<p><b>Історичний колорит</b> — відтворення особливостей епохи: побуту, звичаїв, мови, одягу, світогляду людей.</p>
<p><b>Засоби створення колориту в «Айвенго»:</b></p>
<ul><li>докладні описи <b>замків, зброї, обладунків, одягу</b>;</li><li>сцени <b>лицарського турніру</b> в Ешбі з його ритуалами;</li><li>описи бенкетів, середньовічного побуту;</li><li>історичні постаті й реалії (хрестові походи, тамплієри);</li><li>мова персонажів, звертання, девізи.</li></ul>
<p><b>Динаміка сюжету:</b> стрімкі події — таємничий лицар на турнірі, полонення, облога, суд, двобій; несподівані розкриття (Чорний Лицар — король Річард, Позбавлений Спадщини — Айвенго).</p>
<p><b>Гумор:</b> блазень <b>Вамба</b> дотепно жартує, часто кажучи мудру правду; комічні сцени з братом Туком (відлюдником-ченцем); жартівливі суперечки персонажів. Гумор робить роман живим і людяним.</p>`,

{pages:"с. 62–69",
info:`<p><b>Друга світова війна</b> (1939–1945) — найкривавіша війна в історії людства, що забрала десятки мільйонів життів. Вона почалася 1 вересня 1939 р. нападом нацистської Німеччини на Польщу. Європейська поезія того часу стала голосом болю, протесту й пам'яті.</p>
<p><b>Константи-Ільдефонс Галчинський</b> (1905–1953) — польський поет, народився у Варшаві. У вересні 1939 р. його призвали до армії, 17 вересня він потрапив у німецький полон і понад п'ять років провів у таборі для військовополонених.</p>
<p><b>«Пісня про солдатів з Вестерплятте».</b> Вестерплятте — півострів біля Гданська, де невеликий польський гарнізон 7 днів (1–7 вересня 1939 р.) героїчно оборонявся від переважаючих сил ворога. Поет оспівує загиблих захисників: їхні душі ніби піднімаються до неба, а пам'ять про них — вічна. Подвиг протиставлено жахіттю війни.</p>
<p><b>«Лист із полону»</b> (1942) поет присвятив дружині Наталії. Листи з табору надсилати було заборонено, тож вірш — «лист», який міг дійти лише подумки. Ліричний герой звертається до коханої з ніжністю («Ти щастя моє весняне…», «Ти — пісня моєї дороги»): любов і віра в зустріч допомагають вистояти. Їхнє кохання витримало війну — після звільнення подружжя зустрілося в Кракові.</p>
<p><b>Ідея:</b> війна антигуманна — вона нищить людей, розлучає родини; але мужність і любов сильніші за насильство.</p>`,
terms:[["Антигуманний","спрямований проти людини, її життя й гідності"],["Ліричний герой","особа, чиї почуття й думки передано у вірші"]],

{pages:"с. 70–73",
info:`<p><b>Альфред Марґул-Шпербер</b> (1898–1967) — поет, що писав німецькою мовою; народився на Буковині (у Сторожинці, нині Чернівецька область України). Перекладач, громадський діяч.</p>
<p><b>«Про назву концтабору Бухенвальд».</b> <b>Бухенвальд</b> — один із найбільших нацистських концентраційних таборів (1937–1945) поблизу Веймара, де загинули десятки тисяч в'язнів. Назва в перекладі з німецької означає <b>«буковий ліс»</b>.</p>
<p>Поет вражений <b>контрастом</b>: прекрасна, мирна назва — і жахлива реальність табору смерті неподалік від Веймара, міста Ґете й Шиллера. Для поета це ще й особистий біль: його рідна Буковина теж означає «букові ліси». Спогади дитинства (килим трав, біляві хмари над поляною) тепер затьмарені страшним питанням: «А чи оте біляве пасмо хмар було не димом спалених людей?»</p>
<p><b>Ідеї вірша:</b> засудження нацизму й війни; пам'ять про жертви; заклик берегти життя й людські цінності навіть у найтрагічніших обставинах. Поезія не дає забути, щоб таке не повторилося.</p>`,
terms:[["Концтабір","концентраційний табір — місце масового ув'язнення й знищення людей"],["Контраст","протиставлення для підсилення враження"]],

{pages:"с. 74–105",
info:`<p><b>Джон Бойн</b> (нар. 1971) — ірландський письменник, народився в Дубліні. Автор понад двадцяти книжок для дорослих і дітей.</p>
<p><b>«Хлопчик у смугастій піжамі»</b> (2006) — повість, перекладена понад 50 мовами; 2008 р. екранізована (режисер Марк Герман).</p>
<p><b>Друга світова війна крізь долі дітей.</b> Події показано очима дев'ятирічного <b>Бруно</b> — сина нацистського коменданта. Хлопчик не розуміє, що відбувається: чому вони переїхали з Берліна, хто ці люди «в смугастих піжамах» за парканом.</p>
<p><b>Теми нацизму та Голокосту.</b> <b>Нацизм</b> — людиноненависницька ідеологія, що проголошувала перевагу одних народів над іншими. <b>Голокост</b> — масове знищення нацистами близько 6 мільйонів євреїв Європи. Табір у повісті — <b>Аушвіц (Освенцим)</b>.</p>
<p>Наївний дитячий погляд робить жахіття ще страшнішим: читач розуміє більше, ніж герой.</p>`,
terms:[["Голокост","масове знищення євреїв нацистами під час Другої світової війни"],["Нацизм","людиноненависницька ідеологія расової переваги"],["Оповідач","той, чиїми очима показано події"]],

{pages:"с. 78–105",
info:`<p><b>Бруно</b> — німецький хлопчик, допитливий, щирий, мріє стати дослідником. Нудьгуючи в новому будинку, він вирушає «досліджувати» місцевість і біля огорожі знайомиться зі <b>Шмулем</b>.</p>
<p><b>Шмуль</b> — єврейський хлопчик, в'язень табору; худий, сумний, тихий. Він народився в той самий день, що й Бруно.</p>
<p><b>Дружба:</b> майже рік хлопчики щодня зустрічаються біля паркану: розмовляють, діляться секретами. Бруно приносить Шмулю їжу. Між ними — колючий дріт, але для дружби кордонів немає.</p>
<p><b>Випробування дружби:</b> одного разу Шмуль потрапляє в дім коменданта, Бруно пригощає його, але, злякавшись лейтенанта Котлера, зрікається друга — і Шмуля жорстоко карають. Бруно мучиться соромом і просить пробачення; Шмуль прощає.</p>
<p><b>Взаємодопомога:</b> Бруно вирішує допомогти Шмулю знайти зниклого батька: перевдягається в «смугасту піжаму» й пролазить під парканом.</p>`,
terms:[["Дружба","взаємини, засновані на довірі, повазі й підтримці"]],
q:[["Де познайомилися Бруно і Шмуль?",["Біля огорожі табору","У школі","У Берліні","У парку"],0],
["Що спільного в хлопчиків?",["Народилися в один день","Однакові батьки","Однакова мова","Однакове захоплення футболом"],0],
["Що Бруно приносив Шмулю?",["Їжу","Книжки","Іграшки","Листи"],0],
["Як Бруно вчинив, коли злякався лейтенанта Котлера?",["Зрікся друга","Захистив Шмуля","Утік","Покликав батька"],0],
["Навіщо Бруно перевдягнувся в «піжаму»?",["Щоб допомогти Шмулю знайти батька","Для гри","Щоб утекти з дому","Щоб налякати сестру"],0]]},

{pages:"с. 78–105",
info:`<p><b>Ідея рівності</b> представників різних рас, націй і народів — головна в повісті.</p>
<ul><li>Бруно не розуміє, чому люди по різні боки паркану «різні». Для нього Шмуль — просто друг.</li><li>Діти нічим не відрізняються: однаковий вік, однакові мрії, однакові почуття. Різниця — лише в тому, по який бік огорожі вони опинилися.</li><li>Дорослі, отруєні ідеологією (батько, лейтенант Котлер, учитель Ліст), вчать ненавидіти «чужих».</li><li>Сестра Ґретель під впливом пропаганди змінюється: замість ляльок вішає на стіни карти й підтримує «ідеї» батька.</li><li>Мати й бабуся Бруно жахаються тим, що відбувається.</li></ul>
<p><b>Паркан</b> — символ штучного поділу людей, ненависті й несвободи.</p>
<p><b>Висновок:</b> немає «вищих» і «нижчих» народів; усі люди рівні в праві на життя, свободу й гідність. Ненависть — не вроджена, її прищеплюють.</p>`,

{pages:"с. 78–105",
info:`<p><b>Трагічний фінал.</b> Мати вирішує повернутися з дітьми до Берліна. В останній день Бруно перевдягається у смугасту робу, пролазить під парканом, щоб допомогти Шмулю знайти батька. Солдати заганяють в'язнів у «приміщення» — газову камеру. Хлопчики гинуть, тримаючись за руки.</p>
<p>Батько, знайшовши під парканом одяг сина, усвідомлює, що сталося. Його життя зруйноване: зло, яке він творив, забрало його власну дитину.</p>
<p><b>Значення фіналу:</b></p>
<ul><li>показує масштаб <b>злочинів фашизму</b>: у таборах смерті гинули мільйони, зокрема діти;</li><li>засуджує людиноненависницьку ідеологію;</li><li>утверджує: зло обертається проти тих, хто його творить;</li><li>дружба дітей сильніша за ненависть — вони разом до кінця.</li></ul>
<p>Автор завершує словами про те, що все це сталося давно і <b>ніколи не повинно повторитися</b> — у наш час.</p>`,

{pages:"с. 106–121",
info:`<p><b>Новела</b> (від італ. <i>novella</i> — новина) — невеликий прозовий твір про незвичайну подію, з напруженим сюжетом і <b>несподіваною кінцівкою</b>.</p>
<p><b>Ознаки новели:</b> невеликий обсяг; одна подія; небагато персонажів; стрімкий розвиток дії; чітка композиція; часто — неочікуваний фінал («пуант»), що змінює розуміння всього твору.</p>
<p><b>Різновиди:</b> соціально-побутова, психологічна, фантастична, пригодницька, гумористична, детективна.</p>
<p><b>О. Генрі</b> (Вільям Сідні Портер, 1862–1910) — американський письменник, <b>майстер новели</b>. Працював аптекарем, касиром у банку, був засуджений за розтрату в банку й саме у в’язниці почав писати. Створив близько 300 новел про «маленьких людей» Нью-Йорка.</p>
<p><b>«Дари волхвів»</b> (1905) — різдвяна новела про бідне подружжя, де кожен жертвує найдорожчим, щоб зробити подарунок коханій людині. <b>Моральні цінності:</b> любов, самопожертва, щедрість, вірність.</p>`,

{pages:"с. 111–121",
info:`<p><b>Біблійні мотиви.</b> <b>Волхви</b> — мудреці зі Сходу, які, за Євангелієм, прийшли вклонитися новонародженому Ісусові й принесли дари: золото, ладан і смирну. Вони започаткували звичай дарувати подарунки на Різдво.</p>
<p>О. Генрі називає своїх героїв «наймудрішими з усіх, хто підносить дари»: Делла й Джим принесли в жертву найдорожче — і їхні подарунки «непотрібні», але саме вони — справжні дари любові.</p>
<p><b>Роль художньої деталі:</b></p>
<ul><li><b>1 долар 87 центів</b> — усі заощадження Делли; деталь показує бідність героїв;</li><li><b>розкішне волосся Делли</b> і <b>золотий годинник Джима</b> — два скарби родини;</li><li><b>гребінці</b> й <b>платиновий ланцюжок</b> — подарунки, що стали «непотрібними»;</li><li>убога квартира за 8 доларів на тиждень, старий диван, сірий паркан за вікном.</li></ul>
<p>Деталі роблять розповідь зримою й підсилюють головну думку: любов цінніша за будь-які речі.</p>`,

{pages:"с. 122–130",
info:`<p><b>«Останній листок»</b> (1907) — новела О. Генрі про силу людського співчуття й самопожертви.</p>
<p>Дві молоді художниці, <b>Сью</b> і <b>Джонсі</b>, живуть у Грінвіч-Вілиджі — кварталі митців у Нью-Йорку. Джонсі тяжко захворіла на запалення легень і втратила волю до життя: вона вирішила, що помре, коли з плюща за вікном упаде останній листок.</p>
<p><b>Берман</b> — старий невдаха-художник, який усе життя мріяв написати шедевр, але так і не створив його. Він грубуватий, любить випити, але насправді має добре серце. Почувши про Джонсі, він обурюється її «дурними думками».</p>
<p>Уночі, у холодну зливу, Берман малює на стіні листок плюща — такий справжній, що Джонсі вірить: він не впав. До неї повертається бажання жити. А Берман, промерзлий, за два дні помирає від запалення легень.</p>
<p><b>Специфіка образу Бермана:</b> про його подвиг читач дізнається лише у фіналі — це несподівана кінцівка. Намальований листок і є його <b>справжнім шедевром</b>. Новела — гімн людині, здатній на самопожертву заради ближнього.</p>`,

info:`<p><b>Динаміка образу</b> — зміна характеру чи стану героя протягом твору.</p>
<p><b>Джонсі</b> — спочатку мрійлива, тендітна (мріє намалювати Неаполітанську затоку). Хвороба ламає її: вона здається, лежить нерухомо, рахує листки й чекає смерті. Але, побачивши «незламний» листок, соромиться своєї слабкості: «Бажати смерті — гріх». Вона просить їжі, дзеркало, знову мріє — і одужує. Від <b>зневіри — до волі до життя</b>.</p>
<p><b>Сью</b> — енергійна, практична, турботлива подруга. Вона доглядає Джонсі, працює за двох, приховує свій відчай, щоб підтримати подругу. Її любов і вірність не дають Джонсі згаснути. Наприкінці саме Сью розповідає про подвиг Бермана.</p>
<p><b>Висновок:</b> дружба, турбота й приклад самопожертви здатні повернути людині віру в життя.</p>`,

info:`<p><b>Особливості художньої мови новел О. Генрі:</b></p>
<ul><li><b>гумор та іронія</b> навіть у сумних ситуаціях (опис квартири Діллінгемів, «пан Запалення Легень»);</li><li><b>олюднення</b>: хвороба постає як «холодний, невидимий незнайомець», що ходить кварталом;</li><li><b>художні деталі</b> — гроші Делли, листок плюща;</li><li><b>розмовна мова</b> персонажів, жаргон, звертання до читача;</li><li><b>лаконізм</b> і <b>несподівана кінцівка</b>.</li></ul>

{pages:"с. 131–134",
info:`<p><b>Сторінки світової любовної лірики.</b> Кохання — одна з вічних тем поезії.</p>
<p><b>П'єр де Ронсар</b> (1524–1585) — французький поет доби Відродження, голова поетичної групи «Плеяда», яку називали «королем поетів». Його сонети присвячені коханим жінкам, красі, швидкоплинності молодості.</p>
<p><b>«До того, як любов у світ прийшла…»</b> (1547) — сонет про кохання як <b>творчу силу</b>. Спершу — космічна картина: до появи любові у світі панував хаос, планети плавали «без ладу, і без форми, й без числа». Так само й душа ліричного героя «без ладу й форми» блукала, поки кохана не «розлила сяйво з очей». Любов дала «життя, і рух, і силу» й відродила засмучену душу. Найбільше сонетів Ронсар присвятив юній селянці Марії Дюпен.</p>
<p><b>Сонет</b> — вірш із 14 рядків: два чотиривірші (катрени) і два тривірші (терцети), зі строгою схемою рим.</p>`,

{pages:"с. 135–137",
info:`<p><b>Роберт Бернс</b> (1759–1796) — національний поет Шотландії, який писав, спираючись на народну пісню. Багато його віршів стали піснями.</p>
<p><b>«Моя любов…»</b> (1794) — одна з найвідоміших поезій про кохання. У перекладі Миколи Лукаша: «Моя любов — рожевий квіт в весінньому саду, моя любов — веселий спів, що з ним я в світ іду». Кохана для ліричного героя — і квітка, і пісня.</p>
<p>Він клянеться любити її, хоч «висхнуть всі моря», «потануть брили скал», «аж згасне сонця пал», — <b>гіперболи</b> підкреслюють силу й вічність почуття. Прощаючись, він обіцяє повернутися, хоч би й за тисячі миль.</p>
<p><b>Художні засоби:</b> порівняння, гіпербола, звертання, повтори, пісенна мелодійність.</p>
<p><b>Ідея:</b> справжнє кохання — високе, вічне почуття, що робить людину кращою, вірною й сильною.</p>`,

{pages:"", nobook:"Вірша Гейне немає в підручнику — прочитайте його за матеріалами вчителя.",
info:`<p><b>Генріх Гейне</b> (1797–1856) — німецький поет-романтик. Його <b>«Книга пісень»</b> (1827) стала однією з найпопулярніших поетичних збірок Європи; на її вірші написано тисячі пісень. Гейне перекладали Леся Українка та Іван Франко.</p>
<p><b>«Коли настав чудовий май…»</b> — вірш із циклу «Ліричне інтермецо». Навесні, у травні, коли розпускаються бруньки й співають птахи, у серці ліричного героя розквітає кохання. Він зізнається коханій у своїх почуттях і тузі.</p>
<p><b>Особливості:</b> <b>паралелізм</b> — розквіт природи й розквіт почуття в душі; простота, мелодійність, близькість до народної пісні; лаконізм (два короткі строфи). Р. Шуман поклав вірш на музику (цикл «Любов поета»).</p>
<p><b>Ідея:</b> кохання — природне, світле почуття, що, як весна, оновлює людину.</p>`,
terms:[["Паралелізм","зіставлення явищ природи і людського життя"],["Ліричне інтермецо","цикл віршів Гейне про кохання"]],

{pages:"с. 138–140",
info:`<p><b>Детектив</b> (від лат. <i>detego</i> — розкриваю) — жанр літератури, у центрі якого — <b>розкриття таємниці</b>, найчастіше злочину, шляхом розслідування.</p>
<p><b>Характерні особливості детективу:</b></p>
<ul><li>загадка (таємниця, злочин) на початку;</li><li>постать <b>детектива-слідчого</b> з винятковими здібностями;</li><li>його помічник, часто — оповідач;</li><li>хибні версії, підозрювані, докази;</li><li>напружений сюжет, інтрига;</li><li>розгадка у фіналі, де детектив пояснює хід своїх міркувань;</li><li>перемога розуму й справедливості.</li></ul>
<p><b>Різновиди:</b> класичний (інтелектуальний) детектив; пригодницький; психологічний; іронічний; історичний; детектив «замкненої кімнати»; шпигунський.</p>
<p><b>Засновником</b> жанру вважають Едгара Аллана По («Вбивство на вулиці Морг», 1841). Класику жанру створили Артур Конан Дойл, Агата Крісті, Жорж Сіменон.</p>`,
terms:[["Детектив","жанр, у центрі якого — розкриття таємниці чи злочину"],["Інтрига","напружений, заплутаний перебіг подій"]],
q:[["Що в центрі детективу?",["Розкриття таємниці чи злочину","Кохання","Подорож","Опис природи"],0],
["Кого вважають засновником детективу?",["Едгара По","Вальтера Скотта","О. Генрі","Шиллера"],0],

["Що відбувається у фіналі детективу?",["Розгадка таємниці","Загибель усіх героїв","Нова загадка","Нічого"],0],

{pages:"с. 141–170",
info:`<p><b>Едгар Аллан По</b> (1809–1849) — американський письменник і поет, засновник детективу та жанру «жахів» у новелі. Рано втратив батьків, виховувався в родині купця Аллана. Жив у бідності, але його новели й вірші («Ворон») здобули світову славу.</p>
<p><b>«Золотий жук»</b> (1843) — оповідання, що поєднує <b>детектив і пригоди</b>.</p>
<p><b>Захопливий сюжет:</b> на Саллівеновому острові (Південна Кароліна) живе збіднілий аристократ <b>Вільям Легран</b> зі старим слугою <b>Джупітером</b>. Легран знаходить незвичайного золотого жука й шматок пергаменту. Його поведінка дивна, і друг-оповідач і Джупітер думають, що він збожеволів.</p>
<p>Легран веде їх у глибину пагорбів: Джупітер лізе на старе дерево, знаходить череп і опускає жука на шнурку через ліве око черепа. Перша спроба копати — невдала (Джупітер переплутав ліве око з правим!). Друга — і знаходять скриню зі <b>скарбами капітана Кіда</b>. Наприкінці Легран пояснює, як розшифрував таємний запис.</p>
<p><b>Що захоплює:</b> таємниця, інтрига, несподівані повороти, гумор (Джупітер), логічна розгадка.</p>`,
terms:[["Криптограма","текст, записаний таємним шифром"],["Інтрига","напружений, заплутаний сюжет"]],
q:[["Як звали головного героя «Золотого жука»?",["Вільям Легран","Шерлок Холмс","Огюст Дюпен","Джон Вотсон"],0],
["Де жив Легран?",["На Саллівеновому острові","У Лондоні","У Парижі","У Бостоні"],0],
["Чиї скарби знайшли герої?",["Капітана Кіда","Короля Річарда","Піратів Карибського моря","Робіна Гуда"],0],
["Що опускали через око черепа?",["Золотого жука","Камінь","Ключ","Монету"],0],
["Чому перша спроба копати була невдалою?",["Джупітер переплутав ліве і праве око","Пішов дощ","Загубили лопату","Скарб уже викрали"],0]]},

{pages:"с. 145–170",
info:`<p><b>Композиція «розповідь у розповіді».</b> Твір складається з двох частин:</p>
<ol><li><b>Зовнішня розповідь</b> (від імені оповідача): дивна поведінка Леграна, мандрівка, пошуки, знахідка скарбу. Читач, як і оповідач, не розуміє, що відбувається, — це створює <b>таємницю й напругу</b>.</li><li><b>Внутрішня розповідь</b> (розповідь самого Леграна): як він знайшов пергамент, як при вогні проявився малюнок черепа й козеняти (kid — «козеня», підпис капітана Кіда), як він <b>розшифрував криптограму</b>, порахувавши частоту знаків (найчастіший — літера «е»), як прочитав указівки.</li></ol>
<p><b>Художнє значення:</b></p>
<ul><li>спершу — інтрига, потім — пояснення: читач сам проходить шлях від загадки до розгадки;</li><li>показує силу аналітичного мислення героя;</li><li>поєднує пригодницьке й інтелектуальне начала.</li></ul>
<p>Цей прийом стане класичним для детективу: детектив пояснює хід міркувань у фіналі.</p>`,
terms:[["Композиція","побудова твору, розташування його частин"],["Розповідь у розповіді","прийом, коли в основну оповідь вставлено розповідь іншого персонажа"]],
q:[["Як називається композиційний прийом у «Золотому жуку»?",["Розповідь у розповіді","Кільцева композиція","Щоденник","Лист"],0],
["Хто розповідає внутрішню історію?",["Легран","Джупітер","Оповідач","Капітан Кід"],0],

{pages:"с. 145–170",
info:`<p><b>Вільям Легран</b> — збіднілий аристократ, освічений, захоплений природничими науками (колекціонує комах). Він має <b>аналітичний розум</b>, наполегливий, уважний до деталей, але схильний до різких змін настрою. Таємничий, не пояснює своїх дій до самого кінця. Він — прообраз детектива-інтелектуала.</p>
<p><b>Джупітер</b> — старий слуга, звільнений раб, що залишився з Леграном із відданості. Простодушний, забобонний (боїться «золотого жука», що нібито вкусив хазяїна), але вірний і турботливий. Його мова й плутанина (ліве око — праве око) додають гумору.</p>
<p><b>Оповідач</b> — друг Леграна, розсудливий, звичайний, як і читач. Він не розуміє дій Леграна й підозрює в нього хворобу. Через його погляд створюється таємниця: ми знаємо стільки ж, скільки він.</p>
<p>Персонажі доповнюють одне одного: <b>розум</b> (Легран), <b>відданість і гумор</b> (Джупітер), <b>здоровий глузд</b> (оповідач).</p>`,
terms:[["Система образів","сукупність персонажів твору та їхні взаємини"]],
q:[["Яка головна риса Леграна?",["Аналітичний розум","Боягузтво","Жадібність","Лінощі"],0],

{pages:"с. 171–195",
info:`<p><b>Артур Конан Дойл</b> (1859–1930) — англійський (шотландського походження) письменник, лікар за фахом. Створив образ найвідомішого детектива світу — <b>Шерлока Холмса</b>. Прообразом Холмса став викладач медицини Джозеф Белл, який умів за дрібницями визначати професію й минуле пацієнтів. Перший твір про Холмса — «Етюд у багряних тонах» (1887).</p>
<p><b>«Пістрява стрічка»</b> (1892) — одне з найвідоміших оповідань про Холмса.</p>
<p><b>Особливості сюжету і композиції оповідань про Холмса:</b></p>
<ol><li>до Холмса на Бейкер-стріт приходить клієнт із загадкою;</li><li>розповідь клієнта (експозиція);</li><li>Холмс розпитує, помічає деталі;</li><li>огляд місця події, збирання доказів;</li><li>напружена кульмінація (засідка, небезпека);</li><li>розв'язка й пояснення Холмса.</li></ol>
<p>Оповідь веде <b>доктор Вотсон</b> — друг і помічник Холмса.</p>`,

{pages:"с. 174–195",
info:`<p><b>Сімейний конфлікт</b> в оповіданні «Пістрява стрічка». До Холмса приходить налякана <b>Хелін Стоунер</b>. Вона живе з вітчимом, лікарем <b>Грімсбі Ройлоттом</b>, у старовинному маєтку Стоук-Моран. Ройлотт — жорстокий, запальний, тримає вдома індійських звірів.</p>
<p>Два роки тому, незадовго до весілля, загинула сестра-близнючка Хелін — <b>Джулія</b>. Помираючи, вона вигукнула: «Пістрява стрічка!». Тепер і Хелін готується до весілля, і вночі вона чує той самий тихий свист…</p>
<p><b>Холмс як учасник розв'язання конфлікту:</b> він не лише розгадує загадку, а й <b>активно захищає</b> дівчину: оглядає маєток, помічає підозрілі деталі (фальшивий шнур дзвоника, вентилятор у сусідню кімнату, ліжко, прикручене до підлоги, блюдце з молоком, сейф). Уночі разом із Вотсоном сидить у засідці в кімнаті Хелін.</p>
<p><b>Розгадка:</b> «пістрява стрічка» — <b>болотяна гадюка</b>, яку Ройлотт пускав через вентилятор по шнуру. Мотив — гроші: після заміжжя дочки отримали б свою частку спадку. Холмс б'є змію тростиною, вона повертається й жалить свого господаря.</p>`,
terms:[["Конфлікт","зіткнення інтересів, характерів, що рухає сюжет"],["Мотив злочину","причина, що спонукала до злочину"]],

{pages:"с. 174–195",
info:`<p><b>Дедуктивний метод</b> Шерлока Холмса — спосіб мислення, коли з окремих спостережень і фактів робляться логічні висновки, що ведуть до розгадки.</p>
<p><b>Кроки методу:</b> 1) уважне <b>спостереження</b> за дрібницями; 2) збирання фактів; 3) відкидання неможливих версій; 4) логічний <b>висновок</b>; 5) перевірка на практиці.</p>
<p><b>Приклади з «Пістрявої стрічки»:</b> за квитком і брудом на рукаві Холмс визначає, що Хелін їхала двоколкою й потягом; дзвоник, що не дзвонить, і вентилятор, що виходить не на вулицю, а в сусідню кімнату, наводять на думку про «шлях» для чогось живого; блюдце з молоком — про тварину.</p>
<p><b>Моральні якості Холмса:</b> безстрашність, готовність ризикувати заради інших, співчуття до скривджених, чесність. Він визнає й свої помилки («я дійшов спершу хибного висновку»).</p>
<p>В образі Холмса утверджено <b>силу інтелекту</b>, поєднану з <b>моральністю</b>.</p>`,
terms:[["Дедуктивний метод","логічні висновки на основі спостережень за фактами й деталями"],["Версія","одне з можливих пояснень події"]],

{pages:"с. 174–195",
info:`<p><b>Доктор Джон Вотсон</b> — друг, помічник і літописець Холмса, колишній військовий лікар. Він <b>оповідач</b> більшості оповідань.</p>
<p><b>Чому оповідач — Вотсон, а не Холмс?</b></p>
<ul><li>Вотсон — звичайна людина, як і читач: він бачить ті самі факти, але не робить висновків. Тому таємниця зберігається до кінця.</li><li>Він захоплюється другом — і через його погляд Холмс постає ще геніальнішим.</li><li>Вотсон чесний, сміливий, надійний; він передає емоції — страх, напругу, здивування.</li></ul>
<p><b>Різні точки зору на події</b> як прийом створення атмосфери таємничості: Хелін розповідає про жахи з позиції наляканої жертви; Ройлотт погрожує; Вотсон описує моторошну нічну засідку; Холмс у фіналі дає логічне пояснення. Зіставлення поглядів створює <b>напругу й загадковість</b>.</p>`,

{pages:"", nobook:"Новели «Вождь червоношкірих» немає в підручнику 7 класу — прочитайте її самостійно (позакласне читання).",
info:`<p><b>О. Генрі</b> — майстер новели з несподіваною кінцівкою.</p>
<p><b>«Вождь червоношкірих»</b> (1907): двоє шахраїв — <b>Сем</b> (оповідач) і <b>Білл</b> — викрадають сина поважного городянина Ебенезера Дорсета, щоб отримати 2000 доларів викупу. Але 10-річний хлопчик, що називає себе Вождем Червоношкірих, перетворює життя викрадачів на пекло. У фіналі батько погоджується забрати сина, лише якщо викрадачі доплатять йому 250 доларів.</p>
<p><b>Образи персонажів і засоби їх створення:</b></p>
<ul><li><b>Сем</b> — «розумник», що любить книжні слова: його пихата мова створює комічний ефект;</li><li><b>Білл</b> — простодушний, добрий, найбільше страждає від «вождя»; його скарги смішать;</li><li><b>«Вождь»</b> — енергійний бешкетник, для якого викрадення — гра; </li><li><b>Дорсет</b> — розважливий батько, що «перемагає» шахраїв.</li></ul>
<p><b>Роль художніх деталей:</b> гарячий камінь, яким хлопчик пече Біллу спину; рогатка й «скальп»; лист батька — деталі підсилюють гумор і характеризують героїв.</p>`,

{pages:"с. 196–217",
info:`<p><b>Антуан де Сент-Екзюпері</b> (1900–1944) — французький письменник і льотчик. Прокладав поштові авіалінії над Сахарою та Південною Америкою, був начальником аеропорту Кап-Джубі на краю Сахари, пережив аварії в пустелі. У роки Другої світової війни воював; 31 липня 1944 р. не повернувся з розвідувального польоту.</p>
<p><b>«Маленький принц»</b> (1943) — філософська <b>казка-притча</b> з авторськими малюнками. Льотчик, що зазнав аварії в Сахарі, зустрічає хлопчика з астероїда В-612.</p>
<p><b>Алегорія</b> — зображення абстрактного поняття через конкретний образ. У казці багато алегоричних образів:</p>
<ul><li><b>Троянда</b> — кохання, кохана людина;</li><li><b>Лис</b> — дружба, мудрість;</li><li><b>Змія</b> — смерть і мудрість;</li><li><b>баобаби</b> — зло, погані звички, які треба вчасно «виполювати»;</li><li><b>пустеля</b> — самотність; <b>колодязь</b> — джерело життя й духовності;</li><li><b>мешканці планет</b> — людські вади.</li></ul>`,

{pages:"с. 201–217",
info:`<p>Казка-притча «Маленький принц» говорить про <b>людські взаємини й моральні цінності</b>.</p>
<p><b>Дорослі й діти.</b> Оповідач із дитинства зіткнувся з тим, що дорослі не розуміють головного: замість удава, що проковтнув слона, бачать капелюх; люблять цифри й не цікавляться суттю. Діти ж бачать серцем.</p>
<p><b>Дружба.</b> Лис учить принца: «Приручити — означає створити узи». Справжня дружба потребує часу, терпіння, турботи. «Ти завжди відповідаєш за всіх, кого приручив».</p>
<p><b>Кохання.</b> Принц розуміє, що його Троянда — єдина у світі, хоча на Землі є сад із тисяч троянд: вона особлива, бо він віддав їй свій час і любов.</p>
<p><b>Головне — невидиме:</b> «Пильно бачить лише серце. Найголовнішого очима не побачиш».</p>
<p><b>Цінності:</b> дружба, любов, відповідальність, вірність, уміння бачити серцем.</p>`,
terms:[["Приручити","за Лисом — створити узи, стати потрібними одне одному"],["Моральні цінності","уявлення про добро, які керують поведінкою людини"]],

{pages:"с. 201–217",
info:`<p><b>Філософський зміст</b> казки — роздуми про сенс життя, любов, дружбу, відповідальність, про те, що справді важливо.</p>
<p><b>Маленький принц і його планета.</b> Він щоранку прибирає свою планету: чистить вулкани, виполює паростки баобабів. «Встав уранці, вмився, привів себе до ладу — і зразу ж приведи до ладу свою планету». Це образ <b>відповідальності</b> за свій дім, за світ.</p>
<p><b>Маленький принц і Троянда.</b> Примхлива, горда Троянда заподіяла йому біль, і він залишив планету. Лише в мандрах він зрозумів: «Треба було судити не за словами, а за вчинками». Він відповідальний за неї.</p>
<p><b>Маленький принц і Лис.</b> Лис навчив його приручати й відкрив таємницю: «Найголовнішого очима не побачиш». Дружба змінює світ: пшеничні поля тепер нагадують Лисові золоте волосся друга.</p>
<p><b>Повернення.</b> Принц вирішує повернутися до своєї Троянди — бо відповідає за неї. Його відхід (через укус змії) — символ повернення додому, а не смерті.</p>`,

{pages:"с. 201–217",
info:`<p>Мандруючи, Маленький принц відвідує планети, мешканці яких уособлюють <b>людські вади</b>:</p>
<table class="tbl"><tr><th>Мешканець</th><th>Риса</th></tr>
<tr><td><b>Король</b></td><td>владолюбство: усім «наказує», навіть сонцю, і вважає всіх підданими</td></tr>
<tr><td><b>Честолюбець</b></td><td>марнославство: хоче, щоб ним лише захоплювалися</td></tr>
<tr><td><b>Пияк</b></td><td>безвихідь: п'є, щоб забути, що соромиться, що п'є</td></tr>
<tr><td><b>Ділова людина</b></td><td>жадібність: рахує зірки й вважає їх своїми</td></tr>
<tr><td><b>Ліхтарник</b></td><td>вірність обов'язку, але бездумна: запалює й гасить ліхтар щохвилини</td></tr>
<tr><td><b>Географ</b></td><td>кабінетна наука: описує світ, не бачивши його</td></tr></table>
<p>Лише ліхтарника принц вважає гідним дружби: той дбає не лише про себе.</p>
<p><b>На Землі</b> він зустрічає Змію, Лиса, стрілочника, торговця пігулками від спраги, сад троянд. Земля — планета, де живуть усі ці типи людей одночасно.</p>`,

{pages:"с. 218–227",
info:`<p><b>Акутаґава Рюноске</b> (1892–1927) — японський письменник, майстер новели. Поєднував японські традиції із західною літературою. На його честь заснована престижна літературна премія Японії — премія Акутаґави. Твори: «Ворота Расьомон», «Павутинка», «Носовичок».</p>
<p><b>«Павутинка»</b> (1918) — новела-притча для дітей. Будда, прогулюючись біля ставка з лотосами в Раю, бачить у глибинах пекла великого розбійника <b>Кандату</b>. Будда згадує, що колись Кандата <b>пожалів павука</b> й не розчавив його. Щоб віддячити за це єдине добро, Будда опускає в пекло срібну павутинку.</p>
<p>Кандата хапається за неї й лізе вгору. Озирнувшись, бачить, що за ним лізуть тисячі грішників. Він кричить: «Ця павутинка — моя! Геть!» — і павутинка рветься саме над ним. Кандата падає назад у пекло.</p>
<p><b>Ідея моральної відповідальності:</b> людина відповідає за свої вчинки; егоїзм губить, а навіть маленьке добро дає шанс на порятунок.</p>`,
terms:[["Новела-притча","новела з повчальним, філософським змістом"],["Егоїзм","думання лише про себе"]],
q:[["Країна Акутаґави:",["Японія","Китай","Корея","Індія"],0],
["Яке добро зробив колись Кандата?",["Пожалів павука","Врятував дитину","Збудував храм","Віддав гроші"],0],
["Хто опустив павутинку в пекло?",["Будда","Кандата","Ангел","Павук"],0],
["Чому павутинка порвалася?",["Кандата закричав, що вона лише його","Була занадто слабкою","Її перегриз павук","Будда передумав"],0],
["Ідея новели:",["Егоїзм губить, людина відповідає за вчинки","Сила понад усе","Треба бути хитрим","Рай недосяжний"],0]]},

{pages:"с. 222–227",
info:`<p><b>Філософський зміст</b> новели «Павутинка»:</p>
<ul><li>кожен вчинок має наслідки; навіть одна добра справа може стати шансом на порятунок;</li><li><b>егоїзм</b> руйнує саму можливість порятунку: Кандата хотів урятуватися лише сам — і втратив усе;</li><li>порятунок можливий лише тоді, коли людина думає й про інших;</li><li>природа (Рай, лотоси) байдужа до людських драм — життя триває.</li></ul>
<p><b>Підтекст</b> — прихований зміст, не висловлений прямо. Автор не пише моралі, але читач розуміє: павутинка не порвалася б, якби Кандата дозволив лізти іншим. Будда «засмутився» — це теж підтекст: він дав шанс, але людина ним не скористалася.</p>
<p>Буддійська ідея <b>карми</b>: людина сама творить свою долю своїми вчинками.</p>`,

["Як відреагував Будда?",["Засмутився й пішов далі","Розсердився","Радів","Покарав грішників"],0],

{pages:"с. 222–227",
info:`<p><b>Будда</b> — втілення мудрості, милосердя й справедливості. Він дає шанс навіть великому грішнику, пам'ятаючи найменше добро. Спокійний, споглядальний.</p>
<p><b>Кандата</b> — великий розбійник: убивав, підпалював, грабував. Проте одного разу пожалів павука. Він — образ людини, у якій є і зло, і іскра добра. Але в найважливіший момент перемагає егоїзм.</p>
<p><b>Символічні образи:</b></p>
<ul><li><b>павутинка</b> — тонка нитка надії, шанс на порятунок, зв'язок між добрим вчинком і винагородою;</li><li><b>павук</b> — найменше живе створіння; ставлення до нього — мірило людяності;</li><li><b>лотос</b> — чистота, духовність (у буддизмі лотос росте з бруду, але залишається чистим);</li><li><b>ставок у Раю й пекло</b> — протилежні світи добра й зла;</li><li><b>Криваве Озеро</b> — образ пекла, покарання за зло.</li></ul>`,
terms:[["Символ","образ із переносним значенням"],["Лотос","у буддизмі — символ чистоти й духовного пробудження"]],

{pages:"", nobook:"Оповідання «Останній дюйм» немає в підручнику — прочитайте його самостійно (позакласне читання).",
info:`<p><b>Джеймс Олдрідж</b> (1918–2015) — письменник австралійського походження, журналіст, військовий кореспондент.</p>
<p><b>«Останній дюйм»</b> (1957). Пілот <b>Бен</b>, що втратив роботу, береться знімати акул на дні Червоного моря. Він бере із собою десятирічного сина <b>Деві</b>, з яким у них холодні, відчужені стосунки: батько не вміє говорити із сином, а Деві боїться й не любить батька.</p>
<p>Під водою на Бена нападає акула й тяжко його калічить. Деві мусить сам вести літак, хоча раніше лише спостерігав, як це робить батько. Під керівництвом знекровленого батька хлопчик злітає й саджає літак — проходить «останній дюйм» над землею, найважчий у посадці.</p>
<p><b>Проблема взаємин батьків і дітей:</b> лише в критичній ситуації батько й син відкривають одне одного, вчаться довіряти.</p>
<p><b>Символічність назви:</b> «останній дюйм» — і найскладніший момент посадки, і та остання межа, яку треба подолати, щоб зрозуміти рідну людину; межа між життям і смертю; межа дорослішання.</p>`,
terms:[["Символічна назва","назва з переносним, глибшим змістом"]],
q:[["Скільки років було Деві?",["10","15","7","12"],0],
["Що сталося з Беном під водою?",["На нього напала акула","Він загубився","Він знайшов скарб","Він утопився"],0],
["Хто посадив літак?",["Деві","Бен","Інший пілот","Ніхто"],0],
["Яку проблему порушує оповідання?",["Взаємин батьків і дітей","Війни","Бідності","Освіти"],0],
["Що символізує «останній дюйм»?",["Найважчу межу, яку треба подолати","Відстань до моря","Розмір акули","Висоту польоту"],0]]},

{pages:"с. 228–251",
info:`<p><b>Айзек Азімов</b> (1920–1992) — американський письменник-фантаст і вчений-біохімік, професор. Його доробок — майже 500 книжок: науково-фантастичні романи, оповідання, наукові праці. Автор знаменитих «Трьох законів робототехніки» (збірка «Я — робот», 1950).</p>
<p><b>«Фах»</b> (1957) — науково-фантастична повість про суспільство майбутнього. Знання там «завантажують» у мозок за допомогою спеціальних стрічок: у <b>день Читання</b> (у 8 років) дітей навчають читати, а в <b>день Освіти</b> (у 18 років) кожен миттєво отримує фах, визначений машиною.</p>
<p>Найкращих фахівців відбирають на <b>Олімпіадах</b> і відправляють працювати на інші планети, зокрема на престижну Новію.</p>
<p><b>Роздуми про майбутнє людини й людства:</b> що станеться, якщо люди перестануть самі вчитися й мислити? Хто тоді створюватиме нові знання? Азімов попереджає: технології не замінять живої думки й творчості.</p>`,

["Як люди в повісті отримують знання?",["Їх завантажують у мозок стрічками","Читають книжки","Слухають учителів","Через сни"],0],
["Що відбувалося в день Освіти?",["Кожен отримував фах","Діти вчилися читати","Олімпіада","Свято врожаю"],0],

{pages:"с. 233–251",
info:`<p><b>Джордж Плейтен</b> — хлопець, який мріє стати комп'ютерним програмістом і поїхати на Новію. Ще до дня Читання він сам навчився читати й цікавився книжками.</p>
<p>У день Освіти лікарі вирішують, що його мозок <b>непридатний</b> для завантаження фаху. Джорджа поміщають в «інтернат для недоуків». Для нього це трагедія: він почувається нікчемним, ображається на весь світ, заздрить другові Тревіліяну, якого відібрали в металурги для Новії.</p>
<p>Джордж тікає з інтернату, хоче довести, що вартий більшого, пробирається на Олімпіаду. Там він знайомиться з істориком Ладисласом Інженеску й згодом дізнається, що за ним увесь час спостерігали.</p>
<p><b>Проблема духовної реалізації:</b> лише через розчарування, боротьбу й самостійний пошук Джордж відкриває, що здатен мислити й творити — а це найвищий «фах».</p>`,
terms:[["Духовна реалізація","розкриття внутрішнього потенціалу, творчих сил людини"],["Конфлікт","зіткнення героя з суспільством чи обставинами"]],
q:[["Ким мріяв стати Джордж?",["Програмістом","Лікарем","Пілотом","Вчителем"],0],
["Куди помістили Джорджа після дня Освіти?",["В інтернат для «недоуків»","На Новію","У в'язницю","У лікарню назавжди"],0],

{pages:"с. 233–251",
info:`<p><b>Розв'язка повісті.</b> Наприкінці Джордж дізнається правду від історика <b>Ладисласа Інженеску</b> і керівника інтернату <b>Омейні</b>: «інтернат для недоуків» насправді є <b>інститутом вищих досліджень</b>. Туди відбирають тих, чий мозок не підходить для «стрічок», бо він <b>здатен до самостійного мислення й творчості</b>. Саме такі люди створюють нові знання, нові машини й нові стрічки для всіх інших.</p>
<p>Втеча Джорджа й бажання щось довести були останнім випробуванням: він показав, що може діяти й мислити самостійно.</p>
<p><b>Що утверджує повість:</b></p>
<ul><li><b>силу людського інтелекту</b> — він вищий за будь-яку машину;</li><li><b>самостійність мислення</b> — уміння шукати, сумніватися, робити висновки;</li><li><b>творчу уяву</b> — джерело прогресу;</li><li><b>моральні цінності</b> — наполегливість, гідність, відповідальність.</li></ul>
<p>Назва «Фах» іронічна: справжній фах — не отриманий готовим, а здобутий власною працею думки.</p>`,
terms:[["Розв'язка","завершення подій у творі"],["Іронія","прихована насмішка; вживання слова в протилежному значенні"]],
q:[["Чим насправді був «інтернат для недоуків»?",["Інститутом вищих досліджень","В'язницею","Лікарнею","Школою для програмістів"],0],

{pages:"с. 228–251",
info:`<p>Повість «Фах» змушує замислитися над питаннями: <b>що таке справжня освіта</b> й <b>яке призначення людини</b>?</p>
<p><b>Культура й освіта</b> в повісті протиставлені:</p>
<table class="tbl"><tr><th>«Освіта стрічками»</th><th>Справжня освіта</th></tr>
<tr><td>швидка, готова, однакова для всіх</td><td>тривала, через книжки, власні зусилля</td></tr>
<tr><td>дає вузький фах</td><td>розвиває мислення, уяву, особистість</td></tr>
<tr><td>людина — виконавець</td><td>людина — творець</td></tr></table>
<p><b>Призначення людини в сучасному світі:</b> не лише виконувати роботу, а <b>мислити, творити, шукати нове</b>, відповідати за себе й світ. Технології (у наш час — інтернет, штучний інтелект) — помічники, але не заміна власної думки.</p>
<p>Скульптура Родена «Мислитель» — символ цієї ідеї: людський інтелект ніколи не зупиняється в пошуках.</p>`,

info:`<p><b>Корнелія Функе</b> (нар. 1958) — німецька письменниця й ілюстраторка, одна з найпопулярніших дитячих авторок світу. Її книжки перекладено понад 50 мовами.</p>
<p><b>«Чорнильне серце»</b> (2003) — перша частина трилогії «Чорнильний світ». Роман-фентезі, роман про книжки й читання.</p>
<p><b>Тема «оживлення» книжки:</b> батько дванадцятирічної <b>Меґі</b>, палітурник <b>Мо</b>, має дивовижний дар: коли він читає вголос, персонажі книжок виходять у реальний світ, а люди з нашого світу натомість зникають у книжці. Через це Мо прозвали «<b>Срібноязиким</b>».</p>
<p>Дев'ять років тому, читаючи роман «Чорнильне серце», Мо випадково «вичитав» звідти лиходія <b>Каприкорна</b> та його поплічників, а мати Меґі зникла в книжці. Відтоді Мо більше не читає вголос.</p>
<p>Книжка в романі — живий світ, що має владу над людьми. Функе показує, яку силу мають слово й уява.</p>`,

<p><b>Сили добра:</b> Меґі, Мо, Елінор, автор книжки Феноліо, хлопчик Фарид (теж «вичитаний», зі «Тисячі й однієї ночі»). Пилопалець — неоднозначний: він помиляється, зраджує, але врешті допомагає.</p>

{pages:"", nobook:"Роману «Мандрівний замок Хаула» немає в підручнику — прочитайте його самостійно (позакласне читання).",
info:`<p><b>Діана Вінн Джонс</b> (1934–2011) — британська письменниця-фантастка, авторка понад 40 книжок для дітей і підлітків.</p>
<p><b>«Мандрівний замок Хаула»</b> (1986). У казковій країні Інґарі живе <b>Софі</b> — старша з трьох сестер. Вона вважає, що старшим не щастить, і змирилася з нудним життям у капелюшній крамниці. Через непорозуміння <b>Відьма Пустки</b> зачаровує її, перетворивши на 90-річну стареньку.</p>
<p>Софі вирушає шукати порятунку й потрапляє до <b>мандрівного замку чарівника Хаула</b>, про якого ходять страшні чутки. Там вона укладає угоду з вогняним демоном <b>Кальцифером</b>, стає служницею, знайомиться з учнем Хаула <b>Майклом</b>.</p>
<p><b>Поєднання казки й детективу:</b> казкові чари, прокляття, чарівні двері в різні місця; і водночас — розплутування таємниць: що за угода між Хаулом і Кальцифером, куди зникли принц і королівський чарівник, хто такий опудало.</p>
<p><b>Образ Софі:</b> світ її мрій (бути щасливою, цікавою), бажань (зняти прокляття, допомогти іншим) і жахів (власна невпевненість). Ставши «старою», вона парадоксально стає сміливішою й сильнішою — і відкриває, що теж має чарівний дар.</p>`,
