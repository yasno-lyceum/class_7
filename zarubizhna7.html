about:"Балада про старого короля, який повірив лестощам старших дочок і прогнав щиру молодшу. Залишившись без влади й даху, він пізнає, хто любив його насправді. Твір про невдячність, лицемірство й справжню любов, що виявляється у вчинках.",
plot:["Старий король Лір вирішує поділити королівство між трьома дочками й питає, хто з них любить його найбільше.","Старші, Гонорелла й Регана, запевняють у безмежній любові. Молодша, Корделія, каже чесно й скромно — що любить, як дочка має любити батька.","Розгніваний Лір позбавляє Корделію спадку й проганяє. Її бере за дружину французький король.","Старші дочки, отримавши владу, зневажають батька, зменшують його почет, виганяють. Лір блукає, стає жебраком.","Корделія з військом приходить на допомогу й повертає батькові корону, але гине в битві. Лір помирає від горя над її тілом; лицемірних сестер наздоганяє покарання."],
heroes:[["Король Лір","довірливий батько, що помилився в дітях"],["Корделія","молодша дочка; щира, вірна, самовіддана"],["Гонорелла і Регана","старші дочки; лицемірні, жорстокі, невдячні"]]},

robin:{name:"«Як Робін Гуд став розбійником»", author:"Англійські балади й перекази про Робіна Гуда", genre:"Народна балада (переказ)",
about:"Історія про юнака, якого несправедливість змусила піти в ліс і стати ватажком вільних лучників. Робін Гуд — народний захисник, що забирає в багатих кривдників і допомагає бідним.",
plot:["Роб із Локслі — син королівського лісничого. Вороги батька зводять наклеп: родину виганяють, батько помирає у в'язниці, мати — від горя.","Дорогою на змагання лучників Роб зустрічає лісників; їхній ватажок посів місце його батька. Роб виграє заклад, влучивши в оленя, але лісничий стріляє йому в спину. Роб убиває кривдника й стає поза законом.","Бідна вдова розповідає про своїх синів, що переховуються в лісі. Роб приєднується до вигнанців.","Переодягнувшись жебраком, він виграє на змаганнях у Ноттінгемі золоту стрілу й дарує її Маріан.","Ватага обирає Роба ватажком. Вони присягають допомагати бідним і ніколи не кривдити жінок. Так з'являється Робін Гуд."],
heroes:[["Робін Гуд (Роб із Локслі)","найкращий лучник; справедливий, сміливий, вірний"],["Маріан","кохана Робіна, втілення вірності"],["Шериф Ноттінгемський","жорстокий представник влади"],["Сини вдови, «одноокий лучник»","товариші Робіна по ватазі"]]},

glove:{name:"«Рукавичка»", author:"Фрідріх Шиллер, 1797", genre:"Літературна балада",
about:"Балада про лицаря, якого жорстока красуня змусила ризикувати життям заради забаганки. Він доводить і мужність, і гідність. Твір про ціну людського життя й справжню честь.",
plot:["Король Франциск із придворними дивиться на звіринець. На арену виходять лев, тигр і два леопарди.","Звірі готові кинутися одне на одного, але лев своїм ревом утихомирює всіх.","Красуня Куніґунда кидає рукавичку між звірів і просить лицаря Делоржа довести своє кохання — принести її.","Делорж спокійно спускається на арену, бере рукавичку серед хижаків і повертається.","Придворні захоплені, Куніґунда зустрічає його ніжним поглядом. Але Делорж кидає рукавичку їй в обличчя зі словами «Не треба дяки!» і йде геть."],
heroes:[["Делорж","лицар; мужній, сповнений гідності"],["Куніґунда","придворна красуня; марнославна, жорстока"],["Король Франциск","володар, що влаштовує жорстокі розваги"]]},

heather:{name:"«Балада про вересовий трунок»", author:"Роберт Льюїс Стівенсон, 1890", genre:"Літературна балада",
about:"Балада за шотландською легендою про останніх піктів, які воліли загинути, ніж видати ворогові таємницю медового напою з вересу. Твір про духовну силу народу, що береже свої цінності.",
plot:["Шотландський король іде війною на піктів і нещадно знищує їх.","Із усього народу залишаються двоє — старий батько й син.","Король вимагає видати таємницю вересового трунку, погрожуючи тортурами.","Батько погоджується, але просить спершу стратити сина, бо той, мовляв, не витримає ганьби зради. Сина кидають у море.","Старий каже, що тепер таємницю не вирве з нього ніхто, — і вона гине разом із ним."],
heroes:[["Батько-пікт","мудрий, незламний; обирає смерть замість зради"],["Син","юний пікт, що гине за свій народ"],["Король шотландців","жорстокий завойовник, безсилий перед духом народу"]]},

svityaz:{name:"«Світязь»", author:"Адам Міцкевич, 1821", genre:"Літературна балада",
about:"Балада за легендою про озеро Світязь, на дні якого нібито стоїть затоплене місто. Жінки міста обрали загибель, а не неволю. Твір про любов до батьківщини, героїзм і гідність.",
plot:["Пан наказує рибалкам закинути невід в озеро Світязь.","Замість риби вони витягують прекрасну діву.","Вона розповідає: колись тут стояло місто Світязь князя Тугана. Чоловіки пішли на допомогу союзникам, а місто оточили вороги.","Жінки помолилися, щоб не потрапити в неволю, — і місто пішло під воду, а вони перетворилися на білі квіти.","Вороги, які зривали ці квіти, гинули. Розповівши це, діва зникає у хвилях."],
heroes:[["Діва з озера","оповідачка легенди, душа загиблого міста"],["Жінки Світязя","мужні, обирають смерть, а не неволю"],["Князь Туган","володар міста"]]},

ivanhoe:{name:"«Айвенго»", author:"Вальтер Скотт, 1819", genre:"Історичний роман",
about:"Роман про Англію кінця XII століття, де нормани гноблять англосаксів, а принц Джон рветься до трону, поки король Річард Левове Серце в полоні. Лицар Айвенго, вигнаний батьком, бореться за честь, кохання й справедливість.",
plot:["Айвенго, позбавлений спадщини батьком Седріком за кохання до Ровени й службу королю Річарду, таємно повертається з хрестового походу.","На турнірі в Ешбі він під іменем «Позбавлений Спадщини» перемагає найсильніших лицарів-норманів, зокрема Буагильбера, але отримує поранення. Йому допомагає таємничий Чорний Лицар.","Буагильбер, Фрон де Беф і де Брасі захоплюють у полон Седріка, Ровену, Айвенго, Ребекку та Ісаака й ув'язнюють у замку Торкілстон.","Чорний Лицар разом із лучником Локслі (Робін Гудом) і селянами штурмує замок і визволяє полонених. Буагильбер викрадає Ребекку.","Ребекку судять як «чаклунку». Айвенго виходить на двобій — Буагильбер падає мертвим. Чорний Лицар виявляється королем Річардом. Айвенго отримує прощення батька й одружується з Ровеною."],
heroes:[["Айвенго","лицар, втілення честі, вірності й шляхетності"],["Король Річард (Чорний Лицар)","справедливий, хоробрий король"],["Леді Ровена","кохана Айвенго, англосаксонська красуня"],["Ребекка","мудра, мужня, милосердна дочка Ісаака"],["Бріан де Буагильбер","лицар-тамплієр, гордий і себелюбний"],["Принц Джон, Фрон де Беф, де Брасі","підступні нормани"],["Седрік","батько Айвенго, гордий англосакс"]]},

wester:{name:"«Пісня про солдатів з Вестерплятте», «Лист із полону»", author:"Константи-Ільдефонс Галчинський (1939, 1942)", genre:"Лірика", poem:true,
about:"Вірші польського поета про Другу світову війну. Перший уславлює героїв, що першими стали на шляху нацистів; другий — лист до коханої з табору військовополонених, де любов допомагає вистояти.",
plotTitle:"Зміст віршів",
plot:["«Пісня…»: загиблі захисники Вестерплятте «лавами» йдуть до неба й співають, що рани — «пусте».","Солдати пишаються, що стояли в Гданську «як мур»; тепер вони — у хмарах, на «вересі небеснім».","Узимку, коли сніг кружлятиме над Варшавою, — «то ми, солдати з Вестерплятте»: пам'ять про героїв вічна.","«Лист із полону»: ліричний герой звертається до коханої («Ти спиш уже? На добраніч!»), бачить її образ у темряві.","Кохана для нього — щастя в усі пори року, «пісня моєї дороги»: любов сильніша за неволю."],
heroes:[["Солдати з Вестерплятте","героїчні захисники, що загинули за батьківщину"],["Ліричний герой «Листа»","полонений, що зберігає любов і надію"],["Кохана (Наталія)","дружина поета, джерело сили"]]},

buchen:{name:"«Про назву концтабору Бухенвальд»", author:"Альфред Марґул-Шпербер, 1945", genre:"Лірика", poem:true,
about:"Вірш про контраст між мирною назвою «Буковий ліс» і жахливою реальністю нацистського табору смерті. Для поета з Буковини (теж «букові ліси») це ще й особистий біль: спогади дитинства тепер отруєні пам'яттю про злочини.",
plotTitle:"Зміст вірша",
plot:["Поруч — Веймар, місто культури, а тут навіки замовкли голоси в'язнів.","Ліричного героя проймає гнів: адже і його рідний край зветься «Букові ліси».","Він згадує дитинство: килим трав, буковий ліс, біляві хмари над поляною.","Тепер, чуючи слово «Бухенвальд», він не може згадувати юність без жаху.","Страшне питання: чи ті біляві хмари не були димом спалених людей?"],
heroes:[["Ліричний герой","людина, що протестує проти війни й пам'ятає жертви"]]},

boy:{name:"«Хлопчик у смугастій піжамі»", author:"Джон Бойн, 2006", genre:"Повість",
about:"Повість про дружбу дев'ятирічного сина нацистського коменданта і єврейського хлопчика, в'язня Аушвіцу. Наївними очима дитини показано жахіття Голокосту та злочини нацизму.",
plot:["Бруно разом із родиною переїжджає з Берліна до нового будинку: батька призначили комендантом табору. Хлопчик нудьгує і не розуміє, хто ці люди в «смугастих піжамах» за парканом.","Досліджуючи місцевість, Бруно знайомиться біля огорожі зі Шмулем — єврейським хлопчиком, який народився з ним в один день.","Майже рік вони щодня розмовляють через паркан; Бруно приносить другові їжу. Одного разу, злякавшись лейтенанта Котлера, Бруно зрікається Шмуля — і потім гірко шкодує.","Мати вирішує повернутися з дітьми до Берліна. Напередодні Бруно перевдягається в смугасту робу й пролазить у табір, щоб допомогти Шмулю знайти зниклого батька.","Хлопчиків разом з іншими в'язнями заганяють у газову камеру. Вони гинуть, тримаючись за руки. Батько, знайшовши одяг сина біля паркану, усвідомлює, що сталося."],
heroes:[["Бруно","німецький хлопчик; допитливий, щирий, наївний"],["Шмуль","єврейський хлопчик, в'язень табору; тихий, сумний, вірний друг"],["Батько Бруно","нацистський комендант табору"],["Ґретель","сестра Бруно, що піддається пропаганді"],["Лейтенант Котлер","жорстокий молодий нацист"],["Мати Бруно","жахається тим, що відбувається"]]},

magi:{name:"«Дари волхвів»", author:"О. Генрі, 1905", genre:"Новела",
about:"Різдвяна новела про бідне подружжя, де кожен потай жертвує найдорожчим, щоб подарувати коханій людині щось гідне. Подарунки виявляються «непотрібними», але саме вони — найцінніші дари любові.",
plot:["Напередодні Різдва Делла Діллінгем Юнг має лише 1 долар 87 центів — а хоче купити подарунок чоловікові Джиму.","Скарби родини — розкішне волосся Делли й золотий годинник Джима, що дістався йому від батька й діда.","Делла продає своє волосся за 20 доларів і купує платиновий ланцюжок для годинника.","Джим приходить додому, бачить коротко стрижену Деллу й дарує їй набір черепахових гребінців, про які вона давно мріяла.","Виявляється, Джим продав годинник, щоб купити гребінці. Подарунки «непотрібні», але автор називає героїв наймудрішими з усіх, хто підносить дари."],
heroes:[["Делла","молода дружина; любляча, щира, здатна на жертву"],["Джим","її чоловік; добрий, щедрий, вірний"]]},

leaf:{name:"«Останній листок»", author:"О. Генрі, 1907", genre:"Новела",
about:"Новела про двох молодих художниць і старого митця, який ціною власного життя повернув хворій дівчині волю до життя. Гімн співчуттю, дружбі й самопожертві.",
plot:["У Грінвіч-Вілиджі, кварталі художників у Нью-Йорку, живуть подруги Сью і Джонсі.","Джонсі тяжко хворіє на запалення легень і вирішує, що помре, коли з плюща за вікном упаде останній листок.","Сью розповідає про це сусідові — старому художникові Берману, який усе життя мріяв про шедевр.","Уночі буря зриває листя, але вранці один листок усе ще тримається. Джонсі соромиться свого відчаю й починає одужувати.","Виявляється, листок намалював на стіні Берман у холодну зливну ніч. Він застудився й помер — а листок став його справжнім шедевром."],
heroes:[["Джонсі","молода художниця, що втратила й знайшла волю до життя"],["Сью","її вірна, турботлива подруга"],["Берман","старий художник, що пожертвував собою"]]},

ronsard:{name:"«До того, як любов у світ прийшла…»", author:"П'єр де Ронсар, 1547 (переклад Федора Скляра)", genre:"Сонет", poem:true,
about:"Сонет про кохання як силу, що впорядкувала хаос Усесвіту й відродила душу ліричного героя.",
plotTitle:"Зміст і будова сонета",
plot:["До появи любові у Всесвіті панував хаос: планети плавали «без ладу, і без форми, й без числа».","Так само «без ладу й форми» блукала душа ліричного героя.","Любов прийшла, коли кохана «з очей… сяйво розлила».","Дух героя наповнився блаженством, у думках запломенів вогонь; любов дала «життя, і рух, і силу» й відродила засмучену душу."],
heroes:[["Ліричний герой","закоханий, якого любов перетворила й відродила"],["Кохана","джерело світла й натхнення"]]},

burns:{name:"«Моя любов…»", author:"Роберт Бернс, 1794 (переклад Миколи Лукаша)", genre:"Лірика, пісня", poem:true,
about:"Вірш-пісня про світле, вічне кохання, сильніше за час і відстань.",
plotTitle:"Зміст вірша",
plot:["Ліричний герой порівнює кохану з «рожевим квітом в весінньому саду» і з «веселим співом».","Він освідчується: «О, як тебе кохаю я, єдиная моя!»","Клянеться любити, хоч «висхнуть всі моря», «потануть брили скал», «аж згасне сонця пал».","Прощаючись, обіцяє: де б не був — повернеться до коханої знов."],
heroes:[["Ліричний герой","вірний, палко закоханий"],["Кохана","ніжна, як весняний квіт"]]},

heine:{name:"«Коли настав чудовий май…»", author:"Генріх Гейне, «Книга пісень» (1827)", genre:"Лірика", poem:true,
about:"Короткий вірш про те, як разом із травневою весною в серці розквітає кохання.",
plotTitle:"Зміст вірша",
plot:["Настав чудовий травень, розкрилися бруньки.","Разом із весною в серці ліричного героя розквітло кохання.","Співають пташки — і він зізнається коханій у своїй тузі й бажанні."],
heroes:[["Ліричний герой","закоханий юнак, чиє почуття розквітає, як весна"]]},

bug:{name:"«Золотий жук»", author:"Едгар Аллан По, 1843", genre:"Оповідання (детективно-пригодницьке)",
about:"Історія про пошуки скарбів пірата капітана Кіда. Легран завдяки аналітичному розуму розшифровує таємний запис і знаходить скарб. Твір поєднує детектив і пригоди.",
plot:["Оповідач відвідує друга Вільяма Леграна, що живе на Саллівеновому острові зі слугою Джупітером. Легран знайшов дивного золотого жука.","На шматку пергаменту, у який загорнули жука, Легран помічає малюнок і поводиться дивно. Джупітер і оповідач думають, що він хворий.","Легран веде їх у пагорби. Джупітер лізе на старе тюльпанове дерево, знаходить череп і опускає жука на шнурку через ліве око.","Перша спроба копати невдала — Джупітер переплутав ліве око з правим. З другої — знаходять скриню з золотом і коштовностями.","Легран пояснює: під дією тепла на пергаменті проступила криптограма капітана Кіда; він розшифрував її, порахувавши частоту знаків, і прочитав указівки."],
heroes:[["Вільям Легран","збіднілий аристократ, аналітичний розум"],["Джупітер","старий вірний слуга; простодушний, кумедний"],["Оповідач","друг Леграна, розсудлива людина"]]},

band:{name:"«Пістрява стрічка»", author:"Артур Конан Дойл, 1892", genre:"Детективне оповідання",
about:"Шерлок Холмс розслідує таємничу смерть дівчини в старовинному маєтку й рятує її сестру-близнючку від тієї ж долі. Класичний детектив про силу дедуктивного методу.",
plot:["Рано-вранці до Холмса й Вотсона на Бейкер-стріт приходить налякана Хелін Стоунер.","Вона розповідає: її сестра Джулія два роки тому, незадовго до весілля, загинула, вигукнувши «Пістрява стрічка!». Тепер, перед весіллям Хелін, вітчим Ройлотт переселив її в кімнату сестри, і вночі вона чує свист.","Ройлотт приходить до Холмса з погрозами. Холмс оглядає маєток Стоук-Моран: фальшивий шнур дзвоника, вентилятор у кімнату вітчима, ліжко, прикручене до підлоги, сейф, блюдце з молоком.","Уночі Холмс і Вотсон сидять у засідці. Почувши свист, Холмс б'є тростиною по шнуру.","Розлючена змія повертається через вентилятор і жалить Ройлотта. «Пістрява стрічка» — болотяна гадюка; мотив злочину — спадок дочок."],
heroes:[["Шерлок Холмс","геніальний детектив, майстер дедукції"],["Доктор Вотсон","друг і помічник, оповідач"],["Хелін Стоунер","дівчина, що просить допомоги"],["Доктор Грімсбі Ройлотт","жорстокий вітчим-злочинець"]]},

chief:{name:"«Вождь червоношкірих»", author:"О. Генрі, 1907", genre:"Гумористична новела",
about:"Двоє шахраїв викрадають хлопчика заради викупу, але «жертва» так їх мучить, що вони самі платять, аби його позбутися.",
plot:["Сем і Білл вирішують викрасти 10-річного сина поважного Ебенезера Дорсета й вимагати 2000 доларів.","Хлопчик із радістю йде з ними: це для нього гра в індіанців, він — Вождь Червоношкірих.","«Вождь» мучить викрадачів, особливо Білла: б'є, лякає, катається на ньому верхи.","Шахраї надсилають батькові листа з вимогою викупу.","Батько відповідає: забере сина, якщо вони доплатять йому 250 доларів. Шахраї з радістю погоджуються й тікають."],
heroes:[["Сем","оповідач, шахрай-«розумник»"],["Білл","його спільник, найбільше потерпає від хлопця"],["«Вождь Червоношкірих»","10-річний бешкетник"],["Ебенезер Дорсет","кмітливий батько"]]},

prince:{name:"«Маленький принц»", author:"Антуан де Сент-Екзюпері, 1943", genre:"Казка-притча",
about:"Філософська казка про хлопчика з маленької планети, який мандрує Всесвітом і вчиться розуміти головне: любов, дружбу, відповідальність. «Найголовнішого очима не побачиш».",
plot:["Льотчик зазнає аварії в Сахарі. Уранці його будить хлопчик: «Намалюй мені баранця!» Це Маленький принц з астероїда В-612.","На своїй планеті принц чистив вулкани, виполював баобаби й доглядав примхливу Троянду. Ображений нею, він вирушив мандрувати.","Він відвідує планети Короля, Честолюбця, Пияка, Ділової людини, Ліхтарника й Географа — і дивується дивацтвам дорослих.","На Землі принц зустрічає Змію, сад троянд і Лиса, який учить його «приручати» й відкриває таємницю: «Пильно бачить лише серце» і «Ти відповідаєш за всіх, кого приручив».","Разом із льотчиком вони знаходять у пустелі колодязь. Принц вирішує повернутися до своєї Троянди: укус Змії дає йому змогу «піти додому». Льотчик відтоді слухає зорі."],
heroes:[["Маленький принц","щирий, допитливий, вірний; бачить серцем"],["Льотчик (оповідач)","дорослий, що зберіг у собі дитину"],["Троянда","горда, примхлива, але кохана"],["Лис","мудрий друг, що вчить приручати"],["Змія","символ смерті й мудрості"],["Мешканці планет","уособлення людських вад"]]},

spider:{name:"«Павутинка»", author:"Акутаґава Рюноске, 1918", genre:"Новела-притча",
about:"Притча про розбійника, якому Будда дав шанс вибратися з пекла за єдине добре діло, — і про те, як егоїзм зруйнував цей шанс.",
plot:["Будда прогулюється в Раю біля ставка з лотосами й бачить у глибинах пекла розбійника Кандату.","Будда згадує: колись Кандата не розчавив павучка, пожалів його.","На знак подяки Будда опускає в пекло срібну павутинку.","Кандата лізе вгору, але, озирнувшись, бачить тисячі грішників, що лізуть за ним. Він кричить: «Ця павутинка моя! Геть!»","Павутинка рветься якраз над Кандатою, і він падає назад у пекло. Будда засмучено йде далі, а лотоси в Раю спокійно пахнуть."],
heroes:[["Будда","мудрий і милосердний"],["Кандата","великий розбійник з іскрою добра, але егоїст"]]},

inch:{name:"«Останній дюйм»", author:"Джеймс Олдрідж, 1957", genre:"Оповідання",
about:"Оповідання про батька й сина, які лише в смертельній небезпеці навчилися розуміти й довіряти одне одному.",
plot:["Пілот Бен, утративши роботу, береться знімати акул на дні Червоного моря й бере з собою десятирічного сина Деві.","Стосунки між ними холодні: батько не вміє говорити з сином, хлопчик почувається самотнім.","Під водою на Бена нападає акула й тяжко його ранить. Деві допомагає батькові дістатися до літака.","Знекровлений Бен підказує, а Деві сам піднімає літак у повітря й веде його.","Хлопчик здійснює посадку, долаючи найважчий «останній дюйм». Батько й син нарешті відкривають одне одного."],
heroes:[["Бен","пілот, суворий батько, що вчиться розуміти сина"],["Деві","десятирічний син, що виявляє мужність"]]},

profession:{name:"«Фах»", author:"Айзек Азімов, 1957", genre:"Науково-фантастична повість",
about:"Повість про майбутнє, де знання завантажують у мозок стрічками. Юнак, якого визнали «непридатним до освіти», доводить, що здатен до найціннішого — самостійного мислення.",
plot:["У світі майбутнього у 8 років у день Читання дітей навчають читати, а у 18 — у день Освіти кожен миттєво отримує фах.","Джордж Плейтен мріє стати програмістом і поїхати на Новію. Він сам читає книжки, хоч це вважають дивним.","У день Освіти лікарі визнають його мозок непридатним. Джорджа відправляють в «інтернат для недоуків». Він у відчаї, заздрить другові Тревіліяну.","Джордж тікає й пробирається на Олімпіаду фахівців, щоб довести, що вартий більшого. Там він знайомиться з істориком Інженеску.","Джордж дізнається правду: «інтернат» — це інститут вищих досліджень для тих, хто здатен творити нове знання. Він пройшов останнє випробування."],
heroes:[["Джордж Плейтен","юнак, здатний до самостійного мислення"],["Тревіліян","друг дитинства Джорджа"],["Ладислас Інженеску","історик, що допомагає Джорджу"],["Омейні","сусід Джорджа в інтернаті"],["Сем Елленфорд","посадовець, що повідомляє Джорджу «вирок»"]]},

inkheart:{name:"«Чорнильне серце»", author:"Корнелія Функе, 2003", genre:"Роман-фентезі",
about:"Роман про дівчинку, яка любить книжки, і її батька, що вміє «вичитувати» персонажів у реальний світ. Пригоди, у яких зіткнулися реальність і вигадка, добро і зло, — і сила слова.",
plot:["Дванадцятирічна Меґі живе з батьком Мо, палітурником. Одного вечора до них приходить таємничий Пилопалець.","Меґі дізнається: читаючи вголос, Мо оживлює персонажів. Дев'ять років тому він «вичитав» із книжки «Чорнильне серце» лиходія Каприкорна, а мати Меґі зникла в книжці.","Меґі з батьком тікають до тітки Елінор, власниці великої бібліотеки. Люди Каприкорна викрадають Мо й останній примірник книжки.","Меґі вирушає на порятунок і потрапляє в полон. Вона відкриває, що теж має дар читати вголос.","Каприкорн хоче знищити полонених страшною Тінню. Меґі читає текст, змінений автором книжки Феноліо, — і Тінь знищує самого Каприкорна."],
heroes:[["Меґі","дівчинка, що любить читати; мужня, вірна"],["Мо (Срібноязикий)","її батько, палітурник із чарівним даром"],["Пилопалець","вуличний жонглер вогнем із книжки"],["Елінор","тітка, пристрасна збирачка книжок"],["Каприкорн","жорстокий лиходій із книжки"],["Феноліо","автор книжки «Чорнильне серце»"]]},

howl:{name:"«Мандрівний замок Хаула»", author:"Діана Вінн Джонс, 1986", genre:"Роман-фентезі",
about:"Казкова історія про дівчину, яку відьма перетворила на стареньку, і про її пригоди в мандрівному замку чарівника Хаула. Твір про сміливість, віру в себе й силу любові.",
plot:["Софі, старша з трьох сестер, працює в капелюшній крамниці й вважає, що їй не судилося щастя.","Відьма Пустки перетворює Софі на 90-річну стареньку.","Софі йде з дому й потрапляє в мандрівний замок чарівника Хаула. Вона укладає угоду з вогняним демоном Кальцифером: допомогти розірвати його контракт із Хаулом в обмін на зняття чарів.","Софі стає «прибиральницею» замку, заводить дружбу з учнем Майклом, розкриває таємниці Хаула й відьми.","Софі відкриває у собі чарівний дар, рятує Хаула й Кальцифера, перемагає Відьму Пустки — і повертає собі молодість та знаходить кохання."],
heroes:[["Софі","скромна дівчина, що стає сміливою"],["Хаул","молодий чарівник, марнославний, але добрий"],["Кальцифер","вогняний демон, що живе в каміні"],["Майкл","учень Хаула"],["Відьма Пустки","головна лиходійка"]]}
};

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("zl7_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS.find(x=>x.name===l.section); if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 7 клас</div>
      <h1>Зарубіжна література</h1>
      <p>Уроки за календарно-тематичним плануванням: основна інформація, про що твір, сюжет і герої, тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> розділів</span><span><b>${total}</b> тем</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${si+1}</div><h2>${esc(s.name)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">РОЗДІЛ ${si+1}</div><div class="rn">${esc(s.name)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Тема ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Зарубіжна література · 7 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">Розділ ${si+1}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${si+1}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("zl7_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Зарубіжна література 7`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("zl7_theme",d.dataset.theme); }
const th=store.get("zl7_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
