<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Географія · 7 клас · Ліцей «Ясно»</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2433;--mute:#5b6478;--line:#e3e8f0;--ac:#0ea5a4;--ac2:#14b8a6;--soft:#e6fbf8;--mark:#fff3a3;--shadow:0 6px 24px rgba(20,40,80,.08)}
body.dark{--bg:#0f1420;--card:#182031;--ink:#e8edf6;--mute:#9aa6bd;--line:#2a3550;--soft:#1d2b3d;--mark:#6b5d00;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(90deg,#0f766e,#2563eb 55%,#7c3aed);color:#fff;box-shadow:var(--shadow)}
.top b{font-size:17px}.top .sp{flex:1}
.top button,.top a.btn{background:rgba(255,255,255,.18);border:0;color:#fff;padding:7px 12px;border-radius:10px;cursor:pointer;font-size:15px;text-decoration:none}
.top button:hover,.top a.btn:hover{background:rgba(255,255,255,.3)}
#app{max-width:980px;margin:0 auto;padding:18px 14px 60px}
.hero{border-radius:22px;padding:26px 24px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:attr(data-e);position:absolute;right:14px;bottom:-18px;font-size:120px;opacity:.25}
.hero .k{opacity:.9;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.hero h1{margin:6px 0 8px;font-size:30px;line-height:1.2;max-width:85%}
.hero .pg{display:inline-block;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:99px;font-size:14px}
.card{background:var(--card);border-radius:18px;padding:20px 22px;margin:16px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.hook{background:linear-gradient(135deg,#fff7e6,#ffe9f1);border:0;color:#3a2a10}
body.dark .hook{background:linear-gradient(135deg,#3a2c12,#3a1c2a);color:#ffe9c7}
.hook h3{margin:0 0 6px}
.sum{border:2px solid var(--ac);background:var(--soft)}
.sum h3{margin:0 0 8px;color:var(--ac)}
.sum ol{margin:0;padding-left:22px}.sum li{margin:5px 0}
h2.sec{display:flex;align-items:center;gap:10px;font-size:23px;margin:26px 0 8px}
h2.sec .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:17px}
.src{display:inline-block;font-size:13px;font-weight:500;color:var(--mute);background:var(--soft);border-radius:99px;padding:2px 10px;margin-left:auto;white-space:nowrap}
p{margin:8px 0}
mark{background:linear-gradient(transparent 35%,var(--mark) 35%);color:inherit;padding:0 2px;border-radius:3px}
.key{border-left:6px solid #f59e0b;background:#fffbea;border-radius:12px;padding:12px 16px;margin:12px 0}
body.dark .key{background:#2d2610}
.key:before{content:"⭐ Головне";display:block;font-weight:700;color:#b45309;margin-bottom:4px}
.fact{border-left:6px solid #8b5cf6;background:#f4efff;border-radius:12px;padding:12px 16px;margin:12px 0}
body.dark .fact{background:#251d3d}
.fact:before{content:"🤩 Цікавий факт";display:block;font-weight:700;color:#7c3aed;margin-bottom:4px}
.life{border-left:6px solid #10b981;background:#eafaf3;border-radius:12px;padding:12px 16px;margin:12px 0}
body.dark .life{background:#12302a}
.life:before{content:"🌍 Як це пов’язано з життям";display:block;font-weight:700;color:#047857;margin-bottom:4px}
.ua{border-left:6px solid #2563eb;background:linear-gradient(90deg,#eaf2ff,#fffbe0);border-radius:12px;padding:12px 16px;margin:12px 0}
body.dark .ua{background:linear-gradient(90deg,#16264a,#2d2a10)}
.ua:before{content:"🇺🇦 Україна і ...";display:block;font-weight:700;color:#1d4ed8;margin-bottom:4px}
ul.l{margin:8px 0;padding-left:0;list-style:none}
ul.l li{position:relative;padding-left:26px;margin:6px 0}
ul.l li:before{content:"";position:absolute;left:6px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--ac)}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15.5px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th{background:var(--ac);color:#fff;text-align:left;padding:9px 12px}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.cards div{border-radius:16px;padding:14px;background:var(--soft);border:1px solid var(--line);text-align:center}
.cards .e{font-size:30px}.cards .big{font-size:22px;font-weight:800;color:var(--ac)}.cards .lb{font-size:14px;color:var(--mute)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.term{perspective:900px;height:150px;cursor:pointer}
.term .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.term.f .in{transform:rotateY(180deg)}
.term .fa,.term .ba{position:absolute;inset:0;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;overflow:auto}
.term .fa{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;font-size:19px}
.term .ba{background:var(--card);border:2px solid var(--ac);transform:rotateY(180deg);font-size:15px}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:var(--card)}
.q .qt{font-weight:650;margin-bottom:8px}
.q label{display:block;padding:9px 12px;margin:6px 0;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s}
.q label:hover{border-color:var(--ac)}
.q input{display:none}
.q.done label{cursor:default}
.q label.ok{border-color:#10b981;background:#e7f9f0}
.q label.no{border-color:#ef4444;background:#fdecec}
body.dark .q label.ok{background:#123a2a}body.dark .q label.no{background:#3d1717}
.q .ex{display:none;margin-top:8px;font-size:15px;color:var(--mute)}
.q.done .ex{display:block}
.score{font-size:20px;font-weight:700;text-align:center;padding:14px;border-radius:14px;background:var(--soft);margin-top:12px}
.btnp{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.nav a{flex:1;text-decoration:none;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.nav a.n{text-align:right}
.nav small{color:var(--mute);display:block}
.home h1{font-size:32px;margin:6px 0}
.topic{margin:24px 0 10px;padding:10px 16px;border-radius:14px;color:#fff;font-weight:700;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ls{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);transition:transform .15s}
.ls:hover{transform:translateY(-2px)}
.ls .nb{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.ls .tt{font-size:15.5px;line-height:1.3}.ls .st{font-size:13px;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#2563eb)}
.recap h4{margin:14px 0 4px}
@media(max-width:600px){.hero:after{font-size:70px;opacity:.15;bottom:-8px}.hero h1{font-size:24px;max-width:100%}body{font-size:16px}.top b{font-size:15px}}
@media print{.top,.nav,#tests{display:none}.card,.hero{box-shadow:none}}
</style>
</head>

D({n:35,top:4,par:"§ 36",pg:"151–154",e:"🏔️",t:"Південна Америка: вертикальна поясність в Андах",

b:[["h","Висотні пояси Анд (біля екватора)",151],

L.sort((a,b)=>a.n-b.n);
const $=s=>document.querySelector(s);
const esc=s=>String(s);
function fmt(s){return esc(s).replace(/==(.+?)==/g,"<mark>$1</mark>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
const store={get(k,d){try{return JSON.parse(localStorage.getItem("geo7_"+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem("geo7_"+k,JSON.stringify(v))}catch(e){}}};
if(store.get("dark",false))document.body.classList.add("dark");
$("#dk").onclick=()=>{document.body.classList.toggle("dark");store.set("dark",document.body.classList.contains("dark"))};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setTheme(t){const T=TOPICS[t];document.documentElement.style.setProperty("--ac",T.c1);document.documentElement.style.setProperty("--ac2",T.c2);document.documentElement.style.setProperty("--soft",document.body.classList.contains("dark")?"#1d2b3d":T.s)}
function block(b){
 const [k,a,c]=b;
 if(k=="h"){H++;return `<h2 class="sec"><span class="num">${H}</span><span>${fmt(a)}</span>${c?`<span class="src">📘 с. ${c}</span>`:""}</h2>`}
 if(k=="p")return `<p>${fmt(a)}</p>`;
 if(["key","fact","life","ua"].includes(k))return `<div class="${k}">${fmt(a)}</div>`;
 if(k=="ul")return `<ul class="l">${a.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;
 if(k=="tbl")return `<div class="tw"><table><tr>${a[0].map(x=>`<th>${fmt(x)}</th>`).join("")}</tr>${a.slice(1).map(r=>`<tr>${r.map(x=>`<td>${fmt(x)}</td>`).join("")}</tr>`).join("")}</table></div>`;
 if(k=="cards")return `<div class="cards">${a.map(x=>`<div><div class="e">${x[0]}</div><div class="big">${fmt(x[1])}</div><div class="lb">${fmt(x[2])}</div></div>`).join("")}</div>`;
 return "";
}
let H=0;
function topicLessons(t){return L.filter(x=>x.top==t&&!x.sumOf)}
function quiz(qs,id){
 const items=qs.map((q,i)=>{const opts=shuffle(q.slice(1,5).map((o,j)=>({o,ok:j==0})));
  return `<div class="q" data-i="${i}"><div class="qt">${i+1}. ${fmt(q[0])}</div>${opts.map(x=>`<label data-ok="${x.ok?1:0}"><input type="radio" name="q${i}">${fmt(x.o)}</label>`).join("")}<div class="ex">${q[5]?"💡 "+fmt(q[5]):""}</div></div>`}).join("");
 return `<div id="tests">${items}<div class="score" id="sc">Відповідай на запитання — результат з’явиться тут</div><p style="text-align:center"><button class="btnp" onclick="route()">🔄 Пройти ще раз</button></p></div>`;
}
function bindQuiz(n,total){
 let got=0,ans=0;
 document.querySelectorAll(".q").forEach(q=>{q.querySelectorAll("label").forEach(l=>l.onclick=()=>{
  if(q.classList.contains("done"))return;q.classList.add("done");ans++;
  q.querySelectorAll("label").forEach(x=>{if(x.dataset.ok=="1")x.classList.add("ok")});
  if(l.dataset.ok=="1"){got++}else l.classList.add("no");
  const sc=$("#sc");sc.textContent=ans<total?`Правильно: ${got} з ${ans} (усього запитань: ${total})`:`🎉 Результат: ${got} з ${total} — ${Math.round(got/total*12)} балів із 12`;
  if(ans==total){const best=store.get("s"+n,0);if(got/total>best)store.set("s"+n,got/total);}
 })});
}
function lessonView(n){
 const x=L.find(y=>y.n==n);if(!x)return home();
 setTheme(x.top);H=0;const T=TOPICS[x.top];
 let h=`<div class="hero" data-e="${x.e||T.e}"><div class="k">Урок ${x.n} · ${T.name}</div><h1>${fmt(x.t)}</h1>${x.par?`<span class="pg">📘 Підручник: ${x.par}${x.pg?", с. "+x.pg:""}</span>`:""}</div>`;
 let qs=x.q||[];
 if(x.sumOf){
  const ls=x.sumOf=="all"?L.filter(y=>!y.sumOf):Array.isArray(x.sumOf)?L.filter(y=>!y.sumOf&&x.sumOf.includes(y.top)):topicLessons(x.top);
  if(x.hook)h+=`<div class="card hook"><h3>🎯 Мета уроку</h3>${fmt(x.hook)}</div>`;
  if(x.b)h+=`<div class="card">${x.b.map(block).join("")}</div>`;
  h+=`<div class="card recap"><h2 class="sec"><span class="num">📌</span><span>Повторюємо головне з кожного уроку</span></h2>${ls.map(y=>`<h4>Урок ${y.n}. ${fmt(y.t)}</h4><ul class="l">${(y.sum||[]).map(s=>`<li>${fmt(s)}</li>`).join("")}</ul>`).join("")}</div>`;
  const pool=[];ls.forEach(y=>y.noPool||(y.q||[]).forEach(q=>pool.push(q)));
  qs=(x.q||[]).concat(shuffle(pool).slice(0,x.cnt||(x.sumOf=="all"?24:16)));
  const terms=[];ls.forEach(y=>(y.terms||[]).forEach(t=>terms.push(t)));x._terms=terms;
 }else{
  if(x.hook)h+=`<div class="card hook"><h3>🤔 Для початку — подумай</h3>${fmt(x.hook)}</div>`;
  if(x.sum)h+=`<div class="card sum"><h3>⚡ Урок за 30 секунд</h3><ol>${x.sum.map(s=>`<li>${fmt(s)}</li>`).join("")}</ol></div>`;
  h+=`<div class="card">${x.b.map(block).join("")}</div>`;
  x._terms=x.terms||[];
 }
 if(x._terms.length)h+=`<div class="card"><h2 class="sec"><span class="num">🔑</span><span>Ключові поняття — натисни на картку</span></h2><div class="terms">${x._terms.map(t=>`<div class="term" onclick="this.classList.toggle('f')"><div class="in"><div class="fa">${fmt(t[0])}</div><div class="ba">${fmt(t[1])}</div></div></div>`).join("")}</div></div>`;
 if(x.link)h+=`<div class="card"><p>📝 Онлайн-тест від учителя: <a class="btnp" href="${x.link}" target="_blank" rel="noopener">Відкрити тест на «Всеосвіті»</a></p></div>`;
 if(qs.length)h+=`<div class="card"><h2 class="sec"><span class="num">✅</span><span>Тест: перевір себе (${qs.length} запитань)</span></h2>${quiz(qs)}</div>`;
 const pv=L.find(y=>y.n==n-1),nx=L.find(y=>y.n==n+1);
 h+=`<div class="nav">${pv?`<a href="#${pv.n}"><small>← Попередній</small>${pv.n}. ${fmt(pv.t)}</a>`:"<span></span>"}${nx?`<a class="n" href="#${nx.n}"><small>Наступний →</small>${nx.n}. ${fmt(nx.t)}</a>`:"<span></span>"}</div>`;
 $("#app").innerHTML=h;bindQuiz(n,qs.length);scrollTo(0,0);document.title=`Урок ${n}. ${x.t.replace(/==|\*\*/g,"")}`;
}
function home(){
 document.documentElement.style.setProperty("--ac","#0ea5a4");
 const done=L.filter(x=>store.get("s"+x.n,0)>0).length;
 let h=`<div class="home"><div class="hero" data-e="🌍" style="background:linear-gradient(135deg,#0f766e,#2563eb,#7c3aed)"><div class="k">Ліцей «Ясно» · 7 клас</div><h1>Географія: материки та океани</h1><span class="pg">📘 За підручником С. Запотоцького та ін. (НУШ, 2024) · ${L.length} уроків</span></div>
 <div class="card"><b>Твій прогрес:</b> пройдено тестів — ${done} з ${L.length}<div class="bar"><i style="width:${done/L.length*100}%"></i></div><small style="color:var(--mute)">Кожен урок: загадка → «урок за 30 секунд» → теорія з виділеним головним → картки понять → тест із поясненнями.</small></div>`;
 TOPICS.forEach((T,i)=>{const ls=L.filter(x=>x.top==i);if(!ls.length)return;
  h+=`<div class="topic" style="background:linear-gradient(90deg,${T.c1},${T.c2})">${T.e} ${T.name}</div><div class="grid">${ls.map(x=>{const s=store.get("s"+x.n,0);return `<a class="ls" href="#${x.n}"><span class="nb" style="background:linear-gradient(135deg,${T.c1},${T.c2})">${x.n}</span><span><div class="tt">${fmt(x.t)}</div><div class="st">${s?`✅ найкраще: ${Math.round(s*100)}%`:(x.sumOf?"🏁 узагальнення":(x.par||""))}</div></span></a>`}).join("")}</div>`});
 $("#app").innerHTML=h+"</div>";document.title="Географія · 7 клас";scrollTo(0,0);
}
function route(){const n=parseInt(location.hash.slice(1));n?lessonView(n):home()}
addEventListener("hashchange",route);route();
</script>
