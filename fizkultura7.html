ькість."]}, {"h": "Бадмінтон. Серія ударів у довільній послідовності", "p": ["У грі ніхто не попереджає, куди полетить волан. Тому наступний крок — довільна послідовність: партнер спрямовує волан то праворуч, то ліворуч, а гравець має швидко зрозуміти, яким ударом відповісти.", "Ця вправа розвиває реакцію та уважність. Головне — не вгадувати заздалегідь, а стежити за воланом і рухом ракетки партнера."], "ul": ["Стеж за ракеткою партнера — вона підказує напрямок.", "Не поспішай з рішенням до того, як волан полетів.", "Волан праворуч — удар справа, ліворуч — удар зліва.", "Тримай ноги «живими», готовими до руху.", "Вправу виконуй з безпечною дистанцією між гравцями."]}], "f": "", "pr": ["Виконай вдома без волана імітацію серії ударів: справа-зліва-справа-зліва, 4 серії по 10 ударів, повертаючи ракетку (або уявну ракетку) у вихідне положення після кожного удару.", "Опиши письмово, як перейти від хвату для удару справа до хвату для удару зліва."], "q": ["Чим визначена послідовність ударів відрізняється від довільної?", "Навіщо змінювати хват між ударами справа і зліва?", "Як зрозуміти, куди полетить волан?", "Що треба робити між ударами в серії?"]}, {"n": "91", "t": "Баскетбол 3×3: гра за спрощеними правилами", "g": "Навчитися грати в баскетбол 3×3 за спрощеними правилами, дотримуючись правил безпеки та чесної гри.", "k": "Модулі: Баскетбол 3×3", "terms": [["Винесення м'яча за дугу", "обов'язкова дія в баскетболі 3×3: після підбирання або перехоплення м'яч треба вивести за дугу, перш ніж атакувати."], ["Персональний фол", "порушення правил гравцем у контакті з суперником: поштовх, удар по руках, утримання."], ["Штрафний кидок", "кидок з лінії штрафного без перешкод, який призначають після певних фолів."], ["Атака", "дії команди, яка володіє м'ячем і намагається закинути його в кошик."]], "th": [{"h": "Баскетбол 3×3. Спрощені правила гри на уроці", "p": ["На уроці гра може бути спрощена: менший час, відсутність таймера атаки, кожен гравець має торкнутися м'яча перед кидком. Але основа залишається: гра на один кошик, 1 очко зсередини дуги, 2 очки з-за дуги, після зміни володіння м'яч виносять за дугу.", "Правила потрібні не лише для порядку, а й для безпеки: вони забороняють грубий контакт."], "ul": ["Після підбирання чи перехоплення — винеси м'яч за дугу.", "Пробіжка і подвійне ведення — втрата м'яча.", "Персональний фол — м'яч отримує суперник або призначається штрафний.", "Не вибивай м'яч ударом по руках.", "Суддя (учитель) вирішує спірні моменти."]}, {"h": "Баскетбол 3×3. Як діяти в атаці і захисті", "p": ["В атаці трійка гравців постійно рухається: один веде, двоє відкриваються для передачі. Добре працює передача і повернення м'яча, коли гравець віддав пас і одразу біжить до кошика.", "У захисті кожен опікає свого суперника, стоячи між ним і кошиком. Після невлучного кидка суперника всі борються за підбирання."], "ul": ["Не стій усі троє в одному місці.", "Віддав пас — рухайся.", "У захисті руки активні, але без хапання.", "Стій між суперником і кошиком.", "Підтримуй партнерів і поважай суперників."]}], "f": "", "pr": ["Намалюй схему майданчика для баскетболу 3×3 (кошик, дуга, лінія штрафного) і розстав трьох нападників і трьох захисників.", "Запиши 5 найважливіших правил спрощеної гри в баскетбол 3×3, які ти запам'ятав."], "q": ["Що треба зробити з м'ячем після підбирання в захисті?", "Що таке персональний фол?", "Як мають рухатися гравці в атаці?", "Де має стояти захисник відносно суперника і кошика?"]}, {"n": "92", "t": "Cool Games: естафети та ігри; норматив — згинання і розгинання рук в упорі лежачи", "g": "Навчитися правильно виконувати віджимання (згинання і розгинання рук в упорі лежачи) та розвивати силу рук безпечно.", "k": "Модулі: COOL GAMES", "terms": [["Упор лежачи", "положення тіла на прямих руках і носках, коли тіло утворює пряму лінію."], ["Згинання і розгинання рук в упорі лежачи", "вправа, під час якої людина опускає тіло, згинаючи руки, і повертається вгору, випрямляючи їх (віджимання)."], ["Пряма лінія тіла", "положення, у якому голова, плечі, таз і п'яти розташовані на одній лінії."], ["Повторення", "одне повне виконання вправи від початку до кінця."]], "th": [{"h": "COOL GAMES. Норматив: згинання і розгинання рук в упорі лежачи", "p": ["Вихідне положення: упор лежачи, руки на ширині плечей, пальці вперед, тіло пряме від голови до п'ят. Учень згинає руки, опускаючись до кута в ліктях близько 90 градусів або до торкання грудьми позначки, і повністю випрямляє руки. Рахується кількість правильних повторень. Для дівчат умови можуть бути іншими (наприклад, з опорою на коліна чи на лаву) — їх визначає вчитель.", "Перед тестом розімни зап'ястя, лікті, плечі. Виконуй рухи рівномірно, без ривків."], "ul": ["Тіло пряме: не прогинайся в попереку і не піднімай таз.", "Лікті рухаються назад і трохи в сторони, не розводь їх широко.", "Опускайся до потрібної глибини, повністю випрямляй руки.", "Дихай: вдих донизу, видих угору.", "Неправильні повторення не зараховуються."]}, {"h": "COOL GAMES. Естафети та ігри для активного відпочинку", "p": ["Після силового тесту — естафети Cool Games на кмітливість і злагодженість: будування фігур з обручів, передача предметів у колоні, командні завдання з фрізбі чи м'якими мішечками.", "Ігри для активного відпочинку завершують урок і допомагають рукам відпочити після навантаження."], "ul": ["Обирай завдання без додаткового навантаження на руки одразу після тесту.", "Дій злагоджено з командою.", "Не кидай предмети в партнерів.", "Дотримуйся черговості.", "Наприкінці — розслаблення плечей і кистей."]}], "f": "", "pr": ["Виконай вдома 3 серії віджимань (від підлоги, від колін або від стіни — як тобі під силу) по 8–12 повторень з правильною технікою, стежачи за прямою лінією тіла.", "Виконай вправу «планка» на прямих руках: 3 рази по 20–30 секунд, і запиши, як змінюється час утримання за тиждень."], "q": ["Як має виглядати тіло в упорі лежачи?", "До якої глибини треба опускатися під час віджимання?", "Які помилки роблять повторення незарахованим?", "Як правильно дихати під час віджимань?"]}, {"n": "93", "t": "Бадмінтон: серія ударів справа і зліва з підкиданням волана, навчальна гра", "g": "Закріпити удари справа і зліва та навчитися застосовувати їх у навчальній грі з дотриманням правил рахунку.", "k": "Модулі: Бадмінтон", "terms": [["Партія", "частина матчу в бадмінтоні, яка триває до 21 очка."], ["Подавальний", "гравець, який виконує подачу в розіграші."], ["Приймальний", "гравець, який приймає подачу суперника."], ["Матч", "повна гра між суперниками, яка зазвичай складається з двох-трьох партій."]], "th": [{"h": "Бадмінтон. Серія ударів справа і зліва: закріплення", "p": ["На початку уроку повторюють вправу з підкиданням волана партнером: серії ударів справа, потім зліва. Відстань між партнерами поступово збільшують, щоб удар був сильнішим, але точним.", "Слідкуй за технікою: розворот плечем до волана, замах, удар перед тілом, супровід, повернення у вихідне положення."], "ul": ["Партнер підкидає волан невисоко і точно.", "Зберігай безпечну відстань між гравцями.", "Б'ючи справа, розвертайся плечем з боку вільної руки до сітки.", "Б'ючи зліва, змінюй хват.", "Дивись на волан до удару."]}, {"h": "Бадмінтон. Навчальна гра і рахунок", "p": ["У навчальній грі гравці застосовують вивчені удари. Розіграш починається з подачі знизу по діагоналі. Хто виграв розіграш, той отримує очко і подає наступним. Партія триває до 21 очка, але якщо рахунок 20:20, гра триває, доки хтось не поведе на 2 очки (максимум до 30).", "На уроці правила можуть бути спрощені: коротші партії, гра без суворої розмітки. Головне — чесно рахувати очки й поважати суперника."], "ul": ["Подавальний оголошує рахунок перед подачею.", "При парному рахунку подавального подача з правого поля, при непарному — з лівого.", "Не торкайся сітки.", "Спірний волан можна переграти.", "Після гри потисни руку суперникові."]}], "f": "", "pr": ["Напиши правила підрахунку очок у бадмінтоні своїми словами: до скількох грають партію, що буває при рахунку 20:20, хто подає.", "Виконай вправу на швидкість ніг: в ігровій стійці роби 4 швидкі приставні кроки вправо і вліво, 5 серій з відпочинком 30 секунд."], "q": ["До скількох очок триває партія в бадмінтоні?", "Що відбувається при рахунку 20:20?", "З якого поля подає гравець, якщо його рахунок парний?", "Хто отримує очко в розіграші?"]}, {"n": "94", "t": "Баскетбол 3×3: ведення з обведенням стійок, передача і ловіння м'яча обома руками", "g": "Навчитися вести м'яч з обведенням стійок і виконувати передачу та ловіння м'яча обома руками.", "k": "Модулі: Баскетбол 3×3", "terms": [["Обведення", "ведення м'яча навколо перешкоди або суперника зі зміною напрямку руху."], ["Передача двома руками від грудей", "основна передача в баскетболі: м'яч від грудей спрямовується партнеру рухом рук уперед і розворотом кистей."], ["Ловіння м'яча обома руками", "прийом м'яча, коли руки витягуються назустріч, пальці утворюють «лійку», а м'яч м'яко підтягується до грудей."], ["Фішка", "конус або стійка, що позначає перешкоду чи межу у вправі."]], "th": [{"h": "Баскетбол 3×3. Ведення м'яча з обведенням стійок", "p": ["Обведення стійок — вправа, що імітує обхід суперника. Гравець веде м'яч змійкою між фішками, змінюючи руку: обходячи стійку праворуч, веде правою, ліворуч — лівою. Так м'яч завжди опиняється з боку, протилежного до перешкоди.", "Спершу вправу виконують повільно, кроком, потім збільшують швидкість. Головне — не торкатися стійок і не втрачати м'яч."], "ul": ["Веди м'яч рукою, дальшою від стійки.", "Зміна руки — відскоком м'яча перед собою.", "Перед поворотом зменш швидкість і висоту ведення.", "Голова піднята, дивись на наступну стійку.", "Не біжи швидше, ніж можеш контролювати м'яч."]}, {"h": "Баскетбол 3×3. Передача і ловіння м'яча обома руками", "p": ["Передача від грудей: м'яч тримають пальцями біля грудей, лікті опущені. Робиться крок уперед, руки різко випрямляються, кисті розвертаються назовні, великі пальці дивляться донизу. М'яч летить прямо в груди партнеру.", "Ловіння: руки витягнуті назустріч м'ячу, пальці розставлені, великі пальці майже торкаються один одного. Щойно м'яч торкнувся пальців — руки згинаються, «гасячи» удар, і м'яч опиняється біля грудей, готовий до наступної дії."], "ul": ["Передавай у груди партнера, а не в обличчя чи ноги.", "Перед передачею подивись на партнера.", "Ловлячи, не тримай руки прямими й напруженими.", "Після ловіння одразу захисти м'яч від суперника.", "Відстань для передач збільшуй поступово."]}], "f": "", "pr": ["Виконай вправу на передачі об стіну (з дозволу дорослих, м'яким м'ячем): 3 серії по 15 передач двома руками від грудей і ловіння, стоячи за 2–3 кроки від стіни.", "Опиши письмово техніку передачі двома руками від грудей у 4 кроки."], "q": ["Якою рукою треба вести м'яч, обходячи стійку праворуч?", "Як виконується передача двома руками від грудей?", "Як правильно ловити м'яч, щоб не травмувати пальці?", "Навіщо зменшувати висоту ведення перед поворотом?"]}, {"n": "95", "t": "Cool Games: естафети та ігри; норматив — човниковий біг", "g": "Закріпити техніку човникового бігу та вміння діяти злагоджено в естафетах Cool Games.", "k": "Модулі: COOL GAMES", "terms": [["Гальмування", "зменшення швидкості бігу перед зміною напрямку чи зупинкою."], ["Зміна напрямку", "швидкий перехід від руху в один бік до руху в інший."], ["Опорна стопа", "стопа, на яку переноситься вага тіла під час розвороту."], ["Зона розвороту", "ділянка біля лінії, де бігун зупиняється і змінює напрямок."]], "th": [{"h": "COOL GAMES. Норматив: човниковий біг", "p": ["Човниковий біг перевіряє спритність: уміння швидко бігти, гальмувати й змінювати напрямок. Довжину відрізка та кількість повторень визначає вчитель. Результат — час у секундах.", "Головне в техніці — розворот. За 2–3 кроки до лінії бігун коротшає крок, знижує центр ваги, ставить опорну стопу біля лінії, торкається лінії і різко відштовхується в протилежний бік."], "ul": ["Старт — з високого положення за сигналом.", "Перед лінією — короткі кроки, коліна зігнуті.", "Торкайся лінії так, як вимагає вчитель (рукою або ногою).", "Не пробігай далеко за лінію.", "Біжи в неслизькому взутті.", "Порівнюй результат з тим, що показував у ІІІ чверті."]}, {"h": "COOL GAMES. Естафети та ігри для активного відпочинку", "p": ["Естафети Cool Games на цьому уроці часто містять зміну напрямку: біг змійкою між фішками, обігання конусів, збирання предметів у різних кінцях майданчика. Це гарна підготовка до човникового бігу.", "Наприкінці — ігри для активного відпочинку, щоб знизити навантаження і відновити дихання."], "ul": ["Обігай фішки, не збиваючи їх.", "Не зіштовхуйся з учасниками інших команд.", "Передавай естафету чітко.", "Підтримуй свою команду.", "Після естафет — спокійна ходьба і розтягування."]}], "f": "", "pr": ["Виконай вдома вправу на спритність без бігу: «зірочка» — з центру роби крок-випад у 4 напрямки (вперед, вправо, назад, вліво) і повертайся; 5 кіл, стежачи за рівновагою.", "Запиши 4 поради, як правильно виконувати розворот у човниковому бігу."], "q": ["Що перевіряє човниковий біг?", "Як правильно гальмувати перед лінією?", "Яка найпоширеніша помилка під час розвороту?", "Які завдання в естафетах готують до човникового бігу?"]}, {"n": "96", "t": "Бадмінтон: подача з фіксацією ударного положення, удар над головою, навчальна гра", "g": "Вивчити техніку подачі та удару над головою і застосувати їх у навчальній грі.", "k": "Модулі: Бадмінтон", "terms": [["Подача", "удар, яким починається кожен розіграш; виконується знизу, волан летить по діагоналі на поле суперника."], ["Фіксація ударного положення", "зупинка руху в положенні перед ударом, щоб перевірити й запам'ятати правильну позу."], ["Удар над головою", "удар по волану, що летить високо, виконаний ракеткою над головою і трохи попереду."], ["Зона подачі", "частина поля суперника по діагоналі, у яку має потрапити волан після подачі."]], "th": [{"h": "Бадмінтон. Подача з фіксацією ударного положення", "p": ["Подача виконується знизу: волан у вільній руці за оперення, ракетка відведена назад. Гравець відпускає волан і рухом ракетки знизу вперед-угору б'є по ньому нижче рівня пояса. Волан має перелетіти сітку і впасти в зону подачі по діагоналі.", "Фіксація ударного положення — це коли гравець зупиняється в позі перед ударом, а вчитель або партнер перевіряє її: ноги, положення ракетки, волана, погляд. Так легше виправити помилки."], "ul": ["Стопи нерухомі під час подачі, не відривай їх від підлоги.", "Удар по волану — нижче пояса.", "Ракетка рухається знизу вгору.", "Дивись на волан, а не на суперника.", "Подавай по діагоналі."]}, {"h": "Бадмінтон. Удар над головою і навчальна гра", "p": ["Удар над головою виконують, коли волан летить високо. Гравець розвертається боком до сітки, відводить ракетку за голову, вільна рука вказує на волан. Потім, розвертаючи тулуб і випрямляючи руку, б'є по волану в найвищій точці перед собою.", "У навчальній грі намагайся застосувати подачу і удар над головою. Пам'ятай про правила рахунку і поважай суперника."], "ul": ["Вільна рука піднята і вказує на волан — це допомагає прицілитися.", "Удар — у найвищій точці, трохи попереду голови.", "Вага тіла переходить із задньої ноги на передню.", "Після удару швидко повертайся в центр.", "Не бий над головою, якщо поруч партнер (у парній грі домовляйтеся)."]}], "f": "", "pr": ["Виконай імітацію подачі з фіксацією положення перед дзеркалом: зупинись перед «ударом» і перевір ноги, ракетку, погляд; 3 серії по 10 повторень.", "Опиши письмово послідовність удару над головою в 5 кроків."], "q": ["Як має виконуватися подача в бадмінтоні?", "Що означає фіксація ударного положення?", "Навіщо під час удару над головою піднімати вільну руку?", "У якій точці потрібно бити по волану під час удару над головою?"]}, {"n": "97", "t": "Баскетбол 3×3: гра за спрощеними правилами; норматив — кидки з 3 метрів збоку від щита", "g": "Вивчити техніку кидків однією рукою зверху і двома руками від голови та дізнатися, як виконується норматив з кидків з 3 метрів.", "k": "Модулі: Баскетбол 3×3", "terms": [["Кидок однією рукою зверху", "кидок, під час якого м'яч підтримується знизу кидковою рукою над головою, а друга рука лише притримує його збоку."], ["Кидок двома руками від голови", "кидок, коли м'яч тримають двома руками над чолом і випускають, одночасно випрямляючи руки."], ["Кут кидка", "кут, під яким м'яч летить до щита або кошика, залежно від позиції гравця."], ["Супровід кидка", "рух кисті й пальців після випуску м'яча в бік кошика."]], "th": [{"h": "Баскетбол 3×3. Норматив: 6 кидків з 3 метрів збоку від щита", "p": ["Учень стоїть збоку від щита на відстані 3 метри і виконує 6 кидків: хлопці — однією рукою зверху, дівчата — двома руками від голови. Рахується кількість влучань.", "Кидок однією рукою зверху: м'яч на пальцях кидкової руки над головою, лікоть спрямований на кошик, друга рука притримує збоку. Поштовх ногами, випрямлення руки і захльостувальний рух кисті. Кидок двома руками від голови: м'яч над чолом, лікті трохи в сторони, випуск одночасним випрямленням рук і рухом кистей уперед."], "ul": ["Збоку від щита цілься в його верхній кут, щоб м'яч відскочив у кошик.", "Кидок починається з ніг: злегка присядь і випрямися.", "Після випуску м'яча кисть «дивиться» донизу.", "Не кидай м'яч «від плеча, як ядро» — він летить без дуги.", "Порівнюй результат із попередніми спробами."]}, {"h": "Баскетбол 3×3. Гра за спрощеними правилами", "p": ["У навчальній грі намагайся використати кидки з-під кошика і з середньої відстані. Не завжди треба кидати одразу — іноді краще передати м'яч партнеру, який у кращій позиції.", "Пам'ятай основні правила: винесення м'яча за дугу після зміни володіння, 1 і 2 очки, без пробіжок і грубого контакту."], "ul": ["Кидай, коли тебе не закривають.", "Після кидка біжи на підбирання.", "Після зміни володіння — винеси м'яч за дугу.", "Захищайся між суперником і кошиком.", "Поважай рішення судді."]}], "f": "", "pr": ["Виконай імітацію кидка однією рукою зверху (або двома від голови) з уявним м'ячем: 3 серії по 10, стежачи, щоб рух починався з ніг і завершувався кистю.", "Кидай м'яку іграшку чи шкарпетку у високу коробку (або кошик для білизни) з 2–3 метрів, 3 серії по 6 кидків; запиши кількість влучань."], "q": ["Який кидок виконують у нормативі хлопці, а який дівчата?", "Куди треба цілитися, кидаючи збоку від щита?", "Звідки починається рух під час кидка?", "Що таке супровід кидка?"]}, {"n": "98", "t": "Cool Games: естафети та ігри; норматив — стрибок у довжину з місця", "g": "Вивчити техніку стрибка в довжину з місця та дізнатися, як правильно підготуватися до нормативу.", "k": "Модулі: COOL GAMES", "terms": [["Стрибок у довжину з місця", "стрибок поштовхом двох ніг вперед без розбігу; результат вимірюють від лінії до найближчого сліду."], ["Мах руками", "рух руками назад і вперед перед стрибком, що допомагає стрибнути далі."], ["Поштовх", "енергійне відштовхування ногами від підлоги."], ["Приземлення", "завершальна фаза стрибка, коли спортсмен м'яко опускається на обидві ноги зі згинанням колін."]], "th": [{"h": "COOL GAMES. Норматив: стрибок у довжину з місця", "p": ["Стрибок виконується так: стань біля лінії, ноги на ширині стоп або плечей. Зроби мах руками назад, одночасно присідаючи й нахиляючи тулуб. Потім різко викинь руки вперед-угору і відштовхнися обома ногами. У польоті підтягни коліна, а перед приземленням винеси ноги вперед. Приземляйся м'яко, згинаючи коліна, і не падай назад.", "Результат вимірюють у сантиметрах від лінії до найближчого сліду (найчастіше п'ят). Зазвичай дають кілька спроб і зараховують найкращу. Оцінюй прогрес, порівнюючи свій результат з осіннім."], "ul": ["Не заступай за лінію.", "Відштовхуйся обома ногами одночасно.", "Мах руками синхронний з поштовхом ніг.", "Приземляйся на обидві ноги, руки вперед.", "Не спирайся рукою позаду себе після приземлення — результат зменшиться.", "Перед стрибками — обов'язкова розминка ніг."]}, {"h": "COOL GAMES. Естафети та ігри для активного відпочинку", "p": ["Естафети з елементами стрибків — стрибки через обручі, «жабки», стрибки на двох ногах між фішками — готують до нормативу і розвивають вибуховість. Їх виконують на рівній, неслизькій поверхні.", "Після стрибкових вправ ноги втомлюються, тому завершують урок спокійними іграми для активного відпочинку та розтягуванням."], "ul": ["Стрибай на м'яку, неслизьку поверхню.", "Приземляйся на передню частину стопи з перекатом.", "Не стрибай, якщо попереду ще не звільнилася доріжка.", "Виконуй завдання точно — не пропускай обручі.", "Наприкінці — розтягування м'язів ніг."]}], "f": "", "pr": ["Виконай вправи для зміцнення ніг без стрибків: 3×12 присідань, 3×15 підйомів на носки, 3×20 секунд «стільчик» біля стіни.", "Опиши письмово 4 фази стрибка в довжину з місця: підготовка, поштовх, політ, приземлення."], "q": ["Як виконується мах руками під час стрибка в довжину з місця?", "Як вимірюють результат стрибка?", "Як правильно приземлятися?", "Які помилки зменшують результат?"]}, {"n": "99", "t": "Бадмінтон: подачі, удар над головою, навчальна гра", "g": "Удосконалити різні види подач і удар над головою та навчитися обирати їх відповідно до ситуації в грі.", "k": "Модулі: Бадмінтон", "terms": [["Висока подача", "подача, після якої волан летить високо й далеко в глибину поля суперника."], ["Коротка подача", "подача, після якої волан низько перелітає сітку й падає біля передньої лінії подачі."], ["Смеш", "сильний атакувальний удар над головою, після якого волан швидко летить донизу на половину суперника."], ["Кліар", "високий і далекий удар, яким волан спрямовують у глибину поля суперника."]], "th": [{"h": "Бадмінтон. Види подач", "p": ["Висока подача відсуває суперника в глибину поля: волан летить високо й опускається біля задньої лінії. Таку подачу частіше використовують в одиночній грі. Коротка подача — волан ледь перелітає сітку і падає біля передньої лінії, суперникові важко атакувати.", "Обидві подачі виконують знизу, з фіксованим положенням ніг. Різниця — у силі та напрямку руху ракетки: для високої — сильний мах угору, для короткої — м'який поштовх уперед."], "ul": ["Для високої подачі — повний замах і рух ракетки вгору.", "Для короткої — короткий рух, волан ледь над сіткою.", "Обидві подачі — по діагоналі.", "Змінюй подачі, щоб суперник не звикав.", "Помилка — бити волан вище пояса."]}, {"h": "Бадмінтон. Удар над головою і навчальна гра", "p": ["Удар над головою може бути різним: кліар — високо й далеко, щоб виграти час і повернутися в центр; смеш — сильно й донизу, щоб завершити розіграш. Обидва починаються однаково: розворот боком, вільна рука вгору, ракетка за головою.", "У навчальній грі вибирай удар залежно від ситуації: якщо волан високо і близько до сітки — можна смеш, якщо ти в глибині поля — краще кліар."], "ul": ["Кліар: удар спрямований вгору-вперед.", "Смеш: удар у найвищій точці, спрямований донизу.", "Після удару повертайся в центр.", "Не бий смеш, якщо волан позаду тебе.", "Чесно рахуй очки та оголошуй рахунок."]}], "f": "", "pr": ["Опиши письмово, чим відрізняються висока і коротка подачі та в яких ситуаціях кожну використовують.", "Виконай вправи для плечового суглоба: кругові рухи руками вперед і назад (по 15), махи прямими руками вгору (3×10), імітація удару над головою (3×10)."], "q": ["Чим висока подача відрізняється від короткої?", "Що таке смеш?", "Коли краще виконати кліар, а не смеш?", "Що спільного в техніці всіх ударів над головою?"]}, {"n": "100", "t": "Баскетбол 3×3: кидки від плеча і від грудей з місця та в русі, ловіння м'яча", "g": "Удосконалити кидки однією рукою від плеча і двома руками від грудей з місця та в русі, а також ловіння м'яча обома руками.", "k": "Модулі: Баскетбол 3×3", "terms": [["Кидок однією рукою від плеча", "кидок, під час якого м'яч лежить на пальцях кидкової руки біля плеча і випускається її випрямленням угору-вперед."], ["Кидок двома руками від грудей", "кидок, коли м'яч від грудей посилається в кошик одночасним випрямленням обох рук."], ["Кидок у русі", "кидок, виконаний після ведення або отримання передачі на ходу."], ["Амортизація при ловінні", "м'яке згинання рук у момент торкання м'яча, яке гасить його швидкість."]], "th": [{"h": "Баскетбол 3×3. Кидки з місця", "p": ["Кидок однією рукою від плеча: м'яч на пальцях кидкової руки біля плеча, лікоть під м'ячем і спрямований на кошик, друга рука притримує збоку. Ноги злегка зігнуті. Поштовх ногами, випрямлення руки вгору-вперед, захльостувальний рух кисті.", "Кидок двома руками від грудей — простіший, його часто використовують новачки та на ближчих відстанях: м'яч біля грудей, лікті опущені, рух рук і ніг одночасний, кисті розвертаються назовні."], "ul": ["Дивись на кошик, а не на м'яч.", "Лікоть кидкової руки під м'ячем, не відведений убік.", "М'яч летить по дузі, а не прямо.", "Поштовх ногами додає кидку сили.", "Після кидка рука лишається витягнутою в бік кошика."]}, {"h": "Баскетбол 3×3. Кидки в русі та ловіння м'яча обома руками", "p": ["Кидок у русі ускладнений тим, що треба поєднати ловіння, кроки і кидок. Гравець отримує передачу, ловить м'яч обома руками з амортизацією, робить не більше двох кроків і кидає. Це основа подвійного кроку.", "Ловіння: руки назустріч м'ячу, пальці розставлені, руки м'яко згинаються, м'яч одразу переводиться в положення для кидка або передачі."], "ul": ["Лови м'яч обома руками, а не однією.", "Не роби третього кроку з м'ячем.", "Готуйся до ловіння заздалегідь, витягнувши руки.", "Після ловіння одразу обери дію: кидок, передача чи ведення.", "Не біжи під кошик, якщо там уже є гравці."]}], "f": "", "pr": ["Виконай імітацію кидків з уявним м'ячем: 10 кидків однією рукою від плеча і 10 двома руками від грудей, 2 серії, стежачи за роботою ніг і кистей.", "Опиши, чим відрізняються кидок однією рукою від плеча і кидок двома руками від грудей, і в яких ситуаціях їх краще використовувати."], "q": ["Як має розташовуватися лікоть під час кидка від плеча?", "Чому м'яч має летіти по дузі?", "Скільки кроків можна зробити з м'ячем у руках перед кидком?", "Що таке амортизація при ловінні м'яча?"]}, {"n": "101", "t": "Cool Games: естафети та ігри; норматив — метання малого м'яча на дальність", "g": "Вивчити техніку метання малого м'яча на дальність і правила безпеки під час метань.", "k": "Модулі: COOL GAMES", "terms": [["Метання малого м'яча", "кидок невеликого м'яча однією рукою з-за голови на дальність."], ["Кут вильоту", "кут між напрямком польоту м'яча в момент випуску і землею; від нього залежить дальність кидка."], ["Сектор метання", "позначена зона, у яку мають падати м'ячі під час метання."], ["Фінальне зусилля", "завершальна частина метання: поворот тулуба, випрямлення руки й захльостувальний рух кисті."]], "th": [{"h": "COOL GAMES. Норматив: метання малого м'яча на дальність", "p": ["Метання виконують з місця або з кількох кроків розбігу (як визначить учитель). М'яч тримають пальцями, рука відводиться назад, тулуб повертається боком у бік кидкової руки, вага на задній нозі. Потім вага переноситься на передню ногу, тулуб розвертається, рука через верх викидає м'яч уперед-угору. Завершує кидок рух кисті.", "Найкраще м'яч летить, якщо випустити його під кутом приблизно 40 градусів до землі — не надто низько і не надто високо. Результат — відстань у метрах до місця падіння м'яча. Зараховується найкраща спроба."], "ul": ["Не заступай за лінію метання.", "Метай лише за сигналом учителя.", "Ніхто не стоїть у секторі під час метання.", "По м'ячі йдуть лише за командою, усі разом.", "Перед метанням — розминка плечей, ліктів і кистей.", "Помилка — кидати «від плеча» без повороту тулуба."]}, {"h": "COOL GAMES. Естафети та ігри для активного відпочинку", "p": ["Естафети Cool Games з елементами метання: кидки м'яких мішечків у ціль, влучання фрізбі в обруч, кидки в коробку. Вони розвивають влучність і координацію, а метати в них треба точно, а не сильно.", "Наприкінці уроку — спокійні ігри для активного відпочинку та вправи на розслаблення рук."], "ul": ["Кидай лише в ціль, а не в людей.", "Чекай, поки ціль звільниться.", "Інвентар передавай у руки.", "Дотримуйся черговості.", "Наприкінці — розслаблення плечей і рук."]}], "f": "", "pr": ["Виконай імітацію метання малого м'яча без м'яча: 3 серії по 10 повторень кожною рукою, стежачи за поворотом тулуба і переносом ваги з задньої ноги на передню.", "Запиши правила безпеки під час метань на уроці (не менше 5)."], "q": ["Як правильно тримати малий м'яч?", "Під яким кутом краще випускати м'яч, щоб він полетів далі?", "Що таке фінальне зусилля в метанні?", "Які правила безпеки слід пам'ятати під час метань?"]}, {"n": "102", "t": "Бадмінтон: подачі, удар над головою, удари з власного підкидання; норматив — точність подачі", "g": "Удосконалити подачі та удари з власного підкидання і дізнатися, як виконується норматив з точності подачі.", "k": "Модулі: Бадмінтон", "terms": [["Ближня лінія подачі", "лінія недалеко від сітки, перед якою волан після подачі не повинен падати."], ["Удар з власного підкидання", "вправа, коли гравець сам підкидає волан і виконує по ньому удар."], ["Влучність подачі", "здатність спрямувати волан після подачі точно в задану зону."], ["Помилка подачі", "порушення, через яке подача не зараховується: волан у сітці, поза зоною, удар вище пояса тощо."]], "th": [{"h": "Бадмінтон. Норматив: точність подачі (10 подач у ближню зону)", "p": ["Учень виконує 10 подач вивченим способом і намагається, щоб волан упав у ближню зону подачі — за ближньою лінією подачі, але недалеко від неї. Рахується кількість влучень із 10. Найкраще для цього підходить коротка подача.", "Техніка: волан за оперення перед собою, ракетка позаду, удар м'яким рухом уперед нижче пояса. Волан має ледь перелетіти сітку. Не поспішай між спробами: зроби вдих, прицілься, подавай."], "ul": ["Ноги нерухомі під час подачі.", "Удар по волану — нижче пояса.", "Рух ракетки короткий і м'який.", "Волан має пролетіти низько над сіткою.", "Стеж, щоб волан не впав перед ближньою лінією.", "Порівняй результат із попереднім тренуванням."]}, {"h": "Бадмінтон. Удари з власного підкидання та удар над головою", "p": ["Удари з власного підкидання допомагають тренуватися самостійно: гравець підкидає волан вільною рукою і виконує удар справа, зліва або над головою. Підкидати треба точно в точку удару — трохи попереду і з боку ракетки.", "Удар над головою продовжують відпрацьовувати: розворот боком, вільна рука вказує на волан, удар у найвищій точці."], "ul": ["Підкидай волан невисоко й точно.", "Б'ючи над головою, розвертайся боком до сітки.", "Після удару повертайся у вихідне положення.", "Тримай безпечну відстань від інших гравців.", "Не бий з усієї сили — головне контроль."]}], "f": "", "pr": ["Виконай вдома вправу на точність: постав на підлогу коробку або таз за 2–3 кроки і м'яко закидай у нього легкий предмет (волан, паперову кульку) рухом знизу, як під час подачі. 3 серії по 10, запиши кількість влучень.", "Опиши письмово, які помилки роблять подачу незарахованою."], "q": ["Як виконується норматив з точності подачі?", "Яка подача найкраще підходить для влучання в ближню зону?", "Як треба підкидати волан для удару з власного підкидання?", "Назви три помилки подачі."]}, {"n": "103", "t": "Баскетбол 3×3: навчальна гра за спрощеними правилами, захист і взаємодія", "g": "Застосувати вивчені прийоми баскетболу 3×3 у навчальній грі та навчитися простим діям у захисті й нападі.", "k": "Модулі: Баскетбол 3×3", "terms": [["Захист один на один", "спосіб захисту, коли кожен гравець опікає одного конкретного суперника."], ["Заслін", "прийом, коли нападник стає на шляху захисника, щоб звільнити партнера з м'ячем."], ["Передай і біжи", "взаємодія, коли гравець віддає пас і одразу біжить до кошика, щоб отримати м'яч назад."], ["Захисна стійка", "положення з широко розставленими зігнутими ногами і руками, готовими перешкодити передачі чи кидку."]], "th": [{"h": "Баскетбол 3×3. Захист у грі", "p": ["У баскетболі 3×3 найчастіше використовують захист один на один. Кожен захисник стоїть між своїм суперником і кошиком у захисній стійці: ноги ширше плечей, коліна зігнуті, руки активні. Він пересувається приставними кроками, не схрещуючи ноги.", "За function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
