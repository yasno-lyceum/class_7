<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фізична культура · 7 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "fk7", "name": "Фізична культура · 7 клас", "short": "Фізкультура 7", "themes": [{"name": "І чверть. Дитяча легка атлетика, баскетбол, волейбол", "lessons": [{"n": "1", "t": "Безпека на уроках фізкультури. Легка атлетика: низький старт, стартовий розгін, естафети", "g": "Учень знатиме загальні правила безпеки на уроках фізичної культури та легкої атлетики, розумітиме техніку низького старту і стартового розгону.", "k": "Модулі: Дитяча легка атлетика", "terms": [["Інструктаж з безпеки", "пояснення вчителя про правила поведінки на уроці, які допомагають уникнути травм."], ["Низький старт", "спосіб початку бігу на короткі дистанції, коли бігун спирається на руки й ногу, що стоїть попереду."], ["Стартовий розгін", "перші 10–15 кроків після старту, під час яких бігун поступово випрямляється і набирає швидкість."], ["Естафета", "командне змагання, у якому учасники по черзі долають свої відрізки дистанції."], ["Загальнорозвивальні вправи (ЗРВ)", "комплекс вправ для розминки всіх груп м'язів і суглобів перед основною частиною уроку."]], "th": [{"h": "Дитяча легка атлетика. Правила безпеки на уроках фізичної культури", "p": ["Урок фізкультури починається з розминки й інструктажу. Правила безпеки потрібні не для заборон, а щоб ти міг займатися із задоволенням і без травм. Спортивна форма має бути зручною, взуття — на неслизькій підошві, а прикраси й годинник краще зняти.", "На легкій атлетиці ми бігаємо, стрибаємо й метаємо, тому особливо важливо стежити, щоб попереду й поруч нікого не було, і виконувати вправи лише за сигналом учителя."], "ul": ["Перед уроком зніми прикраси, зав'яжи шнурки, збери волосся.", "Завжди виконуй розминку (комплекс ЗРВ), щоб розігріти м'язи.", "Біжи лише своєю доріжкою, не перетинай дистанцію інших.", "Після фінішу не зупиняйся різко — пробіжи ще кілька метрів і перейди на крок.", "Повідом учителя, якщо погано почуваєшся або отримав навіть невелику травму."]}, {"h": "Дитяча легка атлетика. Техніка низького старту і стартового розгону", "p": ["Низький старт виконують за трьома командами. «На старт!» — бігун ставить сильнішу ногу попереду, коліно другої ноги опускає на доріжку, руки — на ширині плечей біля лінії старту. «Увага!» — піднімає таз трохи вище плечей, вага тіла переходить на руки й передню ногу. «Руш!» — потужно відштовхується обома ногами й робить швидкий рух руками.", "Під час стартового розгону тулуб спочатку нахилений уперед, а потім поступово випрямляється. Кроки поступово подовжуються, руки активно працюють, зігнуті в ліктях."], "ul": ["Не став руки за лінію старту — це фальстарт.", "Не піднімай голову різко на першому кроці — дивись трохи вперед на доріжку.", "Типова помилка: одразу випрямитися — так втрачається швидкість.", "Перші кроки — короткі й часті, далі — довші.", "Руки рухаються вперед-назад, а не впоперек тіла."]}, {"h": "Дитяча легка атлетика. Естафети з елементами бігу", "p": ["Естафета вчить працювати в команді: результат залежить від кожного. Наступний учасник стартує тільки тоді, коли попередній торкнувся його руки або передав предмет.", "Під час естафети важливо стояти в колоні, не заважати іншим командам і не вибігати раніше часу."], "ul": ["Чекай своєї черги за лінією старту.", "Передавай естафету чітко, торкаючись долоні товариша.", "Після свого етапу стань у кінець колони.", "Підтримуй товаришів словами, а не штовханням.", "Чесна гра важливіша за перемогу."]}], "f": "Легка атлетика — один із найдавніших видів спорту: біг на коротку дистанцію був у програмі вже перших античних Олімпійських ігор.", "pr": ["Запиши в зошит 5 правил безпеки на уроках легкої атлетики своїми словами.", "Виконай удома розминку з 6–8 вправ (нахили голови, оберти руками, нахили тулуба, присідання) і запиши її порядок."], "q": ["Які три команди подають під час низького старту?", "Що відбувається з положенням тулуба під час стартового розгону?", "Чому після фінішу не можна різко зупинятися?", "Що таке фальстарт?"]}, {"n": "2", "t": "Безпека на уроках баскетболу. Переміщення в стійці баскетболіста, передачі м'яча", "g": "Учень знатиме правила безпеки на уроках баскетболу, техніку переміщень у стійці та основні види передач м'яча.", "k": "Модулі: Баскетбол", "terms": [["Стійка баскетболіста", "основне положення гравця: ноги на ширині плечей, зігнуті в колінах, тулуб трохи нахилений уперед, руки готові до дії."], ["Приставний крок", "пересування, під час якого одна нога приставляється до другої без схрещування."], ["Передача від грудей", "передача м'яча двома руками, коли м'яч виштовхується від грудей прямо до партнера."], ["Передача з відскоком від підлоги", "передача, під час якої м'яч один раз ударяється об підлогу перед тим, як потрапити до партнера."]], "th": [{"h": "Баскетбол. Правила безпеки", "p": ["Баскетбол — швидка гра з частими зупинками, стрибками та боротьбою за м'яч. Тому важливо мати зручне взуття, яке добре фіксує гомілкостоп, і пам'ятати про інших гравців.", "Найчастіші травми в баскетболі — вивих пальців і гомілкостопу. Їх можна уникнути, якщо правильно ловити м'яч і не приземлятися на ноги інших гравців."], "ul": ["Ловити м'яч треба розслабленими пальцями, утворюючи «лійку» з долонь.", "Не штовхай і не хапай суперника.", "Не вішайся на кільце.", "М'ячі, які не використовуються, мають лежати в кошику, а не під ногами.", "Подавай м'яч партнерові, коли він дивиться на тебе."]}, {"h": "Баскетбол. Переміщення в стійці баскетболіста", "p": ["Стійка дає змогу швидко рушити в будь-який бік. Ноги трохи зігнуті, вага на передній частині стопи, спина пряма, погляд уперед.", "Пересуваються приставними кроками вбік, уперед і назад. Ноги не схрещують, щоб не спіткнутися, а висота стійки не змінюється — голова не «стрибає» вгору-вниз."], "ul": ["Ноги на ширині плечей або трохи ширше.", "Коліна зігнуті, п'яти не відриваються різко.", "Крок починається з ноги, що ближча до напрямку руху.", "Типова помилка: випрямлені ноги — гравець повільно реагує.", "Руки перед собою, готові до передачі чи перехоплення."]}, {"h": "Баскетбол. Різновиди передач і рухливі ігри", "p": ["Передача — найшвидший спосіб перемістити м'яч. Найпоширеніші — двома руками від грудей, з відскоком від підлоги, двома руками з-за голови та однією рукою від плеча.", "Рухливі ігри з м'ячем (наприклад, «Передав — сідай») допомагають закріпити передачі у веселій формі й вчать стежити за партнерами."], "ul": ["Перед передачею подивися на партнера.", "Виштовхуй м'яч руками й закінчуй рух кистями, великі пальці вниз.", "Передача з відскоком: м'яч ударяється ближче до партнера, приблизно на 2/3 відстані.", "Партнер готує руки на рівні грудей.", "Не кидай м'яч занадто сильно на малій відстані."]}], "f": "Баскетбол придумав учитель фізкультури Джеймс Нейсміт у 1891 році; першими кошиками були кошики для персиків.", "pr": ["Намалюй схему стійки баскетболіста (вигляд збоку) і підпиши положення ніг, тулуба та рук.", "Постій у стійці баскетболіста 3 рази по 20 секунд та виконай кілька приставних кроків уліво-вправо в кімнаті, де нічого не заважає."], "q": ["Як виглядає правильна стійка баскетболіста?", "Чому під час переміщень не можна схрещувати ноги?", "Назви три види передач м'яча.", "Як правильно ловити м'яч, щоб не травмувати пальці?"]}, {"n": "3", "t": "Безпека на уроках волейболу. Стійка і переміщення, передача м'яча над собою", "g": "Учень знатиме правила безпеки на уроках волейболу, техніку стійки, переміщень та передачі м'яча вгору над собою.", "k": "Модулі: Волейбол", "terms": [["Ігрова стійка волейболіста", "положення гравця з напівзігнутими ногами й руками перед собою, з якого він швидко рушає до м'яча."], ["Передача зверху", "прийом, коли м'яч направляють пальцями обох рук над головою."], ["«Ківш»", "положення кистей під час передачі зверху: пальці розставлені, великі й вказівні утворюють трикутник."], ["Сітка", "натягнута над серединою майданчика перешкода, через яку перекидають м'яч."]], "th": [{"h": "Волейбол. Правила безпеки", "p": ["У волейболі м'яч летить швидко, а гравці часто рухаються біля сітки. Щоб не травмуватися, потрібно розминати пальці, кисті та гомілкостопи.", "Під час вправ у парах дивися на партнера і подавай м'яч тільки тоді, коли він готовий."], "ul": ["Перед заняттям розімни пальці (стискання й розтискання кулаків, оберти кистями).", "Не торкайся сітки й стійок.", "Не пробігай під сіткою на чужий бік, коли там грають.", "Не наступай на м'ячі, що лежать на підлозі.", "Попереджай голосом: «Мій!», коли йдеш на м'яч."]}, {"h": "Волейбол. Ігрова стійка і переміщення", "p": ["Стійка волейболіста схожа на стійку баскетболіста, але руки зігнуті в ліктях і підняті перед грудьми. Вага тіла — на передній частині стопи, щоб швидко зрушити з місця.", "Переміщуються приставними кроками, швидкими кроками вперед, назад і вбік. Головне — вийти під м'яч заздалегідь, щоб виконувати передачу з місця, а не в стрибку."], "ul": ["Ноги на ширині плечей, одна трохи попереду.", "Коліна зігнуті, спина нахилена вперед.", "Погляд — на м'яч.", "Під час руху не випрямляй ноги.", "Типова помилка: чекати м'яча на місці замість того, щоб рухатися до нього."]}, {"h": "Волейбол. Передача м'яча вгору над собою і рухливі ігри", "p": ["Передачу над собою виконують пальцями обох рук. Кисті розміщують над чолом, утворюючи «ківш». Коли м'яч торкається пальців, ноги й руки разом випрямляються, і м'яч летить вертикально вгору.", "У рухливих іграх з елементами волейболу (наприклад, «Не дай м'ячу впасти») учні закріплюють уміння стежити за м'ячем і вчасно підходити під нього."], "ul": ["М'яч приймають пальцями, а не долонями.", "Лікті розведені в сторони.", "Рух починається з ніг, продовжується руками.", "Передача має бути на висоту 1–2 метри.", "Типова помилка: м'яч б'ється об долоні — він летить неточно."]}], "f": "Волейбол придумав американський викладач Вільям Морган у 1895 році як спокійнішу гру, ніж баскетбол.", "pr": ["Опиши письмово послідовність рухів під час передачі м'яча зверху над собою (3–4 кроки).", "Виконай вправи для пальців: 20 стискань кулаків, 10 обертів кистями в кожен бік, 10 разів «ківш» перед дзеркалом."], "q": ["Чому перед волейболом треба розминати пальці?", "Як розташовані кисті під час передачі зверху?", "З якої частини тіла починається рух під час передачі?", "Що означає вигук «Мій!» у грі?"]}, {"n": "4", "t": "Легка атлетика: біг 30 м, багатоскоки, стрибок у довжину з місця, метання малого м'яча", "g": "Учень розумітиме техніку бігу на 30 м, стрибка в довжину з місця та метання малого м'яча на дальність.", "k": "Модулі: Дитяча легка атлетика", "terms": [["Спеціальні бігові вправи", "вправи, що імітують окремі частини бігового кроку: біг з високим підніманням стегна, захльостування гомілки тощо."], ["Багатоскоки", "серія стрибків з ноги на ногу з довгим польотом, яка розвиває силу ніг."], ["Стрибок у довжину з місця", "стрибок поштовхом двома ногами вперед без розбігу."], ["Метання на дальність", "кидок снаряда так, щоб він пролетів якомога далі."]], "th": [{"h": "Дитяча легка атлетика. Біг 30 м і спеціальні вправи", "p": ["Біг на 30 м — це спринт, тут важливі швидка реакція на старті й частота кроків. Спеціальні та прикладні вправи (біг з високим підніманням стегна, захльостуванням гомілки, дріботіння) готують м'язи до швидкого бігу.", "Багатоскоки — стрибки з ноги на ногу — розвивають силу поштовху, яка потрібна і для бігу, і для стрибків."], "ul": ["Біжи на передній частині стопи.", "Руки зігнуті приблизно під прямим кутом.", "Дивись уперед, а не під ноги.", "Пробігай фінішну лінію, не сповільнюючись перед нею.", "Багатоскоки виконують лише на м'якій або спортивній поверхні."]}, {"h": "Дитяча легка атлетика. Стрибок у довжину з місця", "p": ["Стрибок складається з фаз: підготовка, поштовх, політ і приземлення. Учень стає біля лінії, ноги на ширині стоп, робить замах руками назад і присідає. Потім руки рішуче йдуть уперед-угору, а ноги потужно відштовхуються.", "У польоті ноги підтягуються вперед, а приземлення відбувається м'яко на обидві ноги з перекатом з п'яти на носок. Результат вимірюють до найближчого сліду."], "ul": ["Не заступай за лінію.", "Відштовхуйся одночасно обома ногами.", "Замах руками допомагає стрибнути далі.", "Приземлюйся на зігнуті ноги.", "Типова помилка: падіння назад на руки — це зменшує результат."]}, {"h": "Дитяча легка атлетика. Метання малого м'яча на дальність", "p": ["Малий м'яч метають однією рукою з-за голови. Метальник стоїть боком до напрямку кидка, рука з м'ячем відведена назад. Кидок починається з ніг і тулуба, а закінчується швидким рухом руки та кисті.", "Найкращий кут вильоту м'яча — помірно вгору, приблизно під кутом 40–45 градусів."], "ul": ["Метай тільки за командою вчителя.", "Перед кидком переконайся, що в секторі нікого немає.", "По м'ячі йдуть лише за командою, усі разом.", "Не заступай за лінію метання.", "Розімни плечові суглоби перед метанням."]}], "f": "", "pr": ["Намалюй схему стрибка в довжину з місця з чотирма фазами та підпиши кожну.", "Виконай 3 підходи по 10 присідань і 3 рази по 20 секунд стійку на носках — це зміцнює м'язи для поштовху."], "q": ["Які фази має стрибок у довжину з місця?", "Як правильно приземлятися після стрибка?", "Під яким приблизно кутом треба метати м'яч на дальність?", "Чому під час метання треба стояти боком?"]}, {"n": "5", "t": "Баскетбол: стійки в нападі і захисті, утримання та укривання м'яча, передачі й ловіння", "g": "Учень знатиме відмінності стійок у нападі й захисті, вмітиме пояснити, як утримувати й укривати м'яч, передавати та ловити його.", "k": "Модулі: Баскетбол", "terms": [["Стійка нападника", "положення гравця з м'ячем, у якому він готовий до передачі, кидка або ведення."], ["Стійка захисника", "низьке положення гравця без м'яча з розставленими руками для перешкоджання суперникові."], ["Укривання м'яча", "захист м'яча тулубом, ліктями й плечем від суперника."], ["Ловіння м'яча", "прийом, під час якого гравець зустрічає м'яч розслабленими руками і притягує його до себе."]], "th": [{"h": "Баскетбол. Стійки в нападі і захисті", "p": ["Нападник з м'ячем стоїть у так званій потрійній загрозі: ноги зігнуті, м'яч біля стегна, він може і кинути, і передати, і почати ведення. Захисник стоїть нижче, ноги ширші, одна рука вгорі — заважає кидку, друга внизу — передачі.", "Захисник стоїть між суперником і своїм кошиком і переміщується приставними кроками."], "ul": ["Нападник тримає м'яч обома руками, не відводить його далеко від тіла.", "Захисник дивиться на пояс суперника, а не на м'яч.", "Захисник не схрещує ноги.", "Обидві стійки — на напівзігнутих ногах.", "Типова помилка: високе положення тіла."]}, {"h": "Баскетбол. Утримання і укривання м'яча", "p": ["Щоб суперник не вибив м'яч, його тримають міцно пальцями, а не долонями, близько до тулуба. Укривають м'яч, повертаючись до суперника плечем і розставляючи лікті, але без ударів.", "Розмахувати ліктями заборонено правилами — так можна травмувати іншого гравця."], "ul": ["М'яч тримають пальцями, долоні не торкаються його повністю.", "Плече й тулуб — між м'ячем і суперником.", "Лікті розставлені, але нерухомі.", "Погляд — на майданчик, щоб бачити партнерів.", "Не тримай м'яч високо над головою біля суперника."]}, {"h": "Баскетбол. Передачі на місці і в русі, ловіння м'яча", "p": ["Передачі на місці вчать точності, а в русі — узгодження кроків і рухів рук. Ловлячи м'яч у русі, гравець робить крок назустріч і не перевищує двох кроків з м'ячем у руках.", "Під час ловіння руки витягнуті назустріч м'ячу, пальці розставлені. Щойно м'яч торкнувся пальців, руки згинаються і «гасять» його швидкість."], "ul": ["Виходь назустріч м'ячу.", "Показуй руками, куди тобі передати.", "Передавай партнерові трохи попереду, якщо він рухається.", "Після ловіння прийми стійку нападника.", "Пам'ятай про правило пробіжки."]}], "f": "", "pr": ["Запиши, чим відрізняються стійка нападника і стійка захисника (не менше трьох відмінностей).", "Виконай 3 рази по 30 секунд утримання низької стійки захисника і 10 повільних випадів на кожну ногу."], "q": ["Що таке потрійна загроза?", "Як правильно укривати м'яч від суперника?", "Чому під час ловіння руки треба згинати?", "Що порушує гравець, який зробив багато кроків з м'ячем у руках?"]}, {"n": "6", "t": "Волейбол: правила гри, стійка, пересування приставними кроками, вихідне положення", "g": "Учень знатиме основні правила волейболу та вмітиме пояснити, як обирати вихідне положення для передач і прийому м'яча.", "k": "Модулі: Волейбол", "terms": [["Подача", "удар, яким гравець із-за лицьової лінії вводить м'яч у гру."], ["Перехід", "переміщення гравців по майданчику за годинниковою стрілкою після виграшу права подачі."], ["Три торкання", "правило, за яким команда може торкнутися м'яча не більше трьох разів, перш ніж перекинути його через сітку."], ["Вихідне положення", "місце й поза гравця під м'ячем перед виконанням передачі або прийому."]], "th": [{"h": "Волейбол. Основні правила гри", "p": ["У волейбол грають дві команди по 6 гравців на майданчику, розділеному сіткою. Мета — щоб м'яч упав на половині суперника або щоб суперник не зміг його повернути. Очко отримує команда, яка виграла розіграш.", "Гравець не може торкатися м'яча двічі поспіль (крім випадку після блоку), а команда має не більше трьох торкань."], "ul": ["Гра починається з подачі.", "М'яч, що впав на лінію, вважається таким, що потрапив у майданчик.", "Торкатися сітки заборонено.", "Після виграшу подачі команда робить перехід.", "Не можна ловити й кидати м'яч — його відбивають."]}, {"h": "Волейбол. Стійка і пересування приставними кроками", "p": ["Від правильної стійки залежить, чи встигнеш ти до м'яча. Ноги зігнуті, тулуб нахилений, руки перед собою. Пересування приставними кроками дає змогу рухатися вбік, не втрачаючи рівноваги.", "Під час пересування тіло залишається на одній висоті, а погляд прикутий до м'яча."], "ul": ["Перший крок — ногою в бік руху.", "Ноги не зводяться разом повністю.", "Руки не опускаються під час руху.", "Пересуватися треба короткими швидкими кроками.", "Типова помилка: біг випрямившись."]}, {"h": "Волейбол. Вибір вихідного положення для передач і прийому", "p": ["Для передачі зверху гравець стає під м'яч так, щоб той падав йому трохи перед чолом. Для прийому знизу — так, щоб м'яч опинився перед тулубом на рівні пояса.", "Оцінити, куди впаде м'яч, можна, стежачи за його польотом із самого початку. Чим раніше ти рушиш, тим спокійніше виконаєш прийом."], "ul": ["Стеж за м'ячем від руки суперника.", "Зупиняйся до того, як м'яч підлетить.", "Передача зверху — м'яч над чолом.", "Прийом знизу — м'яч перед поясом.", "Розвертайся грудьми в напрямку передачі."]}], "f": "Волейбол як вид спорту входить до програми Олімпійських ігор із 1964 року.", "pr": ["Запиши 5 основних правил волейболу.", "Перед дзеркалом прийми стійку волейболіста і виконай 3 серії по 10 приставних кроків уліво-вправо в безпечному місці."], "q": ["Скільки разів команда може торкнутися м'яча на своїй половині?", "Що таке перехід у волейболі?", "Як вибрати місце для передачі зверху?", "Чому важливо стежити за м'ячем від самого початку його польоту?"]}, {"n": "7", "t": "Легка атлетика: біг 60 м, естафета 4×30 м, передача палички, оцінка стрибка з місця", "g": "Учень розумітиме техніку бігу на 60 м і передачі естафетної палички, знатиме, як оцінюють стрибок у довжину з місця.", "k": "Модулі: Дитяча легка атлетика", "terms": [["Естафетна паличка", "порожниста трубка, яку бігуни передають один одному під час естафети."], ["Зона передачі", "ділянка доріжки, у межах якої треба передати естафетну паличку."], ["Спринт", "біг на короткі дистанції з максимальною швидкістю."], ["Фініш", "завершальна частина дистанції, яку бігун пробігає з найвищою швидкістю."]], "th": [{"h": "Дитяча легка атлетика. Біг 60 м і багатоскоки", "p": ["Дистанція 60 м — класичний шкільний спринт. Вона складається зі старту, стартового розгону, бігу по дистанції та фінішу. На дистанції бігун тримає високу частоту кроків і не напружує плечі.", "Багатоскоки, як і на попередніх уроках, допомагають зробити поштовх сильнішим."], "ul": ["Тримай голову прямо, плечі розслаблені.", "Активно працюй руками.", "Не озирайся на суперників.", "Фінішуй, нахиливши груди вперед.", "Після бігу — спокійна ходьба і відновлення дихання."]}, {"h": "Дитяча легка атлетика. Естафетний біг 4×30 м і передача палички", "p": ["Естафета 4×30 м означає, що четверо учасників пробігають по 30 м. Паличку передають у зоні передачі. Бігун, що приймає, починає рухатися заздалегідь, коли товариш наближається, і відводить руку назад.", "Передають паличку знизу вгору або зверху вниз за домовленістю. Найважливіше — не впустити її та не вийти за межі зони."], "ul": ["Приймай паличку, не обертаючись повністю.", "Передавальник подає сигнал «Хоп!».", "Паличку не кидають — її вкладають у долоню.", "Якщо паличка впала, піднімає її той, хто впустив.", "Після передачі не перебігай на чужу доріжку."]}, {"h": "Дитяча легка атлетика. Метання малого м'яча та оцінювання стрибка з місця", "p": ["На уроці повторюється метання малого м'яча на дальність і виконується оцінювання стрибка в довжину з місця. Оцінюють і техніку, і довжину стрибка в сантиметрах, адже нормативи на початку навчального року ще не приймаються.", "Довжину вимірюють від лінії поштовху до найближчого сліду. Тому важливо не падати назад."], "ul": ["Перед спробами — гарна розминка ніг.", "Зазвичай виконують кілька спроб, зараховується найкраща.", "Пам'ятай: замах руками, поштовх обома ногами, м'яке приземлення.", "Запиши свій результат, щоб порівняти його з наступними.", "Головне — порівнювати себе з собою вчорашнім."]}], "f": "", "pr": ["Опиши письмово, як правильно передати естафетну паличку (3–4 речення).", "Запиши свій результат стрибка в довжину з місця і склади короткий план його покращення; виконай 3 підходи по 12 присідань і 15 підйомів на носки."], "q": ["З яких частин складається біг на 60 м?", "Як приймає паличку бігун наступного етапу?", "Від чого вимірюють довжину стрибка з місця?", "Чому оцінюють не лише сантиметри, а й техніку?"]}, {"n": "8", "t": "Баскетбол: техніка й тактика гри, стрибки, стійки, різновиди ведення м'яча", "g": "Учень розумітиме поняття техніки й тактики в баскетболі та знатиме основні різновиди ведення м'яча.", "k": "Модулі: Баскетбол", "terms": [["Техніка гри", "сукупність прийомів, якими гравець володіє м'ячем і пересувається: передачі, ведення, кидки."], ["Тактика гри", "узгоджені дії гравців, спрямовані на перемогу над суперником."], ["Ведення м'яча", "пересування гравця з м'ячем, коли він відбиває м'яч однією рукою об підлогу."], ["Подвійне ведення", "порушення, коли гравець веде м'яч двома руками одночасно або починає ведення знову після його зупинки."]], "th": [{"h": "Баскетбол. Основні поняття техніки й тактики", "p": ["Техніка — це те, як ти виконуєш рух: ведеш, передаєш, кидаєш. Тактика — це те, коли і навіщо ти це робиш: кому передати, коли атакувати, як захищатися.", "Навіть найкраща техніка не допоможе, якщо гравці не взаємодіють. Тому в баскетболі важливо бачити партнерів і домовлятися."], "ul": ["Техніка нападу: ведення, передачі, кидки.", "Техніка захисту: стійка, пересування, перехоплення.", "Тактика нападу: вихід на вільне місце, швидкий прорив.", "Тактика захисту: особистий захист, зонний захист.", "Стрибки потрібні для підбирання м'яча та кидків."]}, {"h": "Баскетбол. Стійки і стрибки", "p": ["Повторюємо стійки нападника й захисника. Стрибки в баскетболі виконують поштовхом однієї або двох ніг. Поштовх двома ногами використовують для боротьби за відскок, поштовх однією — під час кидка в русі.", "Приземляються завжди на обидві зігнуті ноги, щоб зберегти рівновагу й захистити коліна."], "ul": ["Перед стрибком — присід і замах руками.", "Приземлення м'яке, на передню частину стопи.", "Дивись, щоб під тобою не було ноги іншого гравця.", "Після приземлення одразу прийми стійку.", "Не стрибай на суперника."]}, {"h": "Баскетбол. Різновиди ведення м'яча і рухливі ігри", "p": ["М'яч ведуть пальцями, а не долонею. Розрізняють ведення з високим відскоком (для швидкого руху без суперника поруч) і з низьким відскоком (для захисту м'яча, коли суперник близько). Також ведуть на місці, в русі прямо, зі зміною напрямку.", "Рухливі ігри (наприклад, естафети з веденням) допомагають навчитися вести м'яч, не дивлячись на нього."], "ul": ["Відштовхуй м'яч кистю й пальцями.", "Голову тримай піднятою.", "Високе ведення — м'яч до рівня пояса, низьке — до коліна.", "Вільна рука захищає м'яч.", "Типова помилка: ляскання долонею по м'ячу."]}], "f": "", "pr": ["Наведи письмово по 2 приклади технічних і тактичних дій у баскетболі.", "Виконай вправу для кистей: 3 рази по 20 «пальцевих поштовхів» (відштовхуй від себе подушку або м'яку іграшку кінчиками пальців, як під час ведення)."], "q": ["Чим техніка відрізняється від тактики?", "Коли використовують високе, а коли низьке ведення?", "Яке порушення називають подвійним веденням?", "Як правильно приземлятися після стрибка?"]}, {"n": "9", "t": "Волейбол: передачі зверху в парах і від стіни, рухлива гра", "g": "Учень знатиме, як виконувати передачу зверху в парах і від стіни, та розумітиме типові помилки.", "k": "Модулі: Волейбол", "terms": [["Передача в парах", "вправа, під час якої двоє гравців передають м'яч один одному зверху або знизу."], ["Передача від стіни", "вправа, коли гравець багато разів поспіль передає м'яч у стіну й приймає його."], ["Траєкторія", "лінія, по якій летить м'яч."], ["Точність передачі", "здатність направити м'яч саме туди, де партнер може зручно його прийняти."]], "th": [{"h": "Волейбол. Передачі зверху в парах", "p": ["Партнери стоять один навпроти одного на відстані 3–4 метри. Кожен виходить під м'яч, приймає стійку, ставить кисті «ковшем» над чолом і передає м'яч дугоподібною траєкторією партнерові.", "Важливо, щоб м'яч летів не прямо, а по дузі — так партнерові зручніше його прийняти."], "ul": ["Перед передачею — крок під м'яч.", "Ноги зігнуті, рух починається з ніг.", "Пальці напружені, але не тверді.", "Розвертайся до партнера, перш ніж передати.", "Типова помилка: передача «ляском» долонями."]}, {"h": "Волейбол. Передачі від стіни", "p": ["Стіна — найтерплячіший партнер: вона повертає м'яч щоразу. Гравець стоїть на відстані 1,5–3 метри від стіни й передає м'яч у неї зверху, щоразу приймаючи його знову.", "Вправа розвиває точність і силу пальців. Спочатку можна ловити м'яч після кожної передачі, а потім виконувати передачі безперервно."], "ul": ["Цілься в одну точку на стіні вище голови.", "Тримай однакову відстань до стіни.", "Рахуй, скільки передач поспіль вдалося.", "Не стій занадто близько — не встигнеш підготуватися.", "Перевір, щоб поруч не було вікон і крихких предметів."]}, {"h": "Волейбол. Рухлива гра з елементами волейболу", "p": ["Рухливі ігри (наприклад, «Піонербол» або «Передай м'яч по колу») закріплюють навички передач у цікавій формі. Учасники вчаться стежити за м'ячем, перемовлятися й допомагати один одному.", "Під час гри важливо дотримуватися правил і чесно визнавати помилки."], "ul": ["Гравці стоять на рівній відстані один від одного.", "Кричи «Мій!», коли береш м'яч.", "Не відбирай м'яч у товариша по команді.", "Після гри подякуй суперникам.", "Гра — це насамперед задоволення від руху."]}], "f": "", "pr": ["Намалюй дугоподібну траєкторію передачі в парах і поясни, чому вона краща за пряму.", "Виконай вправи для пальців і кистей: 20 стискань м'якого м'ячика або шкарпетки кожною рукою, 10 обертів кистями."], "q": ["На якій відстані стоять партнери для передач у парах?", "Чому передача має летіти по дузі?", "Як вправа зі стіною допомагає вдосконалити передачу?", "Яка типова помилка під час передачі зверху?"]}, {"n": "10", "t": "Легка атлетика: естафета 4×30 м, стрибок у довжину з розбігу, оцінка метання", "g": "Учень розумітиме техніку стрибка в довжину з розбігу та знатиме, як оцінюють метання малого м'яча на дальність.", "k": "Модулі: Дитяча легка атлетика", "terms": [["Розбіг", "прискорений біг перед стрибком, який дає спортсменові швидкість."], ["Брусок для відштовхування", "смуга біля ями з піском, з якої виконують поштовх у стрибках у довжину."], ["Заступ", "порушення, коли спортсмен наступає за лінію або брусок відштовхування."], ["Стрибок «зігнувши ноги»", "найпростіший спосіб стрибка в довжину, коли в польоті ноги підтягуються до грудей."]], "th": [{"h": "Дитяча легка атлетика. Біг 60 м, багатоскоки й естафета 4×30 м", "p": ["Повторюємо біг на 60 м та естафету 4×30 м. Командна гра в естафеті вимагає точної передачі палички в межах зони та злагоджених дій.", "Під час багатоскоків стеж, щоб кожен стрибок був довгим і рівним."], "ul": ["Пам'ятай про свою доріжку.", "Паличку передавай у долоню партнера.", "Не зупиняйся до кінця зони передачі.", "Розминка перед бігом обов'язкова.", "Після бігу відновлюй дихання ходьбою."]}, {"h": "Дитяча легка атлетика. Техніка стрибка у довжину з розбігу", "p": ["Стрибок складається з чотирьох фаз: розбіг, відштовхування, політ і приземлення. Розбіг має бути рівномірно прискореним, а останні кроки — швидкими. Відштовхуються однією, сильнішою ногою з бруска.", "У польоті ноги підтягуються вперед, руки рухаються вперед-вниз. Приземлення — на обидві ноги в яму з піском, тіло подається вперед, щоб не впасти назад."], "ul": ["Однакова довжина розбігу допомагає влучати в брусок.", "Не дивись на брусок під час останніх кроків.", "Поштовх — угору-вперед, а не лише вперед.", "Стрибай тільки в підготовлену яму з піском.", "Не стрибай, якщо в ямі хтось є."]}, {"h": "Дитяча легка атлетика. Оцінювання метання малого м'яча на дальність", "p": ["На уроці оцінюють метання малого м'яча: і техніку, і дальність у метрах. Дальність вимірюють від лінії метання до місця падіння м'яча.", "Добрий кидок — це злагоджена робота ніг, тулуба й руки: метальник стоїть боком, робить замах, переносить вагу на передню ногу і викидає руку вперед-угору."], "ul": ["Метай тільки за сигналом учителя.", "Виконуй кілька спроб, найкраща зараховується.", "Не заступай за лінію.", "Розімни плечі й лікті.", "Запиши свій результат для порівняння."]}], "f": "", "pr": ["Опиши чотири фази стрибка в довжину з розбігу і що робить спортсмен у кожній.", "Виконай вправи для плечей: 10 обертів руками вперед і назад, 10 махів руками, повільні нахили тулуба вбік (по 8 разів)."], "q": ["Які фази має стрибок у довжину з розбігу?", "Що таке заступ?", "Як вимірюють результат метання?", "Чому розбіг має бути однаковим у кожній спробі?"]}, {"n": "11", "t": "Баскетбол: ведення м'яча правою і лівою рукою, захист м'яча, ігри з м'ячами", "g": "Учень знатиме, як вести м'яч обома руками та захищати його від суперника під час ведення.", "k": "Модулі: Баскетбол", "terms": [["Ведення зі зміною руки", "прийом, коли гравець перекидає м'яч з однієї руки в іншу під час ведення."], ["Ведення з поворотом", "зміна напрямку ведення з розворотом тулуба навколо опорної ноги."], ["Захист м'яча під час ведення", "укривання м'яча тулубом і вільною рукою від суперника."], ["Кут ведення", "положення м'яча збоку від тіла під час ведення, щоб суперникові було важче його дістати."]], "th": [{"h": "Баскетбол. Ведення м'яча правою і лівою рукою", "p": ["Хороший баскетболіст однаково впевнено веде м'яч обома руками. Тому на уроці важливо тренувати і слабшу руку.", "Під час ведення кисть «супроводжує» м'яч: коли він піднімається, рука трохи згинається, а коли опускається — штовхає його вниз."], "ul": ["Веди м'яч збоку від себе, а не перед собою.", "Дивися вперед, а не на м'яч.", "Зміна руки — низький відскок перед собою.", "Тренуй слабшу руку частіше.", "Не бий м'яч долонею."]}, {"h": "Баскетбол. Захист м'яча", "p": ["Якщо поруч суперник, гравець переходить на низьке ведення і стає боком: між м'ячем і суперником опиняються нога, тулуб і вільна рука.", "Вільною рукою не можна відштовхувати захисника — вона лише створює бар'єр."], "ul": ["Низьке ведення ближче до тіла.", "Плече до суперника.", "Вільна рука зігнута перед собою.", "Не зупиняй ведення без потреби.", "Пам'ятай: після зупинки ведення вести знову не можна."]}, {"h": "Баскетбол. Рухливі ігри з м'ячами", "p": ["Рухливі ігри, як-от «Квач з веденням» або естафети з обведенням стійок, вчать вести м'яч у русі, дивлячись навколо.", "Під час ігор важливо пам'ятати про безпеку: не штовхатися, не наступати на м'ячі та не вибивати їх грубо."], "ul": ["Тримай дистанцію з іншими гравцями.", "Веди м'яч, дивлячись уперед.", "Виконуй завдання чесно.", "Втрачений м'яч підбирай обережно.", "Допомагай товаришам по команді."]}], "f": "", "pr": ["Запиши, чому важливо вміти вести м'яч обома руками.", "Сидячи на стільці, виконай вправу для кистей: 3 рази по 20 «відштовхувань» пальцями м'якого м'ячика або подушки по черзі правою і лівою рукою."], "q": ["Чому м'яч ведуть збоку, а не перед собою?", "Як захищати м'яч, коли суперник поруч?", "Що робить вільна рука під час ведення?", "Що заборонено робити після зупинки ведення?"]}, {"n": "12", "t": "Волейбол: правила гри, стійка, пересування, вихідне положення, гра «Малюкбол»", "g": "Учень закріпить знання правил волейболу, стійки й переміщень та ознайомиться з грою «Малюкбол».", "k": "Модулі: Волейбол", "terms": [["«Малюкбол»", "спрощена гра через сітку, у якій м'яч ловлять і перекидають на бік суперника."], ["Лицьова лінія", "лінія, що обмежує майданчик у глибину; з-за неї виконують подачу."], ["Бокова лінія", "лінія, що обмежує майданчик з боків."], ["Аут", "ситуація, коли м'яч упав за межами майданчика."]], "th": [{"h": "Волейбол. Повторення правил гри", "p": ["Майданчик для волейболу прямокутний, його розмічають лицьовими та боковими лініями, а посередині натягують сітку. Якщо м'яч упав за межами ліній, це аут, і очко отримує суперник того, хто торкнувся м'яча останнім.", "Важливо знати, що лінії входять до майданчика: м'яч на лінії — це влучання."], "ul": ["Гравці не перетинають центральну лінію.", "Кожна команда має до трьох торкань.", "Подачу виконують із-за лицьової лінії.", "Гра йде до певної кількості очок.", "Суперечки вирішує суддя або вчитель."]}, {"h": "Волейбол. Стійка, пересування і вихідне положення", "p": ["Повторюємо стійку і пересування приставними кроками. Щоб вчасно вийти під м'яч, гравець оцінює його політ і робить кілька швидких кроків, а потім зупиняється в стійці.", "Під м'яч треба виходити так, щоб він опинився перед тобою, а не за спиною."], "ul": ["Перший крок — швидкий.", "Останній крок — гальмівний.", "Погляд — на м'яч.", "Ноги зігнуті перед прийомом.", "Руки готові до передачі."]}, {"h": "Волейбол. Гра «Малюкбол»", "p": ["«Малюкбол» — це гра, що готує до волейболу. Учасники двох команд перекидають м'яч через сітку, а суперники намагаються його спіймати, не давши впасти на свою половину.", "Гра вчить швидко оцінювати політ м'яча, вибирати місце й домовлятися з партнерами — усе те, що знадобиться у волейболі."], "ul": ["Ловлять м'яч двома руками.", "Кидок — через сітку, у межі майданчика.", "Якщо м'яч упав на твою половину — очко суперникам.", "Розподіліть зони відповідальності.", "Не тягни м'яч довго — кидай швидко."]}], "f": "", "pr": ["Намалюй волейбольний майданчик, підпиши лицьові й бокові лінії, сітку та зони команд.", "Виконай вправу на реакцію в безпечному місці: стоячи в стійці, за сигналом когось із рідних роби 1–2 приставні кроки в названий бік (5 разів у кожен бік)."], "q": ["Що таке аут?", "Чи вважається влучанням м'яч, що впав на лінію?", "Чим «Малюкбол» відрізняється від волейболу?", "Чому під час гри важливо розподілити зони відповідальності?"]}, {"n": "13", "t": "Легка атлетика: стрибок у висоту, стрибок у довжину з розбігу, рівномірний біг, норматив 60 м", "g": "Учень ознайомиться з технікою стрибка у висоту, знатиме правила рівномірного бігу та як виконувати норматив із бігу на 60 м.", "k": "Модулі: Дитяча легка атлетика", "terms": [["Стрибок у висоту способом «переступання»", "спосіб, за якого стрибун долає планку, по черзі переносячи через неї махову і поштовхову ногу."], ["Планка", "легка поперечина на стійках, через яку перестрибують у стрибках у висоту."], ["Рівномірний біг", "біг з однаковою швидкістю протягом усієї дистанції."], ["Темп бігу", "швидкість, з якою бігун долає дистанцію."]], "th": [{"h": "Дитяча легка атлетика. Техніка стрибка у висоту", "p": ["У шкільному курсі вивчають стрибок у висоту способом «переступання». Розбіг виконують під кутом до планки, відштовхуються ногою, дальньою від планки. Махова нога піднімається вгору над планкою, а потім поштовхова переноситься слідом.", "Приземляються на махову ногу або на мати. Стрибати можна тільки на мати, що лежать щільно."], "ul": ["Розбіг — 5–7 кроків під кутом 30–40 градусів.", "Поштовх — з ноги, дальньої від планки.", "Махову ногу піднімай прямо й енергійно.", "Не стрибай без матів.", "Не торкайся планки руками."]}, {"h": "Дитяча легка атлетика. Стрибок у довжину з розбігу і рівномірний біг", "p": ["Повторюємо фази стрибка в довжину з розбігу. Також виконуємо рівномірний біг до 1200 м для юнаків і до 1000 м для дівчат. Це біг на витривалість, тому головне — розподілити сили.", "Дихати під час рівномірного бігу треба ритмічно, носом і ротом, не затримуючи дихання."], "ul": ["Починай біг спокійно, не поспішай на першому колі.", "Тримай рівний темп.", "Розслаб плечі й руки.", "Якщо дуже важко — перейди на швидку ходьбу й повідом учителя.", "Фінішне прискорення — лише на останніх метрах."]}, {"h": "Дитяча легка атлетика. Норматив із бігу на 60 м", "p": ["На уроці виконують орієнтовний навчальний норматив — біг на 60 м. Результат фіксують у секундах.", "Щоб показати свій найкращий результат, виконай якісну розминку, зосередься на старті, біжи до кінця й не сповільнюйся перед фінішем."], "ul": ["Розминка: легкий біг, ЗРВ, спеціальні бігові вправи.", "Старт — за командою.", "Біжи до лінії фінішу та трохи далі.", "Запиши свій час.", "Порівняй результат зі своїми минулими спробами."]}], "f": "", "pr": ["Запиши, чим рівномірний біг відрізняється від спринту та як правильно розподіляти сили.", "Виконай вправу для махової ноги: стоячи біля стіни й тримаючись за неї, зроби 10 махів кожною ногою вперед."], "q": ["З якої ноги відштовхуються у стрибку в висоту способом «переступання»?", "Як правильно дихати під час рівномірного бігу?", "Що робити, якщо під час бігу стало дуже важко?", "Як підготуватися до нормативу з бігу на 60 м?"]}, {"n": "14", "t": "Баскетбол: ведення зі зміною напрямку, захист м'яча, ігри з м'ячами", "g": "Учень удосконалить знання про ведення м'яча зі зміною напрямку та швидкості і способи захисту м'яча.", "k": "Модулі: Баскетбол", "terms": [["Зміна швидкості ведення", "прийом, коли гравець різко пришвидшується або сповільнюється, щоб відірватися від захисника."], ["Ведення спиною вперед", "ведення м'яча під час руху назад, щоб віддалитися від захисника, не втрачаючи огляду."], ["Перехоплення", "дія захисника, коли він заволодіває м'ячем під час передачі суперника."], ["Вибивання м'яча", "дія захисника, коли він вибиває м'яч у гравця, що веде, не торкаючись його рук."]], "th": [{"h": "Баскетбол. Різновиди ведення м'яча", "p": ["Крім ведення прямо, гравці використовують ведення зі зміною напрямку та швидкості. Різка зміна дає змогу обійти захисника. Ведення спиною вперед допомагає відступити від тиску, щоб потім віддати передачу.", "Усі ці прийоми виконують, дивлячись на майданчик, а не на м'яч."], "ul": ["Перед зміною напрямку — низьке ведення.", "Зміну виконують швидко, щоб захисник не встиг.", "Після обходу захисника — прискорення.", "Тримай корпус між захисником і м'ячем.", "Тренуй прийоми спочатку повільно."]}, {"h": "Баскетбол. Захист м'яча і дії захисника", "p": ["Захисник може перехопити або вибити м'яч, але не має права бити по руках, штовхати й тримати суперника. Це фол — порушення правил.", "Нападник, у свою чергу, захищає м'яч тулубом і не розмахує ліктями."], "ul": ["Вибивати м'яч можна лише по м'ячу.", "Штовхання і утримання — фол.", "Нападник веде м'яч дальньою від захисника рукою.", "Не повертайся спиною надовго — втратиш огляд.", "Грай чесно і поважай суперника."]}, {"h": "Баскетбол. Рухливі ігри з м'ячами", "p": ["У рухливих іграх, як-от «Хто швидше» або «Зберегти м'яч», учні тренують ведення та захист м'яча в умовах змагання.", "Ігри навчають швидко приймати рішення й діяти разом."], "ul": ["Дотримуйся меж ігрового поля.", "Не штовхайся.", "Слідкуй за сигналами вчителя.", "Допомагай товаришам.", "Після гри збери інвентар."]}], "f": "", "pr": ["Запиши, які дії захисника дозволені, а які вважаються фолом.", "Виконай 3 підходи по 30 секунд низької баскетбольної стійки та 10 повільних кроків приставними кроками в кожен бік."], "q": ["Навіщо змінювати швидкість ведення?", "Чим відрізняється вибивання від фолу?", "Якою рукою ведуть м'яч, якщо захисник праворуч?", "Що таке перехоплення?"]}, {"n": "15", "t": "Волейбол: передачі м'яча зверху над собою на місці, естафети", "g": "Учень знатиме, як виконувати серію передач зверху над собою на місці, та застосовувати цей прийом в естафетах.", "k": "Модулі: Волейбол", "terms": [["Серія передач", "кілька передач поспіль без ловіння м'яча."], ["Контроль м'яча", "уміння утримувати м'яч у грі потрібною силою та напрямком."], ["Висота передачі", "наскільки високо підлітає м'яч після торкання пальцями."], ["Естафета з м'ячем", "командне змагання, у якому учасники виконують завдання з м'ячем по черзі."]], "th": [{"h": "Волейбол. Передачі м'яча зверху над собою на місці", "p": ["Мета вправи — виконати якомога більше передач поспіль, не сходячи з місця. Для цього м'яч має летіти точно вертикально, а висота передач бути однаковою.", "Якщо м'яч відлітає вбік, гравець має змінити положення кистей або ступнів, а не тягнутися руками."], "ul": ["Висота передачі — 1–1,5 метра над головою.", "Кисті утворюють «ківш» над чолом.", "Ноги згинаються й випрямляються з кожною передачею.", "Лікті розведені в сторони.", "Рахуй кількість передач поспіль."]}, {"h": "Волейбол. Естафети з елементами волейболу", "p": ["У естафетах учні виконують передачі над собою, пересуваючись до орієнтира, або передають м'яч один одному в колоні.", "Естафети розвивають швидкість, координацію та командний дух."], "ul": ["Виконуй завдання точно, а не лише швидко.", "Якщо м'яч упав — продовжуй з того місця.", "Не заважай іншим командам.", "Підтримуй товаришів.", "Дотримуйся черговості."]}], "f": "", "pr": ["Опиши 3 типові помилки під час передачі зверху над собою і як їх виправити.", "Виконай вправу «ківш»: 15 разів поспіль підкинь угору м'який предмет (наприклад, згорнуті шкарпетки) кінчиками пальців обох рук над чолом."], "q": ["На яку висоту має підлітати м'яч під час передачі над собою?", "Що робити, якщо м'яч відлітає вбік?", "Яка роль ніг під час передачі?", "Чого навчають естафети з м'ячем?"]}, {"n": "16", "t": "Легка атлетика: стрибок у висоту, рівномірний біг, норматив зі стрибка в довжину з розбігу", "g": "Учень удосконалить техніку стрибка у висоту, знатиме, як підготуватися до нормативу зі стрибка в довжину з розбігу.", "k": "Модулі: Дитяча легка атлетика", "terms": [["Махова нога", "нога, яку енергійно піднімають угору під час відштовхування, щоб допомогти злету."], ["Поштовхова нога", "нога, якою спортсмен відштовхується від землі під час стрибка."], ["Контрольна позначка", "мітка на доріжці, від якої спортсмен починає розбіг."], ["Спроба", "одне виконання стрибка або кидка під час змагань чи оцінювання."]], "th": [{"h": "Дитяча легка атлетика. Стрибок у висоту", "p": ["Повторюємо стрибок способом «переступання». Головне — правильно поставити поштовхову ногу і енергійно піднести махову. Стрибок має бути спрямований угору, а не вздовж планки.", "Висоту планки підвищують поступово, лише коли попередня взята впевнено."], "ul": ["Поштовх — з повної стопи з перекатом на носок.", "Руки допомагають злету, піднімаючись угору.", "Не опускай голову над планкою.", "Стрибай лише на мати.", "Чекай, поки місце приземлення звільниться."]}, {"h": "Дитяча легка атлетика. Рівномірний біг", "p": ["Продовжуємо розвивати витривалість рівномірним бігом до 1200 м (юнаки) і 1000 м (дівчата). Поступово організм звикає до навантаження, і бігти стає легше.", "Після бігу треба походити, щоб пульс поступово заспокоївся."], "ul": ["Тримай однакову швидкість.", "Дихай ритмічно.", "Не обганяй, штовхаючи інших.", "Після фінішу — ходьба 1–2 хвилини.", "Пий воду невеликими ковтками після уроку."]}, {"h": "Дитяча легка атлетика. Норматив: стрибок у довжину з розбігу", "p": ["На уроці виконують орієнтовний навчальний норматив зі стрибка в довжину з розбігу, результат фіксують у сантиметрах. Вимірюють від краю бруска до найближчого сліду в піску.", "Для гарного результату важливо підібрати свій розбіг і контрольну позначку, щоб не заступати і не «не добігати» до бруска."], "ul": ["Перед нормативом — розминка й кілька пробних розбігів.", "Не змінюй розбіг перед самою спробою.", "Відштовхуйся вгору-вперед.", "Приземляйся, подаючись уперед.", "Запиши результат і порівняй з попередніми."]}], "f": "", "pr": ["Опиши, як знайти свою контрольну позначку для розбігу.", "Виконай 10 махів кожною ногою вперед біля стіни та 3 підходи по 15 підйомів на носки."], "q": ["Яка нога називається маховою, а яка поштовховою?", "Як вимірюють результат стрибка з розбігу?", "Навіщо потрібна контрольна позначка?", "Що робити після завершення рівномірного бігу?"]}, {"n": "17", "t": "Баскетбол: пересування в нападі і захисті, передачі на місці і в русі, ловіння м'яча", "g": "Учень знатиме способи пересування в нападі й захисті та вмітиме пояснити, як виконувати передачі й ловіння м'яча в русі.", "k": "Модулі: Баскетбол", "terms": [["Ривок", "раптове швидке прискорення гравця з місця або під час руху."], ["Зупинка стрибком", "спосіб зупинки, коли гравець приземляється одночасно на обидві ноги."], ["Зупинка двома кроками", "спосіб зупинки, коли гравець гальмує послідовно першою і другою ногою."], ["Поворот на місці", "обертання навколо опорної ноги, яку не можна відривати від підлоги."]], "th": [{"h": "Баскетбол. Різновиди пересувань у нападі і захисті", "p": ["Нападник пересувається ривками, зупинками й поворотами, щоб звільнитися від опіки захисника. Захисник пересувається приставними кроками, кроками назад і швидким бігом, щоб не відстати.", "Зупинки виконують стрибком або двома кроками. Після зупинки з м'ячем опорна нога має залишатися на місці."], "ul": ["Ривок — короткі швидкі кроки.", "Зупинка — на зігнутих ногах.", "Поворот — на передній частині опорної стопи.", "Захисник не схрещує ноги.", "Погляд завжди на майданчик."]}, {"h": "Баскетбол. Передачі на місці та в русі", "p": ["Передача в русі вимагає узгодження: м'яч треба відпустити так, щоб він опинився перед партнером, який біжить. Це називають передачею на випередження.", "Під час вправ у парах і трійках гравці рухаються вздовж майданчика й передають м'яч, не роблячи зайвих кроків."], "ul": ["Передавай на рівень грудей партнера.", "Передача на випередження — трохи попереду.", "Не передавай, коли партнер не бачить.", "Кроки з м'ячем — не більше двох.", "Використовуй передачу з відскоком проти високого захисника."]}, {"h": "Баскетбол. Ловіння м'яча", "p": ["Під час ловіння в русі гравець виставляє руки назустріч м'ячу, ловить його і притягує до грудей. Потім виконує зупинку або передачу.", "Ловіння м'яча, що летить високо, виконують із витягнутими вгору руками; низько — з присіданням."], "ul": ["Пальці розслаблені й розставлені.", "Руки гасять швидкість м'яча.", "Після ловіння — одразу оцінка ситуації.", "Не ловитися «прямими пальцями».", "Тримай м'яч міцно, щоб не вибили."]}], "f": "", "pr": ["Опиши різницю між зупинкою стрибком і зупинкою двома кроками.", "Виконай вправу «повороти»: поставивши одну ногу як опорну, зроби по 8 поворотів уперед і назад на кожну ногу в безпечному місці."], "q": ["Що таке передача на випередження?", "Які два способи зупинки ти знаєш?", "Що можна і що не можна робити опорною ногою?", "Як ловлять м'яч, що летить високо?"]}, {"n": "18", "t": "Волейбол: передача зверху над собою в парах, прийом знизу від стіни й у парах", "g": "Учень знатиме техніку прийому м'яча двома руками знизу та закріпить передачу зверху над собою в парах.", "k": "Модулі: Волейбол", "terms": [["Прийом знизу", "прийом м'яча, коли гравець відбиває його передпліччями зімкнутих рук."], ["Передпліччя", "частина руки від ліктя до кисті, якою відбивають м'яч під час прийому знизу."], ["Платформа", "рівна поверхня зі зведених разом прямих рук для прийому м'яча знизу."], ["Передача з накиданням", "вправа, коли партнер підкидає м'яч, а гравець виконує передачу або прийом."]], "th": [{"h": "Волейбол. Передача двома руками зверху над собою в парах", "p": ["Гравець спочатку виконує одну-дві передачі над собою, а потім передає м'яч партнерові. Так тренується контроль м'яча й точність.", "Перед передачею партнерові треба розвернутися до нього грудьми."], "ul": ["Перша передача — над собою, низько.", "Друга — партнерові, по дузі.", "Тримай ноги зігнутими.", "Рахуй вдалі серії.", "Міняйтеся ролями."]}, {"h": "Волейбол. Прийом м'яча двома руками знизу", "p": ["Руки випрямлені й зведені разом, кисті з'єднані (одна кисть у долоні іншої, великі пальці поруч). Утворюється «платформа» з передпліч. М'яч відбивають саме передпліччями, ближче до кистей, а не кулаками.", "Рух виконують ногами: гравець присідає під м'яч і, випрямляючи ноги, підставляє руки. Руками не махають угору."], "ul": ["Руки прямі в ліктях.", "Удар — передпліччями, а не кистями.", "Ноги згинаються, тулуб нахилений.", "Не розмахуй руками, рух іде від ніг.", "Від стіни: відстань 2–3 метри, м'яч ударяє в стіну вище голови."]}, {"h": "Волейбол. Безпека під час вправ у парах", "p": ["Під час вправ у парах легко зіткнутися з іншими учнями, якщо м'яч відлетів. Тому пари стоять на достатній відстані одна від одної, а за м'ячем біжать, дивлячись довкола.", "М'яч, що відкотився до іншої пари, не забирай силоміць — дочекайся, поки його повернуть."], "ul": ["Пари — паралельно, на відстані 3–4 метри.", "Не біжи за м'ячем через чужу зону.", "Подавай м'яч, коли партнер готовий.", "Сильні удари — лише після вказівки вчителя.", "Якщо болять передпліччя — зменш силу вправ."]}], "f": "Прийом знизу — основний спосіб приймати подачу суперника, адже швидкий м'яч передпліччями контролювати легше, ніж пальцями.", "pr": ["Намалюй положення рук під час прийому знизу і підпиши, якою частиною рук відбивають м'яч.", "Виконай імітацію прийому знизу перед дзеркалом: 3 серії по 10 разів (присід, руки утворюють платформу, випрямлення ніг)."], "q": ["Якою частиною рук приймають м'яч знизу?", "Чому під час прийому не можна махати руками вгору?", "Як з'єднують кисті під час прийому знизу?", "Як уникнути зіткнень під час вправ у парах?"]}, {"n": "19", "t": "Легка атлетика: стрибок у висоту, естафети, норматив із рівномірного бігу", "g": "Учень закріпить техніку стрибка у висоту та знатиме, як правильно виконати норматив із рівномірного бігу.", "k": "Модулі: Дитяча легка атлетика", "terms": [["Витривалість", "здатність довго виконувати роботу без зниження її якості."], ["Пульс", "частота скорочень серця, яку відчувають на зап'ясті або шиї."], ["Самоконтроль", "спостереження за своїм самопочуттям і фізичним станом під час занять."], ["Кругова естафета", "естафета, під час якої учасники пробігають етапи по колу."]], "th": [{"h": "Дитяча легка атлетика. Стрибок у висоту", "p": ["Повторюємо стрибок у висоту способом «переступання»: розбіг під кутом, поштовх дальньою ногою, мах і переступання через планку, приземлення на махову ногу.", "Найчастіші помилки — поштовх занадто близько до планки та слабкий мах ногою."], "ul": ["Місце поштовху — на відстані витягнутої руки від планки.", "Махова нога — пряма.", "Тулуб тримай прямо.", "Приземлення — на мати.", "Не стрибай, якщо поруч стоять інші."]}, {"h": "Дитяча легка атлетика. Естафети з елементами легкої атлетики", "p": ["Естафети можуть включати біг, стрибки, обминання орієнтирів. Вони розвивають швидкість і спритність та вчать діяти в команді.", "Кожен учасник має точно виконати своє завдання — інакше команда отримає штраф."], "ul": ["Дотримуйся черговості.", "Оббігай орієнтир повністю.", "Передавай естафету рукою.", "Не штовхай суперників.", "Підбадьорюй команду."]}, {"h": "Дитяча легка атлетика. Норматив: рівномірний біг", "p": ["Орієнтовний норматив — рівномірний біг до 1200 м (юнаки) і 1000 м (дівчата). Результат оцінюють за кількістю пробігнутих метрів. Тобто важливо бігти без зупинок, у своєму темпі.", "Самоконтроль допоможе: до і після бігу виміряй пульс за 10 секунд і помнож на 6. Через кілька хвилин відпочинку пульс має знижуватися."], "ul": ["Не починай занадто швидко.", "Бігти краще, ніж зупинятися — але якщо погано, зупинись і повідом учителя.", "Дихай рівно.", "Після бігу — ходьба, а не сидіння.", "Запиши свою дистанцію."]}], "f": "", "pr": ["Виміряй свій пульс у спокої за 10 секунд, помнож на 6 і запиши. Потім виконай 20 присідань і виміряй знову — порівняй результати.", "Запиши в зошит 3 поради, як краще розподілити сили під час бігу на витривалість."], "q": ["Що таке витривалість?", "Як виміряти пульс?", "Як оцінюють норматив із рівномірного бігу?", "Які типові помилки у стрибку в висоту?"]}, {"n": "20", "t": "Баскетбол: ведення, захист м'яча, фінти, штрафний кидок, взаємодія, норматив з передач", "g": "Учень знатиме, що таке фінт і штрафний кидок, як взаємодіяти з партнерами, та розумітиме норматив із передач у парах.", "k": "Модулі: Баскетбол", "terms": [["Фінт", "обманний рух, яким гравець вводить суперника в оману."], ["Штрафний кидок", "кидок з лінії штрафного без перешкод з боку суперника, який дається за фол."], ["Взаємодія", "узгоджені дії двох або більше гравців команди в нападі чи захисті."], ["Заслін", "прийом, коли гравець своїм тілом перекриває захисникові шлях до партнера."]], "th": [{"h": "Баскетбол. Ведення, захист м'яча і фінти", "p": ["Фінт — це обман: гравець показує, що збирається кинути чи пройти в один бік, а сам діє інакше. Фінт має бути переконливим: рух головою, плечима, м'ячем.", "Фінти поєднують із веденням і захистом м'яча, щоб обійти захисника."], "ul": ["Фінт на кидок — підняти м'яч, наче для кидка.", "Фінт на прохід — крок убік і різка зміна напрямку.", "Не роби фінт занадто довгим.", "Після фінту — швидка дія.", "Захищай м'яч під час фінту."]}, {"h": "Баскетбол. Штрафний кидок і взаємодії з партнерами", "p": ["Штрафний кидок виконують з лінії штрафного кидка, ставши ноги на ширині плечей. М'яч тримають однією рукою знизу, другою притримують збоку. Кидок починається з випрямлення ніг, а закінчується рухом кисті — м'яч летить по дузі.", "Взаємодія — це передачі один одному, відкривання для отримання м'яча, заслони. Двоє гравців, що діють разом, сильніші за одного."], "ul": ["Перед кидком — зосередься і дихай спокійно.", "Не заступай за лінію до торкання м'ячем кільця.", "Кисть після кидка «ховається» вниз.", "Відкривайся під передачу.", "Говори з партнером."]}, {"h": "Баскетбол. Норматив: 10 передач у парах", "p": ["Норматив — 10 передач у парах на відстані 4 метрів одним із вивчених способів. Оцінюють кількість правильних передач — таких, які партнер піймав без зусиль.", "Щоб виконати норматив добре, вибери спосіб, який у тебе виходить найкраще, і виконуй передачі в одному темпі."], "ul": ["Стань в стійку.", "Передавай на рівні грудей партнера.", "Не поспішай — важлива якість.", "Ловіння — розслабленими пальцями.", "Неправильна передача — коли м'яч летить мимо або партнер ловить із труднощами."]}], "f": "", "pr": ["Опиши поетапно техніку штрафного кидка (4–5 кроків).", "Виконай імітацію штрафного кидка без м'яча 3 рази по 10: присід, випрямлення ніг, рух рукою вгору й кистю вниз."], "q": ["Що таке фінт і навіщо він потрібен?", "За що призначають штрафний кидок?", "Як виконується штрафний кидок?", "Яка передача вважається правильною під час нормативу?"]}, {"n": "21", "t": "Волейбол: передача над собою, прийом знизу, «Малюкбол». Діагностувальна робота за І чверть", "g": "Учень повторить вивчене з легкої атлетики, баскетболу й волейболу та знатиме, як виконувати норматив із передач м'яча в стіну.", "k": "Модулі: Волейбол · Дитяча легка атлетика · Баскетбол", "terms": [["Діагностувальна робота", "перевірка знань і вмінь з вивчених тем, яка показує, що вже вдається, а над чим варто попрацювати."], ["Групи результатів", "напрями оцінювання: рухова активність, здоров'я, ставлення до занять і знання."], ["Норматив", "контрольне завдання, результат якого вимірюють і порівнюють."], ["Стабільність", "здатність виконувати вправу однаково добре багато разів поспіль."]], "th": [{"h": "Волейбол. Передача над собою, прийом знизу, «Малюкбол»", "p": ["На уроці закріплюють передачу двома руками зверху над собою та прийом знизу від стіни й у парах. Норматив — передачі м'яча в стіну двома руками зверху з відстані 1,5–3 метри; оцінюють кількість правильних передач.", "Правильною вважається передача пальцями обома руками, після якої м'яч повертається, і ти знову передаєш його, не ловлячи."], "ul": ["Тримай однакову відстань до стіни.", "Цілься в одну точку.", "Працюй ногами.", "Не ловиш м'яч — продовжуй серію.", "У «Малюкболі» розподіліть зони."]}, {"h": "Дитяча легка атлетика. Баскетбол. Підсумок вивченого за чверть", "p": ["За чверть ми вивчили: у легкій атлетиці — низький старт, біг 30 і 60 м, естафету, стрибки в довжину з місця й з розбігу, стрибок у висоту, метання малого м'яча, рівномірний біг. У баскетболі — стійки, пересування, передачі, ловіння, ведення, фінти, штрафний кидок.", "Діагностувальна робота показує результати за групами: як ти рухаєшся, як дбаєш про здоров'я, як ставишся до занять і що знаєш."], "ul": ["Легка атлетика: техніка старту, стрибків, метань.", "Баскетбол: ведення обома руками, передачі, штрафний кидок.", "Волейбол: стійка, передача зверху, прийом знизу.", "Правила безпеки для кожного модуля.", "Самоконтроль: пульс, самопочуття."]}], "f": "", "pr": ["Склади таблицю: модуль — 3 найважливіші прийоми, які ти вивчив за чверть.", "Виконай вправу для пальців і кистей (20 стискань м'якого м'ячика) та імітацію передачі зверху 3 рази по 10."], "q": ["Які фази стрибка в довжину з розбігу?", "Як виконується штрафний кидок у баскетболі?", "Чим прийом знизу відрізняється від передачі зверху?", "Яка передача в стіну вважається правильною під час нормативу?"]}]}, {"name": "ІІ чверть. Доджбол, шашки, гімнастика", "lessons": [{"n": "22", "t": "Доджбол: кидки м'яча в парах і в ціль, рухлива гра «Вибивний»", "g": "Учень ознайомиться з доджболом, правилами безпеки та технікою кидків м'яча в парах і в ціль.", "k": "Модулі: Доджбол", "terms": [["Доджбол", "командна гра, у якій гравці намагаються влучити м'ячем у суперників і ухилитися від їхніх кидків."], ["Вибивання", "влучання м'ячем у гравця, після якого він залишає гру."], ["Ухилення", "швидкий рух тілом, щоб м'яч не влучив."], ["Кидок у ціль", "кидок м'яча з метою влучити в певну мішень."]], "th": [{"h": "Доджбол. Правила безпеки і суть гри", "p": ["Доджбол — це гра двох команд, які стоять на своїх половинах майданчика. Гравці кидають м'ячі, намагаючись влучити в суперників, і ухиляються від кидків. Якщо м'яч, кинутий у гравця, впіймали, вибуває той, хто кидав.", "Для гри використовують м'які м'ячі. Кидати в голову заборонено."], "ul": ["Цілься в тулуб і ноги, не в голову.", "Не перетинай центральну лінію.", "Не кидай м'яч у гравця, який уже вибув.", "Не штовхайся під час ухилення.", "Окуляри перед грою знімай або використовуй спортивні."]}, {"h": "Доджбол. Кидки в парах і в ціль", "p": ["Кидок виконують однією рукою зверху: рука відводиться назад, тулуб розвертається, вага переходить на передню ногу (протилежну до кидаючої руки). У парах учні кидають і ловлять м'яч, у ціль — намагаються влучити в мішень на стіні або обруч.", "Точність важливіша за силу: швидкий, але неточний кидок легко ловлять."], "ul": ["Дивись на ціль.", "Крок уперед протилежною ногою.", "Закінчуй кидок кистю.", "Партнер ловить м'яч на рівні грудей.", "Кидай лише за сигналом."]}, {"h": "Доджбол. Рухлива гра «Вибивний»", "p": ["У грі «Вибивний» двоє гравців стоять з обох боків майданчика і кидають м'яч, намагаючись влучити в гравців посередині. Ті ухиляються, а хто ловить м'яч — отримує додаткове «життя» або повертає вибуту людину (за домовленістю).", "Гра розвиває спритність, реакцію та точність."], "ul": ["Кидай нижче пояса.", "Ухиляйся, а не відвертайся спиною.", "Вибулий гравець спокійно виходить за межі поля.", "Дотримуйся правил, про які домовились.", "Не кидай м'яч з близької відстані сильно."]}], "f": "", "pr": ["Запиши 5 правил безпеки під час гри в доджбол.", "Виконай імітацію кидка однією рукою без м'яча: 2 рази по 10 кожною рукою, стежачи за кроком протилежною ногою."], "q": ["Яка мета гри в доджбол?", "Куди заборонено кидати м'яч?", "Що відбувається, якщо гравець піймав кинутий у нього м'яч?", "Чому під час кидка крок роблять протилежною ногою?"]}, {"n": "23", "t": "Шашки: знайомство з грою, вправи для розвитку фізичних якостей і відновлення емоційного стану", "g": "Учень ознайомиться з шашками як інтелектуальним видом спорту і знатиме вправи для розвитку фізичних якостей та відновлення емоційного стану.", "k": "Модулі: Шашки", "terms": [["Шашкова дошка", "квадратне поле з темними і світлими клітинками, на якому грають у шашки."], ["Ігрові поля", "темні клітинки дошки, по яких рухаються шашки."], ["Інтелектуальний вид спорту", "вид спорту, де основне змагання відбувається в мисленні, логіці й розрахунку."], ["Релаксація", "розслаблення м'язів і заспокоєння, яке допомагає відновити емоційний стан."]], "th": [{"h": "Шашки. Знайомство з грою", "p": ["Шашки — інтелектуальна гра для двох, яку визнано видом спорту. У найпоширенішому варіанті дошка має 64 клітинки (8×8), а кожен гравець має 12 шашок одного кольору. Шашки ставлять на темні поля трьох рядів біля себе.", "Мета гри — забрати всі шашки суперника або позбавити його можливості ходити."], "ul": ["Дошку кладуть так, щоб ліворуч від гравця внизу було темне поле.", "Першими ходять білі.", "Шашки рухаються лише по темних полях.", "Гравці ходять по черзі.", "Шашки розвивають увагу, пам'ять і логіку."]}, {"h": "Шашки. Спеціальні вправи для фізичних якостей і відновлення емоційного стану", "p": ["Навіть інтелектуальний спорт вимагає витривалості: партія може тривати довго, тож шашкістам потрібна правильна постава й уміння розслаблятися. Між партіями виконують вправи для шиї, плечей і спини.", "Для відновлення емоційного стану підходять дихальні вправи: повільний вдих носом на 4 рахунки, затримка на 2, видих ротом на 4–6 рахунків."], "ul": ["Вправи на поставу: зведення лопаток, потягування вгору.", "Оберти плечима вперед і назад.", "Повільні нахили голови.", "Дихальна вправа «квадрат».", "Розслаблення м'язів обличчя й рук."]}], "f": "Існує багато різновидів шашок, і в деяких країнах грають на дошці 10×10 зі 100 клітинок.", "pr": ["Намалюй шашкову дошку 8×8 і розстав на ній початкову позицію (по 12 шашок кожного кольору).", "Виконай комплекс з 5 вправ для постави та дихання (зведення лопаток, оберти плечима, нахили голови, потягування, дихання «квадрат») і запиши свої відчуття."], "q": ["Скільки шашок має кожен гравець у шашках-64?", "По яких полях рухаються шашки?", "Хто ходить першим?", "Які вправи допомагають заспокоїтися перед партією?"]}, {"n": "24", "t": "Гімнастика: ранкова гімнастика, самоконтроль, лазіння по канату, опорний стрибок", "g": "Учень знатиме, як скласти комплекс ранкової гімнастики, вести самоконтроль і ознайомиться з технікою лазіння по канату та опорного стрибка.", "k": "Модулі: Гімнастика", "terms": [["Ранкова гімнастика", "комплекс легких вправ після сну, який допомагає прокинутися й підготувати організм до дня."], ["Канат", "товста мотузка, підвішена до стелі, по якій лазять у спортзалі."], ["Опорний стрибок", "стрибок через гімнастичний снаряд з опорою руками."], ["Гімнастичний козел", "снаряд для опорних стрибків з м'яким верхом і чотирма ніжками."], ["Страхування", "допомога вчителя або партнера, яка запобігає падінню й травмі."]], "th": [{"h": "Гімнастика. Ранкова гімнастика і самоконтроль", "p": ["Ранкова гімнастика триває 10–15 хвилин і складається з 6–10 вправ: від шиї до ніг. Вправи виконують у спокійному темпі, із провітреним приміщенням.", "Самоконтроль — це повага до свого здоров'я: стеж за самопочуттям, пульсом, сном і настроєм. Якщо після вправ з'являється біль чи запаморочення — зупинись."], "ul": ["Починай з потягувань і ходьби.", "Далі вправи для шиї, рук, тулуба, ніг.", "Закінчуй дихальною вправою.", "Не їж щільно перед гімнастикою.", "Веди щоденник самоконтролю."]}, {"h": "Гімнастика. Техніка лазіння по канату й опорного стрибка", "p": ["Лазіння по канату виконують у три прийоми: перехопитися руками вгору, підтягнути ноги й затиснути канат стопами, випрямити ноги. Спускаються так само, перехоплюючи руками. Зісковзувати не можна — можна обпекти долоні.", "Опорний стрибок через козла складається з розбігу, поштовху з містка, опори руками на снаряд, польоту й приземлення на зігнуті ноги. Його виконують лише з допомогою й страхуванням учителя."], "ul": ["Під канатом обов'язково лежать мати.", "Не лізь вище встановленої вчителем позначки.", "Спускайся, перехоплюючи руками.", "Опорний стрибок — лише за командою і зі страхуванням.", "Приземлення — м'яке, руки вперед для рівноваги."]}], "f": "", "pr": ["Склади і запиши свій комплекс ранкової гімнастики з 8 вправ.", "Виконуй цей комплекс 3 ранки поспіль і записуй самопочуття до і після."], "q": ["Скільки триває ранкова гімнастика і з чого вона складається?", "Що таке самоконтроль?", "З яких трьох прийомів складається лазіння по канату?", "Чому не можна зісковзувати з канату?"]}, {"n": "25", "t": "Доджбол: імітаційні вправи, стійка доджболіста, різновиди кидків, гра «Мисливець і звірі»", "g": "Учень знатиме стійку доджболіста, основні різновиди кидків і розумітиме значення імітаційних вправ.", "k": "Модулі: Доджбол", "terms": [["Імітаційні вправи", "вправи, що повторюють рух без м'яча, щоб засвоїти правильну техніку."], ["Стійка доджболіста", "положення з напівзігнутими ногами і вагою на передній частині стоп, готовність ухилитися або піймати м'яч."], ["Кидок збоку", "кидок однією рукою, коли рука рухається горизонтально на рівні пояса."], ["Кидок знизу", "кидок, коли рука рухається знизу вперед, як під час подачі м'яча в боулінгу."]], "th": [{"h": "Доджбол. Імітаційні вправи і стійка", "p": ["Імітаційні вправи допомагають засвоїти рух без ризику: учень повторює кидок, ухилення, присідання без
