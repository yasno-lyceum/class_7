"Рухливі ігри. Ігри з м'ячем та їхня користь", "p": ["Ігри з м'ячем — найпопулярніші серед рухливих ігор. Вони розвивають координацію (руки й очі працюють разом), точність, швидкість реакції. Більшість спортивних ігор — баскетбол, волейбол, футбол — почалися саме з простих ігор з м'ячем.", "Прикладами є «М'яч капітану», «Квадрат», «Гарячий м'яч», «Перестрілка», «Передав — сідай». Кожна з них тренує щось своє: одна — передачі, інша — ловіння чи перехоплення."], "ul": ["«М'яч капітану»: команда передає м'яч, щоб він потрапив до капітана в окремій зоні.", "«Квадрат»: гравці передають м'яч у колі, а водій у центрі намагається його перехопити.", "«Гарячий м'яч»: м'яч треба передати якомога швидше, ніби він «пече».", "«Передав — сідай»: естафета, у якій капітан передає м'яч кожному гравцю колони.", "Усі ці ігри вчать бачити партнера й домовлятися."]}, {"h": "Рухливі ігри. Правила безпеки в іграх з м'ячем", "p": ["Навіть у грі з м'яким м'ячем можна травмуватися, якщо не дотримуватися правил. Найчастіше травмуються пальці — коли м'яч ловлять прямими напруженими руками, — або хтось падає, зіткнувшись з іншим гравцем.", "Тому спочатку вчитель пояснює правила, позначає межі майданчика, і лише за сигналом починається гра."], "ul": ["Ловлячи м'яч, тримай пальці розслабленими й трохи зігнутими.", "Передавай м'яч тоді, коли партнер дивиться на тебе.", "Не кидай м'яч у голову іншим гравцям.", "Біжучи за м'ячем, дивись довкола, щоб не зіткнутися.", "М'ячі, якими не граєте, мають лежати в кошику, а не під ногами."]}], "f": "", "pr": ["Виконай вправу на координацію: підкидай м'ячик (або згорнуту шкарпетку) правою рукою і лови лівою, потім навпаки — 3 серії по 20 разів.", "Опиши правила однієї гри з м'ячем, у яку можна грати з друзями на вулиці, і зазнач, які якості вона розвиває."], "q": ["Які фізичні якості розвивають ігри з м'ячем?", "Як грають у «Квадрат»?", "Як правильно ловити м'яч, щоб не травмувати пальці?", "Чому передавати м'яч треба тоді, коли партнер на тебе дивиться?"]}, {"n": "60", "t": "Доджбол: правила і навчальна гра", "g": "Вивчити основні правила доджболу та навчитися грати в нього за правилами чесної гри.", "k": "Модулі: Доджбол", "terms": [["Вибування", "вихід гравця з гри після того, як у нього влучили м'ячем або як упіймали кинутий ним м'яч."], ["Повернення гравця", "правило, за яким вибулий гравець може знову вийти на майданчик, коли його команда впіймала м'яч."], ["Суддя", "людина, яка стежить за дотриманням правил і приймає рішення в спірних ситуаціях."], ["Командна тактика", "план спільних дій гравців команди, щоб перемогти суперника."]], "th": [{"h": "Доджбол. Основні правила гри", "p": ["Майданчик ділиться навпіл центральною лінією. На початку м'ячі лежать на лінії, і за сигналом гравці обох команд біжать по них. Потім команди кидають м'ячі одна в одну. Мета — вибити всіх гравців суперника.", "Гравець вибуває, якщо в нього влучили м'ячем, який не відскочив від підлоги чи стіни, якщо він заступив за межі своєї половини або якщо суперник упіймав його кидок. Правила на уроці можуть дещо відрізнятися — їх оголошує вчитель."], "ul": ["Влучання — лише у тулуб, руки та ноги; кидки в голову заборонені.", "М'яч, що спершу торкнувся підлоги, не вибиває гравця.", "Упіймав м'яч — вибуває той, хто кидав, а в команду може повернутися вибулий гравець.", "Заступив за центральну лінію — вибуваєш.", "Вибулі гравці чекають у спеціальній зоні."]}, {"h": "Доджбол. Навчальна гра і тактика", "p": ["Під час гри команда діє разом. Добре, коли кілька гравців кидають одночасно в одного суперника — йому важче ухилитися. Хтось у команді краще ловить — він стоїть попереду й «забирає» кидки суперника.", "Навчальна гра — це не лише азарт, а й чесність. Гравець, у якого влучили, сам піднімає руку і виходить, навіть якщо суддя не помітив."], "ul": ["Цілься в ноги — від низьких кидків важче ухилитися.", "Не кидай усі м'ячі одразу — залиш один для захисту.", "Підказуй партнерам, звідки летить м'яч.", "Визнавай влучання чесно — це правило фейр-плей.", "Суперечки вирішує суддя, а не гравці."]}], "f": "", "pr": ["Запиши в зошит 5 правил доджболу, коротко пояснивши кожне.", "Виконай вправу на ухилення: стоячи в стійці доджболіста, 10 разів зроби випад вправо і 10 вліво, повертаючись у стійку. Повтори 2 серії."], "q": ["У яких випадках гравець вибуває з гри?", "Як вибулий гравець може повернутися на майданчик?", "Чи вибиває гравця м'яч, який відскочив від підлоги?", "Що означає чесна гра в доджболі?"]}, {"n": "61", "t": "Футзал: удари ногою й головою, навчальна гра; норматив — удар носком у стінку", "g": "Удосконалити удари по м'ячу і дізнатися, як правильно виконувати норматив «удар носком у стінку з 5 спроб».", "k": "Модулі: Футзал", "terms": [["Опорна нога", "нога, на яку гравець спирається під час удару по м'ячу."], ["Влучність удару", "здатність спрямувати м'яч саме в задану ціль."], ["Супровід удару", "продовження руху ударної ноги після контакту з м'ячем у бік цілі."], ["Спроба", "одне виконання вправи під час тестування, яке зараховується або не зараховується."]], "th": [{"h": "Футзал. Удари по м'ячу ногою та головою", "p": ["Правильний удар починається з опорної ноги: вона стоїть поруч із м'ячем, а носок вказує напрямок. Ударна нога робить замах, б'є по центру м'яча і продовжує рух — це супровід удару. Якщо опорна нога позаду м'яча, удар виходить вгору.", "Удар головою тренують лише легким м'ячем: м'яч підкидає партнер, гравець злегка відхиляє тулуб назад і рухом уперед б'є серединою лоба."], "ul": ["Удар носком: короткий замах, стопа жорстка, удар у центр м'яча.", "Не відкидайся назад під час удару — м'яч полетить угору.", "Після удару ударна нога продовжує рух у напрямку цілі.", "Під час удару головою очі розплющені, шия напружена.", "Не бий головою важким м'ячем — це небезпечно."]}, {"h": "Футзал. Норматив: удар носком з 5 спроб у стінку", "p": ["Учень виконує 5 ударів носком по нерухомому м'ячу в стінку або в позначену на стіні ціль з відстані, яку визначає вчитель. Рахується кількість правильних ударів — тих, де м'яч влучив у ціль, а техніка була правильною.", "Як підготуватися: розімнися, особливо гомілковостопний і колінний суглоби, зроби кілька пробних ударів. Не поспішай: кожен удар виконуй зосереджено. Оцінити себе можна, порівнявши результат із попереднім тренуванням."], "ul": ["Постав м'яч і відійди на 2–3 кроки для розбігу.", "Опорну ногу став поруч із м'ячем.", "Удар наноси кінчиком взуття точно в центр м'яча.", "Дивись на м'яч у момент удару.", "Після кожної спроби повертайся у вихідне положення спокійно."]}, {"h": "Футзал. Навчальна гра", "p": ["Наприкінці уроку — навчальна гра, у якій треба застосовувати удари з різних позицій. Корисно вирішувати, коли бити носком (швидко, з близької відстані), а коли віддати точну передачу внутрішньою стороною стопи.", "Пам'ятай про безпеку: не бий по м'ячу, коли біля нього нога суперника, та не грай у підкаті."], "ul": ["Бий по воротах, коли є вільний коридор.", "Якщо партнер у кращій позиції — передай йому м'яч.", "Після втрати м'яча одразу повертайся в захист.", "Підтримуй партнерів словом, а не критикою."]}], "f": "", "pr": ["Виконай імітацію удару носком без м'яча: 15 махів кожною ногою, стоячи біля стіни й тримаючись рукою для рівноваги, стеж за правильним положенням опорної ноги.", "Намалюй або опиши три фази удару по м'ячу: замах, удар, супровід. Біля кожної фази напиши одну типову помилку."], "q": ["Де має стояти опорна нога під час удару?", "Що таке супровід удару?", "Як рахують результат у нормативі «удар носком у стінку»?", "Чому м'яч летить угору, якщо відкинутися назад під час удару?"]}, {"n": "62", "t": "Рухливі ігри для активного відпочинку", "g": "Зрозуміти, що таке активний відпочинок і як рухливі ігри допомагають відновлювати сили та покращувати настрій.", "k": "Модулі: Рухливі ігри", "terms": [["Активний відпочинок", "відновлення сил не в спокої, а через легку рухову діяльність, відмінну від основної роботи."], ["Інтенсивність", "ступінь напруження під час вправи: як швидко і з якою силою вона виконується."], ["Відновлення", "повернення організму до нормального стану після навантаження."], ["Втома", "тимчасове зниження працездатності після тривалого або напруженого навантаження."]], "th": [{"h": "Рухливі ігри. Що таке активний відпочинок", "p": ["Коли ти довго сидиш за уроками чи комп'ютером, втомлюються очі, спина й голова. Лежати на дивані — не завжди найкращий відпочинок. Значно швидше сили відновлюються, якщо зайнятися легкою руханкою: погуляти, пограти в спокійну гру, потанцювати. Це і є активний відпочинок.", "Для дистанційного навчання це особливо важливо: між онлайн-уроками корисно робити рухові паузи по кілька хвилин."], "ul": ["Активний відпочинок — це зміна виду діяльності: після розумової праці — рухова.", "Навантаження має бути помірним: дихання прискорене, але можна говорити.", "Найкраще — на свіжому повітрі.", "Короткі рухові паузи між уроками знімають напруження зі спини та очей.", "Активний відпочинок покращує настрій і сон."]}, {"h": "Рухливі ігри. Ігри для активного відпочинку", "p": ["Для активного відпочинку обирають ігри невисокої інтенсивності, у яких можуть узяти участь усі: «Море хвилюється», «Заборонений рух», «Їстівне — неїстівне», ігри з м'ячем у колі, прості естафети. Такі ігри підходять для перерви, свята, сімейного відпочинку.", "Важливо, щоб гра була веселою, а не виснажливою: якщо гравці дуже захекалися — зробіть паузу або оберіть спокійнішу гру."], "ul": ["«Море хвилюється»: на слово «завмри» гравці застигають у позі морської фігури.", "«Заборонений рух»: усі повторюють рухи ведучого, крім одного забороненого.", "Ігри з м'ячем у колі: передачі з називанням імен.", "Гра має бути зрозумілою для всіх учасників.", "Після гри — кілька вправ на розтягування й дихання."]}], "f": "", "pr": ["Склади план 5-хвилинної рухової паузи для перерви між онлайн-уроками: 5 вправ (наприклад, нахили голови, кругові рухи плечима, повороти тулуба, присідання, потягування) і виконуй його щодня протягом тижня.", "Пограй з родиною в одну гру для активного відпочинку і запиши, що в ній сподобалося найбільше."], "q": ["Що таке активний відпочинок?", "Чому під час дистанційного навчання корисні рухові паузи?", "Які ігри підходять для активного відпочинку?", "Як зрозуміти, що навантаження в грі помірне?"]}, {"n": "63", "t": "Доджбол: імітаційні вправи, розміщення гравців, кидки в ціль зверху і знизу", "g": "Удосконалити кидки в ціль зверху і знизу та закріпити розміщення гравців на майданчику під час гри.", "k": "Модулі: Доджбол", "terms": [["Кидок зверху", "кидок однією рукою, коли м'яч виносять за голову і випускають вище плеча; він найсильніший і найшвидший."], ["Кидок знизу", "кидок, під час якого рука рухається знизу вперед, а м'яч випускається на рівні стегна; він точніший на близьку відстань."], ["Траєкторія", "лінія, по якій летить м'яч після кидка."], ["Ціль", "предмет або місце, у яке гравець намагається влучити м'ячем."]], "th": [{"h": "Доджбол. Кидки в ціль зверху та знизу", "p": ["Кидок зверху виконують так: м'яч у кидковій руці, рука відводиться назад, лікоть піднятий не нижче рівня плеча. Потім робиться крок протилежною ногою, тулуб розвертається, і рука різко викидає м'яч уперед. Завершує кидок рух кисті.", "Кидок знизу — рука опускається вниз і відводиться назад, потім махом уперед м'яч випускається на рівні стегна. Траєкторія при цьому низька — такий кидок складно впіймати, бо він летить до ніг."], "ul": ["Перед кидком подивись на ціль і виміряй відстань оком.", "Кидок зверху — для далекої або швидкої атаки.", "Кидок знизу — для близької цілі та влучання в ноги.", "Помилка — кидати лише рукою, без кроку й повороту тулуба.", "Кидай з обох рук, щоб бути непередбачуваним."]}, {"h": "Доджбол. Імітаційні вправи, розміщення гравців і гра", "p": ["Імітаційні вправи допомагають відпрацювати кожну фазу кидка без м'яча: замах, крок, поворот, випуск. Потім ту саму послідовність повторюють з м'ячем — спершу в нерухому ціль, потім у рухому.", "У грі команда розподіляється по майданчику: передні гравці атакують кидками, задні ловлять м'ячі й передають їх уперед. Добре розміщена команда втрачає менше гравців."], "ul": ["Не стій на одній лінії з партнером.", "Задні гравці збирають м'ячі, що залетіли за лінію.", "Перед атакою домовтеся з партнером, у кого цілитеся.", "Влучати можна лише нижче плечей.", "Слухай свисток і виконуй команди судді."]}], "f": "", "pr": ["Наклей на стіну або постав на підлогу ціль (аркуш паперу, коробку) і кидай у неї м'якою іграшкою чи шкарпеткою з відстані 3 кроків: 10 кидків зверху і 10 кидків знизу. Запиши кількість влучень.", "Порівняй письмово кидки зверху і знизу: яка в них траєкторія, сила, коли який краще використовувати."], "q": ["Яке положення ліктя під час кидка зверху?", "Чому кидок знизу складно впіймати?", "Яка типова помилка під час кидка?", "Як розміщення гравців допомагає команді?"]}, {"n": "64", "t": "Футзал: навчальна гра; норматив — удар внутрішньою стороною стопи в стінку", "g": "Навчитися грати за спрощеними правилами та правильно виконувати норматив з удару внутрішньою стороною стопи.", "k": "Модулі: Футзал", "terms": [["Пас", "передача м'яча партнерові по команді."], ["Накопичені фоли", "порушення команди, які рахуються протягом тайму; після певної кількості таких фолів суперник отримує штрафний удар без стінки."], ["Стінка", "кілька гравців, які стають в ряд між м'ячем і воротами під час штрафного удару, щоб закрити ворота."], ["Короткий пас", "передача на невелику відстань, найчастіше внутрішньою стороною стопи."]], "th": [{"h": "Футзал. Норматив: удар внутрішньою стороною стопи в стінку з 6 спроб", "p": ["Учень виконує 6 ударів внутрішньою стороною стопи в стінку або в позначену ціль. Зараховуються удари, після яких м'яч влучив у ціль, і техніка була правильною. Відстань і розмір цілі визначає вчитель.", "Готуючись, згадай техніку: опорна нога поруч із м'ячем, носок ударної ноги розвернутий назовні, стопа напружена, удар — серединою внутрішньої частини стопи в центр м'яча. Порівнюй свій результат із попередньою спробою — так видно прогрес."], "ul": ["Перед ударом подивись на ціль, потім на м'яч.", "Удар — без сильного замаху, головне точність.", "Ударна нога після удару рухається в бік цілі.", "Не бий пальцями — м'яч полетить убік.", "Тренуй обидві ноги, навіть якщо норматив виконується однією."]}, {"h": "Футзал. Навчальна гра за спрощеними правилами", "p": ["У грі найчастіше використовують короткі паси внутрішньою стороною стопи. Команда, яка добре пасує, довше володіє м'ячем і створює більше моментів.", "У справжньому футзалі рахуються накопичені фоли команди — після певної їх кількості суперник отримує штрафний удар без стінки. На уроці це правило може бути спрощене, але гра без грубощів — обов'язкова умова."], "ul": ["Пасуй партнеру, який відкрився.", "Не тримай м'яч довго — шукай передачу.", "Під час штрафного удару стінка стоїть на визначеній відстані від м'яча.", "Захищайся всією командою.", "Після гри подякуй суперникам — це повага."]}], "f": "", "pr": ["Запиши в зошит послідовність виконання удару внутрішньою стороною стопи в 5 кроків і познач типову помилку для кожного кроку.", "Виконай вправу на гнучкість ніг: сидячи на підлозі, з'єднай стопи («метелик»), м'яко натискай руками на коліна 20 разів, потім потягнися вперед і утримуй 15 секунд."], "q": ["Скільки спроб дається в нормативі з удару внутрішньою стороною стопи?", "Які удари зараховуються як правильні?", "Що таке стінка у футзалі?", "Чому командам вигідно грати короткими пасами?"]}, {"n": "65", "t": "Рухливі ігри: естафети з м'ячами", "g": "Дізнатися правила проведення естафет з м'ячами і навчитися діяти швидко, точно та злагоджено в команді.", "k": "Модулі: Рухливі ігри", "terms": [["Естафета", "командне змагання, у якому учасники по черзі виконують завдання, передаючи естафету наступному."], ["Етап", "частина естафети, яку виконує один учасник."], ["Лінія старту", "позначка, від якої учасники починають свій етап."], ["Фальстарт", "початок руху раніше за сигнал або раніше, ніж попередній учасник передав естафету."]], "th": [{"h": "Рухливі ігри. Як проводять естафети", "p": ["В естафеті кожна команда стоїть у колоні. Перший учасник виконує завдання — пробігає з м'ячем до орієнтира і назад, — передає м'яч наступному, і той починає свій етап. Перемагає команда, яка першою завершила естафету без порушень.", "В естафеті важливий кожен учасник: навіть найшвидший гравець не допоможе, якщо інші порушать правила."], "ul": ["Наступний учасник стартує лише після отримання м'яча — інакше фальстарт.", "Обігай орієнтир, не збиваючи його.", "Повертаючись, тримай м'яч, а не кидай його в колону.", "Після свого етапу стань у кінець колони.", "За кожне порушення команді додають штрафний час або очко."]}, {"h": "Рухливі ігри. Естафети з м'ячами та безпека", "p": ["Естафети з м'ячами бувають дуже різні: ведення м'яча рукою або ногою, передача над головою чи між ногами в колоні, біг із м'ячем між колінами, кидок у ціль на етапі. Вони розвивають швидкість, спритність і точність.", "Під час естафет швидкість висока, а гравців багато, тому зіткнення можливі. Кожна команда має свою доріжку, і заходити на чужу не можна."], "ul": ["Тримайся своєї доріжки.", "Колона стоїть за лінією старту, а не на ній.", "Передавай м'яч у руки, а не кидай.", "Якщо м'яч випав — підніми його і продовжуй з того місця.", "Підтримуй свою команду вигуками, а не критикою."]}], "f": "", "pr": ["Вигадай естафету з м'ячем на 3 етапи, яку можна провести на шкільному подвір'ї, і запиши її правила та заходи безпеки.", "Виконай вдома вправу з м'ячем: передавай м'яч (або подушку) навколо тулуба 10 разів у кожен бік, потім навколо ніг по 10 разів."], "q": ["Що таке етап естафети?", "Що таке фальстарт в естафеті?", "Чому учасник має триматися своєї доріжки?", "Які якості розвивають естафети з м'ячами?"]}, {"n": "66", "t": "Доджбол: навчальна гра, атака і захист", "g": "Навчитися поєднувати атакувальні та захисні дії в доджболі та грати злагоджено командою.", "k": "Модулі: Доджбол", "terms": [["Атака", "дії команди, спрямовані на те, щоб вибити гравців суперника кидками м'яча."], ["Захист", "дії гравців, щоб не бути вибитими: ухилення, ловіння, відбивання м'яча."], ["Ухилення", "швидкий рух тіла вбік, вниз або поворот, щоб м'яч пролетів повз."], ["Одночасна атака", "прийом, коли кілька гравців кидають м'ячі в одного суперника одночасно."]], "th": [{"h": "Доджбол. Атака: як влучати", "p": ["Влучний кидок — це не лише сила, а й правильний вибір моменту. Найкраще цілитися в гравця, який щойно ухилився і ще не встиг повернутися в стійку, або який дивиться в інший бік (але не відвернувся, щоб іти з майданчика).", "Одночасна атака кількох гравців дуже ефективна: від двох м'ячів ухилитися значно важче, ніж від одного."], "ul": ["Цілься в ноги та в стегна — від таких кидків важко ухилитися.", "Домовтеся з партнерами про спільну атаку по сигналу.", "Не підходь до центральної лінії надто близько.", "Кидай з різних рук і з різних позицій.", "Кидки в голову заборонені."]}, {"h": "Доджбол. Захист: ухилення, ловіння і гра", "p": ["Захищаючись, гравець завжди стежить за суперниками з м'ячем. Найпростіше ухилитися — кроком убік або присіданням. Найкраще — впіймати м'яч: тоді вибуває той, хто кидав, а твоя команда отримує м'яч.", "Під час навчальної гри важливо підказувати одне одному і чесно визнавати влучання. Гра залишається приємною, лише коли всі дотримуються правил."], "ul": ["Тримай стійку: коліна зігнуті, вага на передній частині стоп.", "Ловлячи м'яч, підтягуй його до грудей.", "Не намагайся ловити дуже сильний кидок у ноги — краще ухилитися.", "Слідкуй одночасно за кількома суперниками з м'ячами.", "Вибулий гравець спокійно виходить з майданчика."]}], "f": "", "pr": ["Опиши в зошиті одну тактичну комбінацію для своєї команди в доджболі (наприклад, одночасна атака) і намалюй її схему.", "Виконай вправу на швидкість ніг: 30 секунд стоячи в стійці доджболіста швидко переступай з ноги на ногу, потім 30 секунд відпочинку; повтори 4 рази."], "q": ["У який момент найкраще кидати м'яч у суперника?", "Чому одночасна атака ефективна?", "Що вигідніше в захисті — ухилитися чи впіймати м'яч? Чому?", "Як гравці можуть допомагати одне одному в захисті?"]}, {"n": "67", "t": "Футзал: пересування, удари, навчальна гра; норматив — зупинка м'яча підошвою після удару об стінку", "g": "Удосконалити прийом і зупинку м'яча та навчитися правильно виконувати норматив із зупинки м'яча підошвою.", "k": "Модулі: Футзал", "terms": [["Відскок", "рух м'яча у зворотному напрямку після удару об стінку, підлогу чи іншу поверхню."], ["Амортизація", "м'яке «гасіння» швидкості м'яча рухом ноги назад у момент дотику."], ["Обробка м'яча", "прийом і підготовка м'яча до наступної дії: передачі, ведення або удару."], ["Правильна зупинка", "зупинка, після якої м'яч залишився біля ноги гравця і не відскочив."]], "th": [{"h": "Футзал. Норматив: зупинка м'яча підошвою після удару об стінку з 7 спроб", "p": ["Учень б'є м'ячем об стінку і, коли той повертається, зупиняє його підошвою. Виконується 7 спроб, рахується кількість правильних зупинок — коли м'яч залишився біля ноги. Відстань до стінки визначає вчитель.", "Секрет успіху — не бити по м'ячу надто сильно і вчасно підставити ногу. Підошва ставиться на верх м'яча, носок трохи вище п'яти. Оцінити себе можна, порівнявши кількість правильних зупинок з попередніми тренуваннями."], "ul": ["Удар об стінку — помірної сили, внутрішньою стороною стопи.", "Стеж за м'ячем від стінки до ноги.", "Ногу підводь назустріч м'ячу, а не тупай по ньому.", "Опорна нога злегка зігнута — так легше тримати рівновагу.", "Не наступай на м'яч усією вагою — можна послизнутися."]}, {"h": "Футзал. Пересування, удари і навчальна гра", "p": ["На уроці продовжують тренувати пересування без м'яча і з м'ячем, удари ногою і головою. У навчальній грі головне — пов'язати зупинку з наступною дією: прийняв, підняв голову, віддав пас.", "Гравець, який швидко обробляє м'яч, отримує більше часу на рішення, а суперникові важче відібрати м'яч."], "ul": ["Перед прийомом озирнися і знай, кому віддаси пас.", "Зупиняй м'яч ногою, дальшою від суперника.", "Удар головою — лише легким м'ячем і серединою лоба.", "Після передачі одразу відкривайся для наступного пасу.", "Без підкатів і штовхань — безпека понад усе."]}], "f": "", "pr": ["Покатай м'яч (або м'ячик) підошвою по колу навколо себе: 2 кола правою, 2 кола лівою ногою, 3 серії. Слідкуй за рівновагою.", "Запиши, чим відрізняється правильна зупинка м'яча від неправильної, і назви 3 типові помилки під час зупинки."], "q": ["Скільки спроб дається в нормативі із зупинки м'яча підошвою?", "Що таке амортизація під час прийому м'яча?", "Чому не варто наступати на м'яч усією вагою?", "Чому корисно озиратися перед прийомом м'яча?"]}, {"n": "68", "t": "Рухливі ігри з перенесенням предметів", "g": "Дізнатися, як ігри з перенесенням предметів розвивають координацію, рівновагу та вміння діяти в команді.", "k": "Модулі: Рухливі ігри", "terms": [["Рівновага", "здатність зберігати стійке положення тіла під час руху або в нерухомій позі."], ["Перенесення предметів", "виконання ігрового завдання, коли учасник доставляє предмет з одного місця в інше."], ["Командна взаємодія", "узгоджені дії учасників команди для досягнення спільної мети."], ["Орієнтир", "предмет, що позначає місце, до якого треба добігти чи обігнути його."]], "th": [{"h": "Рухливі ігри. Ігри з перенесенням предметів", "p": ["У цих іграх треба не лише швидко бігти, а й акуратно нести предмет: м'яч, кубик, кеглю, обруч. Іноді предмет несуть на долоні, ракетці чи між колінами, іноді вдвох, не тримаючи руками. Такі ігри розвивають координацію і рівновагу.", "Популярні приклади: «Перенеси кубики», «Хто швидше збере», естафета з м'ячем на ракетці, перенесення м'яча в парах «спина до спини»."], "ul": ["Предмет не можна кидати — тільки нести і класти.", "Якщо предмет упав — підніми його і продовжуй з цього місця.", "Обігай орієнтир, не торкаючись його.", "У парних іграх домовляйтеся про темп руху.", "Перемагає не найшвидший, а той, хто швидкий і точний водночас."]}, {"h": "Рухливі ігри. Безпека та командна взаємодія", "p": ["Коли руки зайняті предметом, гравцеві важче втримати рівновагу при падінні. Тому в таких іграх не можна бігти з надмірною швидкістю, особливо на поворотах. Предмети мають бути безпечними: без гострих кутів і не надто важкими.", "Ігри з перенесенням предметів добре вчать співпраці: пара або команда має рухатися злагоджено, інакше предмет випаде."], "ul": ["Не поспішай на поворотах.", "Тримай предмет перед собою, щоб бачити дорогу.", "Не залишай предмети на доріжці — об них можна спіткнутися.", "Підказуй партнерові: «повільніше», «поворот», «стоп».", "Після гри складіть інвентар на місце."]}], "f": "", "pr": ["Виконай вдома вправу на рівновагу: пройди 10 кроків по прямій лінії (наприклад, по шву на килимі), тримаючи на долоні легкий предмет, наприклад пластикову кришку. Повтори 5 разів.", "Придумай гру з перенесенням предметів для молодших дітей, опиши її правила і правила безпеки."], "q": ["Які якості розвивають ігри з перенесенням предметів?", "Що робити, якщо предмет упав під час естафети?", "Чому на поворотах слід зменшувати швидкість?", "Як партнери в парі можуть діяти злагоджено?"]}, {"n": "69", "t": "Доджбол: навчальна гра, ролі гравців і чесна гра", "g": "Закріпити правила і тактику доджболу та зрозуміти принципи чесної гри й ролі гравців у команді.", "k": "Модулі: Доджбол", "terms": [["Чесна гра", "дотримання правил, повага до суперника, судді та партнерів, визнання своїх помилок."], ["Капітан", "гравець, який організовує команду, підтримує партнерів і спілкується з суддею."], ["Стратегія", "загальний план команди на всю гру."], ["Ловець", "гравець команди, який найкраще ловить м'ячі й займає позицію для перехоплення кидків суперника."]], "th": [{"h": "Доджбол. Ролі гравців і тактика команди", "p": ["У сильній команді кожен знає свою роль. Хтось влучно кидає і атакує, хтось краще ловить, а хтось підбирає м'ячі й передає їх атакувальникам. Капітан стежить за ситуацією, підказує, на кого зосередити атаку.", "Перед грою команда може обрати стратегію: обережно захищатися й ловити або активно атакувати разом. Під час гри стратегію можна змінювати."], "ul": ["Атакувальники — гравці з сильним і точним кидком.", "Ловці стоять попереду, готові перехопити кидок.", "Підбирачі збирають м'ячі та передають партнерам.", "Капітан підказує й підтримує команду.", "Ролі можна змінювати від гри до гри."]}, {"h": "Доджбол. Чесна гра та навчальна гра", "p": ["Доджбол — гра, у якій суддя не завжди може помітити, влучив м'яч чи ні. Тому багато залежить від чесності гравців. Якщо в тебе влучили — визнай це й вийди, навіть якщо ніхто не бачив.", "Чесна гра — це також відсутність образ і глузувань, повага до суперника, вміння і вигравати, і програвати гідно."], "ul": ["Визнавай влучання сам.", "Не кидай м'яч у гравця, який уже вибув.", "Не сперечайся із суддею.", "Після гри потисніть руки або подякуйте одне одному.", "Підбадьорюй партнера, який помилився."]}], "f": "", "pr": ["Напиши коротке есе (5–7 речень) на тему «Що для мене означає чесна гра» з прикладом із гри або життя.", "Виконай вправу для зміцнення ніг: 3 серії по 12 повільних присідань із рівною спиною, руки витягнуті вперед."], "q": ["Які ролі можуть мати гравці в команді з доджболу?", "Що робить капітан команди?", "Як проявляється чесна гра в доджболі?", "Чому важливо вміти гідно програвати?"]}, {"n": "70", "t": "Футзал: пересування, удари ногою і головою, гра воротаря", "g": "Дізнатися основи гри воротаря у футзалі та закріпити техніку пересувань і ударів.", "k": "Модулі: Футзал", "terms": [["Стійка воротаря", "положення воротаря з напівзігнутими ногами, вагою на передній частині стоп, руками перед собою на рівні пояса."], ["Штрафний майданчик", "зона перед воротами, у межах якої воротар може грати руками."], ["Вибір позиції", "правильне розташування воротаря між м'ячем і центром воріт."], ["Ввід м'яча воротарем", "повернення м'яча в гру воротарем кидком руки зі свого штрафного майданчика."]], "th": [{"h": "Футзал. Гра воротаря", "p": ["Воротар — останній захисник. Він стоїть у стійці: ноги на ширині плечей, коліна зігнуті, руки перед собою, погляд на м'яч. Воротар постійно зміщується так, щоб стояти на уявній лінії між м'ячем і центром воріт.", "Ловити м'яч воротар має «кошиком» або «замком»: пальці розставлені, великі пальці майже торкаються один одного. Низькі м'ячі приймають, опускаючись на коліно. Після того як воротар упіймав м'яч, він має швидко ввести його в гру — у футзалі на це дається обмежений час."], "ul": ["Зміщуйся приставними кроками, не схрещуючи ноги.", "Ловлячи м'яч, одразу притискай його до грудей.", "Не виходи далеко з воріт без потреби.", "Руками грай тільки в межах свого штрафного майданчика.", "Вводь м'яч у гру швидко — кидком руки або котячи по підлозі.", "Безпека: воротар на уроці грає в зручному одязі, без прикрас, з розімкнутими пальцями."]}, {"h": "Футзал. Пересування та удари: закріплення", "p": ["Польові гравці продовжують тренувати пересування з м'ячем і без, удари ногою й головою. Корисна вправа — удари по воротах, де стоїть воротар: так тренуються і нападники, і воротарі.", "Нападнику варто бити в кути воріт — туди воротарю найважче дотягнутися. Низькі удари часто ефективніші за верхові."], "ul": ["Перед ударом подивись, де стоїть воротар.", "Бий у кут, протилежний до того, куди зміщений воротар.", "Удар головою — лише легким м'ячем, серединою лоба.", "Не бий по воротах, якщо воротар ще не готовий (на тренуванні).", "Після удару повертайся на свою позицію."]}], "f": "", "pr": ["Виконай вдома вправу для воротаря: у стійці воротаря роби приставні кроки 3 вправо — 3 вліво, 5 серій, утримуючи руки перед собою.", "Намалюй ворота й схему вибору позиції воротаря, коли м'яч праворуч, по центру і ліворуч від воріт."], "q": ["Як виглядає стійка воротаря?", "Де воротар може грати руками?", "Як воротар вибирає позицію відносно м'яча?", "Куди нападнику найкраще бити по воротах і чому?"]}, {"n": "71", "t": "Рухливі ігри за вибором дітей: організація і суддівство", "g": "Навчитися самостійно організовувати рухливу гру, пояснювати правила і бути суддею.", "k": "Модулі: Рухливі ігри", "terms": [["Ведучий", "учасник гри, який виконує особливу роль: наздоганяє, водить або керує іншими гравцями."], ["Лічилка", "короткий віршик, за допомогою якого чесно обирають ведучого."], ["Організатор гри", "людина, яка пояснює правила, розподіляє ролі й стежить за ходом гри."], ["Правила гри", "домовленості, що визначають, як грати, що можна і що заборонено."]], "th": [{"h": "Рухливі ігри. Як організувати гру самостійно", "p": ["Уміти організувати гру — корисна навичка: вона знадобиться на перерві, у таборі, на сімейному святі. Організатор має обрати гру, яка підходить за кількістю гравців, місцем і віком, коротко пояснити правила й показати приклад.", "Ведучого можна обрати лічилкою, жеребкуванням або по черзі — головне, щоб чесно."], "ul": ["Перевір, чи безпечне місце для гри.", "Поясни мету гри і 3–5 головних правил.", "Покажи, як рухатися, на прикладі.", "Домовтеся про сигнал початку й закінчення.", "Після гри запитай учасників, що сподобалося."]}, {"h": "Рухливі ігри. Суддівство та ігри за вибором", "p": ["Суддя стежить, щоб правила виконувалися, і вирішує спірні ситуації. Суддя має бути неупередженим: однаково ставитися до всіх гравців, навіть до друзів.", "На уроці учні по черзі пропонують свої улюблені ігри і пробують бути організаторами та суддями. Так кожен відчуває відповідальність за гру."], "ul": ["Суддя говорить спокійно і чітко.", "Рішення пояснюй коротко: що порушено і яке покарання.", "Не змінюй правил посеред гри без попередження.", "Якщо хтось травмувався — гра зупиняється.", "Подякуй гравцям за гру."]}], "f": "", "pr": ["Запиши правила улюбленої рухливої гри так, щоб їх зрозумів першокласник: мета, хід гри, заборонені дії, як визначити переможця.", "Вивчи одну лічилку для вибору ведучого і запиши її в зошит."], "q": ["Що має зробити організатор перед початком гри?", "Якими чесними способами можна обрати ведучого?", "Якими якостями має володіти суддя?", "Коли гру треба негайно зупинити?"]}, {"n": "72", "t": "Доджбол: сила кистей рук, імітаційні вправи, кидки однією рукою зверху", "g": "Дізнатися, як розвивати силу кистей рук, і вдосконалити кидок м'яча однією рукою зверху в парах і колонах.", "k": "Модулі: Доджбол", "terms": [["Сила кистей", "здатність м'язів кисті та передпліччя міцно стискати, утримувати й кидати предмет."], ["Хват м'яча", "спосіб утримання м'яча пальцями й долонею перед кидком."], ["Кидок у колонах", "вправа, у якій гравці двох колон по черзі кидають м'яч одне одному і переходять у кінець колони."], ["Захльостувальний рух кисті", "завершальний різкий рух кисті під час кидка, що додає м'ячу швидкості."]], "th": [{"h": "Доджбол. Вправи для розвитку сили кистей рук", "p": ["Сильні кисті допомагають міцно тримати м'яч, кидати сильніше й ловити впевненіше. Сила кистей розвивається вправами на стискання, обертання та утримання: стискання м'ячика, кистьовий еспандер, обертання кистями, вправи з гантелями малої ваги.", "Ці вправи виконують помірно, без болю, з паузами для розслаблення."], "ul": ["Стискання тенісного або гумового м'ячика — 15–20 разів кожною рукою.", "Кругові рухи кистями в обидва боки.", "«Ножиці» пальцями — розведення і зведення пальців.", "Утримання м'яча пальцями без участі долоні.", "Після вправ — струсити кисті й розслабити."]}, {"h": "Доджбол. Кидки однією рукою зверху в парах і колонах", "p": ["Кидок однією рукою зверху — головний атакувальний кидок доджболу. Послідовність: хват м'яча пальцями, замах за голову, лікоть на рівні плеча або вище, крок протилежною ногою, поворот тулуба, викид руки вперед і захльостувальний рух кисті.", "У парах партнери кидають одне одному м'яч з невеликої відстані, поступово її збільшуючи. У колонах гравці кидають м'яч першому у протилежній колоні та біжать у кінець своєї."], "ul": ["Тримай м'яч пальцями, а не долонею.", "Не опускай лікоть під час замаху.", "Кидок завершуй рухом кисті вниз.", "Партнер готується ловити: руки вперед, пальці розслаблені.", "Після кидка дивись, куди полетів м'яч, і вчись на помилках."]}], "f": "", "pr": ["Виконай вдома комплекс для кистей: стискання м'якого м'ячика (або згорнутої шкарпетки) 3×15 кожною рукою, кругові рухи кистями по 10 у кожен бік, «ножиці» пальцями 3×10.", "Опиши послідовність кидка однією рукою зверху в 6 кроків."], "q": ["Навіщо доджболісту сильні кисті?", "Назви три вправи для розвитку сили кистей.", "Що таке захльостувальний рух кисті?", "Як проводиться вправа «кидки в колонах»?"]}, {"n": "73", "t": "Футзал: жонглювання м'ячем, навчальна гра; норматив — ведення м'яча 15 м", "g": "Дізнатися, як жонглювання розвиває контроль м'яча, та навчитися правильно виконувати норматив із ведення м'яча на 15 метрів.", "k": "Модулі: Футзал", "terms": [["Жонглювання", "утримання м'яча в повітрі послідовними дотиками ніг, стегон чи голови, не даючи йому впасти."], ["Контроль м'яча", "уміння тримати м'яч під своїм керуванням і виконувати з ним точні дії."], ["Ведення по прямій", "швидке переміщення з м'ячем прямою лінією з частими дотиками."], ["Фінішна лінія", "позначка, перетинаючи яку разом з м'ячем, гравець завершує вправу на час."]], "th": [{"h": "Футзал. Жонглювання м'ячем", "p": ["Жонглювання — чудова вправа для відчуття м'яча. Новачки починають так: підкидають м'яч руками, б'ють його один раз підйомом стопи або стегном і ловлять. Потім два дотики, три, і так далі.", "Що більше дотиків поспіль, то краще ти контролюєш м'яч. Цю навичку видно потім у грі — під час прийому й зупинки м'яча."], "ul": ["Удар підйомом: носок витягнутий, стопа напружена.", "Бий м'яч невисоко — до рівня пояса.", "Чергуй праву і ліву ногу.", "Стеж за м'ячем очима весь час.", "Тренуйся там, де немає крихких предметів."]}, {"h": "Футзал. Норматив: ведення м'яча по прямій на 15 метрів", "p": ["Учень за сигналом веде м'яч по прямій 15 метрів до фінішної лінії. Рахується час у секундах. Важливо не лише бігти швидко, а й не втратити м'яч — інакше витрачається час.", "Перед нормативом розімнися і зроби 1–2 пробні проходи. Веди м'яч частими легкими поштовхами підйомом або зовнішньою частиною стопи, не відпускаючи його далеко. Свій результат порівнюй із попереднім."], "ul": ["Старт — за сигналом, м'яч лежить на лінії старту.", "Дотик до м'яча — приблизно на кожному другому кроці.", "Голова трохи піднята, щоб бачити напрямок.", "Біля фінішу не зупиняй м'яч — перетни лінію разом із ним.", "Помилка — сильно штовхнути м'яч і бігти за ним."]}, {"h": "Футзал. Рухливі ігри та навчальна гра", "p": ["Перед навчальною грою використовують рухливі ігри з м'ячем: «Квач із веденням», «Відбери м'яч», естафети з веденням. Вони готують до гри та розвивають контроль м'яча під тиском суперника.", "У навчальній грі намагайся застосувати жонглювання й ведення: м'яко прийняти м'яч, обвести суперника, віддати пас."], "ul": ["Веди м'яч ногою, дальшою від суперника.", "Не бійся помилок — вони частина навчання.", "Грай без підкатів і штовхань.", "Допомагай партнерам відкриватися."]}], "f": "", "pr": ["Пожонглюй м'ячем на подвір'ї або в безпечному місці (з дозволу дорослих): 5 спроб, кожного разу рахуючи кількість дотиків поспіль. Запиши найкращий результат.", "Опиши в зошиті 4 поради, як швидко й без втрати м'яча виконати ведення на 15 метрів."], "q": ["Що розвиває жонглювання?", "Як рахують результат у нормативі «ведення м'яча 15 м»?", "Чому не можна сильно відпускати м'яч під час ведення?", "Яким має бути положення голови під час ведення?"]}, {"n": "74", "t": "Рухливі ігри за вибором; норматив — біг на 30 метрів", "g": "Дізнатися техніку бігу на коротку дистанцію та як правильно підготуватися до нормативу з бігу на 30 метрів.", "k": "Модулі: Рухливі ігри", "terms": [["Високий старт", "положення для початку бігу стоячи: одна нога попереду, друга позаду, тулуб нахилений уперед."], ["Швидкісні якості", "здатність швидко реагувати, швидко набирати й підтримувати високу швидкість."], ["Фінішування", "завершальна частина дистанції, коли бігун не зменшує швидкість до самої лінії фінішу."], ["Спринт", "біг на коротку дистанцію з максимальною швидкістю."]], "th": [{"h": "Рухливі ігри. Ігри за вибором дітей на швидкість", "p": ["Ігри за вибором дозволяють класу самому обрати, у що грати. Цього разу добре обирати ігри, які розігрівають і готують до бігу: «День і ніч», «Виклик номерів», «Квач», естафети.", "Пам'ятай: ігри перед нормативом мають бути розминкою, а не виснажливою гонкою. Інакше на бігу 30 м сил залишиться менше."], "ul": ["Обирай ігри з короткими прискореннями.", "Між іграми — коротка пауза для дихання.", "Біжи у своєму напрямку, дивись уперед.", "Не штовхай гравців і не хапай за одяг.", "Перед нормативом зроби легку розминку ніг."]}, {"h": "Рухливі ігри. Норматив: біг на 30 метрів", "p": ["Біг на 30 метрів — це спринт, де все вирішується за кілька секунд. Учень стартує з високого старту за сигналом і біжить з максимальною швидкістю до фінішу. Вимірюється час у секундах.", "Техніка: на старті поштовхова нога попереду, тулуб нахилений, руки зігнуті в ліктях. За сигналом — потужний поштовх і часті кроки. На дистанції біг на передній частині стопи, руки активно працюють уперед-назад. Біля фінішу не гальмуй — пробігай лінію на повній швидкості."], "ul": ["Перед бігом — розминка та 2–3 прискорення по 10–15 метрів.", "Стартуй точно за сигналом, без фальстарту.", "Дивись уперед, а не під ноги.", "Не озирайся на суперника — це втрачає час.", "Свій результат порівнюй із попереднім і з вимогами, які назве вчитель.", "Після бігу — пройдись кроком, щоб відновити дихання."]}], "f": "", "pr": ["Виконай імітацію роботи рук під час спринту, стоячи перед дзеркалом: 3 серії по 20 секунд, руки зігнуті в ліктях під прямим кутом, рухаються вперед-назад, а не поперек тіла.", "Запиши правильну послідовність виконання бігу на 30 м: старт, стартовий розгін, біг по дистанції, фінішування — по одному реченню на кожну фазу."], "q": ["Як виглядає високий старт?", "Чому не можна гальмувати перед фінішною лінією?", "Як мають працювати руки під час спринту?", "Як підготуватися до нормативу з бігу на 30 м?"]}, {"n": "75", "t": "Доджбол: кидки в ціль; норматив і діагностувальна робота за ІІІ чверть", "g": "Підсумувати вивчене в ІІІ чверті з футзалу, рухливих ігор і доджболу та підготуватися до нормативу з кидків у ціль.", "k": "Модулі: Футзал · Рухливі ігри · Доджбол", "terms": [["Діагностувальна робота", "перевірка, яка показує рівень знань і вмінь учня з певної теми."], ["Група результатів", "категорія навчальних досягнень (ГР1, ГР2, ГР3), за якою оцінюють, наскільки учень опанував тему."], ["Влучання", "попадання м'ячем у задану ціль."], ["Самооцінка", "вміння чесно оцінити власні досягнення й помилки."]], "th": [{"h": "Доджбол. Норматив: кидки м'яча в ціль зверху з 6 спроб", "p": ["Учень виконує 6 кидків однією рукою зверху в ціль з визначеної вчителем відстані. Рахується кількість влучень. Перед нормативом — вправи для кистей і імітація кидка, щоб розігріти плечовий суглоб.", "Для точного кидка не треба кидати дуже сильно: важливіше правильно стати, прицілитися і завершити кидок рухом кисті в бік цілі."], "ul": ["Стань боком до цілі, нога, протилежна до кидкової руки, попереду.", "Подивись на ціль перед кидком.", "Лікоть під час замаху на рівні плеча або вище.", "Завершуй кидок рухом кисті.", "Не поспішай між спробами — зосередься на кожній."]}, {"h": "Футзал. Рухливі ігри. Доджбол. Підсумок чверті", "p": ["У ІІІ чверті ти вивчив три модулі. Футзал: правила безпеки, пересування, ведення, удари носком і внутрішньою стороною стопи, удари головою, зупинки, гра воротаря, жонглювання. Рухливі ігри: ігри на швидкість і спритність, з м'ячем, з перенесенням предметів, естафети, ігри для активного відпочинку, організація гри. Доджбол: правила, стійка, кидки зверху і знизу, ловіння, ухилення, тактика і чесна гра.", "Діагностувальна робота показує, на якому рівні ти опанував тему (ГР1, ГР2 або ГР3). Важливо не лише результат, а й прогрес від початку чверті."], "ul": ["Футзал: удари, зупинки, ведення, правила гри і безпеки.", "Рухливі ігри: види ігор, правила, організація, суддівство.", "Доджбол: стійка, кидки, ловіння, вибування, чесна гра.", "Пригадай, у чому ти покращився за чверть.", "Визнач одну навичку, над якою варто попрацювати далі."]}], "f": "", "pr": ["Склади таблицю «Мої досягнення за ІІІ чверть»: для кожного модуля (Футзал, Рухливі ігри, Доджбол) запиши, що вийшло найкраще і над чим ще варто попрацювати.", "Виконай вправу на точність: кидай згорнуту шкарпетку однією рукою зверху в коробку з відстані 3–4 кроків, 3 серії по 6 кидків, і запиши кількість влучень у кожній серії."], "q": ["Назви основні удари по м'ячу, які ти вивчив у футзалі.", "Які правила вибування гравця в доджболі?", "Які види рухливих ігор ти знаєш і що вони розвивають?", "Як правильно виконати кидок у ціль однією рукою зверху?"]}]}, {"name": "IV чверть. Баскетбол 3×3, COOL GAMES, бадмінтон", "lessons": [{"n": "76", "t": "Баскетбол 3×3: техніка безпеки, кидки з близької відстані, гра «Лабіринт»", "g": "Ознайомитися з баскетболом 3×3, правилами безпеки та технікою кидка м'яча з близької відстані.", "k": "Модулі: Баскетбол 3×3", "terms": [["Баскетбол 3×3", "різновид баскетболу, у якому дві команди по троє гравців грають на один кошик на половині майданчика."], ["Щит", "прямокутна панель, до якої кріпиться кошик; від неї можна відбивати м'яч під час кидка."], ["Кидок з близької відстані", "кидок м'яча в кошик із місця біля щита, найчастіше з відскоком від щита."], ["Лабіринт", "навчальна гра, у якій учні з м'ячем проходять смугу з перешкод, не торкаючись їх."]], "th": [{"h": "Баскетбол 3×3. Що це за гра та техніка безпеки", "p": ["Баскетбол 3×3 — швидка й видовищна гра: три гравці проти трьох на одному кошику. Гра триває до 21 очка або 10 хвилин. Влучний кидок зсередини дуги приносить 1 очко, з-за дуги — 2 очки, а на кожну атаку дається лише 12 секунд.", "Через високий темп і боротьбу за м'яч під кошиком у баскетболі 3×3 потрібно суворо дотримуватися правил безпеки."], "ul": ["Займайся в кросівках зі шнурками, зав'язаними надійно.", "Зніми прикраси й годинник, нігті мають бути коротко підстрижені.", "Не штовхай гравців під кошиком і не стрибай на них.", "Не стій під кошиком, коли інші кидають.", "Не кидай м'яч у партнера, який на тебе не дивиться.", "Відчуваєш біль — зупинись і повідом учителя."]}, {"h": "Баскетбол 3×3. Кидок з близької відстані і гра «Лабіринт»", "p": ["Кидок з близької відстані виконують однією рукою від плеча або двома руками від грудей. Найпростіше влучити з відскоком від щита: цілься у верхній ближній кут намальованого на щиті прямокутника. М'яч тримають пальцями, а не долонею, кидок завершується рухом кисті.", "Гра «Лабіринт»: на майданчику розставляють фішки або стійки, і учні з м'ячем проходять між ними, ведучи його, а наприкінці виконують кидок у кошик. Перемагає той, хто проходить швидко, не торкаючись перешкод, і влучає."], "ul": ["Стань під кутом до щита, а не прямо під кошиком.", "Ноги злегка зігнуті, кидок починається з поштовху ногами.", "Лікоть кидкової руки спрямований на кошик.", "Після кидка кисть «дивиться» вниз.", "У «Лабіринті» не поспішай — краще без помилок, ніж швидко, але з торканнями."]}], "f": "Баскетбол 3×3 став олімпійським видом спорту і вперше був представлений на Олімпійських іграх у Токіо.", "pr": ["Запиши основні відмінності баскетболу 3×3 від звичайного баскетболу (кількість гравців, кошики, очки, час) і 5 правил безпеки на уроці.", "Виконай імітацію кидка однією рукою від плеча без м'яча: 3 серії по 10 повторень, стежачи за положенням ліктя і завершальним рухом кисті."], "q": ["Скільки гравців у команді баскетболу 3×3 на майданчику?", "Скільки очок дає кидок зсередини дуги і з-за дуги?", "Куди треба цілитися під час кидка з відскоком від щита?", "Назви три правила безпеки на уроках баскетболу."]}, {"n": "77", "t": "Cool Games: правила безпеки в естафетах; норматив — піднімання тулуба в сід за 30 с", "g": "Ознайомитися з естафетами Cool Games, правилами безпечної поведінки та технікою піднімання тулуба в сід.", "k": "Модулі: COOL GAMES", "terms": [["Cool Games", "сучасні командні ігри та естафети з нестандартним інвентарем, у яких поєднуються рух, співпраця і кмітливість."], ["Нестандартний інвентар", "незвичні предмети для гри: фрізбі, м'які мішечки, кольорові фішки, обручі, конуси, мотузки тощо."], ["Піднімання тулуба в сід", "вправа для м'язів живота: з положення лежачи на спині учень піднімається в положення сидячи і повертається назад."], ["М'язи преса", "м'язи передньої стінки живота, які утримують поставу і захищають внутрішні органи."]], "th": [{"h": "COOL GAMES. Що це таке та правила безпеки", "p": ["Cool Games — це сучасні командні ігри та естафети, у яких використовують нестандартний інвентар. Вони цікаві тим, що перемагає не лише найшвидший, а й найкмітливіша і найзлагодженіша команда.", "Оскільки в естафетах багато учасників і предметів, правила безпеки особливо важливі."], "ul": ["Стартуй лише за сигналом і на своїй доріжці.", "Інвентар передавай у руки, не кидай у партнера.", "Предмети, якими не граєте, не лишай на доріжці.", "Не штовхай учасників інших команд.", "Підтримуй команду, але не кричи в обличчя партнеру.", "У разі травми — гру зупиняють."]}, {"h": "COOL GAMES. Естафети та норматив: піднімання тулуба в сід за 30 секунд", "p": ["На уроці вивчають кілька естафет Cool Games: перенесення предметів, проходження смуги з обручів і фішок, командні завдання, де треба діяти разом. Після естафет виконують норматив.", "Норматив: учень лягає на спину, ноги зігнуті в колінах, стопи на підлозі (їх утримує партнер), руки схрещені на грудях або за головою, як скаже вчитель. За сигналом треба підніматися до торкання ліктями колін і повертатися до торкання лопатками підлоги. Рахується кількість правильних повторень за 30 секунд."], "ul": ["Не смикай голову руками — шия має бути розслаблена.", "Опускайся до торкання підлоги лопатками.", "Дихай рівномірно: видих під час підйому.", "Не відривай стопи від підлоги.", "Порівнюй результат із попереднім, щоб бачити прогрес."]}], "f": "", "pr": ["Виконай вдома піднімання тулуба в сід: 3 серії по 10–15 повторень з відпочинком 1 хвилина, стежачи за технікою (руки не тягнуть голову).", "Придумай естафету в стилі Cool Games з предметами, які є вдома (подушки, пластикові пляшки, шкарпетки), і опиши її правила."], "q": ["Що таке Cool Games?", "Чим нестандартний інвентар відрізняється від звичайного?", "Як правильно виконувати піднімання тулуба в сід?", "Які типові помилки під час цієї вправи?"]}, {"n": "78", "t": "Бадмінтон: загальна характеристика та основні правила гри", "g": "Дізнатися, що таке бадмінтон, який інвентар для нього потрібен та основні правила гри.", "k": "Модулі: Бадмінтон", "terms": [["Бадмінтон", "спортивна гра з ракетками й воланом, у якій гравці перекидають волан через сітку, не даючи йому впасти на свою половину."], ["Волан", "легкий снаряд для бадмінтону з пробкової або пластикової голівки та оперення з пір'я чи пластику."], ["Ракетка", "спортивний снаряд з ручкою, ободом і натягнутими струнами, яким б'ють по волану."], ["Розіграш", "частина гри від подачі до моменту, коли волан торкнувся підлоги або сталася помилка."]], "th": [{"h": "Бадмінтон. Загальна характеристика і безпека", "p": ["Бадмінтон — гра для двох (одиночна) або чотирьох (парна) гравців. Майданчик поділений сіткою. Гравці ракетками перебивають волан через сітку. Волан легкий, але після сильного удару летить дуже швидко, а в польоті різко гальмує — це робить гру цікавою і непередбачуваною.", "Бадмінтон розвиває швидкість, спритність, координацію і реакцію. У нього можна грати й професійно, і для відпочинку на природі."], "ul": ["Тримай ракетку міцно, щоб вона не вислизнула.", "Не підходь близько до гравця, який замахується.", "Не бий по волану, якщо поруч стоїть людина.", "Займайся в неслизькому взутті.", "Перед грою розімни плечі, лікті та кисті."]}, {"h": "Бадмінтон. Основні правила гри", "p": ["Гра починається з подачі. Подача виконується знизу, по діагоналі на половину суперника. Очко отримує той, хто виграв розіграш, незалежно від того, хто подавав. Партія триває до 21 очка, зазвичай грають до двох виграних партій.", "Розіграш закінчується, коли волан торкнувся підлоги, вилетів за межі майданчика, застряг у сітці або коли гравець порушив правила, наприклад торкнувся сітки ракеткою чи тілом."], "ul": ["Подача — знизу і по діагоналі.", "Волан, що впав на лінію, вважається в полі.", "Торкатися сітки під час розіграшу заборонено.", "По волану можна вдарити лише один раз з кожного боку.", "Очко отримує переможець розіграшу."]}], "f": "Волан — один із найшвидших снарядів у спорті: після сильного удару над головою його швидкість може перевищувати 400 км/год, але в польоті вона швидко зменшується.", "pr": ["Намалюй схему майданчика для бадмінтону з сіткою і познач напрямок подачі по діагоналі. Запиши 5 основних правил гри.", "Виконай розминку для кистей і плечей, яку робиш перед бадмінтоном: кругові рухи плечима, ліктями, кистями — по 10 у кожен бік."], "q": ["Що таке волан і з чого він складається?", "Як виконується подача в бадмінтоні?", "До скількох очок триває партія?", "Коли закінчується розіграш?"]}, {"n": "79", "t": "Баскетбол 3×3: рухливі ігри з елементами баскетболу", "g": "Закріпити ведення, передачі та ловіння м'яча в рухливих іграх з елементами баскетболу 3×3.", "k": "Модулі: Баскетбол 3×3", "terms": [["Ведення м'яча", "переміщення гравця з м'ячем, коли м'яч відбивається від підлоги поштовхами однієї руки."], ["Передача м'яча", "спрямування м'яча партнеру по команді руками."], ["Підбирання м'яча", "боротьба за м'яч, що відскочив від щита чи кошика після невлучного кидка."], ["Перехоплення", "дія захисника, який забирає м'яч під час передачі суперників."]], "th": [{"h": "Баскетбол 3×3. Елементи гри у рухливих іграх", "p": ["Рухливі ігри з елементами баскетболу допомагають закріпити техніку ведення, передач і кидків у веселій формі. Вони підходять для розігріву та для навчання командній взаємодії.", "Наприклад, «М'яч капітану» вчить передачам, «Квач з веденням» — веденню з піднятою головою, «Вибивний з веденням» — контролю м'яча під тиском суперника."], "ul": ["Веди м'яч пальцями, а не долонею.", "М'яч відбивається від підлоги збоку від ноги, а не перед нею.", "Дивись перед собою, а не на м'яч.", "Передавай м'яч у руки партнеру, на рівні грудей.", "Ловлячи, витягни руки назустріч м'ячу."]}, {"h": "Баскетбол 3×3. Підбирання м'яча та безпека в іграх", "p": ["У баскетболі 3×3 після невлучного кидка гравці борються за підбирання. Команда, яка частіше підбирає м'яч, частіше атакує. Але боротьба має бути чесною: не можна штовхати чи тягнути суперника.", "У рухливих іграх із баскетбольним м'ячем важливо розподіляти простір і не збиватися в одну купу."], "ul": ["Займи позицію між суперником і кошиком перед підбиранням.", "Стрибай угору, а не на інших гравців.", "Не вибивай м'яч ударом по руках суперника.", "Після перехоплення одразу починай атаку.", "Тримай дистанцію з іншими гравцями."]}], "f": "", "pr": ["Опиши правила однієї рухливої гри з елементами баскетболу і зазнач, який технічний прийом вона розвиває.", "Виконай вправу для пальців: «відбивай» м'яч з руки в руку подушечками пальців перед собою (або імітуй без м'яча) — 3 серії по 30 секунд."], "q": ["Якою частиною руки правильно вести м'яч?", "Що таке підбирання м'яча?", "Які рухливі ігри допомагають навчитися веденню?", "Що заборонено під час боротьби за м'яч?"]}, {"n": "80", "t": "Cool Games: естафети; норматив — біг 30 м", "g": "Удосконалити участь в естафетах Cool Games і закріпити техніку бігу на 30 метрів для виконання нормативу.", "k": "Модулі: COOL GAMES", "terms": [["Стартова реакція", "швидкість, з якою бігун починає рух після сигналу."], ["Стартовий розгін", "перші 10–15 метрів бігу, під час яких бігун поступово випрямляється і набирає швидкість."], ["Командна естафета", "змагання, у якому результат залежить від усіх учасників, що виконують етапи по черзі."], ["Передача естафети", "дія, коли учасник торкається наступного або передає йому предмет, дозволяючи стартувати."]], "th": [{"h": "COOL GAMES. Естафети з нестандартним інвентарем", "p": ["Естафети Cool Games часто складаються з кількох завдань на одному етапі: пробігти змійкою між фішками, перенести предмет, влучити ним у ціль і повернутися. Ускладнення роблять гру цікавою і вимагають кмітливості.", "Важливо, щоб кожен учасник знав своє завдання і порядок передачі естафети."], "ul": ["Перед стартом уважно вислухай пояснення.", "Передавай естафету чітко: торкання долонею або предмет у руки.", "Не починай рух, поки не отримав естафету.", "Розташуй інвентар так, щоб він не заважав іншим командам.", "Після естафети допоможи прибрати інвентар."]}, {"h": "COOL GAMES. Норматив: біг 30 метрів", "p": ["Біг на 30 м — короткий спринт. Велике значення тут має стартова реакція і стартовий розгін: хто швидше відреагує і набере швидкість, той покаже кращий час. Виконується з високого старту за сигналом.", "Готуючись, добре розімни ноги, зроби кілька прискорень. На дистанції біжи на передній частині стопи, активно працюй руками, не гальмуй до самого фінішу. Результат порівнюй із тим, що показав у ІІІ чверті."], "ul": ["На старті вага тіла на передній нозі.", "Перші кроки — короткі й часті, тулуб нахилений.", "Поступово випрямляйся і збільшуй довжину кроку.", "Руки працюють уперед-назад.", "Пробігай фінішну лінію, не сповільнюючись."]}], "f": "", "pr": ["Виконай вправу «біг на місці з високим підніманням стегна»: 4 серії по 15 секунд з відпочинком 45 секунд, стежачи за роботою рук.", "Порівняй свої результати бігу на 30 м (якщо вони є) і запиши, що допомогло або завадило показати кращий час."], "q": ["Що таке стартова реакція?", "Як виконується стартовий розгін?", "Як правильно передавати естафету?", "Чому не можна гальмувати перед фінішем?"]}, {"n": "81", "t": "Бадмінтон: хват ракетки, тримання волана, точка удару", "g": "Навчитися правильно тримати ракетку і волан та зрозуміти, де і як ракетка зустрічається з воланом під час удару.", "k": "Модулі: Бадмінтон", "terms": [["Універсальний хват", "спосіб тримати ракетку, коли ручку беруть ніби для рукостискання, а великий і вказівний пальці утворюють букву «V»."], ["Точка удару", "місце в просторі, де ракетка зустрічається з воланом."], ["Струнна поверхня", "частина ракетки з натягнутими струнами, якою б'ють по волану."], ["Оперення волана", "«спідничка» з пір'я або пластику, завдяки якій волан летить голівкою вперед і гальмує в повітрі."]], "th": [{"h": "Бадмінтон. Хват ракетки та тримання волана", "p": ["Найпоширеніший хват — універсальний. Візьми ракетку так, ніби вітаєшся з кимось за руку: обід стоїть ребром до підлоги, пальці охоплюють ручку, великий і вказівний утворюють букву «V». Ракетку тримають не надто міцно — кисть має залишатися рухливою.", "Волан для подачі тримають за оперення великим і вказівним пальцями, голівкою донизу, перед собою на рівні пояса."], "ul": ["Не тримай ракетку «кулаком» — так кисть стає скутою.", "Не тримай ракетку за самий край ручки або біля обода.", "Пальці розслаблені, стискаються лише в момент удару.", "Волан тримай за оперення, а не за голівку.", "Не розмахуй ракеткою поблизу інших людей."]}, {"h": "Бадмінтон. Точка удару, положення ракетки і гравця", "p": ["Точка удару — місце, де струнна поверхня зустрічається з воланом. Для ударів справа вона перед тілом і трохи збоку з боку ракетки, для ударів над головою — над головою і трохи попереду. Влучати треба серединою струнної поверхні.", "У момент удару гравець стоїть стійко, дивиться на волан, рука з ракеткою вже виконала замах, а вага тіла переходить із задньої ноги на передню."], "ul": ["Дивись на волан до самого моменту удару.", "Влучай серединою струн, а не ободом.", "Бий волан перед собою, а не позаду.", "У момент удару кисть фіксована, після удару рука продовжує рух.", "Не чекай, поки волан опуститься надто низько."]}], "f": "", "pr": ["Візьми будь-яку ракетку (або імітуй з лінійкою чи кухонною лопаткою) і потренуй універсальний хват: 10 разів візьми ракетку правильно з різних положень, перевіряючи букву «V» між пальцями.", "Намалюй людину з ракеткою і познач точку удару для удару справа і для удару над головою."], "q": ["Як правильно взяти ракетку універсальним хватом?", "Як тримають волан перед подачею?", "Що таке точка удару?", "Якою частиною ракетки треба влучати по волану?"]}, {"n": "82", "t": "Баскетбол 3×3: розвиток гри, основні правила, ведення м'яча, подвійний крок", "g": "Дізнатися про розвиток баскетболу 3×3, його основні правила та вивчити ведення м'яча й подвійний крок.", "k": "Модулі: Баскетбол 3×3", "terms": [["Дуга", "лінія на майданчику, що відділяє зону кидків за 1 очко від зони кидків за 2 очки."], ["Таймер атаки", "час на одну атаку команди; у баскетболі 3×3 він становить 12 секунд."], ["Подвійний крок", "прийом, коли гравець після ведення робить два кроки з м'ячем у руках і виконує кидок у стрибку."], ["Ведуча рука", "рука, якою гравець веде м'яч у цей момент."]], "th": [{"h": "Баскетбол 3×3. Розвиток гри та основні правила", "p": ["Баскетбол 3×3 виріс із вуличного баскетболу, у який грали на дворових майданчиках. Згодом Міжнародна федерація баскетболу (ФІБА) затвердила для нього єдині правила, а пізніше він став олімпійським видом спорту. В Україні також проводяться змагання з баскетболу 3×3.", "Основні правила: команда — 3 гравці на майданчику й 1 запасний; гра на один кошик; 1 очко за кидок зсередини дуги, 2 — з-за дуги; 12 секунд на атаку; гра до 21 очка або 10 хвилин."], "ul": ["Кожна атака починається з-за дуги.", "Після підбирання м'яча захисна команда спершу виносить його за дугу.", "Після влучання м'яч отримує команда, яка пропустила, і виводить його за дугу.", "Перемагає та, що першою набрала 21 очко, або має більше очок через 10 хвилин.", "Грубі порушення караються штрафними кидками."]}, {"h": "Баскетбол 3×3. Ведення м'яча правою і лівою рукою та подвійний крок", "p": ["Ведення виконують пальцями: м'яч відбивається від підлоги збоку від ноги, на рівні пояса. Корисно вміти вести обома руками — тоді суперникові важче вибити м'яч.", "Подвійний крок: після ведення гравець бере м'яч у руки, робить перший крок (для правші — правою ногою), другий — лівою, відштовхується нею і в стрибку виконує кидок однією рукою з-під кошика."], "ul": ["Ведення: м'яч не вище пояса, погляд перед собою.", "Ведучу руку змінюй залежно від того, з якого боку суперник.", "Подвійний крок: «раз» — бери м'яч, «два» — відштовхнись, кидай.", "Третій крок з м'ячем у руках — порушення «пробіжка».", "Кидай у верхній кут прямокутника на щиті."]}], "f": "", "pr": ["Виконай імітацію подвійного кроку без м'яча (на вільному місці): «раз-два-стрибок угору» з рухом руки до уявного кошика — 3 серії по 6 повторень з кожного боку. Стрибок має бути невисоким і з м'яким приземленням.", "Запиши 5 основних правил баскетболу 3×3 своїми словами."], "q": ["Скільки часу дається на одну атаку в баскетболі 3×3?", "Що потрібно зробити після підбирання м'яча в захисті?", "Опиши послідовність подвійного кроку.", "Чому корисно вміти вести м'яч обома руками?"]}, {"n": "83", "t": "Cool Games: естафети, ігри для активного відпочинку; норматив — рівномірний біг", "g": "Зрозуміти, що таке витривалість і як правильно виконувати рівномірний біг, та закріпити естафети Cool Games.", "k": "Модулі: COOL GAMES", "terms": [["Витривалість", "здатність тривалий час виконувати роботу без зниження її ефективності."], ["Рівномірний біг", "біг з однаковою, помірною швидкістю протягом усієї дистанції."], ["Пульс", "частота серцевих скорочень, яку визначають, рахуючи удари на зап'ясті або шиї."], ["Темп", "частота рухів, наприклад кроків за певний час."]], "th": [{"h": "COOL GAMES. Норматив: рівномірний біг", "p": ["Рівномірний біг розвиває витривалість — серце й легені вчаться працювати довше. Головне правило: обрати такий темп, щоб пробігти всю дистанцію без зупинок. Якщо стартувати занадто швидко, сил не вистачить до кінця.", "Дистанцію або час бігу визначає вчитель. Перед бігом — розминка, після — заминка: ходьба і вправи на розтягування. Оцінити своє навантаження можна, порахувавши пульс до і після бігу."], "ul": ["Біжи у спокійному темпі, щоб могти говорити короткими реченнями.", "Дихай рівномірно: вдих носом, видих ротом або через ніс і рот.", "Крок короткий і легкий, приземлення на передню частину стопи або на всю стопу м'яко.", "Руки розслаблені, зігнуті в ліктях.", "Якщо закололо в боці — сповільнись, глибоко подихай, але не зупиняйся різко."]}, {"h": "COOL GAMES. Естафети та ігри для активного відпочинку", "p": ["Після бігу — естафети Cool Games та спокійні ігри для активного відпочинку. Вони допомагають відновитися і водночас тренують командну взаємодію.", "Для активного відпочинку обирають ігри невисокої інтенсивності: передачі предметів у колі, завдання на кмітливість, естафети без швидкісних ривків."], "ul": ["Після рівномірного бігу не сідай одразу — походи.", "Ігри мають бути помірними за навантаженням.", "Кожен у команді має свою роль.", "Дотримуйся правил безпеки під час передачі інвентарю.", "Наприкінці — вправи на дихання і розтягування."]}], "f": "", "pr": ["Навчися рахувати пульс: порахуй удари на зап'ясті за 15 секунд і помнож на 4 — у спокої, після 30 присідань і через 2 хвилини відпочинку. Запиши результати.", "Вийди на прогулянку з дорослими і пройди 15–20 хвилин швидким кроком без зупинок; запиши, як почувався."], "q": ["Що таке витривалість?", "Як обрати правильний темп для рівномірного бігу?", "Як порахувати пульс?", "Що робити, якщо під час бігу закололо в боці?"]}, {"n": "84", "t": "Бадмінтон: вихідні та ударні положення, удари справа і зліва", "g": "Навчитися займати вихідне та ударне положення і вивчити техніку ударів справа і зліва.", "k": "Модулі: Бадмінтон", "terms": [["Вихідне положення", "положення гравця перед ударом суперника, з якого зручно рушити в будь-який бік."], ["Ударне положення", "положення тіла й ракетки в момент перед ударом по волану."], ["Удар справа", "удар, який виконують з боку руки, що тримає ракетку, долонею вперед."], ["Удар зліва", "удар, який виконують з протилежного від ракетки боку, тильною стороною долоні вперед."]], "th": [{"h": "Бадмінтон. Вихідні та ударні положення", "p": ["Вихідне положення: гравець стоїть у центрі своєї половини, ноги на ширині плечей, коліна злегка зігнуті, вага на передній частині стоп, ракетка перед собою. З цього положення можна швидко рушити до волана в будь-який бік.", "Ударне положення займають після переміщення до волана: замах виконано, ракетка відведена, вага тіла на нозі, ближчій до волана, погляд — на волан."], "ul": ["Після кожного удару повертайся у вихідне положення.", "Ракетка завжди піднята, а не опущена до підлоги.", "До волана рухайся приставними або перехресними кроками.", "Не бий волан, стоячи на прямих ногах.", "Займай ударне положення заздалегідь, не в останню мить."]}, {"h": "Бадмінтон. Серія ударів справа і зліва з підкиданням волана партнером", "p": ["Удар справа: розвернися боком, відведи ракетку назад, і рухом передпліччя та кисті вдар по волану перед собою. Удар зліва: розвернися іншим плечем до сітки, рука з ракеткою перед тілом, удар виконується тильною стороною долоні вперед, великий палець упирається в ручку.", "У вправі партнер з невеликої відстані підкидає волан рукою, а гравець виконує серію ударів справа, потім зліва. Потім міняються ролями."], "ul": ["Партнер підкидає волан невисоко і точно.", "Відстань між партнерами — така, щоб ракетка не дістала того, хто підкидає.", "Дивись на волан, а не на партнера.", "Для удару зліва трохи змінюй хват — великий палець на широку грань ручки.", "Після удару рука продовжує рух у бік, куди полетів волан."]}], "f": "", "pr": ["Виконай імітацію ударів справа і зліва без волана перед дзеркалом (на вільному місці): 3 серії по 10 кожним ударом, стежачи за розворотом тіла.", "Опиши в зошиті різницю між ударом справа і ударом зліва (положення тіла, хват, рух руки)."], "q": ["Як виглядає вихідне положення бадмінтоніста?", "Що таке ударне положення?", "Чим відрізняється удар справа від удару зліва?", "Як безпечно виконувати вправу з підкиданням волана партнером?"]}, {"n": "85", "t": "Баскетбол 3×3: ведення м'яча правою і лівою рукою, подвійний крок", "g": "Удосконалити ведення м'яча обома руками на місці і в русі та техніку подвійного кроку.", "k": "Модулі: Баскетбол 3×3", "terms": [["Пробіжка", "порушення, коли гравець робить більше двох кроків з м'ячем у руках без ведення."], ["Подвійне ведення", "порушення, коли гравець веде м'яч двома руками одночасно або знову починає ведення після того, як узяв м'яч у руки."], ["Слабша рука", "рука, якою гравцеві менш зручно виконувати прийоми; її треба тренувати окремо."], ["Зміна рук", "перехід ведення м'яча з однієї руки на іншу відскоком перед собою."]], "th": [{"h": "Баскетбол 3×3. Ведення м'яча на місці та в русі", "p": ["Ведення на місці — підготовча вправа: м'яч відбивається від підлоги біля ноги, рука працює від ліктя, пальці «зустрічають» і «супроводжують» м'яч. Потім ведення виконують у русі кроком, потім бігом.", "Обов'язково тренуй слабшу руку: якщо ти ведеш лише правою, захиснику легко передбачити твої дії. Зміна рук виконується відскоком м'яча перед собою з однієї руки в іншу."], "ul": ["Пальці розставлені, долоня не «ляскає» по м'ячу.", "У русі м'яч відбивається трохи попереду і збоку.", "Тулуб нахилений, вільна рука прикриває м'яч від суперника.", "Не дивись на м'яч — дивись на майданчик.", "Не бери м'яч двома руками, щоб знову почати ведення — це порушення."]}, {"h": "Баскетбол 3×3. Подвійний крок: закріплення", "p": ["Подвійний крок виконують після ведення. Для кидка правою рукою: на перший крок правою ногою гравець бере м'яч у руки, на другий — лівою відштовхується вгору і кидає м'яч однією рукою, спрямовуючи його у щит або кошик.", "Найчастіша помилка — плутанина з ногами або зайвий третій крок. Тому спершу подвійний крок вивчають без м'яча, потім з м'ячем у руках, і лише після цього — з ведення."], "ul": ["Ритм «раз-два-кидок»: довгий перший крок, короткий другий.", "Відштовхування — вгору, а не вперед у щит.", "Кидаєш правою — відштовхуєшся лівою ногою, і навпаки.", "Приземлення м'яке, на обидві ноги.", "Не стрибай під кошиком, якщо там стоять інші гравці."]}], "f": "Баскетбол винайшов викладач фізичного виховання Джеймс Нейсміт у 1891 році, і спершу замість кошиків використовували кошики для персиків.", "pr": ["Виконай вправу для слабшої руки: 3 серії по 30 секунд підкидай і лови м'ячик (або згорнуту шкарпетку) лише слабшою рукою.", "Запиши, що таке пробіжка і подвійне ведення, і як уникнути цих порушень."], "q": ["Яке порушення називається пробіжкою?", "Чому важливо тренувати ведення слабшою рукою?", "З якої ноги відштовхуються під час подвійного кроку з кидком правою рукою?", "Як виконується зміна рук під час ведення?"]}, {"n": "86", "t": "Cool Games: естафети та ігри; норматив — нахил тулуба вперед із положення сидячи", "g": "Дізнатися, що таке гнучкість і як правильно виконувати норматив «нахил тулуба вперед із положення сидячи».", "k": "Модулі: COOL GAMES", "terms": [["Гнучкість", "здатність виконувати рухи з великою амплітудою в суглобах."], ["Нахил тулуба вперед із положення сидячи", "тест на гнучкість, під час якого учень сидить з прямими ногами і тягнеться руками якомога далі вперед."], ["Розтягування", "вправи, що поступово збільшують довжину м'язів і рухливість суглобів."], ["Амплітуда", "розмах руху від початкового до кінцевого положення."]], "th": [{"h": "COOL GAMES. Норматив: нахил тулуба вперед із положення сидячи", "p": ["Учень сідає на підлогу, ноги прямі, стопи впираються в позначку чи лінію. Руки витягнуті вперед, долоні одна на одній. Зробивши видих, він плавно нахиляється вперед, ковзаючи пальцями по лінійці чи розмітці, і фіксує найдальшу точку на кілька секунд. Результат вимірюють у сантиметрах.", "Перед тестом обов'язкова розминка: м'язи мають бути розігріті. Нахил виконують плавно, без ривків і пружинних рухів."], "ul": ["Коліна не згинаються — їх можна притримати.", "Не роби ривків — це може травмувати м'язи.", "Видихай під час нахилу.", "Утримуй кінцеве положення 2–3 секунди.", "Порівнюй результат із попереднім: гнучкість поліпшується поступово."]}, {"h": "COOL GAMES. Естафети та ігри для активного відпочинку", "p": ["Естафети Cool Games на цьому уроці можуть містити завдання на гнучкість і координацію: пролізти через обруч, пройти «павутину» з мотузок, не торкаючись її, передати предмет над головою і між ногами в колоні.", "Ігри для активного відпочинку після тесту допомагають розслабитися і відновитися."], "ul": ["Пролазячи через обруч, не поспішай, щоб не впасти.", "Передаючи предмет над головою, не прогинайся різко.", "Чекай своєї черги за лінією старту.", "Допомагай партнерам, якщо вони затрималися.", "Завершуй урок вправами на розтягування."]}], "f": "", "pr": ["Виконуй щодня комплекс на гнучкість: нахил сидячи з прямими ногами (утримання 20 с), «метелик» (20 с), нахили в сторони стоячи (по 8 разів) — 3 повтори. Через тиждень перевір, чи покращився нахил.", "Запиши правила виконання тесту на гнучкість і 3 типові помилки."], "q": ["Що таке гнучкість?", "Як правильно виконувати нахил тулуба вперед із положення сидячи?", "Чому під час нахилу не можна робити ривків?", "Які естафети допомагають розвивати гнучкість і координацію?"]}, {"n": "87", "t": "Бадмінтон: ігрова стійка, вихідні та ударні положення", "g": "Навчитися займати ігрову стійку бадмінтоніста і швидко переходити з вихідного в ударне положення.", "k": "Модулі: Бадмінтон", "terms": [["Ігрова стійка", "положення бадмінтоніста з напівзігнутими ногами, вагою на передній частині стоп і піднятою ракеткою, готове до руху в будь-який бік."], ["Випад", "великий крок уперед або вбік з перенесенням ваги на передню ногу, щоб дотягнутися до волана."], ["Центр майданчика", "місце посередині своєї половини, куди гравець повертається після кожного удару."], ["Перехресний крок", "пересування, коли одна нога заходить за іншу, щоб швидше переміститися на більшу відстань."]], "th": [{"h": "Бадмінтон. Ігрова стійка", "p": ["Ігрова стійка — основа гри. Ноги на ширині плечей або трохи ширше, одна трохи попереду, коліна зігнуті, вага на передній частині стоп. Ракетка тримається перед собою на рівні грудей, вільна рука допомагає балансувати.", "З такої стійки можна швидко рушити до волана вперед, назад чи вбік. Після кожного удару гравець повертається в центр майданчика і знову приймає стійку."], "ul": ["Не стій на п'ятах — ти запізнишся до волана.", "Ракетка піднята, не опущена донизу.", "Погляд на суперника і волан.", "Будь «пружним»: легкий підскок перед ударом суперника допомагає швидше стартувати.", "Повертайся в центр після кожного удару."]}, {"h": "Бадмінтон. Перехід з вихідного в ударне положення", "p": ["Щоб влучно вдарити, гравець має вчасно дістатися до волана і зайняти ударне положення. Для близьких воланів використовують приставний крок або випад, для далеких — перехресні кроки.", "Під час випаду передня нога ставиться з п'яти, коліно не виходить за носок, спина рівна. Після удару гравець відштовхується передньою ногою і повертається в центр."], "ul": ["До волана біля сітки — випадом уперед ногою з боку ракетки.", "До волана в глибині — перехресними кроками назад, боком.", "У момент удару тіло стійке, не падаєш уперед.", "Коліно під час випаду не завалюється всередину.", "Повернення в центр — так само швидко, як рух до волана."]}], "f": "", "pr": ["Виконай вправу «випади»: 3 серії по 8 повільних випадів уперед на кожну ногу, стежачи, щоб коліно не виходило за носок і спина була рівною.", "Намалюй схему половини майданчика для бадмінтону, познач центр і стрілками покажи, як гравець рухається до волана в чотири кути та повертається."], "q": ["Як виглядає ігрова стійка бадмінтоніста?", "Навіщо повертатися в центр майданчика після удару?", "Як правильно виконувати випад?", "Коли використовують перехресні кроки?"]}, {"n": "88", "t": "Баскетбол 3×3: ведення і подвійний крок; норматив — два кроки з кидком у кошик", "g": "Закріпити техніку подвійного кроку і дізнатися, як оцінюють норматив «два кроки з кидком м'яча в кошик із 6 спроб».", "k": "Модулі: Баскетбол 3×3", "terms": [["Ритм кроків", "послідовність і тривалість кроків у подвійному кроці: довгий перший, коротший другий."], ["Відштовхування", "сильний поштовх ногою від підлоги для стрибка."], ["Кидок від щита", "кидок, під час якого м'яч спершу торкається щита, а потім падає в кошик."], ["Оцінювання техніки", "перевірка правильності виконання рухів незалежно від того, чи влучив м'яч."]], "th": [{"h": "Баскетбол 3×3. Норматив: техніка двох кроків із кидком м'яча в кошик з 6 спроб", "p": ["Учень виконує 6 спроб: ведення, два кроки і кидок у кошик. Оцінюються і техніка (правильний ритм кроків, відштовхування з потрібної ноги, кидок однією рукою), і кількість влучень. Тому навіть невлучна спроба з правильною технікою має значення.", "Підготовка: розімни гомілковостопні, колінні суглоби та плечі, виконай кілька подвійних кроків без м'яча, потім 2–3 пробні спроби з м'ячем."], "ul": ["Перший крок — на прийомі м'яча, другий — відштовхувальний.", "Відштовхуйся вгору, не налітай на щит.", "Кидай у верхній кут прямокутника на щиті.", "Не роби третього кроку — це пробіжка.", "Приземляйся м'яко на обидві ноги.", "Порівнюй свої результати з минулими спробами."]}, {"h": "Баскетбол 3×3. Ведення м'яча як підготовка до кидка", "p": ["Добрий подвійний крок починається з ведення. Останній удар м'яча об підлогу має бути таким, щоб м'яч зручно ліг у руки саме на перший крок. Якщо м'яч відскакує далеко — ритм ламається.", "Тренувати поєднання ведення і подвійного кроку корисно з обох боків кошика: справа — кидок правою, зліва — лівою рукою."], "ul": ["Перед кидком зменш висоту ведення.", "Бери м'яч двома руками на першому кроці.", "Тримай м'яч ближче до тіла, щоб захисник не вибив його.", "Тренуй і праву, і ліву сторону.", "Після кидка йди на підбирання."]}], "f": "", "pr": ["Виконай імітацію подвійного кроку з уявним м'ячем: 3 серії по 5 повторень з кожного боку, промовляючи «раз-два-кидок» уголос; стрибок — невисокий і з м'яким приземленням.", "Запиши критерії, за якими оцінюють техніку двох кроків, і поясни, чому вчитель оцінює не лише влучання."], "q": ["Що оцінюється в нормативі «два кроки з кидком у кошик»?", "Яка помилка називається пробіжкою?", "Куди цілитися під час кидка від щита?", "Чому останній удар ведення важливий для подвійного кроку?"]}, {"n": "89", "t": "Cool Games: естафети та ігри; норматив — підтягування", "g": "Дізнатися, як правильно виконувати підтягування і безпечно розвивати силу рук та спини.", "k": "Модулі: COOL GAMES", "terms": [["Підтягування", "вправа, під час якої людина з вису на перекладині згинає руки і піднімається до положення, коли підборіддя вище перекладини."], ["Вис", "положення тіла, коли людина тримається руками за перекладину, не торкаючись ногами опори."], ["Хват зверху", "спосіб тримати перекладину, коли долоні спрямовані від себе."], ["Силова витривалість", "здатність багато разів повторювати силову вправу."]], "th": [{"h": "COOL GAMES. Норматив: підтягування", "p": ["Підтягування виконують з вису на перекладині хватом зверху, руки на ширині плечей. Треба піднятися так, щоб підборіддя опинилося вище перекладини, і опуститися до повністю випрямлених рук. Рахується кількість правильних повторень без ривків і розгойдування. Для дівчат за програмою можуть передбачатися інші варіанти вправи — їх називає вчитель.", "Перед тестом розімни плечі, лікті та кисті. Залазь на перекладину і злазь із неї обережно, не зістрибуй з висоти."], "ul": ["Не розгойдуйся і не допомагай собі ногами.", "Опускайся до повністю прямих рук.", "Підборіддя має бути вище перекладини.", "Дихай: видих під час підйому.", "Якщо руки слизькі — витри їх, щоб не зірватися.", "Порівнюй результат з попереднім."]}, {"h": "COOL GAMES. Естафети та ігри для активного відпочинку", "p": ["Естафети після силового тесту мають бути помірними за навантаженням, щоб руки відпочили. Добре підходять завдання на влучність, кмітливість і командну взаємодію: зібрати фігуру з фішок, передати предмет по ланцюжку, пройти смугу без рук.", "Ігри для активного відпочинку завершують урок і допомагають відновитися."], "ul": ["Не перевантажуй руки після підтягування.", "Виконуй завдання точно, а не лише швидко.", "Слухай пояснення завдання до кінця.", "Допомагай партнерам.", "Наприкінці — вправи на розслаблення рук і плечей."]}], "f": "", "pr": ["Виконай вдома вправи для зміцнення рук і спини без перекладини: «човник» лежачи на животі (3×10), віджимання від стіни (3×12), утримання положення «супермен» (3×15 с).", "Запиши правила виконання підтягування і 3 помилки, через які повторення не зараховується."], "q": ["Як виглядає правильне підтягування?", "Що таке хват зверху?", "Чому не можна розгойдуватися під час підтягування?", "Які правила безпеки слід пам'ятати на перекладині?"]}, {"n": "90", "t": "Бадмінтон: серія ударів справа і зліва у визначеній та довільній послідовності", "g": "Навчитися виконувати удари справа і зліва серіями та швидко обирати потрібний удар.", "k": "Модулі: Бадмінтон", "terms": [["Серія ударів", "кілька ударів поспіль без зупинки гри."], ["Визначена послідовність", "порядок ударів, заздалегідь установлений учителем, наприклад справа — зліва — справа."], ["Довільна послідовність", "виконання ударів залежно від того, куди летить волан, без заздалегідь визначеного порядку."], ["Перехід хвату", "швидка зміна положення пальців на ручці ракетки між ударом справа і зліва."]], "th": [{"h": "Бадмінтон. Серія ударів у визначеній послідовності", "p": ["Спочатку удари виконують у визначеній послідовності: наприклад, три удари справа, потім три зліва або чергування справа-зліва. Партнер підкидає або відбиває волан у потрібний бік. Так гравець звикає до швидкої зміни положення тіла і хвату.", "Між ударами треба повертатися у вихідне положення: ракетка перед собою, готова до наступного удару."], "ul": ["Між ударами справа і зліва швидко змінюй хват.", "Розвертайся плечем до волана перед ударом.", "Після удару повертай ракетку перед себе.", "Не бий з усієї сили — контролюй напрямок.", "Рахуй удари в серії і намагайся збільшити їх кіл
