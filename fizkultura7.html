 м'яча, поки рух не стане правильним і звичним.", "Стійка доджболіста: ноги на ширині плечей, коліна зігнуті, тулуб трохи нахилений, руки перед собою. З неї можна швидко відскочити, присісти або піймати м'яч."], "ul": ["Вага тіла на передній частині стоп.", "Погляд на суперника з м'ячем.", "Не стій на прямих ногах.", "Руки готові до ловіння.", "Повторюй імітацію повільно, потім швидше."]}, {"h": "Доджбол. Різновиди кидків", "p": ["Основні кидки: однією рукою зверху (найточніший), збоку (швидкий, на рівні пояса) та знизу (для кидків у ноги або передачі партнерові). Кожен кидок починається з кроку протилежною ногою і закінчується рухом кисті.", "У доджболі краще кидати в ноги й тулуб — так суперникові важче піймати м'яч."], "ul": ["Кидок зверху — для точності.", "Кидок збоку — для швидкості.", "Кидок знизу — у ноги або для передачі.", "Не кидай у голову.", "Перед кидком перевір, де партнери."]}, {"h": "Доджбол. Рухлива гра «Мисливець і звірі»", "p": ["У грі «Мисливці» мають м'яч і намагаються влучити ним у «звірів», які бігають у межах майданчика. Влучений «звір» стає «мисливцем» або виходить із гри — залежно від правил, про які домовились.", "Гра вчить ухилятися, стежити за м'ячем і кидати точно."], "ul": ["Межі майданчика не можна перетинати.", "Кидки — нижче пояса.", "«Звірі» не штовхаються.", "Дотримуйтеся домовлених правил.", "Гра закінчується, коли всі «звірі» спіймані або закінчився час."]}], "f": "", "pr": ["Намалюй три види кидків (зверху, збоку, знизу) схематично або опиши кожен двома реченнями.", "Виконай імітацію стійки і присідання-ухилення: 3 серії по 10 разів."], "q": ["Навіщо потрібні імітаційні вправи?", "Як виглядає стійка доджболіста?", "Чим відрізняються кидки зверху, збоку і знизу?", "Чому в доджболі краще кидати в ноги?"]}, {"n": "26", "t": "Шашки: повторення правил гри, навчальна гра", "g": "Учень повторить основні правила гри в шашки та знатиме, як провести навчальну партію.", "k": "Модулі: Шашки", "terms": [["Проста шашка", "звичайна шашка, яка ходить на одне поле по діагоналі вперед."], ["Діагональ", "лінія з полів одного кольору, що з'єднує клітинки навскоси."], ["Партія", "одна гра від початкової розстановки до перемоги чи нічиєї."], ["Нічия", "результат партії, коли жоден гравець не переміг."]], "th": [{"h": "Шашки. Повторення правил гри", "p": ["Проста шашка ходить на одне поле по діагоналі тільки вперед. Бити шашку суперника обов'язково: якщо біля твоєї шашки стоїть шашка суперника, а за нею вільне поле, треба перестрибнути через неї і зняти її з дошки.", "Шашка, яка дійшла до останнього ряду суперника, стає дамкою. Партію виграє той, хто забрав усі шашки суперника або заблокував їх."], "ul": ["Ходять по черзі, білі першими.", "Бити обов'язково.", "Можна бити кілька шашок за один хід.", "Шашки рухаються лише темними полями.", "Торкнувся шашки — ходи нею (правило «взявся — ходи»)."]}, {"h": "Шашки. Навчальна гра", "p": ["У навчальній грі головне — не перемога, а розуміння: чому зроблено хід, які загрози є на дошці. Перед кожним ходом подумай, чи не підставляєш ти шашку під удар.", "Після партії корисно разом із суперником обговорити ключові моменти."], "ul": ["Займай центр дошки.", "Не залишай шашки без підтримки.", "Не поспішай.", "Поважай суперника, не підказуй.", "Наприкінці потисніть руки."]}], "f": "", "pr": ["Зіграй навчальну партію в шашки з кимось із рідних і запиши, чим вона закінчилася та яка помилка була найважливішою.", "Виконай 2 хвилини вправ для шиї та плечей після гри, щоб зняти напругу."], "q": ["Як ходить проста шашка?", "Чи можна відмовитися бити шашку суперника?", "Коли шашка стає дамкою?", "Що означає правило «взявся — ходи»?"]}, {"n": "27", "t": "Гімнастика: вправи з гантелями й еспандерами, лазіння по канатах у три прийоми", "g": "Учень знатиме правила виконання вправ з гантелями й еспандерами та техніку лазіння по горизонтальному й вертикальному канатах.", "k": "Модулі: Гімнастика", "terms": [["Гантелі", "невеликі обтяження для однієї руки, які використовують для силових вправ."], ["Еспандер", "тренажер з гуми або пружин, який розтягують для зміцнення м'язів."], ["Обтяження", "додаткова вага, що збільшує навантаження на м'язи."], ["Горизонтальний канат", "канат, натягнутий горизонтально, по якому пересуваються, тримаючись руками й ногами."]], "th": [{"h": "Гімнастика. Загальнорозвивальні вправи з гантелями й еспандерами", "p": ["Для 7 класу підходять легкі гантелі та еспандери середньої жорсткості. Вправи виконують плавно, без ривків, з рівною спиною. Важливіше правильно виконати 10 разів, ніж неправильно 20.", "Еспандер треба перевіряти перед використанням: якщо гума тріснула — ним не можна користуватися."], "ul": ["Тримай спину рівною.", "Видих — на зусилля.", "Не кидай гантелі на підлогу.", "Перевір еспандер перед вправою.", "Тримай достатню відстань до інших учнів."]}, {"h": "Гімнастика. Лазіння по горизонтальному і вертикальному канатах", "p": ["По горизонтальному канату пересуваються, звисаючи під ним: руками перехоплюють канат, ноги закинуті на нього. По вертикальному — у три прийоми: руки вгору, ноги підтягнути і затиснути канат стопами, випрямити ноги.", "Мати під канатами — обов'язкові, а вчитель страхує учнів."], "ul": ["Перехоплюй руками по черзі.", "Затискай канат стопами міцно.", "Не відпускай одночасно обидві руки.", "Спускайся, перехоплюючи руками.", "Лізь лише за командою."]}], "f": "", "pr": ["Запиши правила безпеки під час вправ з гантелями й еспандерами.", "Виконай вправи без обтяження: 3 підходи по 10 віджимань від стіни і 3 по 10 згинань рук із пляшками з водою (0,5 л) замість гантелей."], "q": ["Як перевірити еспандер перед вправою?", "Чому вправи з обтяженням виконують без ривків?", "Як пересуваються по горизонтальному канату?", "Які три прийоми лазіння по вертикальному канату?"]}, {"n": "28", "t": "Доджбол: стійка, розміщення гравців, пересування приставними кроками, вихідне положення", "g": "Учень знатиме, як розміщуються гравці на майданчику в доджболі та як обирати вихідне положення для кидків і ловіння м'яча.", "k": "Модулі: Доджбол", "terms": [["Центральна лінія", "лінія посередині майданчика, яку гравці не мають права перетинати."], ["Зона команди", "половина майданчика, на якій розміщуються гравці однієї команди."], ["Вихідне положення для кидка", "поза гравця перед кидком: боком до цілі, рука з м'ячем відведена назад."], ["Ловіння м'яча", "прийом, коли гравець ловить кинутий у нього м'яч, гасячи його швидкість руками й тулубом."]], "th": [{"h": "Доджбол. Стійка і розміщення гравців", "p": ["Гравці команди не мають стояти купою — так легше в них влучити. Вони розподіляються по своїй половині: хтось ближче до центральної лінії для кидків, хтось у глибині для ловіння.", "Стійка — напівзігнуті ноги, руки перед грудьми, погляд на суперника з м'ячем."], "ul": ["Не стій поруч із партнером впритул.", "Заднім гравцям легше ловити м'ячі.", "Не підходь до центральної лінії без м'яча.", "Слідкуй за всіма м'ячами в грі.", "Спілкуйся з командою."]}, {"h": "Доджбол. Пересування приставними кроками і вихідне положення", "p": ["Приставними кроками гравець швидко зміщується вбік, ухиляючись від м'яча, не втрачаючи з поля зору суперника. Для кидка вихідне положення — боком до цілі, рука відведена назад. Для ловіння — грудьми до суперника, руки перед собою, ноги зігнуті.", "Ловлячи м'яч, гравець притискає його до тулуба й трохи відступає назад, щоб погасити швидкість."], "ul": ["Не схрещуй ноги.", "Ловлячи, притискай м'яч до грудей.", "Пальці розслаблені.", "Перед кидком — крок уперед.", "Після кидка повертайся в стійку."]}, {"h": "Доджбол. Рухлива гра з елементами доджболу", "p": ["У рухливій грі учні закріплюють розміщення на майданчику, пересування та кидки. Правила спрощені: наприклад, без вибування, лише з підрахунком влучень.", "Важливо дотримуватися безпеки й чесності."], "ul": ["Кидки нижче пояса.", "Влучання визнає той, у кого влучили.", "Не кидай у спину того, хто підбирає м'яч, без попередження вчителя.", "Слухай свисток.", "Після гри збери м'ячі."]}], "f": "", "pr": ["Намалюй схему майданчика для доджболу і покажи, як краще розставити свою команду.", "Виконай 3 серії по 10 приставних кроків у кожен бік у стійці та 10 імітацій ловіння м'яча з кроком назад."], "q": ["Чому гравцям не варто стояти купою?", "Як виглядає вихідне положення для кидка?", "Як правильно ловити м'яч у доджболі?", "Що заборонено робити з центральною лінією?"]}, {"n": "29", "t": "Шашки: хід, взяття, шашка, дамка, черговість ходу і бою. Гра «Виштовхни з кола»", "g": "Учень знатиме, чим відрізняються хід і бій простої шашки та дамки, і правила черговості.", "k": "Модулі: Шашки", "terms": [["Хід", "переміщення шашки з одного поля на інше без взяття."], ["Взяття (бій)", "перестрибування через шашку суперника з її зняттям з дошки."], ["Дамка", "шашка, що дійшла до останнього ряду суперника й отримала право ходити на будь-яку кількість полів по діагоналі."], ["Черговість", "правило, за яким гравці роблять ходи строго по черзі."]], "th": [{"h": "Шашки. Хід і взяття простої шашки й дамки", "p": ["Проста шашка ходить на одне поле вперед по діагоналі, а бити може і вперед, і назад (у шашках, поширених в Україні). Дамка ходить по діагоналі на будь-яку кількість вільних полів уперед і назад та б'є шашку суперника з будь-якої відстані, якщо за нею є вільне поле.", "Якщо під час бою проста шашка дійшла до останнього ряду, вона стає дамкою і продовжує бити вже як дамка, якщо є можливість."], "ul": ["Хід — лише на вільне поле.", "Бити обов'язково.", "Бій кількох шашок — за один хід.", "Збиті шашки знімають після завершення ходу.", "Дамку позначають, поставивши дві шашки одна на одну або перевернувши шашку."]}, {"h": "Шашки. Черговість ходу і бою. Рухлива гра «Виштовхни з кола»", "p": ["Гравці ходять по черзі, і пропустити хід не можна. Якщо є кілька варіантів бою, гравець вибирає будь-який, але бити зобов'язаний.", "Після інтелектуальної роботи корисно порухатися. У грі «Виштовхни з кола» двоє учнів стоять у колі і, тримаючи руки перед собою, легкими поштовхами в долоні намагаються вивести суперника з рівноваги. Удари й захвати заборонені."], "ul": ["Пропускати хід не можна.", "Поштовхи — лише долонями в долоні.", "Не штовхай різко й не бий.", "Гра йде на м'якій поверхні.", "Після гри — дихальна вправа."]}], "f": "", "pr": ["Розстав на намальованій дошці позицію, у якій біла шашка може побити дві чорні за один хід, і запиши цей хід.", "Виконай вправи на рівновагу: постій на одній нозі по 20 секунд на кожній, 3 рази, тримаючись поруч зі стіною."], "q": ["Чим хід відрізняється від взяття?", "Як ходить і б'є дамка?", "Чи можна пропустити хід у шашках?", "Що відбувається, коли шашка під час бою дійшла до останнього ряду?"]}, {"n": "30", "t": "Гімнастика: вправи з обтяженням, лазіння по канатах, вправи на брусах", "g": "Учень знатиме безпечні правила вправ з обтяженням, закріпить лазіння по канатах і ознайомиться з вправами на брусах.", "k": "Модулі: Гімнастика", "terms": [["Паралельні бруси", "гімнастичний снаряд із двох паралельних жердин на стійках."], ["Упор", "положення, коли плечі вище точки опори, а тіло тримається на прямих руках."], ["Розмахування", "рух тіла вперед-назад в упорі або висі."], ["Хват", "спосіб утримання снаряда руками."]], "th": [{"h": "Гімнастика. Вправи з обтяженням і лазіння по канатах", "p": ["Вправи з обтяженням (гантелі, набивні м'ячі) зміцнюють м'язи рук, плечей і тулуба. Навантаження обирають за силами, поступово збільшуючи кількість повторень, а не вагу.", "Лазіння по канатах у три прийоми повторюємо, звертаючи увагу на міцне затискання канату стопами."], "ul": ["Починай з легкої ваги.", "Між підходами — відпочинок.", "Не затримуй дихання.", "Канат — лише зі страхуванням.", "Мати під снарядом обов'язкові."]}, {"h": "Гімнастика. Вправи на брусах", "p": ["На паралельних брусах виконують упори, розмахування в упорі, ходьбу на руках у упорі. Руки тримають жердини хватом зверху, плечі не опускаються.", "Вчитель страхує учня з боку снаряда. Перед вправою руки посипають магнезією, якщо вона є, щоб не ковзали."], "ul": ["Упор — на прямих руках, плечі розправлені.", "Розмахування — з плечей, тіло пряме.", "Зіскок — лише за командою, на мат.", "Не виконуй вправ без учителя.", "Перевір висоту брусів під свій зріст."]}], "f": "", "pr": ["Опиши, що таке упор, і намалюй схематично упор на паралельних брусах з правильним положенням рук і плечей.", "Виконай 3 підходи по 10 віджимань від стола або стіни для зміцнення рук."], "q": ["Що таке упор?", "Чому навантаження збільшують за рахунок повторень, а не ваги?", "Яким хватом тримаються за бруси?", "Хто має страхувати під час вправ на брусах?"]}, {"n": "31", "t": "Доджбол: гра в доджбол за правилами", "g": "Учень знатиме основні правила гри в доджбол і вмітиме пояснити тактику командних дій.", "k": "Модулі: Доджбол", "terms": [["Відновлення гравця", "повернення вибулого гравця в гру після того, як партнер піймав м'яч суперника."], ["Захоплення м'яча", "дія, коли гравець першим бере м'яч, що лежить на полі."], ["Блокування м'ячем", "відбивання кинутого м'яча за допомогою м'яча в руках."], ["Чесна гра", "дотримання правил і поваги до суперника навіть без нагляду судді."]], "th": [{"h": "Доджбол. Правила гри", "p": ["Дві команди грають на своїх половинах поля. На початку м'ячі кладуть на центральну лінію, і за сигналом гравці біжать їх брати. Влучений гравець вибуває. Якщо гравець піймав м'яч суперника, вибуває той, хто кидав, а в команду може повернутися вибулий гравець (за прийнятими правилами).", "Перемагає команда, яка вибила всіх суперників або має більше гравців наприкінці часу."], "ul": ["Влучання в голову не зараховується і є порушенням.", "Вихід за межі поля — вибування.", "М'яч, що спершу торкнувся підлоги, не вибиває.", "Тримати м'яч надто довго не можна.", "Рішення судді — остаточне."]}, {"h": "Доджбол. Тактика і командна гра", "p": ["Команда діє злагоджено, коли кілька гравців кидають одночасно в одного суперника — так йому важче ухилитися. Гравці в глибині ловлять м'ячі й відновлюють партнерів.", "Важливо не залишати м'ячі на своїй половині без діла: передай їх тим, хто кидає краще."], "ul": ["Домовтеся про одночасний кидок.", "Сильні ловці — у глибині.", "Не кидай необдумано — м'яч дістанеться суперникові.", "Підтримуй вибулих товаришів.", "Визнавай влучання чесно."]}], "f": "", "pr": ["Запиши 5 правил гри в доджбол і 2 тактичні поради для команди.", "Виконай вправу на реакцію і ухилення: у стійці 3 серії по 10 присідань-ухилень та 10 кроків убік у безпечному місці."], "q": ["Як починається гра в доджбол?", "Що відбувається, коли гравець піймав м'яч?", "Чому корисно кидати кількома гравцями одночасно?", "Які дії вважаються порушенням?"]}, {"n": "32", "t": "Шашки: правила гри, хід, взяття, шашка, дамка, черговість — аналіз позицій", "g": "Учень закріпить правила гри в шашки й навчиться застосовувати їх під час аналізу простих позицій.", "k": "Модулі: Шашки", "terms": [["Позиція", "розташування шашок на дошці в певний момент партії."], ["Розмін", "обмін шашками, коли обидва гравці втрачають однакову кількість шашок."], ["Пожертва", "свідома віддача шашки суперникові заради кращої позиції або виграшу."], ["Удар", "комбінаційний хід, коли гравець за один раз б'є кілька шашок суперника."]], "th": [{"h": "Шашки. Правила і черговість ходу та бою", "p": ["Повторюємо основне: шашки ходять по діагоналі темними полями, проста шашка — на одне поле вперед, бити обов'язково, бити можна назад, дамка ходить на будь-яку відстань. Ходи по черзі, пропуск заборонений.", "Якщо гравець не побив, хоча мав, — це порушення правил; у навчальній грі суперник може вказати на це, і хід повторюють."], "ul": ["Бити обов'язково.", "Бій — до кінця ланцюжка.", "Дамка б'є з будь-якої відстані.", "Проста шашка ходить лише вперед.", "Знімають збиті шашки після ходу."]}, {"h": "Шашки. Аналіз позицій", "p": ["Розмін допомагає спростити гру, а пожертва — підготувати удар. Перш ніж віддати шашку, порахуй, скільки шашок суперника зможеш побити у відповідь.", "Аналізуючи позицію, перевір: чи є в тебе обов'язковий бій, чи немає загрози твоїм шашкам, чи можеш ти провести шашку в дамки."], "ul": ["Спочатку шукай обов'язковий бій.", "Перевір загрози суперника.", "Шукай можливість удару.", "Не жертвуй шашку без розрахунку.", "Бережи шашки останнього ряду — вони заважають супернику пройти в дамки."]}], "f": "", "pr": ["Намалюй позицію з розміном шашок і поясни, хто виграв від розміну.", "Зіграй навчальну партію і після неї виконай 5 вправ для шиї та плечей."], "q": ["Що таке розмін?", "Чим пожертва відрізняється від помилки?", "Що треба перевірити, аналізуючи позицію?", "Навіщо берегти шашки останнього ряду?"]}, {"n": "33", "t": "Гімнастика: вправи з м'ячами, лазіння по вертикальному канату, вправи на перекладині", "g": "Учень знатиме загальнорозвивальні вправи з м'ячами, закріпить лазіння по канату та ознайомиться з вправами на перекладині.", "k": "Модулі: Гімнастика", "terms": [["Перекладина", "гімнастичний снаряд з металевої жердини, закріпленої горизонтально на стійках."], ["Вис", "положення, коли плечі нижче точки хвату і тіло звисає на руках."], ["Хват зверху", "спосіб тримання перекладини, коли долоні звернені від себе."], ["Набивний м'яч", "важкий м'яч, який використовують для силових вправ і кидків."]], "th": [{"h": "Гімнастика. Загальнорозвивальні вправи з м'ячами", "p": ["Вправи з м'ячами розвивають координацію й силу: підкидання та ловіння, передачі м'яча навколо тулуба, нахили з м'ячем, присідання з м'ячем у руках. Набивний м'яч використовують для силових вправ, але кидають його лише за вказівкою вчителя.", "Головне — тримати м'яч під контролем і не кидати його в бік інших учнів."], "ul": ["Підкидай невисоко і лови двома руками.", "Тримай спину рівною під час нахилів.", "Набивний м'яч піднімай, присівши.", "Не кидай м'ячі в інших.", "Виконуй вправи на своєму місці."]}, {"h": "Гімнастика. Лазіння по вертикальному канату й вправи на перекладині", "p": ["На перекладині виконують виси, підтягування, піднімання ніг у висі. Хват — зверху на ширині плечей, великі пальці обхоплюють жердину знизу. Вис має бути спокійним, без розгойдування.", "Лазіння по канату виконуємо у три прийоми, стежачи за правильним затисканням ногами. На всіх снарядах обов'язкові мати й страхування."], "ul": ["Великий палець обхоплює перекладину.", "Не розгойдуйся без вказівки.", "Зіскок — на зігнуті ноги, на мат.", "Перевір, чи сухі долоні.", "Не виконуй вправ без учителя."]}], "f": "", "pr": ["Запиши 5 загальнорозвивальних вправ із м'ячем, які можна виконувати вдома з м'якою іграшкою чи м'ячиком.", "Виконай ці вправи (по 10 повторень) в безпечному місці подалі від крихких предметів."], "q": ["Чим вис відрізняється від упору?", "Як правильно тримати перекладину?", "Як безпечно піднімати набивний м'яч?", "Чому не можна розгойдуватися на перекладині без вказівки?"]}, {"n": "34", "t": "Доджбол: стійка, розміщення гравців, кидки в ціль зверху та знизу, гра", "g": "Учень знатиме техніку кидків у ціль зверху та знизу і як їх застосовувати в грі.", "k": "Модулі: Доджбол", "terms": [["Мішень", "ціль на стіні або підлозі, в яку цілять м'ячем під час тренування."], ["Кидок у ціль зверху", "кидок однією рукою з-за голови для точного влучання в ціль на рівні тулуба чи вище."], ["Кидок у ціль знизу", "кидок рукою знизу вперед для влучання в низьку ціль, наприклад у ноги."], ["Прицілювання", "наведення погляду й руки на ціль перед кидком."]], "th": [{"h": "Доджбол. Імітаційні вправи, стійка і розміщення", "p": ["Повторюємо стійку і розміщення гравців: команда розподіляється по своїй половині, щоб у неї було важче влучити й легше ловити. Імітаційні вправи (кидок без м'яча, ухилення) готують до гри.", "Під час імітації стеж за кроком протилежною ногою і поворотом тулуба."], "ul": ["Ноги зігнуті, вага на носках.", "Розподіліться по полю.", "Тримай руки готовими.", "Повтори кожен кидок без м'яча 5–10 разів.", "Дивися на суперника з м'ячем."]}, {"h": "Доджбол. Кидки в ціль зверху та знизу", "p": ["Кидок зверху: крок протилежною ногою, рука з м'ячем над плечем, поворот тулуба й різкий рух руки вперед. Кидок знизу: рука рухається вздовж тулуба знизу вперед, м'яч випускають на рівні стегна, кидок спрямований у ноги.", "Кидок знизу важче піймати, тому що м'яч летить низько; кидок зверху — точніший на велику відстань."], "ul": ["Перед кидком подивись на ціль.", "Кидок закінчується рухом кисті в бік цілі.", "Кидок знизу — коли ціль близько й низько.", "Кидок зверху — коли ціль далеко.", "Не кидай у голову."]}, {"h": "Доджбол. Гра в доджбол", "p": ["У грі застосуй обидва види кидків. Спостерігай, хто з суперників повільно ухиляється, і кидай у ноги.", "Пам'ятай про правила й чесну гру."], "ul": ["Влучений гравець виходить сам.", "Піймав м'яч — суперник вибуває.", "Не перетинай центральну лінію.", "Допомагай партнерам.", "Слухай суддю."]}], "f": "", "pr": ["Опиши відмінності кидків у ціль зверху й знизу і коли який краще використовувати.", "Влаштуй удома безпечну вправу: кидай згорнуті шкарпетки в кошик з 2–3 метрів по 10 разів кидком зверху і знизу, рахуючи влучання."], "q": ["Як виконують кидок у ціль зверху?", "Чому кидок знизу важче піймати?", "Що таке прицілювання?", "Яка частина руки завершує кидок?"]}, {"n": "35", "t": "Шашки: правила гри, хід, взяття, дамка — типові помилки і прості комбінації", "g": "Учень знатиме типові помилки початківців у шашках і розумітиме найпростіші комбінації.", "k": "Модулі: Шашки", "terms": [["Комбінація", "серія ходів із пожертвою, що веде до виграшу шашок або партії."], ["Зівок", "груба помилка, коли гравець не помітив загрози й віддав шашку без потреби."], ["Відрив", "відхід шашки від своїх, після чого вона залишається без підтримки."], ["Прохідна шашка", "шашка, якій суперник не може перешкодити пройти в дамки."]], "th": [{"h": "Шашки. Правила гри і черговість", "p": ["Ще раз повторюємо правила: як ходять і б'ють прості шашки й дамка, обов'язковість бою, черговість ходу. Це основа, без якої неможливо грати правильно.", "Корисно грати навчальну партію повільно, коментуючи кожен хід уголос."], "ul": ["Перш ніж ходити — перевір обов'язковий бій.", "Проста шашка не ходить назад.", "Дамка не може перестрибувати через свої шашки.", "Через одну шашку двічі бити не можна.", "Ходи по черзі."]}, {"h": "Шашки. Типові помилки і прості комбінації", "p": ["Типові помилки: зівок, відрив шашки, передчасний вихід шашок з останнього ряду. Щоб їх уникнути, після кожного ходу суперника питай себе: «Що він загрожує?».", "Проста комбінація — це коли ти віддаєш одну шашку, щоб потім побити дві або три. Шукай такі можливості, коли шашки суперника стоять з пропусками."], "ul": ["Не залишай шашки поодинці.", "Не поспішай виводити шашки з останнього ряду.", "Рахуй варіанти на 2–3 ходи вперед.", "Шукай пропуски між шашками суперника.", "Прохідна шашка — важлива перевага."]}], "f": "", "pr": ["Намалюй позицію, де одна жертва білої шашки дає змогу побити дві чорні, і запиши ходи.", "Розв'яжи або склади 2 прості шашкові задачі з рідними чи друзями та виконай 2 хвилини дихальної вправи після цього."], "q": ["Що таке зівок і як його уникнути?", "Що таке комбінація?", "Чому не варто передчасно виводити шашки з останнього ряду?", "Яку шашку називають прохідною?"]}, {"n": "36", "t": "Гімнастика: перекид вперед і назад, стійка на голові, лазіння по канату, рівновага", "g": "Учень знатиме техніку перекидів, стійки на голові та вправ на рівновагу і правила безпеки під час акробатики.", "k": "Модулі: Гімнастика", "terms": [["Перекид уперед", "акробатична вправа, коли учень перекочується через голову вперед, спираючись на руки й лопатки."], ["Перекид назад", "перекочування через голову назад з опорою на руки біля плечей."], ["Стійка на голові", "акробатична вправа з опорою на голову й руки, що утворюють трикутник, із прямими ногами вгору."], ["Групування", "положення тіла, коли коліна притиснуті до грудей, а підборіддя — до грудей."], ["Рівновага", "здатність утримувати стійке положення тіла, наприклад стоячи на одній нозі."]], "th": [{"h": "Гімнастика. Перекиди вперед і назад, стійка на голові", "p": ["Перекид уперед: з упору присівши поставити руки на мат, підборіддя притиснути до грудей, відштовхнутися ногами і перекотитися через лопатки, вийти в упор присівши. Перекид назад: з упору присівши перекотитися назад у групуванні, поставити долоні біля плечей і відштовхнутися руками.", "Стійка на голові: голова і руки утворюють рівносторонній трикутник, ноги поступово піднімаються вгору. Її виконують лише зі страхуванням учителя."], "ul": ["Акробатика — лише на матах.", "Підборіддя притиснуте до грудей у перекидах.", "Не перекочуйся на маківку.", "Стійку на голові — тільки з допомогою вчителя.", "Після вправи — повільно піднімайся."]}, {"h": "Гімнастика. Лазіння по вертикальному канату і рівновага", "p": ["Лазіння по канату повторюємо у три прийоми. Вправи на рівновагу — стояння на одній нозі, ходьба по лаві чи колоді з різними положеннями рук — вчать тримати тіло стійко.", "Для рівноваги важливі погляд у одну точку та напружені м'язи живота."], "ul": ["Дивися в одну точку попереду.", "Руки в сторони допомагають втриматися.", "Ходи повільно.", "Якщо втрачаєш рівновагу — зійди на підлогу.", "Під канатом — мати."]}], "f": "", "pr": ["Опиши поетапно перекид уперед (4–5 кроків) і назви 2 головні правила безпеки.", "Виконай вправи на рівновагу біля стіни: «ластівка» (по 10 секунд на кожну ногу) та стояння на одній нозі із заплющеними очима (по 10 секунд), 3 рази. Перекиди вдома не виконуй."], "q": ["Що таке групування?", "Чому в перекиді підборіддя притискають до грудей?", "Як розміщені голова і руки під час стійки на голові?", "Що допомагає утримувати рівновагу?"]}, {"n": "37", "t": "Доджбол: вихідне положення для кидків і ловіння, кидки в ціль зверху та знизу, гра", "g": "Учень удосконалить вибір вихідного положення для кидків і ловіння м'яча та застосовуватиме кидки в грі.", "k": "Модулі: Доджбол", "terms": [["Амортизація", "гасіння швидкості м'яча рухом рук і тулуба назад під час ловіння."], ["Позиція для ловіння", "поза гравця, що стоїть грудьми до суперника з руками перед собою, ноги зігнуті."], ["Швидкий кидок", "кидок без довгого замаху, щоб суперник не встиг відреагувати."], ["Перехоплення ініціативи", "момент, коли команда отримує більше м'ячів і починає активно атакувати."]], "th": [{"h": "Доджбол. Вихідне положення для кидків і ловіння", "p": ["Для кидка гравець стає боком до цілі, рука з м'ячем відведена назад, вага на задній нозі. Для ловіння — грудьми до суперника, ноги зігнуті, руки перед собою з розставленими пальцями.", "Ловлячи м'ячі, гравець виконує амортизацію: руки й тулуб рухаються назад разом із м'ячем, і він притискається до грудей."], "ul": ["Ловити легше м'ячі, що летять у тулуб.", "Низькі м'ячі краще пропустити ухиленням.", "Не ловіть прямими пальцями.", "Після ловіння — швидкий кидок у відповідь.", "Не відвертайся спиною до м'яча."]}, {"h": "Доджбол. Кидки в ціль зверху та знизу", "p": ["Повторюємо кидки: зверху — для точності й дальності, знизу — для влучання в ноги. Швидкий кидок із коротким замахом часто ефективніший, ніж сильний, але передбачуваний.", "Під час тренування кидків у ціль працюй над точністю, а не силою."], "ul": ["Цілься в ноги та тулуб.", "Короткий замах — швидший кидок.", "Крок протилежною ногою.", "Рахуй влучання.", "Дотримуйся черги біля мішені."]}, {"h": "Доджбол. Гра в доджбол", "p": ["У грі застосовуй вивчене: правильно обирай позицію, лови м'ячі, щоб повертати партнерів, і кидай точно.", "Командна тактика — домовляйтеся, хто ловить, а хто кидає."], "ul": ["Слухай сигнали судді.", "Чесно визнавай влучання.", "Не тримай м'яч занадто довго.", "Не кидай у голову.", "Підтримуй товаришів."]}], "f": "", "pr": ["Опиши, що таке амортизація під час ловіння м'яча і навіщо вона потрібна.", "Виконай з кимось із рідних 20 підкидань і ловінь м'якого м'яча чи іграшки з амортизацією (руки йдуть назад разом із м'ячем)."], "q": ["Як стати для ловіння м'яча?", "Що таке амортизація?", "Коли краще ухилитися, ніж ловити?", "Чим швидкий кидок кращий за сильний?"]}, {"n": "38", "t": "Шашки: шашки-100 і шашки-64 (бразильські, міжнародні, чекерс), вправи для фізичних якостей", "g": "Учень знатиме основні різновиди шашок і вправи для підтримки фізичної форми та емоційного стану шашкіста.", "k": "Модулі: Шашки", "terms": [["Шашки-100 (міжнародні)", "різновид шашок на дошці 10×10, де кожен гравець має по 20 шашок."], ["Бразильські шашки", "шашки на дошці 8×8 за правилами міжнародних шашок."], ["Чекерс", "англо-американський різновид шашок на дошці 8×8, де прості шашки б'ють лише вперед, а дамка ходить на одне поле."], ["Шашки-64", "шашки на дошці 8×8 з 64 клітинок, по 12 шашок у кожного гравця."]], "th": [{"h": "Шашки. Різновиди шашок", "p": ["У світі є багато видів шашок. Шашки-64 (поширені в Україні) — дошка 8×8, по 12 шашок, проста шашка б'є вперед і назад, дамка ходить на будь-яку відстань. Міжнародні шашки (шашки-100) — дошка 10×10, по 20 шашок у кожного.", "Бразильські шашки грають на дошці 8×8, але за правилами міжнародних шашок. Чекерс поширений в англомовних країнах: прості шашки б'ють лише вперед, а дамка ходить лише на одне поле."], "ul": ["Шашки-64: дошка 8×8, 12 шашок.", "Шашки-100: дошка 10×10, 20 шашок.", "Бразильські: 8×8, правила міжнародних.", "Чекерс: проста шашка б'є тільки вперед.", "Правила треба домовитися перед грою."]}, {"h": "Шашки. Спеціальні вправи для фізичних якостей і відновлення емоційного стану", "p": ["Шашкісти довго сидять за дошкою, тому їм важливо зміцнювати м'язи спини, шиї й тренувати увагу. Між партіями корисні вправи на поставу, легка розминка та дихальні вправи.", "Для відновлення після напруженої партії допомагає повільне дихання і розслаблення плечей."], "ul": ["Зведення лопаток — 10 разів.", "Повільні повороти голови.", "Потягування вгору на носках.", "Дихання: вдих на 4, видих на 6.", "Короткі перерви між партіями."]}], "f": "Міжнародні шашки на дошці 10×10 — основний різновид для світових змагань.", "pr": ["Склади таблицю порівняння шашок-64, шашок-100, бразильських шашок і чекерсу (дошка, кількість шашок, особливість бою).", "Виконай комплекс для постави: 10 зведень лопаток, 10 потягувань угору, 5 повільних поворотів голови в кожен бік."], "q": ["Скільки шашок у кожного гравця в міжнародних шашках?", "Чим бразильські шашки відрізняються від міжнародних?", "Як б'є проста шашка в чекерсі?", "Чому шашкістам потрібні вправи для постави?"]}, {"n": "39", "t": "Гімнастика: вправи з обтяженням, акробатична комбінація № 1, рівновага, норматив з нахилу", "g": "Учень знатиме, як виконувати акробатичну комбінацію і норматив із нахилу вперед сидячи для оцінювання гнучкості.", "k": "Модулі: Гімнастика", "terms": [["Акробатична комбінація", "послідовність кількох акробатичних вправ, виконаних без зупинок."], ["Гнучкість", "здатність виконувати рухи з великою амплітудою."], ["Амплітуда", "розмах руху від початкового до кінцевого положення."], ["Нахил уперед сидячи", "тест на гнучкість, коли учень сидить з прямими ногами й тягнеться руками вперед."]], "th": [{"h": "Гімнастика. Вправи з обтяженням і акробатична комбінація № 1", "p": ["Акробатична комбінація поєднує вивчені вправи: наприклад, перекиди, стійку на лопатках, рівновагу — у визначеній вчителем послідовності. Головне — плавні переходи від однієї вправи до іншої.", "Комбінацію виконують на матах, повторюючи спочатку окремі вправи, а потім разом."], "ul": ["Вивчи порядок вправ напам'ять.", "Переходи — без зайвих зупинок.", "Тримай ноги прямими, носки натягнутими.", "Комбінацію — лише на матах.", "Після вправ з обтяженням — розслаблення."]}, {"h": "Гімнастика. Лазіння по канату, рівновага і норматив: нахил уперед сидячи", "p": ["Норматив перевіряє гнучкість: учень сидить, ноги прямі, стопи впираються в позначку. Він повільно нахиляється вперед, тягнучись руками якомога далі, і утримує положення. Результат вимірюють у сантиметрах.", "Щоб підготуватися, потрібна розминка й вправи на розтягування. Нахили виконують плавно, без ривків."], "ul": ["Коліна не згинай.", "Тягнися плавно, на видиху.", "Утримай положення 2–3 секунди.", "Розімни м'язи перед тестом.", "Не допомагай собі ривком."]}], "f": "", "pr": ["Виконай нахил уперед сидячи вдома (плавно, без ривків) після розминки і запиши, до якої частини ніг дотягуєшся.", "Виконуй щодня 5 хвилин вправ на розтягування (нахили, «метелик», розтягування задньої поверхні стегна) протягом тижня і порівняй результат."], "q": ["Що таке гнучкість?", "Як правильно виконувати нахил уперед сидячи?", "Чому під час розтягування не можна робити ривки?", "Що таке акробатична комбінація?"]}, {"n": "40", "t": "Доджбол: вправи для сили кистей, імітаційні вправи, гра, норматив з кидків у ціль", "g": "Учень знатиме вправи для розвитку сили кистей і як виконувати норматив з кидків у ціль зверху.", "k": "Модулі: Доджбол", "terms": [["Сила кисті", "здатність м'язів кисті й пальців стискати та утримувати предмети."], ["Кистьовий еспандер", "невелике кільце або пружинний тренажер для зміцнення пальців і кисті."], ["Влучання", "попадання м'ячем у ціль."], ["Залікова спроба", "спроба, результат якої зараховується під час нормативу."]], "th": [{"h": "Доджбол. Вправи для розвитку сили м'язів кистей рук", "p": ["Сильні кисті допомагають міцно тримати м'яч і точно кидати. Для цього стискають кистьовий еспандер або тенісний м'ячик, роблять оберти кистями, віджимання на пальцях від стіни.", "Вправи виконують поступово, без болю."], "ul": ["Стискання м'ячика — 15–20 разів кожною рукою.", "Оберти кистями в обидва боки.", "Віджимання від стіни на пальцях.", "Розтягування пальців після вправ.", "Не перенапружуйся."]}, {"h": "Доджбол. Імітаційні вправи і гра", "p": ["Імітація кидків і ухилень перед грою розігріває м'язи та нагадує правильну техніку. У грі використовуй різні кидки, але пам'ятай про безпеку.", "Гра — це і змагання, і спілкування: підтримуй своїх і поважай суперників."], "ul": ["Повтори кидок без м'яча 10 разів.", "Повтори ухилення.", "Кидки — нижче голови.", "Чесно визнавай влучання.", "Слухай суддю."]}, {"h": "Доджбол. Норматив: кидки м'яча в ціль зверху", "p": ["Норматив — 6 кидків м'яча в ціль зверху, оцінюють кількість влучань. Кожна спроба виконується з визначеної лінії.", "Перед кидком прийми вихідне положення: боком до цілі, рука з м'ячем відведена назад. Цілься, роби крок протилежною ногою і кидай, закінчуючи рух кистю."], "ul": ["Не заступай за лінію.", "Не поспішай між спробами.", "Дихай спокійно.", "Тримай однакову техніку в кожній спробі.", "Запиши кількість влучань."]}], "f": "", "pr": ["Виконуй вправи для кистей щодня тиждень: стискання м'ячика 3×15 кожною рукою, оберти кистями, розтягування пальців.", "Удома кидай згорнуті шкарпетки в кошик з 2–3 метрів 6 разів кидком зверху, запиши кількість влучань і порівняй з нормативом на уроці."], "q": ["Навіщо доджболістові сильні кисті?", "Як виконується кидок у ціль зверху?", "Скільки спроб дається в нормативі з кидків у ціль?", "Які вправи зміцнюють кисті?"]}, {"n": "41", "t": "Шашки: шашкова нотація, запис ходів і позицій, навчальна гра", "g": "Учень знатиме, як позначаються поля шашкової дошки та як записувати ходи й позиції.", "k": "Модулі: Шашки", "terms": [["Шашкова нотація", "система запису ходів і позицій у шашках за допомогою букв і цифр."], ["Вертикаль", "ряд полів дошки знизу вгору, позначений буквою від a до h."], ["Горизонталь", "ряд полів дошки зліва направо, позначений цифрою від 1 до 8."], ["Запис партії", "послідовний запис усіх ходів гри для подальшого аналізу."]], "th": [{"h": "Шашки. Шашкова нотація", "p": ["На дошці 8×8 вертикалі позначають латинськими буквами a, b, c, d, e, f, g, h зліва направо (з боку білих), а горизонталі — цифрами від 1 до 8 знизу вгору. Тож кожне поле має свою назву, наприклад c3 або f6.", "Хід записують назвою поля, звідки пішла шашка, і поля, куди вона прийшла, через риску: c3-d4. Взяття записують через двокрапку: c3:e5."], "ul": ["Поле a1 — темне, воно в лівому нижньому куті з боку білих.", "Хід: c3-d4.", "Бій: c3:e5.", "Бій кількох шашок: c3:e5:g3.", "Ходи білих і чорних записують парами з номером ходу."]}, {"h": "Шашки. Запис позиції і навчальна гра", "p": ["Позицію и й проходять над снарядом, приземлення на зігнуті ноги. Учитель страхує, стоячи за снарядом."], "ul": ["Не лізь високо по стінці без дозволу.", "Стрибок — лише зі страхуванням.", "Поштовх руками від козла активний.", "Приземлення — на мат, руки вперед.", "Не стрибай, поки попередній учень не відійшов."]}, {"h": "Гімнастика. Норматив: піднімання тулуба в сід за 30 секунд", "p": ["Учень лягає на спину, ноги зігнуті в колінах, стопи закріплює партнер. Руки за головою або схрещені на грудях. За сигналом він піднімається до торкання ліктями колін і повертається, торкаючись лопатками мату. Рахують кількість правильних повторень за 30 секунд.", "Щоб виконати норматив добре, потрібні сильні м'язи живота й рівномірний темп."], "ul": ["Не тягни голову руками.", "Торкайся лопатками мату.", "Видих — під час підйому.", "Тримай рівномірний темп.", "Неповні повторення не зараховуються."]}], "f": "", "pr": ["Опиши фази опорного стрибка «ноги нарізно» і назви, хто і як страхує учня.", "Виконуй удома піднімання тулуба в сід на килимку: 3 підходи по 10–15 повторень щодня протягом тижня, стопи підведи під диван."], "q": ["Які вправи виконують на гімнастичній стінці?", "З яких фаз складається опорний стрибок «ноги нарізно»?", "Як правильно виконувати піднімання тулуба в сід?", "Які повторення не зараховуються в нормативі?"]}, {"n": "43", "t": "Доджбол: гра в доджбол, суддівство і командна взаємодія", "g": "Учень закріпить правила доджболу та знатиме основи суддівства й командної взаємодії.", "k": "Модулі: Доджбол", "terms": [["Суддя", "людина, яка стежить за дотриманням правил і приймає рішення в грі."], ["Порушення", "дія гравця, що суперечить правилам гри."], ["Капітан команди", "гравець, який організовує команду й спілкується з суддею."], ["Командна взаємодія", "спільні дії гравців однієї команди для досягнення мети."]], "th": [{"h": "Доджбол. Гра і правила", "p": ["На уроці проходить гра в доджбол. Перед грою повторюємо правила: кидки нижче голови, заборона перетинати центральну лінію, вибування після влучання, вибування того, хто кидав, якщо м'яч піймали.", "Гравці мають бути уважними й стежити за кількома м'ячами одночасно."], "ul": ["Влучення в голову не зараховується.", "Перетнув лінію — вибув.", "М'яч після відскоку від підлоги не вибиває.", "Тримати м'яч довго не можна.", "Вибуті гравці стоять у визначеній зоні."]}, {"h": "Доджбол. Суддівство і командна взаємодія", "p": ["Суддя стежить за правилами, вирішує спірні моменти та подає сигнали свистком. Гравці поважають рішення судді, навіть якщо не згодні.", "Капітан організовує команду: розподіляє, хто кидає, хто ловить, і підбадьорює партнерів."], "ul": ["Свисток — зупинка гри.", "Спірні питання вирішує суддя, а не гравці.", "Капітан говорить за команду.", "Підтримуй партнерів.", "Подякуй суперникам після гри."]}], "f": "", "pr": ["Уяви, що ти суддя гри в доджбол: запиши 5 ситуацій, які вважаються порушеннями, і яке рішення ти приймеш.", "Виконай вправи для кистей і плечей: 15 обертів руками, 20 стискань м'ячика кожною рукою."], "q": ["Які обов'язки судді в доджболі?", "Яка роль капітана команди?", "Чи вибуває гравець, якщо в нього влучив м'яч після відскоку від підлоги?", "Як треба поводитися, якщо не згоден з рішенням судді?"]}, {"n": "44", "t": "Шашки: шашкова нотація, запис ходів і позицій, розбір навчальної партії", "g": "Учень закріпить уміння записувати ходи й позиції та навчиться розбирати свою партію за записом.", "k": "Модулі: Шашки", "terms": [["Діаграма", "малюнок шашкової дошки з розставленими шашками певної позиції."], ["Розбір партії", "аналіз зіграної гри за записом для пошуку кращих ходів і помилок."], ["Дебют", "початок шашкової партії, перші ходи."], ["Ендшпіль", "завершальна частина партії, коли на дошці залишилося мало шашок."]], "th": [{"h": "Шашки. Запис ходів і позиції", "p": ["Повторюємо нотацію: поле позначається буквою вертикалі й цифрою горизонталі. Хід — через риску, бій — через двокрапку. Позицію можна записати переліком полів або намалювати діаграму.", "Діаграма зручна, щоб показати задачу або цікавий момент партії."], "ul": ["Білі: перелік полів з білими шашками.", "Чорні: перелік полів з чорними шашками.", "Дамку позначай окремо.", "Перевір, що всі шашки стоять на темних полях.", "Номеруй ходи."]}, {"h": "Шашки. Навчальна гра і розбір партії", "p": ["Партію умовно ділять на дебют, середину гри і ендшпіль. У дебюті важливо зайняти центр і не поспішати, у середині гри — шукати комбінації, в ендшпілі — проводити шашки в дамки.", "Після навчальної гри відкрий запис і знайди момент, коли ситуація змінилася на твою користь чи навпаки."], "ul": ["Дебют — займай центр.", "Середина гри — шукай удари.", "Ендшпіль — бережи і проводь шашки в дамки.", "Відзначай помилки знаком питання.", "Вдалі ходи — знаком оклику."]}], "f": "", "pr": ["Намалюй діаграму позиції з будь-якої своєї партії та запиши її в нотації.", "Зіграй навчальну партію, запиши її і знайди 2 помилки під час розбору."], "q": ["Що таке діаграма в шашках?", "Які три частини має партія?", "Що найважливіше в ендшпілі?", "Як позначають помилкові та вдалі ходи під час розбору?"]}, {"n": "45", "t": "Гімнастика: виси та упори, комбінація на перекладині й брусах, акробатична комбінація № 2, норматив з віджимань", "g": "Учень знатиме різновиди висів і упорів, вимоги до гімнастичних комбінацій та як виконувати норматив зі згинання і розгинання рук в упорі.", "k": "Модулі: Гімнастика", "terms": [["Вис змішаний", "вис, коли тіло тримається на руках і одночасно спирається ногами."], ["Упор лежачи", "положення з опорою на прямі руки й носки, тіло пряме."], ["Гімнастична лава", "низька довга лава, яку використовують для вправ і як опору."], ["Згинання і розгинання рук в упорі", "силова вправа для м'язів рук, грудей і плечей, віджимання."]], "th": [{"h": "Гімнастика. Виси та упори, комбінація на перекладині і брусах", "p": ["Виси бувають прості (тіло звисає на руках) і змішані (з опорою ногами). Упори — коли плечі вище точки опори: упор на брусах, упор лежачи, упор присівши. На перекладині та брусах виконують комбінацію з кількох вивчених вправ.", "Під час виконання стеж за положенням плечей і прямим тілом, а зіскок виконуй на мат."], "ul": ["Хват — міцний, великий палець обхоплює жердину.", "Тіло пряме, носки натягнуті.", "Зіскок — на зігнуті ноги.", "Страхування вчителя обов'язкове.", "Не виконуй вправ з мокрими долонями."]}, {"h": "Гімнастика. Акробатична комбінація № 2 і норматив: згинання і розгинання рук в упорі", "p": ["Акробатична комбінація № 2 складається з вивчених вправ у визначеній вчителем послідовності. Оцінюють правильність, плавність і безпечність виконання.", "Норматив: хлопці — віджимання в упорі лежачи, дівчата — від гімнастичної лави. Тіло пряме, руки згинаються до кута 90 градусів або до торкання грудьми опори, потім повністю випрямляються. Рахують кількість правильних повторень."], "ul": ["Не прогинайся в попереку.", "Не піднімай таз угору.", "Опускайся повністю.", "Випрямляй руки до кінця.", "Дихай рівно: вниз — вдих, угору — видих."]}], "f": "", "pr": ["Запиши, чим відрізняються вис і упор, і наведи по 2 приклади кожного.", "Виконуй віджимання (хлопці — від підлоги або з колін, дівчата — від стільця чи дивана): 3 підходи по 8–12 разів щодня протягом тижня."], "q": ["Чим простий вис відрізняється від змішаного?", "Як правильно виконувати віджимання в нормативі?", "Які помилки роблять під час віджимань?", "Що оцінюють в акробатичній комбінації?"]}, {"n": "46", "t": "Доджбол: вправи для сили кистей, кидки однією рукою зверху над собою в парах і в колонах, гра", "g": "Учень знатиме, як виконувати кидки однією рукою зверху в парах і в колонах та застосовувати їх у грі.", "k": "Модулі: Доджбол", "terms": [["Кидок однією рукою зверху над собою", "кидок, коли рука з м'ячем піднята над плечем і рухається вперед-угору."], ["Вправа в колонах", "вправа, де учні стоять один за одним і по черзі виконують завдання."], ["Передача м'яча партнерові", "кидок, мета якого — щоб партнер зручно піймав м'яч."], ["Точність кидка", "уміння кинути м'яч саме туди, куди спрямовано."]], "th": [{"h": "Доджбол. Вправи для сили кистей та імітаційні вправи", "p": ["Повторюємо вправи для кистей: стискання м'ячика, оберти кистями, віджимання від стіни на пальцях. Імітаційні вправи — кидки без м'яча — перевіряють правильність руху.", "Сильні пальці дозволяють міцно тримати навіть великий м'яч однією рукою."], "ul": ["Стискання м'ячика 3×15.", "Оберти кистями.", "Імітація кидка 10 разів кожною рукою.", "Розтягування пальців.", "Не перенапружуйся."]}, {"h": "Доджбол. Кидки однією рукою зверху в парах і в колонах", "p": ["У парах учні кидають м'яч однією рукою зверху один одному, поступово збільшуючи відстань. У колонах перший учень кидає м'яч партнерові навпроти і переходить у кінець колони.", "Кидок має бути точним і помірним за силою — партнер має його піймати."], "ul": ["Рука з м'ячем над плечем.", "Крок протилежною ногою.", "Цілься в груди партнера.", "Після кидку переходь у кінець колони.", "Не кидай, якщо партнер не готовий."]}, {"h": "Доджбол. Гра в доджбол", "p": ["У грі використовуй кидки однією рукою зверху для точних влучань і передач партнерам.", "Дотримуйся правил і поважай суперників."], "ul": ["Кидки нижче голови.", "Чесна гра.", "Слухай суддю.", "Допомагай партнерам.", "Збери м'ячі після гри."]}], "f": "", "pr": ["Опиши послідовність кидка однією рукою зверху (4–5 кроків).", "Виконай з кимось із рідних 20 передач м'якого м'ячика однією рукою зверху на відстані 2–3 метри в безпечному місці."], "q": ["Як виконується кидок однією рукою зверху?", "Як організовано вправу в колонах?", "Куди цілитися під час передачі партнерові?", "Як вправи для кистей допомагають у доджболі?"]}, {"n": "47", "t": "Шашки: хід, взяття, шашка, дамка, черговість ходу й бою — повторення, навчальна гра", "g": "Учень повторить і закріпить усі основні правила гри в шашки та застосує їх у навчальній грі.", "k": "Модулі: Шашки", "terms": [["Турецький удар", "правило, за яким збиті шашки знімають лише після завершення всього ходу, тому через ту саму шашку двічі бити не можна."], ["Тиха гра", "хід без взяття, спрямований на поліпшення позиції."], ["Блокування", "позиція, коли шашки суперника не можуть зробити жодного ходу."], ["Цейтнот", "брак часу на обдумування ходів у партії з годинником."]], "th": [{"h": "Шашки. Повторення правил", "p": ["Узагальнюємо правила: проста шашка ходить вперед на одне поле, б'є вперед і назад; дамка ходить і б'є на будь-яку відстань по діагоналі; бити обов'язково; бити ланцюжком до кінця; збиті шашки знімають після ходу.", "Перемога — коли в суперника не лишилося шашок або всі вони заблоковані."], "ul": ["Проста шашка — на одне поле вперед.", "Дамка — на будь-яку відстань.", "Бій — обов'язковий.", "Збиті шашки — знімають після ходу.", "Заблокований суперник програє."]}, {"h": "Шашки. Навчальна гра", "p": ["У навчальній грі застосуй усе вивчене: займай центр, не залишай шашки поодинці, шукай комбінації й записуй ходи.", "Корисно грати з різними суперниками — так ти вчишся бачити різні стилі гри."], "ul": ["Перевіряй загрози суперника.", "Шукай можливість блокування.", "Тиха гра теж важлива.", "Не поспішай.", "Поважай суперника."]}], "f": "", "pr": ["Склади пам'ятку «10 головних правил гри в шашки» для молодшого брата, сестри або друга.", "Зіграй дві навчальні партії з рідними і запиши, як вони завершилися."], "q": ["Як ходить і б'є проста шашка?", "Що означає правило турецького удару?", "Коли гравець вважається переможеним?", "Що таке тиха гра?"]}, {"n": "48", "t": "Гімнастика: підтягування, норматив. Підсумок ІІ чверті: доджбол, шашки, гімнастика", "g": "Учень знатиме, як виконати норматив з підтягування, та повторить вивчене з доджболу, шашок і гімнастики.", "k": "Модулі: Гімнастика · Доджбол · Шашки", "terms": [["Підтягування у висі", "силова вправа на перекладині, коли учень із вису піднімається до положення підборіддя над перекладиною."], ["Вис лежачи", "положення під низькою перекладиною, коли тіло пряме, ноги спираються п'ятами на підлогу."], ["Підсумковий урок", "урок, на якому узагальнюють і перевіряють вивчене за чверть."], ["Самооцінка", "оцінювання власних досягнень і того, над чим ще треба попрацювати."]], "th": [{"h": "Гімнастика. Норматив: підтягування", "p": ["Хлопці виконують підтягування у висі на високій перекладині, дівчата — у висі лежачи на низькій. Хват зверху на ширині плечей. Підтягнутися треба так, щоб підборіддя опинилося над перекладиною, а потім повністю опуститися на прямі руки. Рахують кількість правильних повторень.", "Розгойдування й ривки ногами не допускаються — такі повторення не зараховують."], "ul": ["Хват зверху, на ширині плечей.", "Підборіддя — над перекладиною.", "Опускайся до прямих рук.", "Тіло не розгойдується.", "Зіскок — на мат."]}, {"h": "Доджбол. Шашки. Підсумок вивченого за чверть", "p": ["У доджболі ми вивчили стійку, розміщення гравців, кидки зверху, збоку й знизу, ловіння з амортизацією, правила гри й суддівство. У шашках — правила ходу й бою, дамку, різновиди шашок, нотацію і розбір партії. У гімнастиці — ранкову гімнастику, лазіння по канату, вправи на брусах і перекладині, акробатику, опорні стрибки.", "Діагностувальна робота за групами результатів показує, як ти рухаєшся, як дбаєш про здоров'я та що знаєш. Оціни себе чесно і постав мету на наступну чверть."], "ul": ["Доджбол: кидки, ловіння, правила, безпека.", "Шашки: хід, бій, дамка, нотація.", "Гімнастика: канат, акробатика, опорний стрибок.", "Нормативи: нахил, піднімання тулуба, віджимання, підтягування.", "Самооцінка і мета на наступну чверть."]}], "f": "", "pr": ["Склади таблицю своїх результатів нормативів за чверть (нахил, піднімання тулуба, віджимання, кидки в ціль) і напиши одну мету на наступну чверть.", "Виконай комплекс ЗРВ з 8 вправ та 3 підходи по 10 віджимань від стіни або стола для зміцнення рук."], "q": ["Як правильно виконувати підтягування у висі та у висі лежачи?", "Назви три види кидків у доджболі.", "Як записують бій у шашковій нотації?", "Які правила безпеки потрібні під час лазіння по канату?"]}]}, {"name": "ІІІ чверть. Футзал, рухливі ігри, доджбол", "lessons": [{"n": "49", "t": "Футзал: правила безпеки, особливості гри та навчальна гра", "g": "Дізнатися, чим футзал відрізняється від великого футболу, і засвоїти правила безпечної поведінки на заняттях.", "k": "Модулі: Футзал", "terms": [["Футзал", "командна гра у футбол у залі на невеликому майданчику з твердим покриттям, у якій грають дві команди по п'ять гравців."], ["Воротар", "гравець, який захищає ворота і може грати руками у своєму штрафному майданчику."], ["Ввід м'яча ногою", "спосіб повернути м'яч у гру після виходу за бокову лінію: м'яч ставлять на лінію і пасують ногою."], ["Навчальна гра", "гра за основними правилами, під час якої учні закріплюють вивчені прийоми, а вчитель підказує та виправляє помилки."]], "th": [{"h": "Футзал. Правила безпечної поведінки на уроках і поза ними", "p": ["Футзал — швидка гра: м'яч рухається часто й низько, гравці різко змінюють напрямок і часто опиняються поруч. Тому безпека тут — не формальність, а умова того, щоб гра приносила радість, а не травми.", "Ті самі правила варто пам'ятати й тоді, коли граєш з друзями у дворі чи на шкільному майданчику після уроків."], "ul": ["Займайся у спортивному взутті з неслизькою підошвою та у зручному одязі без прикрас, годинника, значків.", "Починай гру лише після розминки: суглоби і м'язи мають бути розігріті.", "Не штовхай суперника, не підставляй ногу, не грай «у підкаті» на твердому покритті.", "Не бий по м'ячу з усієї сили, якщо поруч стоять гравці без готовності його прийняти.", "Перед грою перевір майданчик: чи немає на ньому сторонніх предметів, води, розв'язаних шнурків.", "Якщо відчув біль або отримав удар — зупинись і одразу скажи вчителю чи дорослому."]}, {"h": "Футзал. Особливості гри та навчальна гра", "p": ["У футзал грають дві команди по п'ять гравців (разом із воротарем). М'яч менший і важчий за звичайний футбольний, він слабше відскакує від підлоги, тому його зручніше контролювати ногою. Замін можна робити багато і в будь-який момент гри — через спеціальну зону біля лави запасних.", "Під час навчальної гри головне — не лише забити гол, а й застосувати те, що вивчали: точні передачі, зупинку м'яча, рух без м'яча, допомогу партнерам у захисті."], "ul": ["Гравці: 4 польові + 1 воротар у кожній команді.", "Коли м'яч виходить за бокову лінію — його вводять ногою, а не руками.", "Воротар грає руками лише у своєму штрафному майданчику.", "Грубі порушення (штовхання, удари по ногах, гра руками) караються штрафними ударами.", "Гравці постійно рухаються: захищаються всією командою і всією командою атакують."]}], "f": "Назва «футзал» походить від іспанського та португальського виразу, що означає «футбол у залі».", "pr": ["Запиши в зошит 5 правил безпечної поведінки під час гри у футзал, які ти вважаєш найважливішими, і поясни, чому.", "Намалюй схему майданчика для футзалу: позначи ворота, центральну лінію, штрафні майданчики та розстав гравців обох команд."], "q": ["Скільки гравців у команді у футзалі виходить на майданчик?", "Як вводять м'яч у гру, якщо він вийшов за бокову лінію?", "Чому на твердому покритті не можна грати в підкаті?", "Що потрібно зробити, якщо під час гри ти відчув біль?"]}, {"n": "50", "t": "Рухливі ігри на розвиток швидкості", "g": "Зрозуміти, що таке швидкість і реакція, та дізнатися, як рухливі ігри допомагають їх розвивати.", "k": "Модулі: Рухливі ігри", "terms": [["Швидкість", "здатність людини виконувати рухи за найкоротший час."], ["Швидкість реакції", "час від появи сигналу (звуку, жесту) до початку руху у відповідь."], ["Стартове прискорення", "перші кроки після старту, під час яких бігун максимально швидко набирає швидкість."], ["Рухлива гра", "гра з активними рухами за певними правилами, у якій діти змагаються, співпрацюють і розвивають фізичні якості."]], "th": [{"h": "Рухливі ігри. Що таке швидкість і як її розвивати", "p": ["Швидкість — одна з головних фізичних якостей. Вона потрібна майже в кожному виді спорту: щоб добігти до м'яча першим, ухилитися від кидка, вчасно стартувати в естафеті. Швидкість складається з кількох частин: як швидко ти реагуєш на сигнал, як швидко робиш один рух і як часто можеш повторювати рухи.", "Найкраще швидкість розвивається у віці 12–13 років саме в іграх: коли азартно, ти мимоволі біжиш і реагуєш швидше, ніж під час звичайного бігу."], "ul": ["Швидкісні вправи виконують на початку основної частини уроку, коли ти ще не втомився.", "Відрізки бігу мають бути короткими, з повноцінним відпочинком між ними.", "Сигнали до старту бувають різні: свисток, оплеск, змах руки, слово.", "Старт із різних положень (сидячи, лежачи, спиною вперед) тренує реакцію.", "Розминка перед швидкісними іграми обов'язкова — інакше легко пошкодити м'язи ніг."]}, {"h": "Рухливі ігри. Ігри на швидкість та правила безпеки", "p": ["На уроці використовують ігри, у яких потрібно швидко стартувати, наздогнати або втекти: «Виклик номерів», «День і ніч», «Хвилі», «Квач». У кожної гри є чіткі правила, межі майданчика й сигнали, і їх треба виконувати чесно.", "Щоб гра була безпечною, бігай лише у своєму напрямку, дивись перед собою і не штовхай суперника, коли його наздоганяєш, — достатньо торкнутися рукою."], "ul": ["«День і ніч»: дві команди стоять спинами одна до одної; за сигналом одна тікає, інша наздоганяє.", "«Виклик номерів»: учитель називає номер, гравці з цим номером біжать до прапорця і назад.", "Квача торкаються легко, долонею, не б'ють і не хапають за одяг.", "Межі майданчика не можна порушувати — вибіг за межу означає вибуття або штрафне очко.", "Після швидких ігор не сідай одразу — пройдися кроком, щоб відновити дихання."]}], "f": "", "pr": ["Пограй вдома з членом родини у гру на реакцію: партнер тримає над твоєю долонею олівець і відпускає без попередження, а ти намагаєшся його впіймати. Спробуй 10 разів і запиши, скільки разів упіймав.", "Опиши в зошиті правила однієї рухливої гри на швидкість, яку ти знаєш, і поясни, яку якість вона розвиває."], "q": ["Що таке швидкість реакції?", "Чому швидкісні вправи краще виконувати на початку основної частини уроку?", "Назви дві рухливі гри на розвиток швидкості.", "Як правильно «осалити» гравця під час гри, щоб не травмувати його?"]}, {"n": "51", "t": "Доджбол: кидки м'яча в парах та в ціль, гра «Вибивний»", "g": "Ознайомитися з грою доджбол, правилами безпеки та технікою кидків у парах і в ціль.", "k": "Модулі: Доджбол", "terms": [["Доджбол", "командна гра, у якій гравці намагаються влучити м'ячем у суперників, а ті ухиляються, ловлять або відбивають м'яч."], ["Вибивний", "рухлива гра, у якій гравці з краю майданчика вибивають м'ячем тих, хто перебуває всередині."], ["Кидок у ціль", "кидок м'яча, під час якого гравець прицілюється і намагається влучити в певну точку чи предмет."], ["Ловіння м'яча", "прийом, коли гравець зупиняє і втримує м'яч руками, притискаючи його до тулуба."]], "th": [{"h": "Доджбол. Що це за гра та правила безпеки", "p": ["Доджбол (від англійського слова, що означає «ухилятися») — динамічна командна гра з м'ячами. Дві команди стоять на своїх половинах майданчика і кидають м'ячі, намагаючись влучити в суперника. Гравець, у якого влучили, вибуває. Якщо ж він упіймав м'яч, вибуває той, хто кидав.", "На уроках використовують м'які м'ячі, які не завдають болю. Але навіть із таким м'ячем треба дотримуватися правил, щоб гра залишалася веселою й безпечною."], "ul": ["Цілься в тулуб і ноги, ніколи не кидай м'яч у голову.", "Не виходь за межі своєї половини майданчика.", "Не кидай м'яч у гравця, який уже вибув або відвернувся, щоб іти з майданчика.", "Під час ловіння тримай пальці розслабленими і трохи зігнутими, щоб не вибити їх.", "Слухай свисток: після сигналу всі кидки припиняються."]}, {"h": "Доджбол. Кидки в парах, у ціль та гра «Вибивний»", "p": ["Перш ніж грати, треба навчитися точно кидати і впевнено ловити. Тому спочатку виконують кидки в парах: партнери стоять один навпроти одного і передають м'яч різними способами. Потім кидають у ціль — обруч, кеглю, позначку на стіні.", "Гра «Вибивний» — простіший варіант доджболу. Двоє «вибивал» стоять за лініями з двох боків, а решта гравців — у середині. Вибивали кидають м'яч, а гравці в середині ухиляються. Хто впіймав м'яч — отримує додаткове «життя»."], "ul": ["Перед кидком подивись на ціль і розверни до неї плечі.", "Замах робиться від плеча, кидок завершується рухом кисті вперед-донизу.", "Ловлячи м'яч, витягни руки назустріч і одразу «підтягни» його до грудей.", "Не стій на місці — постійно рухайся, щоб у тебе важче було влучити.", "У «Вибивному» відстань між лініями вибивал невелика, тому кидати треба не сильно, а точно."]}], "f": "Доджбол має міжнародні змагання і власні федерації, а в багатьох школах світу це одна з найулюбленіших ігор на уроках фізкультури.", "pr": ["Кидай м'який м'ячик або згорнуту шкарпетку в кошик чи коробку з відстані 2–3 кроки: зроби 3 серії по 10 кидків і запиши кількість влучень.", "Запиши правила гри «Вибивний» і придумай одне власне правило, яке зробило б гру цікавішою, але безпечною."], "q": ["Що означає назва «доджбол»?", "Що відбувається, якщо гравець упіймав кинутий у нього м'яч?", "Куди заборонено цілитися під час гри?", "Як правильно ловити м'яч, щоб не травмувати пальці?"]}, {"n": "52", "t": "Футзал: пересування, ведення, удари ногою й головою, зупинки м'яча", "g": "Вивчити основні способи пересування, ведення м'яча, ударів носком і внутрішньою стороною стопи та зупинок м'яча.", "k": "Модулі: Футзал", "terms": [["Ведення м'яча", "переміщення гравця з м'ячем, коли він легкими поштовхами ноги котить м'яч поруч із собою."], ["Удар внутрішньою стороною стопи", "найточніший удар у футболі, яким виконують короткі передачі та удари по воротах з близької відстані."], ["Удар носком", "швидкий удар кінчиком взуття, корисний, коли треба різко пробити без замаху."], ["Зупинка м'яча", "прийом, яким гравець гасить швидкість м'яча і залишає його поруч із собою для подальших дій."], ["Ривок", "раптове коротке прискорення для того, щоб обігнати суперника або встигнути до м'яча."]], "th": [{"h": "Футзал. Пересування, прискорення і ведення м'яча", "p": ["У футзалі гравець весь час рухається: ходить, біжить приставними кроками, задом наперед, робить ривки. Ці рухи допомагають швидко займати вигідну позицію і відриватися від суперника.", "Ведення м'яча — це не сильні удари, а часті легкі поштовхи. М'яч має бути близько, щоб суперник не міг його забрати. Ведуть м'яч внутрішньою, зовнішньою частиною стопи або підйомом (шнурками)."], "ul": ["Під час ведення дивись не лише на м'яч, а й перед собою — на партнерів і суперників.", "Торкайся м'яча на кожному другому-третьому кроці.", "Тулуб трохи нахилений уперед, коліна злегка зігнуті.", "Для ривка з м'ячем відштовхни його трохи далі і різко прискорся.", "Типова помилка — відпустити м'яч далеко від себе, і його легко перехопити."]}, {"h": "Футзал. Удари по м'ячу ногою та головою", "p": ["Удар внутрішньою стороною стопи виконують так: опорну ногу ставлять поруч із м'ячем, носок ударної ноги розвертають назовні, удар наносять серединою внутрішньої частини стопи в центр м'яча. Удар носком — короткий і різкий, без великого замаху, корисний на тісному майданчику.", "Удари головою на уроках вивчають лише з легким м'ячем: м'яч приймають серединою лоба, без стрибка, очі не заплющують, шию напружують."], "ul": ["Опорна нога — поруч із м'ячем, носок спрямований у бік передачі.", "Ударна нога після удару продовжує рух у напрямку цілі.", "Для удару носком стопа напружена, удар — у центр м'яча.", "Головою б'ють лише лобом, ніколи тім'ям чи потилицею.", "Удари головою на уроці — тільки зменшеним за вагою м'ячем."]}, {"h": "Футзал. Зупинки м'яча", "p": ["Зупинити м'яч — означає «погасити» його швидкість. Для цього в момент дотику стопа трохи відходить назад, ніби м'яко приймаючи м'яч. Зупиняють м'яч підошвою, внутрішньою стороною стопи, рідше — стегном чи грудьми.", "У футзалі найчастіше використовують зупинку підошвою: м'яч на твердій підлозі котиться рівно, і його зручно «притиснути» ногою."], "ul": ["Перед прийомом вийди назустріч м'ячу.", "Під час зупинки підошвою носок трохи піднятий, п'ята нижче.", "Зупинка внутрішньою стороною: стопа розвернута, нога рухається назад у момент дотику.", "Помилка — тримати ногу напруженою: м'яч відскакує.", "Після зупинки одразу підніми голову і вибери наступну дію."]}], "f": "", "pr": ["Покатай ногою невеликий м'яч або тенісний м'ячик на місці: 30 секунд підошвою правої ноги, 30 секунд лівої, вперед-назад і вбік. Повтори 3 рази.", "Опиши в зошиті послідовність фаз удару внутрішньою стороною стопи: положення опорної ноги, замах, удар, супровід."], "q": ["Як має стояти опорна нога під час удару внутрішньою стороною стопи?", "Якою частиною голови правильно бити по м'ячу?", "Чому під час ведення м'яч має бути близько до ноги?", "Що робить нога в момент зупинки м'яча, щоб погасити його швидкість?"]}, {"n": "53", "t": "Рухливі ігри: види ігор та гра «Боротьба в квадратах»", "g": "Дізнатися, які бувають рухливі ігри за завданнями і руховим змістом, та навчитися грати в «Боротьбу в квадратах».", "k": "Модулі: Рухливі ігри", "terms": [["Педагогічне завдання гри", "те, чого гра навчає або що вона розвиває: швидкість, спритність, увагу, вміння співпрацювати."], ["Руховий зміст гри", "основні рухи, з яких складається гра: біг, стрибки, кидки, перетягування, повзання."], ["Командна гра", "гра, у якій результат залежить від спільних дій усіх гравців команди."], ["Силове єдиноборство", "вправа або гра, у якій два учасники змагаються між собою силою, наприклад виштовхують один одного з кола."]], "th": [{"h": "Рухливі ігри. Види рухливих ігор", "p": ["Рухливих ігор дуже багато, і їх можна розподілити на групи. За руховим змістом бувають ігри з бігом, стрибками, метанням, ігри з м'ячем, з подоланням перешкод, з перетягуванням. За організацією — індивідуальні (кожен сам за себе) і командні.", "У кожної гри є своє педагогічне завдання. Наприклад, «Квач» розвиває швидкість і спритність, ігри з м'ячем — точність і координацію, а ігри на увагу вчать швидко реагувати на сигнал."], "ul": ["Ігри на швидкість: «День і ніч», «Виклик номерів».", "Ігри на спритність: «Квач», ігри з ухилянням від м'яча.", "Ігри на силу: перетягування, виштовхування з кола.", "Ігри на увагу: «Заборонений рух», «Море хвилюється».", "Командні ігри вчать співпраці та чесної гри."]}, {"h": "Рухливі ігри. Гра «Боротьба в квадратах» та правила безпеки", "p": ["У цій грі учні стають у пари всередині накреслених квадратів. За сигналом кожен намагається виштовхнути суперника за межі квадрата, діючи лише руками в плечі або долонями в долоні. Хто вийшов за лінію або торкнувся підлоги рукою — програв раунд.", "Це силова гра, тому тут особливо важливі правила: суперники мають бути приблизно однакового зросту й сили, а боротьба — чесною і без ривків."], "ul": ["Дозволено штовхати лише долонями в плечі або в долоні суперника.", "Заборонено хапати за одяг, шию, ставити підніжки.", "Ноги ставлять на ширину плечей, коліна злегка зігнуті — так стійкіше.", "Боротьба починається і закінчується лише за сигналом учителя.", "Переможець раунду отримує очко, пари можна змінювати."]}], "f": "", "pr": ["Склади таблицю з трьох колонок: «Гра», «Основні рухи», «Що розвиває». Заповни її для 4 рухливих ігор, які ти знаєш.", "Виконай вправу на рівновагу: стань на одну ногу, руки в сторони, утримуй положення 20 секунд на кожній нозі, 3 повторення."], "q": ["За якими ознаками поділяють рухливі ігри на групи?", "Що таке педагогічне завдання гри? Наведи приклад.", "Як правильно стояти в «Боротьбі в квадратах», щоб бути стійким?", "Які дії заборонені в силових іграх?"]}, {"n": "54", "t": "Доджбол: імітаційні вправи, стійка, різновиди кидків, гра «Мисливець і звірі»", "g": "Вивчити стійку доджболіста, основні види кидків і навчитися грати в «Мисливець і звірі».", "k": "Модулі: Доджбол", "terms": [["Імітаційна вправа", "повторення руху без м'яча або предмета, щоб запам'ятати правильну техніку."], ["Стійка доджболіста", "положення гравця з напівзігнутими ногами, вагою на передній частині стоп і руками перед собою, готовими до ловіння чи кидка."], ["Замах", "рух рукою з м'ячем назад перед кидком, щоб надати йому більшої швидкості."], ["Мисливець і звірі", "рухлива гра, у якій «мисливці» намагаються влучити м'ячем у «звірів», що бігають майданчиком."]], "th": [{"h": "Доджбол. Стійка та імітаційні вправи", "p": ["Від стійки залежить, чи встигнеш ти ухилитися або впіймати м'яч. Правильна стійка: ноги на ширині плечей або трохи ширше, коліна зігнуті, вага тіла на передній частині стоп, руки перед собою, погляд — на суперника з м'ячем.", "Імітаційні вправи — це повторення рухів «без м'яча»: замах і кидок у повітря, крок назустріч, ухилення вбік, присідання. Так рух запам'ятовується швидше, і потім з м'ячем він виходить правильно."], "ul": ["Не стій на прямих ногах — так неможливо швидко рушити.", "Тримай руки готовими: долоні відкриті, пальці розслаблені.", "Ухилятися можна кроком убік, присіданням чи поворотом тулуба.", "Імітацію кидка виконуй повільно, потім швидше, контролюючи кожну фазу.", "Під час імітації стеж за поставою: спина рівна, плечі розслаблені."]}, {"h": "Доджбол. Різновиди кидків і гра «Мисливець і звірі»", "p": ["У доджболі використовують кидки однією рукою зверху (найсильніші й найшвидші), однією рукою збоку, двома руками від грудей і знизу (м'якші й точніші на близьку відстань). Вибір кидка залежить від відстані до суперника й від того, чи готовий він ловити.", "У грі «Мисливець і звірі» кілька мисливців стоять за межами майданчика або всередині нього й кидають м'яч у звірів. Звір, у якого влучили, сам стає мисливцем. Гра триває, доки не залишиться останній звір — переможець."], "ul": ["Кидок зверху: замах за голову, лікоть вище плеча, кидок вперед з поворотом тулуба.", "Кидок знизу: рука опускається вниз-назад, м'яч випускається на рівні стегна.", "Крок ногою, протилежною до кидкової руки, додає кидку сили.", "Влучати можна лише нижче плечей.", "Звірам дозволено ухилятися і ловити м'яч, якщо це передбачено правилами."]}], "f": "", "pr": ["Виконай імітацію кидка однією рукою зверху без м'яча перед дзеркалом: 3 серії по 10 повторень кожною рукою, стежачи за положенням ліктя.", "Опиши в зошиті три різновиди кидків у доджболі й для кожного напиши, в якій ситуації його найкраще використовувати."], "q": ["Як виглядає правильна стійка доджболіста?", "Навіщо виконують імітаційні вправи?", "Який кидок найшвидший і чому?", "Що відбувається з «звіром», у якого влучили м'ячем?"]}, {"n": "55", "t": "Футзал: пересування з м'ячем і без, удари ногою й головою, зупинки", "g": "Закріпити техніку пересувань, ударів і зупинок м'яча та навчитися поєднувати їх у грі.", "k": "Модулі: Футзал", "terms": [["Пересування без м'яча", "рухи гравця по майданчику, коли м'яч у інших: біг, приставні кроки, зупинки, повороти."], ["Прийом м'яча", "дія, якою гравець бере м'яч під контроль після передачі партнера."], ["Підошва", "нижня частина стопи, якою у футзалі часто зупиняють і перекочують м'яч."], ["Відкривання", "переміщення гравця у вільне місце, щоб партнер міг безпечно передати йому м'яч."]], "th": [{"h": "Футзал. Пересування без м'яча та з м'ячем", "p": ["Більшу частину гри футболіст рухається без м'яча. Від того, як він пересувається, залежить, чи зможе партнер йому віддати пас і чи встигне він допомогти в захисті. Добре рухатися — це вміти швидко змінювати напрямок, зупинятися, розвертатися.", "Рух з м'ячем вимагає ще й контролю над ним. На твердій підлозі м'яч котиться швидко, тому дотики мають бути м'якими й точними."], "ul": ["Відкривайся у вільну зону, щоб між тобою і партнером не було суперника.", "Перед прийомом передачі подивись довкола, де суперники.", "Змінюй темп: повільно, потім різкий ривок.", "З м'ячем пересувайся з частими дотиками, тримаючи його під собою.", "Помилка — стояти на місці й чекати пасу."]}, {"h": "Футзал. Удари і зупинки м'яча", "p": ["Удари ногою вже знайомі: внутрішньою стороною стопи — для точних передач, носком — для швидкого пострілу. На цьому уроці їх поєднують з пересуваннями: зупинив м'яч, підняв голову, віддав пас або вдарив по воротах.", "Ланцюжок «прийом — контроль — дія» має виконуватися швидко. Чим менше зайвих дотиків, тим складніше суперникові забрати м'яч."], "ul": ["Удар головою виконують серединою лоба, з напруженою шиєю, лише легким м'ячем.", "Зупиняючи м'яч підошвою, не наступай на нього всією вагою — можна послизнутися.", "Після зупинки м'яч має лишитися на відстані кроку від тебе.", "Перед ударом опорна нога ставиться поруч із м'ячем, а не позаду.", "Безпека: не бий по м'ячу, коли біля нього нога суперника."]}], "f": "", "pr": ["Біля стіни вдома (якщо дозволяють дорослі) або на подвір'ї м'яко покатай м'яч об стіну внутрішньою стороною стопи і зупиняй його підошвою: 2 серії по 15 повторень кожною ногою.", "Намалюй схему простої комбінації у футзалі: гравець відкривається, отримує пас, зупиняє м'яч і передає далі. Підпиши кожен крок."], "q": ["Що таке відкривання і навіщо воно потрібне?", "Опиши ланцюжок дій «прийом — контроль — дія».", "Чому зупинка підошвою зручна у футзалі?", "Як безпечно виконувати удар головою на уроці?"]}, {"n": "56", "t": "Рухливі ігри за вибором; норматив: човниковий біг 4×9 м", "g": "Дізнатися, що таке спритність, і як правильно виконувати човниковий біг 4×9 м.", "k": "Модулі: Рухливі ігри", "terms": [["Спритність", "здатність швидко й точно виконувати складні рухи та змінювати їх відповідно до ситуації."], ["Човниковий біг", "біг між двома лініями туди й назад кілька разів, з розворотами на кожній лінії."], ["Норматив", "встановлена вимога до результату вправи, за якою оцінюють рівень фізичної підготовленості."], ["Розворот", "швидка зміна напрямку бігу на 180 градусів."]], "th": [{"h": "Рухливі ігри. Ігри за вибором дітей", "p": ["Цей урок — нагода самим обрати улюблені ігри. Учні пропонують гру, пояснюють її правила, а клас голосує. Так ви вчитеся домовлятися, пояснювати правила зрозуміло і поважати вибір інших.", "Обираючи гру, подумай, чи безпечна вона для залу, чи всі зможуть узяти участь і чи підійде вона як підготовка до нормативу на спритність."], "ul": ["Пропонуючи гру, назви її, поясни мету і основні правила.", "Ігри на спритність: «Квач», «Вудочка», «Сова», ігри з ухилянням.", "Якщо гравець порушує правила, суддя (вчитель або учень) нагадує про них, а не сварить.", "Після інтенсивної гри — пауза для відновлення дихання.", "Головне в грі — чесність і повага до суперника."]}, {"h": "Рухливі ігри. Норматив: човниковий біг 4×9 метрів", "p": ["Човниковий біг 4×9 м означає, що треба чотири рази пробігти відрізок 9 метрів: туди, назад, туди й назад. Часто на лінії кладуть кубики, які треба перенести. Результат — час у секундах. Він показує не лише швидкість, а й спритність: уміння швидко гальмувати й розвертатися.", "Як підготуватися: добре розімнися, звертаючи увагу на гомілковостопні та колінні суглоби, зроби 2–3 прискорення. Результат порівнюй із власним попереднім і з нормативами, які назве вчитель."], "ul": ["Старт — з високого положення, одна нога попереду.", "Перед лінією зменш швидкість, роби короткі кроки і розвертайся, низько присівши.", "Обов'язково торкнися лінії або предмета рукою чи ногою — як вимагає вчитель.", "Після розвороту одразу різко стартуй у протилежний бік.", "Типова помилка — пробігати далеко за лінію й втрачати час на гальмування.", "Біжи у взутті, яке не ковзає."]}], "f": "", "pr": ["Виконай вправу «Швидкі ноги» на місці: 20 секунд частого перебирання ногами на носках, 40 секунд відпочинку, 4 повторення.", "Запиши в зошит правила однієї гри на спритність, яку ти хотів би запропонувати класу, і поясни, як вона допоможе в човниковому бігу."], "q": ["Що таке спритність?", "Скільки разів пробігають відрізок у човниковому бігу 4×9 м?", "Як правильно виконувати розворот, щоб не втрачати час?", "Як можна оцінити свій результат, якщо порівнювати його з попереднім?"]}, {"n": "57", "t": "Доджбол: стійка, розміщення гравців, пересування приставними кроками", "g": "Навчитися пересуватися в стійці доджболіста, займати правильне місце на майданчику та обирати положення для кидків і ловіння.", "k": "Модулі: Доджбол", "terms": [["Приставний крок", "пересування вбік, коли одна нога робить крок, а друга приставляється до неї без схрещування."], ["Розміщення гравців", "розташування членів команди на своїй половині майданчика так, щоб важче було влучити в кожного й легше ловити м'яч."], ["Центральна лінія", "лінія, що ділить майданчик на дві половини; заступати за неї в доджболі не можна."], ["Вихідне положення", "положення тіла, з якого гравець починає рух: кидок, ловіння або ухилення."]], "th": [{"h": "Доджбол. Стійка і пересування приставними кроками", "p": ["У доджболі треба весь час бути готовим ухилитися. Найзручніше рухатися приставними кроками: так ти завжди обличчям до суперника і бачиш, хто готує кидок. Ноги не схрещуються — це допомагає не заплутатися й не впасти.", "Вихідне положення для кидка — бокова стійка: нога, протилежна до кидкової руки, попереду. Вихідне положення для ловіння — фронтальна стійка, руки витягнуті вперед, долоні назустріч м'ячу."], "ul": ["Під час приставних кроків тримай коліна зігнутими, не підстрибуй.", "Дивись на суперника з м'ячем, а не під ноги.", "Для кидка зроби крок уперед протилежною ногою.", "Для ловіння стань стійко, щоб м'яч не збив тебе з ніг.", "Не підходь занадто близько до центральної лінії — тобі складніше ухилитися."]}, {"h": "Доджбол. Розміщення гравців і гра з елементами доджболу", "p": ["Якщо всі гравці збиваються в купу, суперникові легко влучити хоч у когось. Тому команда розподіляється по своїй половині: хтось ближче до центру — для кидків, хтось ззаду — для ловіння й підбирання м'ячів. Гравці підказують одне одному, звідки летить м'яч.", "У навчальній грі з елементами доджболу вчитель може спростити правила: наприклад, вибулий повертається після того, як його команда впіймає м'яч."], "ul": ["Не стій прямо за партнером — м'яч, від якого він ухилиться, влучить у тебе.", "Тримай дистанцію 2–3 кроки від товаришів.", "Гравці задньої лінії допомагають ловити і передають м'ячі вперед.", "Говоріть між собою: «Справа!», «Мій!», «Ухиляйся!».", "Вибулий гравець спокійно виходить у визначену зону."]}], "f": "", "pr": ["Виконай вдома приставні кроки в стійці доджболіста: 4 кроки вправо, 4 вліво — 5 серій. Слідкуй, щоб ноги не схрещувалися і коліна залишалися зігнутими.", "Намалюй схему розміщення команди з 6 гравців на своїй половині майданчика для доджболу і поясни, чому ти розставив їх саме так."], "q": ["Чому в доджболі зручно пересуватися приставними кроками?", "Яке вихідне положення найкраще для кидка?", "Чому гравцям не варто збиватися в купу?", "Як гравці можуть допомагати одне одному під час гри?"]}, {"n": "58", "t": "Футзал: удари носком і внутрішньою стороною стопи, зупинки, гра за спрощеними правилами", "g": "Закріпити удари й зупинки м'яча та дізнатися основні правила, за якими грають у футзал на уроці.", "k": "Модулі: Футзал", "terms": [["Спрощені правила", "полегшений варіант правил гри, який дозволяє новачкам грати без складних обмежень."], ["Фол", "порушення правил гри, наприклад штовхання, підніжка або гра рукою."], ["Штрафний удар", "удар, який призначають команді, проти якої порушили правила; суперники при цьому стоять на визначеній відстані від м'яча."], ["Кутовий удар", "удар з кута майданчика, який призначають, коли захисник останнім торкнувся м'яча, перш ніж той перетнув лінію воріт."]], "th": [{"h": "Футзал. Удари і зупинки м'яча: закріплення", "p": ["Щоб передачі і удари були точними, техніку треба повторювати багато разів. Удар внутрішньою стороною стопи — основний для передач: він не такий сильний, але точний. Удар носком швидкий і несподіваний для воротаря, але менш точний.", "Зупинки м'яча підошвою і внутрішньою стороною стопи тренують у парах: один котить м'яч, інший зупиняє і повертає передачею."], "ul": ["Перед ударом подивись на ціль, а в момент удару — на м'яч.", "Носок ударної ноги під час удару внутрішньою стороною розвернутий назовні.", "Для удару носком стопа жорстка, удар — у центр м'яча.", "Під час зупинки нога «пружинить» назад.", "Тренуй обидві ноги, а не лише сильнішу."]}, {"h": "Футзал. Гра за спрощеними правилами", "p": ["На уроці грають за спрощеними правилами: менший час гри, менше обмежень, іноді без воротарів або з маленькими воротами. Але основа лишається: м'яч не можна брати руками (крім воротаря), не можна штовхати і бити суперника, за порушення призначається штрафний удар.", "Важливо, щоб кожен учень торкався м'яча й брав участь у грі. Тому вчитель може ввести правило, наприклад: гол зараховується лише після передачі трьох гравців."], "ul": ["М'яч за боковою лінією — ввід ногою з лінії.", "М'яч за лінією воріт після дотику нападника — воротар вводить його рукою.", "М'яч за лінією воріт після дотику захисника — кутовий удар.", "Під час штрафного удару суперники відходять на визначену відстань.", "Суперечки вирішує суддя, а не гравці."]}], "f": "У футзалі, на відміну від великого футболу, немає правила положення «поза грою».", "pr": ["Запиши в зошит, що таке фол, і наведи 4 приклади порушень, за які призначається штрафний удар.", "Виконай вправу на баланс для футболістів: стоячи на одній нозі, повільно виконай 10 махів іншою ногою вперед-назад (як імітацію удару), по 2 серії на кожну ногу."], "q": ["Коли призначається кутовий удар?", "Чим удар внутрішньою стороною стопи відрізняється від удару носком?", "Навіщо на уроці грають за спрощеними правилами?", "Хто вирішує суперечливі моменти у грі?"]}, {"n": "59", "t": "Рухливі ігри з м'ячами", "g": "Дізнатися, які рухливі ігри з м'ячем розвивають точність, координацію та командну взаємодію, і як грати в них безпечно.", "k": "Модулі: Рухливі ігри", "terms": [["Передача м'яча", "дія, якою гравець спрямовує м'яч партнерові."], ["Перехоплення", "дія гравця, який забирає м'яч, що летить між суперниками."], ["Координація", "здатність узгоджувати рухи різних частин тіла, щоб виконати дію точно й злагоджено."], ["Точність", "здатність влучити м'ячем у потрібне місце або передати його точно партнеру."]], "th": [{"h":
