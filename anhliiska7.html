$("#dk").onclick=()=>{document.body.classList.toggle("dark");store.set("dark",document.body.classList.contains("dark"))};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setTheme(t){const T=TOPICS[t];document.documentElement.style.setProperty("--ac",T.c1);document.documentElement.style.setProperty("--ac2",T.c2);document.documentElement.style.setProperty("--soft",document.body.classList.contains("dark")?"#1d2b3d":T.s)}
function block(b){
 const [k,a,c]=b;
 if(k=="h"){H++;return `<h2 class="sec"><span class="num">${H}</span><span>${fmt(a)}</span>${c?`<span class="src">📘 p. ${c}</span>`:""}</h2>`}
 if(k=="p")return `<p>${fmt(a)}</p>`;
 if(["key","fact","life","ua","case","quote"].includes(k))return `<div class="${k}">${fmt(a)}</div>`;
 if(k=="ul")return `<ul class="l">${a.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;
 if(k=="tbl")return `<div class="tw"><table><tr>${a[0].map(x=>`<th>${fmt(x)}</th>`).join("")}</tr>${a.slice(1).map(r=>`<tr>${r.map(x=>`<td>${fmt(x)}</td>`).join("")}</tr>`).join("")}</table></div>`;
 if(k=="cards")return `<div class="cards">${a.map(x=>`<div><div class="e">${x[0]}</div><div class="big">${fmt(x[1])}</div><div class="lb">${fmt(x[2])}</div></div>`).join("")}</div>`;
 if(k=="book"){const [pg,ti,su,qs]=a;return `<div class="card" style="border:2px solid var(--ac);background:var(--soft)"><h3 style="margin:0 0 6px;color:var(--ac)">📖 Читаємо в підручнику: «${fmt(ti)}», Student’s Book p. ${pg}</h3><p>${fmt(su)}</p><p><b>Прочитай текст у підручнику й дай відповіді:</b></p><ol>${qs.map(q=>`<li>${fmt(q[0])}</li>`).join("")}</ol><details><summary>✅ Відповіді (відкрий після читання)</summary><ol>${qs.map(q=>`<li>${fmt(q[1])}</li>`).join("")}</ol></details></div>`}
 if(k=="listen")return `<div class="card" style="background:var(--soft)"><p><button class="btnp" onclick="say(this.dataset.t)" data-t="${a.replace(/"/g,"&quot;")}">🔊 Listen / Слухати</button> <button class="btnp" style="background:#64748b" onclick="speechSynthesis.cancel()">⏹ Stop</button></p><details><summary>📄 Transcript (відкрий після виконання завдання)</summary><p>${fmt(a)}</p></details></div>`;
 if(k=="read")return `<div class="card" style="background:var(--soft);font-size:17.5px">${a.split("\n").map(x=>`<p>${fmt(x)}</p>`).join("")}</div>`;
 if(k=="ph")return `<div class="vw">${a.map(x=>`<div><button class="spk" onclick="say(this.dataset.t)" data-t="${x[0].replace(/"/g,"&quot;")}">🔊</button><span><b>${fmt(x[0])}</b> — ${fmt(x[1])}${x[2]?`<small>${fmt(x[2])}</small>`:""}</span></div>`).join("")}</div>`;
 return "";
}
let VOICE=null;function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,""));u.lang="en-GB";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function norm(s){return String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[.!?,]+$/,"").replace(/\s+/g," ").trim()}
function fills(fs){return `<div id="fb">${fs.map((f,i)=>{const parts=f[0].split("___");return `<div class="fl" data-a="${f[1].replace(/"/g,"&quot;")}">${i+1}. ${parts.map((p,j)=>fmt(p)+(j<parts.length-1?`<input autocomplete="off" autocapitalize="off" spellcheck="false">`:"")).join("")}<div class="ans">✔️ ${f[1].split("|")[0]}${f[2]?" · "+fmt(f[2]):""}</div></div>`}).join("")}<p><button class="btnp" onclick="checkF()">Перевірити ✔️</button><span class="fsc" id="fsc"></span></p></div>`}
function checkF(){let g=0,t=0;document.querySelectorAll("#fb .fl").forEach(d=>{const inp=d.querySelector("input");if(!inp)return;t++;const ok=d.dataset.a.split("|").map(norm).includes(norm(inp.value));inp.classList.toggle("ok",ok);inp.classList.toggle("no",!ok);if(ok)g++;d.classList.add("chk")});$("#fsc").textContent=`Правильно: ${g} з ${t}`}
let H=0;
function topicLessons(t){return L.filter(x=>x.top==t&&!x.sumOf)}
function quiz(qs,id){
 const items=qs.map((q,i)=>{const opts=shuffle(q.slice(1,5).map((o,j)=>({o,ok:j==0})));
  return `<div class="q" data-i="${i}"><div class="qt">${i+1}. ${fmt(q[0])}</div>${opts.map(x=>`<label data-ok="${x.ok?1:0}"><input type="radio" name="q${i}">${fmt(x.o)}</label>`).join("")}<div class="ex">${q[5]?"💡 "+fmt(q[5]):""}</div></div>`}).join("");
 return `<div id="tests">${items}<div class="score" id="sc">Відповідай на запитання — результат з’явиться тут</div><p style="text-align:center"><button class="btnp" onclick="route()">🔄 Пройти ще раз</button></p></div>`;
}
function bindQuiz(n,total){
 let got=0,ans=0;
 document.querySelectorAll(".q").forEach(q=>{q.querySelectorAll("label").forEach(l=>l.onclick=()=>{
  if(q.classList.contains("done"))return;q.classList.add("done");ans++;
  q.querySelectorAll("label").forEach(x=>{if(x.dataset.ok=="1")x.classList.add("ok")});
  if(l.dataset.ok=="1"){got++}else l.classList.add("no");
  const sc=$("#sc");sc.textContent=ans<total?`Правильно: ${got} з ${ans} (усього запитань: ${total})`:`🎉 Результат: ${got} з ${total} — ${Math.round(got/total*12)} балів із 12`;
  if(ans==total){const best=store.get("s"+n,0);if(got/total>best)store.set("s"+n,got/total);}
 })});
}
function lessonView(n){
 const x=L.find(y=>y.n==n);if(!x)return home();
 setTheme(x.top);H=0;const T=TOPICS[x.top];
 let h=`<div class="hero" data-e="${x.e||T.e}"><div class="k">Урок ${x.n} · ${T.name}</div><h1>${fmt(x.t)}</h1>${x.par?`<span class="pg">📘 ${x.par}${x.pg?", p. "+x.pg:""}</span>`:""}</div>`;
 let qs=x.q||[];
 if(x.sumOf){
  let ls=x.sumOf=="all"?L.filter(y=>!y.sumOf):Array.isArray(x.sumOf)?L.filter(y=>!y.sumOf&&x.sumOf.includes(y.top)):topicLessons(x.top);
  if(x.before)ls=ls.filter(y=>y.n<x.n);
  if(x.hook)h+=`<div class="card hook"><h3>🎯 Мета уроку</h3>${fmt(x.hook)}</div>`;
  if(x.b)if(x.b&&x.b.length)h+=`<div class="card">${x.b.map(block).join("")}</div>`;
  h+=`<div class="card recap"><h2 class="sec"><span class="num">📌</span><span>Повторюємо головне з кожного уроку</span></h2>${ls.map(y=>`<h4>Урок ${y.n}. ${fmt(y.t)}</h4><ul class="l">${(y.sum||[]).map(s=>`<li>${fmt(s)}</li>`).join("")}</ul>`).join("")}</div>`;
  const pool=[];ls.forEach(y=>y.noPool||(y.q||[]).forEach(q=>pool.push(q)));
  qs=(x.q||[]).concat(shuffle(pool).slice(0,x.cnt||(x.sumOf=="all"?24:16)));
  x._terms=[];const ws=[],seen={};ls.forEach(y=>(y.w||[]).forEach(t=>{if(!seen[t[0]]){seen[t[0]]=1;ws.push(t)}}));x._w=x.sumOf=="all"?[]:ws;
  const fp=[];ls.forEach(y=>y.noPool||(y.f||[]).forEach(f=>fp.push(f)));x._f=(x.f||[]).concat(shuffle(fp).slice(0,x.fcnt||12));
 }else{
  if(x.hook)h+=`<div class="card hook"><h3>🤔 Для початку — подумай</h3>${fmt(x.hook)}</div>`;
  if(x.sum)h+=`<div class="card sum"><h3>⚡ Урок за 30 секунд</h3><ol>${x.sum.map(s=>`<li>${fmt(s)}</li>`).join("")}</ol></div>`;
  if(x.b&&x.b.length)h+=`<div class="card">${x.b.map(block).join("")}</div>`;
  x._terms=x.terms||[];x._w=x.w||[];x._f=x.f||[];
  if(x.diag){const pool=[];L.filter(y=>!y.sumOf&&y.n!=x.n&&x.diag.includes(y.top)).forEach(y=>(y.q||[]).forEach(q=>pool.push(q)));qs=qs.concat(shuffle(pool).slice(0,x.dcnt||12));}
 }
 const W=x._w||[];
 if(W.length)h+=`<div class="card"><h2 class="sec"><span class="num">🆕</span><span>${x.sumOf?"Слова розділу — повторюємо":"Нові слова — натисни 🔊, щоб почути"}</span></h2>${block(["ph",W])}</div>`;
 if(W.length)h+=`<div class="card"><h2 class="sec"><span class="num">🔁</span><span>Згадай слово англійською — натисни на картку</span></h2><div class="terms">${shuffle(W).slice(0,x.sumOf?16:W.length).map(t=>`<div class="term" onclick="this.classList.toggle('f')"><div class="in"><div class="fa">${fmt(t[1])}</div><div class="ba"><b style="font-size:19px">${fmt(t[0])}</b>&nbsp;<button class="spk" onclick="event.stopPropagation();say(this.dataset.t)" data-t="${t[0].replace(/"/g,"&quot;")}">🔊</button></div></div></div>`).join("")}</div></div>`;
 const F=x._f||[];
 if(F.length)h+=`<div class="card"><h2 class="sec"><span class="num">✍️</span><span>Вправа: впиши правильну форму / слово</span></h2>${fills(F)}</div>`;
 if(x._terms.length)h+=`<div class="card"><h2 class="sec"><span class="num">🔑</span><span>Ключові поняття — натисни на картку</span></h2><div class="terms">${x._terms.map(t=>`<div class="term" onclick="this.classList.toggle('f')"><div class="in"><div class="fa">${fmt(t[0])}</div><div class="ba">${fmt(t[1])}</div></div></div>`).join("")}</div></div>`;
 if(x.link)h+=`<div class="card"><p>📝 Онлайн-тест від учителя: <a class="btnp" href="${x.link}" target="_blank" rel="noopener">Відкрити тест на «Всеосвіті»</a></p></div>`;
 if(qs.length)h+=`<div class="card"><h2 class="sec"><span class="num">✅</span><span>Test yourself: тест (${qs.length} запитань)</span></h2>${quiz(qs)}</div>`;
 const pv=L.find(y=>y.n==n-1),nx=L.find(y=>y.n==n+1);
 h+=`<div class="nav">${pv?`<a href="#${pv.n}"><small>← Попередній</small>${pv.n}. ${fmt(pv.t)}</a>`:"<span></span>"}${nx?`<a class="n" href="#${nx.n}"><small>Наступний →</small>${nx.n}. ${fmt(nx.t)}</a>`:"<span></span>"}</div>`;
 $("#app").innerHTML=h;bindQuiz(n,qs.length);scrollTo(0,0);document.title=`Урок ${n}. ${x.t.replace(/==|\*\*/g,"")}`;
}
function home(){
 document.documentElement.style.setProperty("--ac","#0ea5a4");
 const done=L.filter(x=>store.get("s"+x.n,0)>0).length;
 let h=`<div class="home"><div class="hero" data-e="🇬🇧" style="background:linear-gradient(135deg,#0f766e,#2563eb,#7c3aed)"><div class="k">Ліцей «Ясно» · English</div><h1>English: Wider World 2</h1><span class="pg">📘 Wider World 2 (2nd edition), Student’s Book · ${L.length} уроків</span></div>
 <div class="card"><b>Твій прогрес:</b> пройдено тестів — ${done} з ${L.length}<div class="bar"><i style="width:${done/L.length*100}%"></i></div><small style="color:var(--mute)">Кожен урок: нові слова з озвученням 🔊 → граматика з прикладами → вправи «впиши слово» → тест із поясненнями.</small></div>`;
 TOPICS.forEach((T,i)=>{const ls=L.filter(x=>x.top==i);if(!ls.length)return;
  h+=`<div class="topic" style="background:linear-gradient(90deg,${T.c1},${T.c2})">${T.e} ${T.name}</div><div class="grid">${ls.map(x=>{const s=store.get("s"+x.n,0);return `<a class="ls" href="#${x.n}"><span class="nb" style="background:linear-gradient(135deg,${T.c1},${T.c2})">${x.n}</span><span><div class="tt">${fmt(x.t)}</div><div class="st">${s?`✅ найкраще: ${Math.round(s*100)}%`:(x.sumOf?"🏁 узагальнення":(x.par||""))}</div></span></a>`}).join("")}</div>`});
 $("#app").innerHTML=h+"</div>";document.title="English · Wider World 2";scrollTo(0,0);
}
function route(){const n=parseInt(location.hash.slice(1));n?lessonView(n):home()}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
