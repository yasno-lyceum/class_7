<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Громадянська освіта · 7 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.tbl{display:table}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.note{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--line,#ccc);background:rgba(127,127,127,.08);font-style:italic;font-size:14px;opacity:.9;border-radius:6px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>

{info:`<h4>Людина, особистість, громадянин</h4>
<ul><li><b>Людина</b> – це біопсихосоціальна істота: <i>біо</i> – частина живої природи; <i>психо</i> – наділена мовою, свідомістю, вищими психічними функціями; <i>соціальна</i> – живе в соціумі.</li>

<li><b>Громадянин</b> – особа, яка належить до постійного населення певної держави, має взаємозалежні права та обов’язки.</li></ul>
<h4>Коли виникла культура?</h4>
<p>Слово <b>«культура»</b> латинського походження і означає «обробіток», «догляд». Вперше це поняття вжив римський мислитель, оратор і державний діяч <b>Цицерон</b> (106–43 рр. до н. е.). У культурі він вбачав, з одного боку, діяльність по перетворенню природи на благо людини, а з іншого – засіб удосконалення духовних сил людини, її розуму. У XVII ст. слово «культура» набуває самостійного наукового значення.</p>
<p>Культура виникла разом із появою першої людини: первісні люди почали виготовляти перші знаряддя праці – перші артефакти культури. Людина розумна (кроманьйонець) з’явилася 40–30 тис. років тому; з тваринного світу її виділили трудова діяльність, мова, мислення.</p>
<p>На «плато річок» у пустелі Сахара (Алжир) знайдено <b>петрогліфи</b> – висічені зображення на камені (від VII тис. до н. е. до VII ст. н. е.). У 1933 р. Леонс Жоло поділив їх на періоди: «епоха буйвола», «епоха африканського слона», малюнки з конем і колісницями, «епоха верблюда».</p>
<h4>Матеріальна і духовна культура</h4>
<table class="tbl"><tr><th>Матеріальна культура</th><th>Духовна культура</th></tr>
<tr><td>сукупність усіх матеріальних цінностей, створених певною культурою</td><td>сфера людського життя, яка охоплює погляди на світ, систему цінностей, вірування, знання, мистецтво, філософію та релігію</td></tr>
<tr><td>будівлі, культові споруди, одяг, предмети побуту, картини, ікони, меблі, техніка, транспорт, знаряддя праці</td><td>мова, освіта, релігія, пісні, наука, переконання, звичаї, обряди, легенди, етика, мораль</td></tr></table>
<h4>Культурне розмаїття</h4>
<p><b>Культурне розмаїття</b> – співіснування на планеті різних культур, кожна з яких є унікальною та неповторною (мови, традиції, звичаї, вірування, мистецтво, кухня). Як зберегти: вивчати інші культури, поважати їх (не допускати дискримінації), берегти свою культуру, співпрацювати з представниками інших культур.</p>
<h4>Господарювання (економіка). Приватна власність</h4>
<p><b>Господарювання, або економіка</b> – діяльність людей, спрямована на створення, розподіл, обмін і споживання товарів і послуг. Спочатку було збиральництво, полювання та рибальство; з розвитком землеробства і скотарства виникли надлишки продуктів – основа для торгівлі, ремесел і міст.</p>
<p><b>Приватна власність</b> – право особи чи групи осіб володіти, користуватися та розпоряджатися певним майном. Вона є стимулом праці, інновацій, економічного розвитку, особистої свободи. Секрет економічного зростання – зацікавленість людей у результатах власної праці.</p>
<p><b>Меценат</b> – багатий покровитель наук і мистецтв, що безкорисливо підтримує розвиток культури й освіти (від прізвища римського багатія Мецената).</p>
<h4>Людина і природа. Сталий розвиток</h4>
<p>Природа є джерелом матеріальних і духовних ресурсів людини: вона формувала людину, а людина змінювала природу під свої потреби. <b>Сталий розвиток</b> – концепція балансу між задоволенням сучасних потреб людства і захистом інтересів майбутніх поколінь. У вересні 2015 р. всі 193 члени ООН ухвалили <b>17 Цілей сталого розвитку</b>.</p>`,
terms:[["Культура","від лат. «обробіток», «догляд»; поєднує матеріальне й духовне"],["Матеріальна культура","сукупність усіх матеріальних цінностей, створених певною культурою"],["Духовна культура","погляди на світ, система цінностей, вірування, знання, мистецтво, філософія, релігія"],["Цивілізація","людська спільнота з єдиними рисами політичної та суспільної організації, культури, духовних цінностей"],["Культурне розмаїття","співіснування на планеті різних унікальних культур"],["Економіка","діяльність людей зі створення, розподілу, обміну і споживання товарів і послуг"],["Приватна власність","право особи чи групи осіб володіти, користуватися та розпоряджатися майном"],["Сталий розвиток","баланс між потребами сучасного людства та інтересами майбутніх поколінь"],["Меценат","багатий покровитель наук і мистецтв"]],

{info:`<h4>Права людини: історичний екскурс</h4>
<p>Права людини – ровесники людства: вони зародилися тоді, коли почали виникати перші людські спільноти. Слабкі прагнули позбутися сваволі сильних – із цього почалася історія прав людини як принципів, що мали обмежити владу сильних.</p>

<tr><td>Економічні – участь у господарській діяльності</td><td>право на працю та справедливу винагороду, приватну власність, підприємницьку діяльність</td></tr>

<h4>Принципи прав людини</h4>
<ul><li><b>Невідчужуваність</b> – права належать кожній людині від народження і не можуть бути відібрані.</li>
<li><b>Універсальність</b> – рівною мірою належать усім людям.</li>

<li><b>Взаємозалежність і неподільність</b> – усі права рівнозначні та взаємопов’язані.</li></ul>

// 3 Що робить людину людиною?
{info:`<p>«Ти знаєш, що ти — людина? … Усмішка твоя — єдина, Мука твоя — єдина, Очі твої — одні» (Василь Симоненко). Бути людиною — означає мислити, творити, любити, розуміти, співчувати й шукати гармонію з собою та світом.</p>
<h4>Людська гідність і взаємоповага</h4>
<ul><li><b>Людська гідність</b> – це усвідомлення цінності кожної особистості незалежно від соціального статусу, національності.</li>
<li><b>Гідність</b> – моральне ставлення до самого / самої себе, внутрішнє визнання, самоповага.</li>
<li><b>Повага</b> – почуття шани, прихильне ставлення, яке життєво необхідне для існування суспільства.</li>
<li><b>Взаємоповага</b> – фундамент міцних відносин і здорового суспільства; це щоденний вибір – бачити в інших рівну особистість зі своїми почуттями та потребами.</li></ul>
<h4>Мої цінності, мета і мрії. Внутрішня мотивація</h4>
<p>Цінності можуть бути: чесність, свобода, сім’я, розвиток, допомога іншим, творчість. <b>Внутрішня мотивація</b> – джерело енергії, яке виходить із серця і не залежить від зовнішніх факторів, таких як похвала чи нагороди.</p>
<p><b>Мрії</b> – рушій до життя. Крістофер Рів казав: «Спочатку мрії здаються неможливими, потім неправдоподібними, а потім неминучими». Щоб допомогти мрії втілитись: прибирайте «не», використовуйте теперішній час, визначте пріоритети й етапи, створіть карту (візуалізацію) мрії, звіряйте дати.</p>
<h4>Самоаналіз і саморозвиток</h4>
<ul><li><b>Самоаналіз</b> – вміння зазирнути всередину себе, зрозуміти свої думки, почуття, вчинки, сильні та слабкі сторони. Це ніби чесна та відверта розмова з собою.</li>
<li><b>Саморозвиток</b> – свідома робота над собою, щоб стати кращою версією себе. Самоаналіз – це перший крок до саморозвитку.</li></ul>
<p>Поради: веди щоденник; запитуй поради у друзів і дорослих; читай про саморозвиток; став невеликі цілі; не бійся помилятися – помилки це досвід.</p>
<h4>Особистісні якості</h4>
<p>Особистісні якості виховуються кожною людиною в собі. Успіх часто залежить від наполегливості, лідерських якостей, вміння працювати в команді. Для формування звички зазвичай потрібно <b>21 день</b> (вправа «Мій особистий старт»).</p>`,
terms:[["Людська гідність","усвідомлення цінності кожної особистості незалежно від статусу, національності"],["Гідність","моральне ставлення до самого себе, внутрішнє визнання, самоповага"],["Повага","почуття шани, прихильне ставлення"],["Взаємоповага","фундамент міцних відносин і здорового суспільства"],["Внутрішня мотивація","джерело енергії, що не залежить від похвали чи нагород"],["Самоаналіз","вміння зрозуміти свої думки, почуття, вчинки, сильні та слабкі сторони"],["Саморозвиток","свідома робота над собою, щоб стати кращою версією себе"]],

// 5 Родина як мінісуспільство
{info:`<h4>Спільнота і сім’я</h4>
<p><b>Спільнота</b> – група людей, об’єднаних спільними інтересами, цінностями, метою або місцем проживання. Однією з найважливіших і найдавніших спільнот є <b>сім’я</b> – справжня команда, де всі працюють разом.</p>
<ul><li><b>Сім’я</b> – соціальна група, заснована на шлюбі або кровній спорідненості, члени якої пов’язані спільним побутом, взаємною моральною та матеріальною відповідальністю, вихованням дітей. Сім’я є первинним та основним осередком суспільства.</li>
<li><b>Шлюб</b> – добровільний, юридично оформлений союз між чоловіком та жінкою, спрямований на створення сім’ї, народження та виховання дітей, ведення спільного господарства.</li></ul>
<table class="tbl"><tr><th>Вид шлюбу</th><th>Особливості</th></tr>
<tr><td>Офіційний</td><td>зареєстрований державою, з юридичними правами та обов’язками</td></tr>
<tr><td>Цивільний</td><td>спільне проживання пари без офіційного оформлення</td></tr>
<tr><td>Церковний</td><td>укладений за релігійними обрядами, потребує ще державної реєстрації</td></tr></table>
<p><b>Стаття 51 Конституції України</b>: шлюб ґрунтується на вільній згоді жінки і чоловіка; кожен із подружжя має рівні права і обов’язки; батьки зобов’язані утримувати дітей до їх повноліття; повнолітні діти зобов’язані піклуватися про своїх непрацездатних батьків; сім’я, дитинство, материнство і батьківство охороняються державою.</p>
<h4>Батьківство і материнство. Права та обов’язки батьків і дітей</h4>
<p>Мати й батько мають рівні права й обов’язки щодо дитини. Найвищим принципом є забезпечення інтересів дитини. <b>Сімейний кодекс України</b>:</p>
<ul><li><b>Ст. 150</b> – батьки зобов’язані виховувати дитину, піклуватися про її здоров’я, забезпечити здобуття повної загальної середньої освіти, поважати дитину; заборонено фізичні покарання та експлуатацію дитини.</li>
<li><b>Ст. 151</b> – батьки мають право визначати форми та методи виховання.</li>
<li><b>Ст. 153</b> – дитина має право на належне батьківське виховання.</li>
<li><b>Ст. 202</b> – повнолітні дочка, син зобов’язані утримувати непрацездатних батьків.</li></ul>
<p>Форми сімейного піклування: усиновлення, опіка, піклування, прийомна сім’я, дитячі будинки сімейного типу. <b>ЮНІСЕФ</b> – спеціалізована структура ООН, яка прагне дати дітям рівні можливості для розвитку.</p>
<h4>Родинні цінності і правила</h4>
<p><b>Родинні цінності</b> – набір спільних переконань, принципів та ідеалів, які об’єднують членів сім’ї та передаються з покоління в покоління. Сімейні традиції – будь-яка діяльність, яку родина виконує разом та регулярно (свята, 12 страв на Різдво, колядування, спільний недільний обід).</p>
<h4>Захист сім’ї в суспільстві і державі</h4>
<p><b>Державна охорона сім’ї</b> – заходи, спрямовані на захист прав сім’ї, дитинства, материнства та батьківства. Напрями: державна допомога сім’ям з дітьми; доступне житло; медичні послуги для матерів і дітей; доступність освіти; психологічна, юридична, соціальна допомога; захист дітей від насильства; поєднання батьківських обов’язків з роботою. У 1993 р. ООН встановила <b>Міжнародний день сім’ї – 15 травня</b>.</p>`,

// 6 Дитина – маленька людина
{info:`<h4>Поняття прав дитини</h4>
<p><b>Дитина</b> – це повноцінна особистість із перших років життя: має свої почуття, думки, права й потреби. Дитина — не «майбутнє», а сьогодення.</p>
<p><b>Права дитини</b> – сукупність спеціальних благ, умов життя і можливостей, необхідних для нормального розвитку, яких дитина (або в її інтересах батьки) може домагатися від держави і суспільства і які складають її правовий статус до досягнення повноліття.</p>
<h4>Історія прав дитини</h4>
<ul><li><b>Еглантайн Джебб</b> – «жінка, яка врятувала дітей». У 1919 р. заснувала в Лондоні фонд <b>Save the Children</b> («Врятуємо дітей»); 23 лютого 1923 р. з ініціативи її організації прийнято перший варіант Декларації прав дитини.</li>
<li><b>1924 р.</b> – Ліга Націй прийняла <b>Женевську декларацію прав дитини</b>: право на здоров’я, харчування, освіту та захист від експлуатації.</li>
<li><b>20 листопада 1989 р.</b> – <b>Конвенція ООН про права дитини</b>, ратифікована найбільшою кількістю країн з-поміж усіх міжнародних договорів про права людини.</li></ul>
<h4>Чотири основні принципи Конвенції</h4>
<ol><li><b>Відсутність дискримінації</b> – права всіх дітей поважаються незалежно від статі, статків, релігії, мови, особливих потреб.</li>
<li><b>Участь</b> – діти мають право висловлювати свою думку з усіх питань, які їх стосуються, і бути почутими.</li>
<li><b>Право на життя та розвиток</b>.</li>
<li><b>Найкращі інтереси дитини</b> – під час рішень думати про те, що найкраще для дитини.</li></ol>
<h4>Соціальний, правовий, економічний захист</h4>
<table class="tbl"><tr><th>Тип захисту</th><th>Зміст</th></tr>
<tr><td>Соціальний</td><td>захист від бідності, доступ до освіти, охорони здоров’я, соціальних послуг (притулки, центри підтримки)</td></tr>
<tr><td>Правовий</td><td>захист прав дітей у судах, свобода від насильства та дискримінації (служби захисту дітей, покарання за насильство)</td></tr>
<tr><td>Економічний</td><td>захист від економічної експлуатації, заборона дитячої праці, соціальні виплати на дітей</td></tr></table>
<p>Особлива увага – дітям у складних життєвих обставинах: жертвам збройних конфліктів, сиротам і дітям без батьківського піклування, дітям-біженцям і переселенцям, дітям, що живуть у злиднях. Гарантом прав дитини є держава, родина та середовище, а важливу роль відіграють сім’я та школа.</p>`,

// 7 Громада
{info:`<h4>Що таке громада</h4>
<p><b>Громада</b> – особливий вид спільноти, що вирізняється тісними зв’язками між її членами, спільною територією та наявністю елементів самоврядування. Українська громада завжди була серцем суспільного життя — від віче до сільради, від козацької ради до ради громади XXI століття.</p>
<table class="tbl"><tr><th>Характеристика громади</th><th>Зміст</th></tr>
<tr><td>Територіальна приналежність</td><td>члени громади проживають на одній території (село, місто, район)</td></tr>
<tr><td>Спільні інтереси та потреби</td><td>благоустрій, безпека, освіта, охорона здоров’я, збереження культурної спадщини</td></tr>
<tr><td>Самоврядування</td><td>безпосередня демократія (збори громади) або представницька (вибори місцевої ради)</td></tr>
<tr><td>Соціальна взаємодія та відповідальність</td><td>підтримка один одного, спільна відповідальність за добробут громади</td></tr></table>
<h4>Історичний розвиток громади на теренах України</h4>
<ul><li><b>Первісність</b> – родові общини (спільна територія, колективна праця, спільні предки); згодом – <b>сусідська община</b> (не родичі).</li>
<li><b>Русь-Україна</b> – громади за виробничою (купців, ремісників) або територіальною ознакою; діяли на основі звичаєвого права; <b>народні віча</b>; сільська громада – <b>верв</b>.</li>
<li><b>Велике князівство Литовське</b> – <b>війтівство</b>: міська влада належала війтові, якого обирали на міському вічі.</li>
<li><b>Козаччина</b> (з XV ст.) – козацька громада: кожен вважався вільним від кріпацтва, мав право на землю та участь у самоврядуванні; самоврядування діяло і в державі Війська Запорозького Богдана Хмельницького.</li></ul>
<h4>Громадський простір. Доступність</h4>
<p><b>Громадський простір</b> – загальнодоступні вулиці, парки, сквери, площі, дитячі майданчики, набережні. Ознаки: доступність, безкоштовність, безпечність, універсальність, комфортність. Сучасний підхід – <b>людиноцентричність</b>; урбаністика – наука про комфортне середовище (Грецька площа у Львові, Пейзажна алея в Києві).</p>
<h4>Пам’ятки історії, культури, природи</h4>
<ul><li><b>Історичні</b> – місця або об’єкти, пов’язані з важливими подіями чи людьми.</li>
<li><b>Культурні</b> – витвори мистецтва, архітектури, народної творчості.</li>
<li><b>Природні</b> – унікальні куточки природи.</li></ul>
<p><b>ЮНЕСКО</b> (створена 1945 р., понад 190 країн) зберігає світову спадщину. В Україні до Списку належать, зокрема, Резиденція Буковинських та Далматинських митрополитів, Букові праліси Карпат; до нематеріальної спадщини – косівська мальована кераміка, кримськотатарський орнамент орьнек.</p>

{info:`<h4>Україна — молода держава з багатовіковою історією</h4>
<p><b>Державність</b> – це устрій усього матеріального і духовного буття цілого народу; державність – фундамент, корінь держави. Історія України — це фактично історія національно-визвольної боротьби українського народу за свою державу.</p>
<ul><li>Назва <b>«Україна»</b> згадується ще в <b>1187 р.</b> у Київському літописі (територія Переяславського князівства). Після 1721 р. російська імперія почала називати українські землі «Малоросією». За поширеною теорією, «Україна» походить від слів «країна» чи «край» і є антонімом слова «чужина».</li>
<li>1917 р. проголошено Українську Народну Республіку.</li></ul>
<table class="tbl"><tr><th>Етап державності</th><th>Держави</th></tr>

<tr><td>Третій</td><td>УНР за Центральної Ради, Українська держава Павла Скоропадського, УНР доби Директорії, ЗУНР</td></tr>
<tr><td>Четвертий</td><td>сучасна Українська держава</td></tr></table>
<h4>Проголошення незалежності України</h4>
<ul><li><b>24 серпня 1991 р.</b> – Верховна Рада ухвалила <b>Акт проголошення незалежності України</b>.</li>
<li><b>1 грудня 1991 р.</b> – Всеукраїнський референдум абсолютною більшістю підтвердив незалежність.</li>
<li><b>1992 р.</b> – законодавчо затверджено державні символи – прапор, герб і гімн.</li>
<li>2013–2014 рр. – Революція Гідності: українці відстояли європейський шлях розвитку; з 2014 р. і нині – боротьба проти російської агресії.</li></ul>
<h4>Атрибути державності</h4>
<p>Власна територія з визначеними кордонами, офіційна назва; мова; національне вбрання, страви, музичні інструменти, народна пісня, видатні постаті; національне гасло: <b>«Слава Україні! Героям Слава!»</b>. Державні символи: Державний прапор, Державний герб, Державний гімн.</p>
<h4>Конституція України — основний закон</h4>
<ul><li>Ухвалена <b>28 червня 1996 р.</b>, має <b>найвищу юридичну силу</b>.</li>
<li>Україна – суверенна, незалежна, демократична, соціальна, правова держава; за формою правління – <b>парламентсько-президентська республіка</b>; є <b>унітарною</b> державою.</li>
<li>Поділ влади на законодавчу (Верховна Рада), виконавчу (Кабінет Міністрів) і судову; глава держави – Президент України; контроль за дотриманням Конституції – Конституційний Суд України.</li>
<li><b>Ст. 21</b>: усі люди є вільні і рівні у своїй гідності та правах. <b>Ст. 24</b>: громадяни мають рівні конституційні права і свободи та є рівними перед законом.</li></ul>
<h4>Якою нашу державу бачить світ?</h4>
<p>Символ стійкості, свободи та незламності; країна багатої культури і традицій; держава, що прагне до європейської спільноти; потенціал у сільському господарстві та ІТ; ключовий фактор у зміні світового порядку.</p>`,

// 10 Державні органи влади та їх функції
{info:`<h4>Система органів державної влади в Україні</h4>
<p>Влада – це не лише управління, а й відповідальність, вплив та авторитет. В Україні система органів державної влади діє за <b>принципом поділу влади на три гілки</b>: законодавчу, виконавчу та судову. Це зроблено для уникнення зловживання владою та забезпечення балансу інтересів.</p>
<table class="tbl"><tr><th>Гілка влади</th><th>Органи</th></tr>
<tr><td>Законодавча</td><td>Верховна Рада України</td></tr>
<tr><td>Виконавча</td><td>Кабінет Міністрів України → міністерства, місцеві державні адміністрації</td></tr>
<tr><td>Судова</td><td>суди: Конституційний Суд України, Верховний Суд, апеляційні суди, місцеві суди</td></tr></table>
<h4>Верховна Рада України — законодавча влада</h4>
<ul><li><b>Функції</b>: прийняття законів, затвердження державного бюджету, контроль за діяльністю інших органів влади.</li>
<li><b>Склад</b>: <b>450 народних депутатів</b>, яких обирають на виборах.</li>
<li><b>Контроль</b>: контролює діяльність уряду, затверджує бюджет, призначає вибори Президента та може оголосити йому імпічмент.</li></ul>
<h4>Кабінет Міністрів України — виконавча влада</h4>
<ul><li>Головний орган виконавчої влади, який виконує закони, ухвалені Верховною Радою.</li>
<li>Керує економікою, освітою, безпекою, медициною та іншими сферами життя.</li>
<li>Відповідає за розробку та виконання державного бюджету.</li>
<li>Є <b>колегіальним органом</b>: рішення приймаються шляхом обговорення та голосування.</li></ul>
<h4>Судова влада — захист прав та свобод</h4>
<ul><li><b>Конституційний Суд</b> – перевіряє, чи відповідають закони Конституції.</li>
<li><b>Верховний Суд</b> – вища судова інстанція, яка розглядає складні справи.</li>
<li><b>Місцеві суди</b> – розглядають кримінальні та цивільні справи на рівні громад.</li></ul>
<p>Суди забезпечують справедливість, захищають права громадян та карають порушників закону; їхні рішення є обов’язковими для виконання.</p>
<h4>Президент України — гарант Конституції</h4>
<ul><li>Верховний головнокомандувач армії.</li>
<li>Представляє Україну на міжнародній арені.</li>
<li>Підписує закони, ухвалені Верховною Радою.</li>
<li>Призначає деяких посадовців, зокрема голову Нацбанку та Генерального прокурора.</li></ul>
<h4>Місцеві державні адміністрації</h4>
<p>Відповідають за соціально-економічний розвиток відповідної території, забезпечення законності та правопорядку, охорону прав і свобод громадян, вирішення питань місцевого значення.</p>
<h4>Вплив громади на політичні процеси</h4>
<p>Громадяни можуть впливати на політичні і суспільні процеси через вибори, громадські організації, мирні протести та звернення до органів влади. Влада в демократичній державі належить народу.</p>`,

// 11 Місцеве самоврядування
{info:`<h4>Що таке місцеве самоврядування?</h4>
<p><b>Місцеве самоврядування</b> – це система управління, за якої територіальні громади самостійно або через органи місцевої влади вирішують питання місцевого значення. Воно базується на принципах демократії, участі громадян та автономії місцевих органів влади. Роботу регулює <b>Закон «Про місцеве самоврядування в Україні» від 21.05.1997 р.</b></p>
<h4>Як формуються органи місцевого самоврядування?</h4>
<p>Органи місцевого самоврядування є <b>представницькими</b>: їх обирає безпосередньо населення – повнолітні члени громади.</p>
<table class="tbl"><tr><th>Орган</th><th>Роль</th></tr>
<tr><td>Сільські, селищні, міські ради</td><td>виборні органи, які приймають рішення щодо місцевих питань</td></tr>
<tr><td>Голова громади (мер, сільський / селищний голова)</td><td>очолює виконавчий орган ради та відповідає за її діяльність</td></tr>
<tr><td>Виконавчі органи (управління, відділи)</td><td>реалізують рішення ради та займаються управлінням місцевими справами</td></tr></table>
<p>Безпосередньо громади можуть вирішувати питання у формі <b>місцевого референдуму, загальних зборів громадян, місцевих ініціатив, громадських слухань</b>.</p>
<h4>Завдання і можливості органів місцевого самоврядування</h4>
<ul><li>місцеві фінанси та формування місцевого бюджету; встановлення місцевих податків і зборів;</li>
<li>управління комунальною власністю, житлово-комунальним господарством, землею громади;</li>
<li>збирання, утилізація та знешкодження побутових відходів;</li>
<li>благоустрій населеного пункту;</li>
<li>управління закладами дошкільної та загальної середньої освіти;</li>
<li>утворення та утримання муніципальної міліції.</li></ul>
<h4>Як місцеве самоврядування впливає на життя громади? Як ти можеш впливати?</h4>
<p>Громада – це спільна відповідальність усіх її жителів. Кожен, незалежно від віку, може: організувати толоку у парку чи біля школи; долучатися до благодійних акцій, допомагати літнім людям чи волонтерам; вносити пропозиції щодо покращення шкільного простору. Ще один інструмент – <b>громадський бюджет (бюджет участі)</b>: частина бюджету громади, з якої фінансуються проєкти, запропоновані самими мешканцями і відібрані голосуванням.</p>`,

{info:`<h4>Відправник і отримувач</h4>
<p><b>Спілкування</b> – процес передавання й сприймання повідомлень за допомогою вербальних і невербальних засобів. У процесі комунікації є три складові:</p>
<ul><li><b>відправник</b> – той, хто говорить, пише, малює;</li>
<li><b>повідомлення</b> – те, що відправник передає (в усній мові, письмі, малюнку, пісні);</li>
<li><b>отримувач</b> – той, хто намагається зрозуміти суть повідомлення.</li></ul>
<p>Відправник та отримувач постійно змінюються ролями: щойно ти відповів на повідомлення – ти вже став відправником.</p>
<table class="tbl"><tr><th>Поняття</th><th>Пояснення</th></tr>
<tr><td>Комунікатор</td><td>той, хто передає інформацію (мовець, автор)</td></tr>
<tr><td>Рецепієнт (адресат)</td><td>той, хто сприймає інформацію (слухач, читач)</td></tr>
<tr><td>Канал</td><td>засіб передачі (мова, телефон, інтернет, жести)</td></tr>
<tr><td>Код</td><td>мова або система знаків</td></tr>
<tr><td>Контекст</td><td>обставини спілкування (місце, тема, відносини між людьми)</td></tr>
<tr><td>Інтонація</td><td>звук, ритм і емоційне забарвлення мовлення</td></tr></table>
<h4>Повідомлення: зміст, форма, способи передачі</h4>
<p><b>Повідомлення</b> – інформація, яку відправник передає отримувачу через певний канал зв’язку. Щоб уникати непорозумінь, воно має бути максимально точним і зрозумілим: додай уточнення, повтори важливі деталі.</p>
<ul><li><b>Вербальне спілкування</b> – за допомогою мови (усної чи письмової).</li>
<li><b>Невербальне спілкування</b> – за допомогою немовних засобів: жести, рухи тіла, вираз очей і обличчя, посмішка, тактильні засоби, одяг, манери поведінки, психогеографія (просторове поле між співрозмовниками).</li></ul>
<p>Легенда: Віктор Гюго надіслав видавцеві телеграму «?» і отримав відповідь «!» – коротке повідомлення може бути ефективним.</p>
<h4>Зворотний зв’язок</h4>
<p><b>Зворотний зв’язок</b> – реакція отримувача на повідомлення. Він допомагає зрозуміти, чи правильно передана інформація. Він має бути своєчасним, чесним та об’єктивним; важливо вміти і давати, і отримувати його. Формула: «Мені сподобалося, що ти… / Можливо, наступного разу ти міг (-ла) би…».</p>
<h4>Мистецтво запитувати</h4>
<p>Запитання виконує дві основні функції: <b>комунікативну</b> (налагодити взаємодію, підтримати розмову) і <b>пізнавальну</b> (отримати нову інформацію). Додаткові: мотиваційна, контрольна, емоційна.</p>
<table class="tbl"><tr><th>Закриті запитання</th><th>Відкриті запитання</th></tr>
<tr><td>передбачають коротку відповідь («так» або «ні») або конкретний факт</td><td>дають можливість висловити думку або надати розгорнуту відповідь</td></tr></table>
<p>Поради: формулюй чітко; використовуй відкриті запитання; уникай навідних питань; давай час на обдумування; уважно слухай.</p>`,

{info:`<h4>Чітке формулювання. Аргументація. Висновки</h4>
<p><b>Риторика</b> (красномовство) – мистецтво якісного висловлювання думок з метою переконання та впливу на аудиторію з урахуванням її особливостей. Риторика виникла в античні часи; її батьківщиною називають Сиракузи, а «винахідником» – Коракса. Популяризатором класичної риторики був Еразм Роттердамський.</p>
<ul><li><b>Чітке формулювання</b>: зрозумілі слова, короткі речення, логічна послідовність; зосередитися на головній ідеї.</li>
<li><b>Аргументація</b> за схемою: <b>теза</b> (основна ідея, яку доводять) → <b>аргументи</b> (логічні підстави) → <b>докази, приклади, факти</b>.</li>
<li><b>Висновок</b> – підсумок, що підкреслює головну ідею; має бути коротким, логічним, переконливим.</li></ul>
<p>Поради: працюй над словниковим запасом (читай), розв’язуй логічні задачі, бери участь у дискусіях, веди щоденник або блог.</p>
<h4>Текстове і усне повідомлення</h4>
<table class="tbl"><tr><th>Текстове</th><th>Усне</th></tr>

<h4>Мистецтво публічного виступу. Врахування особливостей аудиторії</h4>
<p>Успішний виступ залежить від двох складових: <b>зміст</b> та сама <b>презентація</b>. Підготуйте план і тези, приклади; тренуйтеся перед друзями чи дзеркалом; підтримуйте зоровий контакт; використовуйте жести, міміку, наочність.</p>
<p><b>Враховуйте аудиторію</b>: вік, інтереси, рівень знань. Для молодших школярів – простіші слова та більше прикладів.</p>

{info:`<h4>Ролі лідера і членів команди</h4>
<p><b>Лідер</b> – особистість, яка спрямовує групу до спільної мети, вміє ухвалювати правильні рішення, проявляти наполегливість і надихати інших. Це не обов’язково найрозумніший чи найголосніший, а той, кого люди готові слухати й підтримувати. «Люди не завжди пам’ятають, що ти сказав, але вони завжди пам’ятають, як ти змусив їх себе почувати» (Майя Енджелоу).</p>
<p><b>Команда</b> – група людей, об’єднаних спільною метою; кожен її член відіграє свою унікальну роль.</p>
<table class="tbl"><tr><th>Ролі лідера</th><th>Ролі членів команди</th></tr>
<tr><td>Організатор – планує, координує, розподіляє завдання</td><td>Виконавець – якісно виконує свою частину роботи</td></tr>
<tr><td>Мотиватор – надихає, підбадьорює</td><td>Ідейний натхненник (ініціатор) – пропонує нові ідеї</td></tr>
<tr><td>Посередник – вирішує конфлікти</td><td>Аналітик – збирає й аналізує інформацію</td></tr>
<tr><td>Наставник – навчає, дає приклад</td><td>Критик – конструктивно оцінює ідеї</td></tr>
<tr><td>Комунікатор – чітко передає інформацію, слухає</td><td>Координатор – стежить за виконанням завдань вчасно</td></tr>
<tr><td>Візіонер – бачить ціль і веде до неї</td><td>Підтримка – створює доброзичливу атмосферу</td></tr></table>
<h4>Як працювати над спільними завданнями</h4>
<p>Кроки: <b>планування</b> (мета, розподіл обов’язків, час) → <b>збір інформації</b> → <b>оформлення</b> → <b>аналіз і висновки</b> → <b>перевірка та репетиція</b> → <b>презентація</b>. Спільні завдання допомагають об’єднати зусилля, вчать розподіляти відповідальність, розвивають комунікаційні навички.</p>
<h4>Командна мотивація. Відповідальність і толерантність</h4>
<p><b>Мотивація</b> – сила, яка допомагає діяти й досягати цілей; командна мотивація тримається на спільній меті, підтримці, визнанні зусиль кожного та довірі. <b>Відповідальність</b> дає можливість довіряти один одному. <b>Толерантність</b> дозволяє працювати з людьми, які відрізняються від нас у підходах і поглядах. Три кити ефективної команди: бажання працювати разом, чесне виконання своїх функцій, повага до кожного.</p>
<h4>Вплив самовираження на взаємодію з іншими</h4>
<p><b>Самовираження</b> – здатність людини відкрито показувати свої думки, почуття, ідеї, цінності та інтереси (через мову, поведінку, творчість, стиль одягу, хобі). За дослідженнями психолога <b>Альберта Меграбяна</b>: 55 % інформації ми отримуємо через жести, міміку та позу, 38 % – через тон голосу, і лише 7 % – через самі слова. Мартін Лютер Кінг промовою «I Have a Dream» надихнув мільйони людей.</p>`,

  document.title="Громадянська освіта · 7 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">${s.lab?"Розділ "+s.lab:"Вступ"}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("go7_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Громадянська освіта 7`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("go7_theme",d.dataset.theme); }
const th=store.get("go7_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
